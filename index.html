 s:["Douleur thoracique augmentée par l'inspiration profonde et le décubitus, soulagée par la position assise penchée en avant","Frottement péricardique : bruit de cuir neuf, superficiel, qui persiste en apnée","Fièvre, dyspnée","ECG : sus-décalage diffus du segment ST, concave en haut, sans image en miroir ; sous-décalage du PQ ; microvoltage","Tamponnade : hypotension, turgescence jugulaire, bruits du cœur assourdis, pouls paradoxal"],
 c:["Péricardite virale ou idiopathique","Tuberculose (fréquente en Afrique)","Péricardite purulente","Cancer, insuffisance rénale chronique (urémique)","Infarctus du myocarde, maladies de système"],
 k:"Le frottement persiste en apnée (le frottement pleural disparaît). Tamponnade = drainage en urgence."},
{id:'choc', sys:'cardio', n:"État de choc (collapsus cardio-vasculaire)",
 e:"Le sang n'arrive plus avec assez de force jusqu'aux organes, comme un robinet qui ne coule presque plus. Les organes manquent d'oxygène : la peau devient froide et marbrée, le cœur bat très vite, on n'urine plus.",
 h:"Insuffisance circulatoire aiguë entraînant une hypoperfusion tissulaire et une inadéquation entre les apports et les besoins en oxygène des organes.",
 s:["Hypotension artérielle (PAS inférieure à 90 mmHg), pincement de la différentielle","Tachycardie, pouls filant","Marbrures (genoux), extrémités froides et cyanosées, temps de recoloration cutanée allongé","Oligurie","Polypnée, troubles de la conscience","Hyperlactatémie"],
 c:["Hypovolémique : hémorragie, déshydratation","Cardiogénique : infarctus, troubles du rythme","Septique (la peau peut être chaude au début)","Anaphylactique","Obstructif : embolie pulmonaire, tamponnade, pneumothorax compressif"],
 k:"Urgence vitale. Les marbrures et l'oligurie sont des signes d'hypoperfusion plus précoces que la chute de la tension."},
{id:'ischemieaigue', sys:'cardio', n:"Ischémie aiguë de membre",
 e:"L'artère qui nourrit une jambe se bouche d'un coup. La jambe n'a plus de sang : elle fait très mal, devient blanche et froide, et on ne sent plus le pouls.",
 h:"Interruption brutale du flux artériel d'un membre, par embolie ou thrombose, mettant en jeu le pronostic du membre et parfois le pronostic vital.",
 s:["Douleur brutale et intense","Pâleur, froideur du membre","Abolition des pouls en aval de l'obstacle","Veines plates","Signes de gravité : anesthésie, paralysie"],
 c:["Embolie d'origine cardiaque (fibrillation atriale)","Thrombose sur artère athéromateuse","Traumatisme artériel"],
 k:"Urgence : revascularisation dans les 6 heures. Le déficit sensitivo-moteur signe la gravité."},
{id:'tvp', sys:'cardio', n:"Thrombose veineuse profonde (phlébite)",
 e:"Un caillot bouche une grosse veine de la jambe. Le sang ne remonte plus bien : le mollet gonfle, devient chaud et douloureux. Le danger, c'est que le caillot parte dans les poumons.",
 h:"Obstruction d'une veine profonde par un thrombus fibrino-cruorique, favorisée par la triade de Virchow : stase veineuse, lésion endothéliale, hypercoagulabilité.",
 s:["Douleur spontanée ou provoquée du mollet","Œdème unilatéral, dur, ne prenant pas le godet","Chaleur locale, dilatation des veines superficielles","Diminution du ballottement du mollet, signe de Homans","Fébricule, tachycardie progressive"],
 c:["Immobilisation, alitement, chirurgie (orthopédique surtout)","Grossesse, post-partum, œstroprogestatifs","Cancer","Thrombophilie"],
 k:"Les signes cliniques sont peu fiables : écho-Doppler veineux. Complication redoutée : l'embolie pulmonaire."},
{id:'aomi', sys:'cardio', n:"Insuffisance artérielle chronique des membres inférieurs",
 e:"Les artères des jambes sont rétrécies par des dépôts de graisse. Au repos ça va, mais quand on marche, les muscles demandent plus de sang et n'en reçoivent pas assez : une crampe oblige à s'arrêter.",
 h:"Rétrécissement progressif du calibre des artères des membres inférieurs, le plus souvent par athérosclérose, responsable d'une ischémie d'effort puis de repos (classification de Leriche et Fontaine).",
 s:["Stade I : abolition d'un pouls, sans symptôme","Stade II : claudication intermittente (crampe du mollet à la marche, cédant à l'arrêt)","Stade III : douleurs de décubitus, soulagées jambes pendantes","Stade IV : troubles trophiques (ulcère, gangrène)","Pouls diminués ou abolis, souffle sur les trajets artériels, peau froide et dépilée"],
 c:["Athérosclérose : tabac, diabète, HTA, dyslipidémie","Artérites inflammatoires (maladie de Buerger chez le jeune fumeur)"],
 k:"L'artériopathie est un marqueur du risque coronaire et cérébral : il faut chercher les autres localisations."},
/* ===== Pleuro-pulmonaire ===== */
{id:'condensation', sys:'pneumo', n:"Syndrome de condensation pulmonaire",
 e:"Normalement le poumon est une éponge pleine d'air. Ici, un morceau de l'éponge est rempli de liquide ou de pus : il devient plein comme un morceau de foie. Il sonne mat et il transmet mieux la voix.",
 h:"Ensemble des signes traduisant le comblement des alvéoles d'un territoire pulmonaire par un produit pathologique, avec bronches perméables.",
 s:["Inspection : diminution de l'ampliation thoracique du côté atteint","Palpation : vibrations vocales augmentées","Percussion : matité","Auscultation : diminution du murmure vésiculaire, râles crépitants, souffle tubaire"],
 c:["Pneumonie franche lobaire aiguë (pneumocoque)","Tuberculose pulmonaire","Infarctus pulmonaire","Atélectasie (condensation rétractile, vibrations vocales alors diminuées)"],
 k:"Vibrations vocales AUGMENTÉES + matité = condensation. C'est le seul syndrome où elles augmentent."},
{id:'pleuresie', sys:'pneumo', n:"Syndrome d'épanchement pleural liquidien",
 e:"Entre le poumon et la paroi, il y a un petit espace normalement presque vide. Quand il se remplit de liquide, le poumon est repoussé : on n'entend plus rien à cet endroit et ça sonne plein comme une cuisse.",
 h:"Ensemble des signes traduisant la présence de liquide dans la cavité pleurale. Le trépied pleurétique associe l'abolition des vibrations vocales, une matité franche et l'abolition du murmure vésiculaire.",
 s:["Signes fonctionnels : douleur basithoracique augmentée par l'inspiration, toux sèche aux changements de position, dyspnée","Vibrations vocales abolies","Matité franche, hydrique, déclive","Murmure vésiculaire aboli","Souffle pleurétique et frottement pleural à la limite supérieure de l'épanchement"],
 c:["Transsudat : insuffisance cardiaque, cirrhose, syndrome néphrotique","Exsudat : tuberculose, cancer, pneumonie (pleurésie parapneumonique), embolie pulmonaire"],
 k:"Trépied : vibrations abolies, matité, silence. Toute pleurésie doit être ponctionnée (sauf insuffisance cardiaque typique)."},
{id:'pneumothorax', sys:'pneumo', n:"Syndrome d'épanchement pleural gazeux (pneumothorax)",
 e:"De l'air est entré entre le poumon et la paroi. Le poumon se dégonfle comme un ballon percé. Ça fait mal d'un coup, on respire mal, et la poitrine sonne creux comme un tambour.",
 h:"Présence d'air dans la cavité pleurale, avec collapsus pulmonaire plus ou moins complet. Le trépied de Gaillard associe l'abolition des vibrations vocales, un tympanisme et l'abolition du murmure vésiculaire.",
 s:["Douleur thoracique brutale, en coup de poignard, augmentée par l'inspiration","Dyspnée, toux sèche","Vibrations vocales abolies","Tympanisme à la percussion","Murmure vésiculaire aboli"],
 c:["Spontané primitif : sujet jeune, longiligne, fumeur","Secondaire : BPCO, emphysème, tuberculose","Traumatique ou iatrogène"],
 k:"Tympanisme = air ; matité = liquide. Pneumothorax compressif (détresse, turgescence jugulaire) = exsufflation en urgence."},
{id:'cavesup', sys:'pneumo', n:"Syndrome cave supérieur",
 e:"La grosse veine qui ramène le sang de la tête et des bras vers le cœur est écrasée. Le sang reste coincé en haut : le visage et le cou gonflent et deviennent bleutés, des veines apparaissent sur la poitrine.",
 h:"Ensemble des signes liés à l'obstruction ou à la compression de la veine cave supérieure, entraînant une stase veineuse dans le territoire céphalique et brachial.",
 s:["Œdème du visage, du cou et de la partie haute du thorax (œdème en pèlerine), comblement des creux sus-claviculaires","Cyanose du visage, augmentée par la position penchée en avant","Turgescence jugulaire","Circulation veineuse collatérale thoracique","Céphalées, somnolence, bourdonnements d'oreilles"],
 c:["Cancer bronchique","Lymphomes","Thrombose sur cathéter central","Goitre plongeant, tumeurs médiastinales"],
 k:"Chez un fumeur, il fait d'abord chercher un cancer bronchique."},
/* ===== Hématologie ===== */
{id:'anemique', sys:'hemato', n:"Syndrome anémique",
 e:"Les globules rouges sont les camions qui transportent l'oxygène. S'il n'y en a pas assez, tout le corps manque d'oxygène : on est pâle, fatigué, essoufflé, et le cœur bat vite pour compenser.",
 h:"Ensemble des signes liés à la diminution du taux d'hémoglobine circulante (moins de 13 g/dL chez l'homme, 12 chez la femme, 11 chez la femme enceinte), responsable d'une hypoxie tissulaire.",
 s:["Pâleur cutanéo-muqueuse (conjonctives, paumes, ongles)","Asthénie, dyspnée d'effort","Tachycardie, palpitations, souffle systolique fonctionnel","Céphalées, vertiges, bourdonnements d'oreilles, mouches volantes","Signes de gravité : angor, dyspnée de repos, troubles de conscience"],
 c:["Microcytaire : carence en fer, inflammation, thalassémie","Normocytaire régénérative : hémorragie aiguë, hémolyse","Normocytaire arégénérative : insuffisance rénale chronique, atteinte médullaire","Macrocytaire : carence en vitamine B12 ou en folates, alcool"],
 k:"La tolérance dépend de la vitesse d'installation plus que du chiffre. Raisonner avec le VGM puis les réticulocytes."},
{id:'hemorragique', sys:'hemato', n:"Syndrome hémorragique",
 e:"Quand on se blesse, le corps fabrique un bouchon pour arrêter le sang. Si le bouchon se fait mal, on saigne pour un rien : des petits points rouges sur la peau, des bleus, le nez ou les gencives qui saignent.",
 h:"Ensemble des manifestations hémorragiques spontanées ou provoquées par un traumatisme minime, traduisant une anomalie de l'hémostase primaire, de la coagulation ou de la fibrinolyse.",
 s:["Purpura : pétéchies, ecchymoses, ne s'effaçant pas à la vitropression","Hémorragies muqueuses : épistaxis, gingivorragies, ménorragies","Hématomes profonds, hémarthroses","Hémorragies viscérales : digestives, urinaires, cérébro-méningées","Saignement prolongé aux points de ponction"],
 c:["Hémostase primaire (purpura, saignements muqueux) : thrombopénie, maladie de Willebrand, thrombopathies","Coagulation (hématomes, hémarthroses) : hémophilie, antivitamines K, insuffisance hépatocellulaire","Coagulation intravasculaire disséminée"],
 k:"Purpura et muqueuses = plaquettes. Hématomes et articulations = facteurs de la coagulation. Bulles hémorragiques buccales = gravité."},
{id:'tumoralhemato', sys:'hemato', n:"Syndrome tumoral hématologique",
 e:"Des cellules du sang se multiplient trop et s'entassent dans leurs maisons : les ganglions, la rate et le foie. Ces organes grossissent et on peut les sentir sous les doigts.",
 h:"Ensemble des signes traduisant l'infiltration des organes hématopoïétiques et lymphoïdes par une prolifération cellulaire, le plus souvent maligne.",
 s:["Adénopathies superficielles ou profondes (fermes, indolores, mobiles dans les hémopathies)","Splénomégalie","Hépatomégalie","Douleurs osseuses","Hypertrophie gingivale, infiltration cutanée, atteinte testiculaire ou méningée"],
 c:["Leucémies aiguës et chroniques","Lymphomes (hodgkinien et non hodgkiniens)","Syndromes myéloprolifératifs"],
 k:"Devant une adénopathie : préciser siège, taille, consistance, sensibilité, mobilité, et examiner toutes les aires ganglionnaires, la rate et le foie."},
{id:'insufmed', sys:'hemato', n:"Syndrome d'insuffisance médullaire",
 e:"La moelle des os est l'usine qui fabrique les cellules du sang. Quand l'usine s'arrête, il manque tout : des globules rouges (pâleur), des globules blancs (infections) et des plaquettes (saignements).",
 h:"Ensemble des signes liés à un défaut de production des trois lignées sanguines par la moelle osseuse. Il associe un syndrome anémique, un syndrome infectieux et un syndrome hémorragique.",
 s:["Syndrome anémique : pâleur, asthénie, dyspnée","Syndrome infectieux (neutropénie) : fièvre, angine ulcéro-nécrotique, infections à répétition","Syndrome hémorragique (thrombopénie) : purpura, épistaxis, gingivorragies","Hémogramme : pancytopénie, anémie arégénérative"],
 c:["Leucémies aiguës, envahissement médullaire","Aplasie médullaire","Chimiothérapie, radiothérapie, toxiques","Carence en vitamine B12 ou en folates","Myélodysplasies"],
 k:"Fièvre chez un neutropénique = urgence. Le myélogramme est l'examen clé."},
{id:'hemolytique', sys:'hemato', n:"Syndrome hémolytique",
 e:"Les globules rouges éclatent trop tôt. On en manque, donc on est pâle. En éclatant, ils libèrent un pigment jaune qui colore la peau et les yeux. Et la rate, qui les détruit, grossit.",
 h:"Ensemble des signes traduisant un raccourcissement de la durée de vie des hématies. L'hémolyse chronique réalise la triade : pâleur, ictère, splénomégalie.",
 s:["Pâleur, ictère ou subictère conjonctival","Splénomégalie","Urines foncées ; urines rouge porto si hémolyse intravasculaire (hémoglobinurie)","Hémolyse aiguë : fièvre, frissons, douleurs lombaires, état de choc","Biologie : anémie régénérative, bilirubine libre élevée, LDH élevées, haptoglobine effondrée"],
 c:["Corpusculaires : drépanocytose, thalassémies, déficit en G6PD, sphérocytose héréditaire","Extra-corpusculaires : paludisme, anémie hémolytique auto-immune, accident transfusionnel, toxiques"],
 k:"Selles de couleur normale, urines foncées, bilirubine libre : c'est ce qui l'oppose à la cholestase."},
/* ===== Général ===== */
{id:'inflammatoire', sys:'gen', n:"Syndrome inflammatoire",
 e:"Quand le corps est attaqué, il sonne l'alarme et envoie ses soldats. Cette bagarre donne de la fièvre et de la fatigue, et laisse des traces qu'on retrouve dans la prise de sang.",
 h:"Ensemble des modifications cliniques et biologiques, non spécifiques, accompagnant la réaction de l'organisme à une agression infectieuse, immunologique, tumorale ou traumatique.",
 s:["Clinique : fièvre, asthénie, anorexie, amaigrissement","Vitesse de sédimentation accélérée","Élévation de la CRP (cinétique rapide) et du fibrinogène","Électrophorèse : augmentation des alpha-2 globulines","Anémie inflammatoire, hyperleucocytose, thrombocytose"],
 c:["Infections bactériennes, tuberculose","Maladies auto-immunes et inflammatoires","Cancers et hémopathies","Nécrose tissulaire (infarctus), traumatismes"],
 k:"C'est un signal d'alarme, pas un diagnostic : il faut chercher la cause. La CRP monte et descend vite, la VS lentement."},
{id:'dec', sys:'gen', n:"Déshydratation extracellulaire",
 e:"Le corps a perdu de l'eau et du sel en même temps, comme après une grosse diarrhée. Il n'y a plus assez de liquide dans les tuyaux : la peau garde le pli quand on la pince, la tension baisse, le cœur accélère.",
 h:"Diminution du volume du secteur extracellulaire (plasmatique et interstitiel) par perte iso-osmotique d'eau et de sodium. La natrémie est normale.",
 s:["Perte de poids","Pli cutané persistant","Hypotension artérielle, d'abord orthostatique ; tachycardie","Veines superficielles aplaties","Yeux cernés, hypotonie des globes oculaires ; fontanelle déprimée chez le nourrisson","Oligurie, soif modérée ; hémoconcentration (hématocrite et protides élevés)"],
 c:["Pertes digestives : diarrhées, vomissements, fistules","Pertes rénales : diurétiques, polyurie osmotique (diabète), insuffisance surrénale","Pertes cutanées : brûlures étendues, sudation importante","Troisième secteur : occlusion, péritonite, pancréatite"],
 k:"Le pli cutané et l'hypotension signent le secteur extracellulaire. Natrémie normale."},
{id:'dic', sys:'gen', n:"Déshydratation intracellulaire",
 e:"Le sang est devenu trop salé. Pour le diluer, l'eau sort des cellules, qui se ratatinent comme des raisins secs. Les cellules du cerveau souffrent : on a une soif terrible et on devient confus.",
 h:"Diminution du volume intracellulaire secondaire à une hyperosmolalité plasmatique, le plus souvent par hypernatrémie (natrémie supérieure à 145 mmol/L), par déficit en eau libre.",
 s:["Soif intense","Sécheresse des muqueuses (face interne des joues, langue rôtie)","Perte de poids","Fièvre","Troubles neurologiques : somnolence, confusion, irritabilité, convulsions, coma"],
 c:["Défaut d'apport d'eau : nourrisson, sujet âgé, coma","Pertes d'eau : diabète insipide, pertes cutanées et respiratoires (fièvre, coup de chaleur)","Diurèse osmotique : coma hyperosmolaire du diabétique"],
 k:"Soif + muqueuses sèches + signes neurologiques + hypernatrémie. La correction doit être lente (risque d'œdème cérébral)."},
{id:'oedemateux', sys:'gen', n:"Syndrome œdémateux (hyperhydratation extracellulaire)",
 e:"Il y a trop d'eau et de sel dans le corps. L'eau sort des tuyaux et s'installe sous la peau, là où ça descend : les pieds le soir, le dos chez la personne couchée. Si on appuie avec le doigt, il reste un petit creux.",
 h:"Augmentation du volume du secteur interstitiel par rétention d'eau et de sodium, se traduisant par des œdèmes généralisés, parfois associés à des épanchements des séreuses (anasarque).",
 s:["Œdèmes blancs, mous, indolores, prenant le godet","Bilatéraux, symétriques, déclives (chevilles debout, lombes couché), paupières le matin","Prise de poids","Épanchements : ascite, pleurésie, hydrocèle (anasarque)"],
 c:["Insuffisance cardiaque","Cirrhose","Syndrome néphrotique, insuffisance rénale","Dénutrition protéique (kwashiorkor)"],
 k:"Trois organes à chercher : cœur, foie, rein. La bandelette urinaire est le premier examen."},
/* ===== Digestif ===== */
{id:'htp', sys:'dig', n:"Syndrome d'hypertension portale",
 e:"La veine porte est le gros tuyau qui amène le sang de l'intestin au foie. Si le foie est dur ou le tuyau bouché, le sang fait un embouteillage : la rate grossit, de l'eau s'accumule dans le ventre, et le sang passe par de petites veines fragiles qui peuvent éclater.",
 h:"Élévation de la pression dans le système porte (supérieure à 15 mmHg ou gradient porto-cave supérieur à 5 mmHg), par obstacle sous-hépatique, intra-hépatique ou sus-hépatique.",
 s:["Splénomégalie","Circulation veineuse collatérale abdominale (au maximum, tête de méduse)","Ascite","Varices œsophagiennes et gastriques : hématémèse, méléna","Hémorroïdes ; hypersplénisme (cytopénies)"],
 c:["Bloc intra-hépatique : cirrhose, bilharziose hépatique (fréquente en Afrique)","Bloc sous-hépatique : thrombose de la veine porte","Bloc sus-hépatique : syndrome de Budd-Chiari, insuffisance cardiaque droite, péricardite constrictive"],
 k:"Complication la plus grave : la rupture de varices œsophagiennes."},
{id:'ihc', sys:'dig', n:"Syndrome d'insuffisance hépatocellulaire",
 e:"Le foie est une usine qui fabrique des protéines et nettoie le sang. Quand l'usine tourne au ralenti, la peau jaunit, on saigne facilement, de petites étoiles rouges apparaissent sur la peau, et le cerveau s'embrouille parce que le sang est mal nettoyé.",
 h:"Ensemble des manifestations cliniques et biologiques liées à la diminution des fonctions de synthèse, d'épuration et de sécrétion biliaire de l'hépatocyte.",
 s:["Asthénie, ictère","Angiomes stellaires, érythrose palmaire, ongles blancs, hippocratisme digital","Gynécomastie, atrophie testiculaire, aménorrhée","Fœtor hepaticus","Encéphalopathie hépatique : astérixis (flapping tremor), inversion du sommeil, confusion, coma","Syndrome hémorragique ; biologie : baisse du TP et du facteur V, hypoalbuminémie"],
 c:["Cirrhose (alcool, hépatites virales B et C)","Hépatites aiguës graves : virales, médicamenteuses (paracétamol), toxiques"],
 k:"Le facteur V bas distingue l'insuffisance hépatique de la carence en vitamine K (facteur V normal)."},
{id:'cholestase', sys:'dig', n:"Syndrome de cholestase",
 e:"La bile est un liquide jaune-vert que le foie envoie dans l'intestin. Si elle ne coule plus, elle reste dans le sang : la peau devient jaune et gratte, les urines sont foncées comme du thé, et les selles deviennent claires comme du mastic.",
 h:"Ensemble des manifestations liées à la diminution ou à l'arrêt de la sécrétion biliaire, par obstacle sur les voies biliaires (extra-hépatique) ou par atteinte hépatocytaire ou canaliculaire (intra-hépatique).",
 s:["Ictère cutanéo-muqueux","Urines foncées, mousseuses","Selles décolorées, mastic","Prurit, lésions de grattage","Biologie : bilirubine conjuguée, phosphatases alcalines et gamma-GT élevées"],
 c:["Extra-hépatique : lithiase de la voie biliaire principale, cancer de la tête du pancréas, cholangiocarcinome, ampullome","Intra-hépatique : hépatites, médicaments, cholangite biliaire primitive"],
 k:"Loi de Courvoisier et Terrier : ictère + grosse vésicule palpable = obstacle néoplasique (tête du pancréas). Fièvre + douleur + ictère = angiocholite."},
{id:'cytolyse', sys:'dig', n:"Syndrome de cytolyse hépatique",
 e:"Des cellules du foie sont abîmées et éclatent. Ce qu'elles contenaient part dans le sang, et on le retrouve dans la prise de sang : ce sont les transaminases.",
 h:"Syndrome biologique traduisant une atteinte de la membrane hépatocytaire, défini par l'élévation des transaminases sériques (ALAT et ASAT).",
 s:["Clinique souvent pauvre : asthénie, nausées, parfois ictère","ALAT et ASAT élevées","Cytolyse majeure (plus de 10 fois la normale) dans les hépatites aiguës"],
 c:["Hépatites virales (A, B, C, E)","Médicaments et toxiques (paracétamol, plantes)","Alcool (ASAT supérieures aux ALAT)","Ischémie hépatique (foie de choc), migration lithiasique"],
 k:"ALAT > ASAT : virus ou médicament. ASAT > ALAT : alcool."},
{id:'ascite', sys:'dig', n:"Syndrome ascitique",
 e:"De l'eau s'est accumulée dans le ventre, autour des intestins. Le ventre gonfle comme un ballon rempli d'eau, et l'eau se déplace quand la personne change de position.",
 h:"Épanchement liquidien dans la cavité péritonéale. L'ascite de moyenne abondance se reconnaît à une matité déclive, mobile, à limite supérieure concave vers le haut.",
 s:["Augmentation du volume de l'abdomen, prise de poids","Ombilic déplissé, peau tendue et luisante","Matité des flancs, déclive, mobile, concave vers le haut","Signe du flot, signe du glaçon","Ponction : transsudat (moins de 25 g/L de protides) ou exsudat"],
 c:["Cirrhose (première cause)","Tuberculose péritonéale","Carcinose péritonéale","Insuffisance cardiaque droite, syndrome néphrotique"],
 k:"Toute ascite doit être ponctionnée. Fièvre ou douleur chez le cirrhotique : infection du liquide d'ascite."},
{id:'occlusif', sys:'dig', n:"Syndrome occlusif",
 e:"L'intestin est un tuyau. S'il est bouché ou s'il ne pousse plus, rien ne passe : le ventre gonfle et fait mal, on vomit, et on ne fait plus ni selles ni gaz.",
 h:"Arrêt complet et persistant du transit intestinal, par obstacle mécanique ou par paralysie du péristaltisme. Il se définit par le carré : douleur, vomissements, arrêt des matières et des gaz, météorisme.",
 s:["Douleur abdominale, à type de colique dans l'obstruction","Vomissements (précoces si l'occlusion est haute, tardifs et fécaloïdes si elle est basse)","Arrêt des matières et des gaz","Météorisme abdominal, tympanisme","Radiographie : niveaux hydro-aériques"],
 c:["Bride post-opératoire","Hernie étranglée (palper les orifices herniaires)","Volvulus du sigmoïde","Cancer colique","Invagination chez le nourrisson ; iléus paralytique"],
 k:"L'arrêt des gaz est le signe le plus fiable. Toujours palper les orifices herniaires et faire le toucher rectal."},
{id:'peritoneal', sys:'dig', n:"Syndrome péritonéal",
 e:"Le péritoine est le tapis qui recouvre l'intérieur du ventre. S'il est infecté, par exemple quand un organe se perce, le ventre devient dur comme du bois et fait horriblement mal dès qu'on le touche.",
 h:"Ensemble des signes traduisant une inflammation aiguë du péritoine, le plus souvent par perforation d'un organe creux ou diffusion d'un foyer infectieux intra-abdominal.",
 s:["Douleur abdominale intense, brutale, permanente","Contracture abdominale : rigide, tonique, permanente, invincible, douloureuse (ventre de bois)","Défense, douleur à la décompression","Cri de l'ombilic, douleur du cul-de-sac de Douglas aux touchers pelviens","Fièvre, vomissements, arrêt du transit, faciès altéré"],
 c:["Perforation d'ulcère gastro-duodénal","Appendicite compliquée","Perforation typhique du grêle","Perforation colique, cholécystite, salpingite"],
 k:"La contracture impose la chirurgie en urgence. Elle peut manquer chez le sujet âgé ou sous corticoïdes."},
{id:'dysenterique', sys:'dig', n:"Syndrome dysentérique",
 e:"Le gros intestin est blessé par un microbe. Il ne fait presque plus de vraies selles : il rejette des glaires et du sang, très souvent, avec des crampes et l'envie d'y aller tout le temps pour presque rien.",
 h:"Syndrome traduisant une atteinte organique de la muqueuse colique ou rectale, associant des évacuations glairo-sanglantes afécales, des épreintes et un ténesme.",
 s:["Selles nombreuses, glaireuses, sanglantes, parfois purulentes, pauvres en matières","Épreintes : coliques précédant l'évacuation","Ténesme : tension douloureuse du rectum","Faux besoins","Fièvre dans les causes bactériennes"],
 c:["Amibiase colique (pas de fièvre : dysenterie amibienne)","Shigellose (fièvre : dysenterie bacillaire)","Rectocolite hémorragique","Cancer du rectum"],
 k:"Dysenterie sans fièvre : amibe. Dysenterie avec fièvre : bactérie."},
{id:'choleriforme', sys:'dig', n:"Syndrome cholériforme",
 e:"Un microbe fabrique un poison qui ouvre les robinets de l'intestin. L'eau du corps s'en va par des selles liquides comme de l'eau de riz. Le danger, c'est de se vider de son eau en quelques heures.",
 h:"Diarrhée aqueuse profuse, par mécanisme sécrétoire toxinique, sans lésion de la muqueuse intestinale, exposant à une déshydratation aiguë.",
 s:["Selles liquides très abondantes, afécales, en eau de riz","Vomissements","Pas de fièvre, peu de douleurs","Déshydratation rapide et sévère, crampes"],
 c:["Choléra (Vibrio cholerae)","Escherichia coli entérotoxinogène (diarrhée du voyageur)","Toxi-infection à staphylocoque","Rotavirus chez l'enfant"],
 k:"Le traitement est la réhydratation, en urgence. Pas de sang ni de glaires dans les selles."},
{id:'ulcereux', sys:'dig', n:"Syndrome ulcéreux",
 e:"L'acide de l'estomac a creusé un petit trou dans sa paroi. Ça fait une crampe en haut du ventre quelques heures après le repas, qui se calme quand on mange.",
 h:"Douleur épigastrique typique de la maladie ulcéreuse gastro-duodénale, caractérisée par son rythme post-prandial et sa périodicité.",
 s:["Douleur épigastrique à type de crampe ou de faim douloureuse","Sans irradiation","Post-prandiale tardive (1 à 4 heures après le repas), parfois nocturne","Calmée par l'alimentation et les antiacides","Périodique : poussées de quelques semaines séparées de rémissions"],
 c:["Ulcère duodénal ou gastrique","Infection à Helicobacter pylori","Anti-inflammatoires non stéroïdiens, aspirine"],
 k:"Complications : hémorragie, perforation, sténose. Tout ulcère gastrique doit être biopsié (risque de cancer)."},
{id:'malabsorption', sys:'dig', n:"Syndrome de malabsorption",
 e:"L'intestin n'arrive plus à attraper les bons éléments de la nourriture. Ils repartent dans les selles, qui deviennent grasses et abondantes, et le corps manque de tout : on maigrit et on a des carences.",
 h:"Ensemble des manifestations cliniques et biologiques liées à un défaut d'absorption des nutriments par l'intestin grêle, par atteinte pariétale ou par maldigestion.",
 s:["Diarrhée chronique, selles abondantes, graisseuses (stéatorrhée)","Amaigrissement avec appétit conservé, retard de croissance chez l'enfant","Anémie par carence en fer, folates ou vitamine B12","Œdèmes (hypoalbuminémie)","Douleurs osseuses, tétanie (vitamine D, calcium), syndrome hémorragique (vitamine K)"],
 c:["Maladie cœliaque","Pancréatite chronique (maldigestion)","Parasitoses : giardiase","Résection du grêle, maladie de Crohn"],
 k:"Diarrhée chronique + amaigrissement + carences."},
/* ===== Néphrologie ===== */
{id:'nephrotique', sys:'nephro', n:"Syndrome néphrotique",
 e:"Le rein est une passoire qui doit garder les protéines dans le sang. Ici, les trous sont trop grands : les protéines partent dans les urines. Sans elles, l'eau ne reste plus dans les vaisseaux et va gonfler le visage et les jambes.",
 h:"Syndrome biologique défini par une protéinurie supérieure à 3 g par 24 heures (50 mg/kg/j chez l'enfant), une hypoalbuminémie inférieure à 30 g/L et une hypoprotidémie inférieure à 60 g/L. Il traduit une atteinte glomérulaire.",
 s:["Œdèmes blancs, mous, indolores, prenant le godet, déclives ; bouffissure des paupières le matin","Prise de poids, parfois anasarque","Urines mousseuses","Pur : pas d'hématurie, pas d'HTA, pas d'insuffisance rénale ; impur si l'un des trois est présent","Hyperlipidémie associée"],
 c:["Lésions glomérulaires minimes (enfant)","Hyalinose segmentaire et focale","Glomérulonéphrite extra-membraneuse","Diabète, amylose, lupus"],
 k:"Complications : thromboses veineuses, infections. La définition est biologique, pas clinique."},
{id:'nephritique', sys:'nephro', n:"Syndrome néphritique aigu",
 e:"Les filtres du rein s'enflamment d'un coup, souvent deux semaines après une angine. Le rein laisse passer du sang et garde l'eau et le sel : les urines sont foncées comme du coca, on gonfle et la tension monte.",
 h:"Syndrome glomérulaire d'installation brutale associant hématurie, protéinurie, œdèmes, hypertension artérielle et oligurie avec insuffisance rénale aiguë modérée. Il traduit une glomérulonéphrite aiguë.",
 s:["Début brutal, en quelques jours","Hématurie macroscopique (urines bouillon sale ou coca)","Protéinurie","Œdèmes du visage et des membres inférieurs","Hypertension artérielle, oligurie, insuffisance rénale aiguë"],
 c:["Glomérulonéphrite aiguë post-streptococcique (10 à 21 jours après une angine ou un impétigo)","Autres infections bactériennes"],
 k:"Intervalle libre après l'infection et baisse du complément C3 : deux arguments pour l'origine post-infectieuse."},
{id:'gnrp', sys:'nephro', n:"Syndrome de glomérulonéphrite rapidement progressive",
 e:"Les filtres du rein sont détruits très vite. En quelques semaines, le rein s'arrête presque de fonctionner. Il faut aller vite, sinon le rein est perdu.",
 h:"Syndrome glomérulaire associant hématurie, protéinurie et insuffisance rénale d'aggravation rapide, en quelques jours à quelques semaines. Il correspond histologiquement à une glomérulonéphrite extracapillaire à croissants.",
 s:["Insuffisance rénale s'aggravant en jours ou semaines","Hématurie, souvent macroscopique","Protéinurie","Signes extra-rénaux possibles : hémorragie alvéolaire, purpura, arthralgies"],
 c:["Maladie de Goodpasture (anticorps anti-membrane basale glomérulaire)","Vascularites à ANCA","Lupus, purpura rhumatoïde"],
 k:"Urgence néphrologique : ponction-biopsie rénale sans attendre."},
{id:'hematurierec', sys:'nephro', n:"Syndrome d'hématurie macroscopique récidivante",
 e:"De temps en temps, souvent un ou deux jours après un rhume ou une angine, les urines deviennent rouges, puis ça passe, puis ça revient.",
 h:"Syndrome glomérulaire fait d'épisodes répétés d'hématurie macroscopique, sans caillot ni douleur, parfois associés à une hématurie microscopique et à une protéinurie entre les épisodes.",
 s:["Hématurie macroscopique totale, sans caillot, indolore","Survenue 24 à 48 heures après une infection ORL","Récidives","Entre les épisodes : hématurie microscopique, protéinurie possible"],
 c:["Néphropathie à IgA (maladie de Berger)","Syndrome d'Alport (avec surdité)"],
 k:"Délai court après l'infection (1 à 2 jours), à l'inverse de la glomérulonéphrite post-streptococcique (2 à 3 semaines)."},
{id:'nti', sys:'nephro', n:"Syndrome de néphropathie tubulo-interstitielle",
 e:"Ce ne sont pas les filtres du rein qui sont malades, mais les petits tuyaux derrière et le tissu autour. Le rein n'arrive plus à concentrer l'urine ni à garder le sel : on urine beaucoup.",
 h:"Ensemble des signes traduisant une atteinte prédominante des tubules et de l'interstitium rénal, aiguë ou chronique.",
 s:["Protéinurie faible (moins de 1 g par 24 heures), de type tubulaire","Leucocyturie, souvent aseptique","Pas d'œdèmes ; HTA absente ou tardive","Polyurie, perte de sel, acidose métabolique","Forme aiguë immuno-allergique : fièvre, éruption, éosinophilie"],
 c:["Aiguës : médicaments (antibiotiques, AINS), pyélonéphrite","Chroniques : obstacle et reflux, analgésiques, plantes, lithiases, causes métaboliques"],
 k:"Peu de protéines, pas d'œdèmes, leucocytes dans les urines : pense tubule et interstitium, pas glomérule."},
{id:'nephrovasc', sys:'nephro', n:"Syndrome de néphropathie vasculaire",
 e:"Les petits tuyaux qui amènent le sang au rein sont abîmés ou rétrécis. Le rein est mal arrosé, il fait monter la tension, et il se fatigue peu à peu.",
 h:"Ensemble des signes traduisant une atteinte des vaisseaux rénaux, des artères aux capillaires, où l'hypertension artérielle est au premier plan.",
 s:["Hypertension artérielle, souvent sévère","Protéinurie faible ou absente","Hématurie rare","Insuffisance rénale d'évolution variable"],
 c:["Néphroangiosclérose (HTA ancienne)","Sténose de l'artère rénale","Microangiopathie thrombotique (syndrome hémolytique et urémique)","Emboles de cholestérol"],
 k:"L'HTA domine le tableau, le sédiment urinaire est pauvre."},
{id:'ira', sys:'nephro', n:"Syndrome d'insuffisance rénale aiguë",
 e:"Les reins s'arrêtent de nettoyer le sang en quelques heures ou quelques jours. Les déchets s'accumulent, et souvent on n'urine presque plus.",
 h:"Baisse brutale et potentiellement réversible du débit de filtration glomérulaire, avec élévation de la créatininémie et, souvent, oligo-anurie.",
 s:["Oligurie (moins de 500 mL par 24 heures) ou anurie ; la diurèse peut être conservée","Élévation rapide de la créatinine et de l'urée","Hyperkaliémie, acidose métabolique","Surcharge hydrosodée : œdèmes, œdème pulmonaire"],
 c:["Fonctionnelle (pré-rénale) : hypovolémie, déshydratation, état de choc","Organique (rénale) : nécrose tubulaire aiguë, glomérulonéphrites, néphrites interstitielles","Obstructive (post-rénale) : lithiase, adénome ou cancer de la prostate, tumeur pelvienne"],
 k:"Toujours éliminer un obstacle en premier (échographie, globe vésical). L'hyperkaliémie menace la vie : ECG."},
{id:'uremique', sys:'nephro', n:"Syndrome urémique (insuffisance rénale chronique)",
 e:"Les reins sont usés depuis longtemps et ne nettoient plus le sang. Les déchets restent et abîment tout le corps petit à petit : fatigue, pâleur, nausées, démangeaisons, tension élevée.",
 h:"Ensemble des manifestations cliniques et biologiques de l'insuffisance rénale chronique évoluée, liées à la rétention des toxines urémiques et à la perte des fonctions endocrines du rein.",
 s:["Asthénie, pâleur (anémie normochrome normocytaire arégénérative)","Nausées, vomissements, anorexie, haleine urémique","Prurit, crampes, polynévrite","Hypertension artérielle, péricardite urémique","Biologie : hypocalcémie, hyperphosphorémie, hyperkaliémie, acidose métabolique","Petits reins à l'échographie"],
 c:["Diabète","Hypertension artérielle (néphroangiosclérose)","Glomérulonéphrites chroniques","Polykystose rénale, néphropathies interstitielles chroniques"],
 k:"Arguments pour la chronicité : petits reins, anémie, hypocalcémie."},
{id:'coliquenephretique', sys:'nephro', n:"Colique néphrétique",
 e:"Un petit caillou bloque le tuyau qui va du rein à la vessie. L'urine pousse derrière, ça distend le rein et ça fait une douleur terrible dans le dos, qui descend vers le bas-ventre. On ne trouve aucune position qui soulage.",
 h:"Syndrome douloureux lombo-abdominal aigu résultant de la mise en tension brutale de la voie excrétrice supérieure en amont d'un obstacle.",
 s:["Douleur lombaire unilatérale, brutale, intense, paroxystique","Irradiation en bas et en avant vers la fosse iliaque et les organes génitaux externes","Agitation, pas de position antalgique","Signes urinaires (pollakiurie, hématurie) et digestifs (nausées, vomissements)","Pas de fièvre dans la forme simple"],
 c:["Lithiase urinaire (la plus fréquente)","Caillots, nécrose papillaire","Compression extrinsèque, tumeur de la voie excrétrice"],
 k:"Formes graves à hospitaliser : fébrile, anurique, hyperalgique."},
/* ===== Rhumatologie ===== */
{id:'artinflam', sys:'rhumato', n:"Syndrome articulaire inflammatoire (arthrite)",
 e:"L'articulation est en feu de l'intérieur. Elle est gonflée, chaude, rouge, et elle fait mal surtout la nuit et le matin au réveil. Il faut un long moment le matin pour la dérouiller.",
 h:"Atteinte articulaire dont la douleur a un horaire inflammatoire, associée à des signes locaux d'inflammation et à un liquide articulaire riche en cellules.",
 s:["Douleur nocturne, en deuxième partie de nuit, avec réveils","Raideur matinale avec dérouillage de plus de 30 minutes","Douleur améliorée par l'activité","Gonflement, chaleur, rougeur, épanchement articulaire","Syndrome inflammatoire biologique ; liquide articulaire de plus de 2 000 éléments par mm³"],
 c:["Arthrite septique (urgence)","Goutte, chondrocalcinose","Polyarthrite rhumatoïde","Spondyloarthrites, rhumatisme articulaire aigu"],
 k:"Une monoarthrite aiguë fébrile est une arthrite septique jusqu'à preuve du contraire : ponction articulaire."},
{id:'artmeca', sys:'rhumato', n:"Syndrome articulaire mécanique (arthrose)",
 e:"L'articulation est usée, comme une charnière qui a trop servi. Elle fait mal quand on s'en sert et en fin de journée, et elle se calme quand on se repose.",
 h:"Atteinte articulaire dont la douleur a un horaire mécanique, sans signe inflammatoire local ni biologique, traduisant le plus souvent une dégradation du cartilage.",
 s:["Douleur à l'effort et à la mise en charge, maximale en fin de journée","Calmée par le repos, pas de réveil nocturne (sauf aux changements de position)","Dérouillage matinal bref, de moins de 15 minutes","Pas de rougeur ni de chaleur ; déformations, craquements","Pas de syndrome inflammatoire ; liquide articulaire pauvre en cellules (moins de 1 000 par mm³)"],
 c:["Arthrose primitive (âge, surpoids)","Arthrose secondaire : traumatisme, dysplasie, déformation","Ostéonécrose, lésion méniscale"],
 k:"Trois questions suffisent : la nuit ? le matin ? à l'effort ?"},
{id:'radiculaire', sys:'rhumato', n:"Syndrome radiculaire (sciatique)",
 e:"Un nerf est pincé à sa sortie de la colonne, souvent par un disque qui a glissé. La douleur part du bas du dos et descend dans la jambe comme une décharge, en suivant toujours le même chemin.",
 h:"Ensemble des signes traduisant la souffrance d'une racine nerveuse : douleur de topographie radiculaire, impulsive à la toux, avec parfois un déficit sensitif, moteur et réflexe dans le territoire correspondant.",
 s:["Douleur de trajet systématisé, augmentée par la toux et la défécation","L5 : fesse, face externe de la cuisse et de la jambe, dos du pied, gros orteil ; marche sur les talons difficile","S1 : fesse, face postérieure de la cuisse et du mollet, talon, plante, bord externe du pied ; réflexe achilléen aboli ; marche sur les pointes difficile","Signe de Lasègue","Syndrome rachidien associé : raideur, contracture, attitude antalgique"],
 c:["Hernie discale (conflit disco-radiculaire)","Arthrose, canal lombaire étroit","Causes secondaires : tumeur, spondylodiscite"],
 k:"Urgences chirurgicales : sciatique paralysante, syndrome de la queue de cheval, sciatique hyperalgique."},
/* ===== Endocrinologie ===== */
{id:'thyrotoxicose', sys:'endoc', n:"Syndrome de thyrotoxicose (hyperthyroïdie)",
 e:"La thyroïde est la pédale d'accélérateur du corps. Ici, elle est bloquée à fond : le cœur bat vite, on a chaud, on transpire, on tremble, on maigrit alors qu'on mange beaucoup.",
 h:"Ensemble des manifestations liées à l'excès d'hormones thyroïdiennes au niveau des tissus cibles. La TSH est effondrée et la T4 libre élevée dans les formes périphériques.",
 s:["Amaigrissement avec appétit conservé ou augmenté","Tachycardie permanente, palpitations, éréthisme cardiaque","Thermophobie, hypersudation, mains chaudes et moites","Tremblement fin des extrémités, nervosité, insomnie","Diarrhée motrice, amyotrophie proximale (signe du tabouret)"],
 c:["Maladie de Basedow : goitre diffus vasculaire, exophtalmie, myxœdème prétibial","Adénome toxique, goitre multinodulaire toxique","Thyroïdites","Surcharge iodée (amiodarone), prise d'hormones thyroïdiennes"],
 k:"Complications : cardiothyréose (fibrillation atriale), crise aiguë thyrotoxique."},
{id:'hypothyroidie', sys:'endoc', n:"Syndrome d'hypothyroïdie",
 e:"La thyroïde ne donne plus assez de carburant. Tout le corps tourne au ralenti : on a froid, on est fatigué et lent, on grossit, le cœur bat doucement, on est constipé et le visage gonfle.",
 h:"Ensemble des manifestations liées à l'insuffisance de sécrétion des hormones thyroïdiennes. Dans la forme périphérique, la TSH est élevée et la T4 libre basse.",
 s:["Asthénie, ralentissement psychomoteur, somnolence","Frilosité, prise de poids modérée","Bradycardie, constipation","Peau sèche, froide, pâle, cireuse ; dépilation (queue du sourcil), cheveux secs","Myxœdème : visage bouffi, paupières gonflées, macroglossie, voix rauque, mains et pieds infiltrés"],
 c:["Thyroïdite de Hashimoto","Thyroïdectomie, iode radioactif","Carence iodée","Médicaments : amiodarone, lithium","Insuffisance hypophysaire (TSH basse ou normale)"],
 k:"Complication grave : le coma myxœdémateux. Le dépistage se fait par la TSH."},
{id:'cushing', sys:'endoc', n:"Syndrome de Cushing (hypercorticisme)",
 e:"Il y a trop de cortisol dans le corps. La graisse s'installe sur le visage et le ventre, alors que les bras et les jambes fondent. La peau devient fine et fragile, avec de larges vergetures violettes.",
 h:"Ensemble des manifestations cliniques et biologiques secondaires à un excès chronique de glucocorticoïdes, d'origine exogène ou endogène.",
 s:["Obésité facio-tronculaire : visage arrondi et rouge, bosse de bison, comblement des creux sus-claviculaires","Amyotrophie des racines des membres","Vergetures larges, pourpres ; peau fine, ecchymoses faciles","Hypertension artérielle, diabète","Ostéoporose, hirsutisme, troubles des règles, troubles psychiques"],
 c:["Corticothérapie prolongée (première cause)","Maladie de Cushing : adénome hypophysaire à ACTH","Adénome ou corticosurrénalome","Sécrétion ectopique d'ACTH (cancer bronchique)"],
 k:"Les signes les plus spécifiques sont ceux du catabolisme : amyotrophie, peau fine, vergetures pourpres, ecchymoses."},
{id:'addison', sys:'endoc', n:"Syndrome d'insuffisance surrénale (maladie d'Addison)",
 e:"Les glandes surrénales ne fabriquent plus assez de cortisol ni l'hormone qui garde le sel. On est épuisé, on maigrit, la tension est basse, on a envie de sel, et la peau fonce comme si on était bronzé.",
 h:"Déficit de sécrétion des hormones corticosurrénaliennes (glucocorticoïdes et minéralocorticoïdes), d'origine périphérique (surrénale) ou centrale (hypophyse).",
 s:["Asthénie physique et psychique, augmentant au cours de la journée","Amaigrissement, anorexie, troubles digestifs","Hypotension artérielle, surtout orthostatique","Mélanodermie : plis de flexion, cicatrices, mamelons, taches ardoisées des muqueuses (forme périphérique seulement)","Goût pour le sel ; hyponatrémie, hyperkaliémie, hypoglycémie"],
 c:["Tuberculose des surrénales (fréquente en Afrique)","Rétraction corticale auto-immune","Arrêt brutal d'une corticothérapie prolongée (forme centrale)","Infection par le VIH, métastases"],
 k:"L'insuffisance surrénale aiguë est une urgence vitale. Pas de mélanodermie dans la forme centrale."},
{id:'polyuropolydipsie', sys:'endoc', n:"Syndrome polyuro-polydipsique",
 e:"On urine énormément, donc on a tout le temps soif et on boit énormément. Soit le sucre en trop dans le sang entraîne l'eau dans les urines, soit le rein n'arrive plus à retenir l'eau.",
 h:"Association d'une polyurie supérieure à 3 litres par 24 heures et d'une polydipsie compensatrice.",
 s:["Diurèse supérieure à 3 L par 24 heures, nycturie","Soif intense, prises de boisson abondantes","Diabète sucré : syndrome cardinal (polyurie, polydipsie, polyphagie, amaigrissement)","Diabète insipide : urines claires, hypotoniques"],
 c:["Diabète sucré (polyurie osmotique)","Diabète insipide central (déficit en hormone antidiurétique) ou néphrogénique","Potomanie","Hypercalcémie, hypokaliémie"],
 k:"Premier geste : glycémie et bandelette urinaire."},
{id:'hypoglycemie', sys:'endoc', n:"Syndrome hypoglycémique",
 e:"Le sucre est l'essence du cerveau. Quand il en manque dans le sang, le corps sonne l'alarme (sueurs, tremblements, faim), puis le cerveau tombe en panne (confusion, convulsions, coma).",
 h:"Ensemble des manifestations liées à une baisse de la glycémie (en dessous de 0,50 g/L, ou 0,70 g/L chez le diabétique). Le diagnostic repose sur la triade de Whipple.",
 s:["Signes adrénergiques : sueurs, pâleur, tremblements, palpitations, faim impérieuse","Signes neuroglucopéniques : troubles de la concentration, troubles visuels, confusion, troubles du comportement","Convulsions, coma agité avec sueurs et signe de Babinski bilatéral","Triade de Whipple : symptômes, glycémie basse, correction par le sucre"],
 c:["Insuline, sulfamides hypoglycémiants","Alcool, jeûne","Insulinome","Insuffisance surrénale, hypophysaire ou hépatique"],
 k:"Tout trouble de conscience ou du comportement impose une glycémie capillaire."},
{id:'hypercalcemie', sys:'endoc', n:"Syndrome d'hypercalcémie (hyperparathyroïdie)",
 e:"Il y a trop de calcium dans le sang, souvent parce qu'une petite glande du cou le fait sortir des os. On est fatigué, on urine et on boit beaucoup, on est constipé, les os font mal et des cailloux se forment dans les reins.",
 h:"Ensemble des manifestations liées à l'élévation de la calcémie (au-dessus de 2,6 mmol/L), dont la cause la plus fréquente en ambulatoire est l'hyperparathyroïdie primaire.",

{id:'acromegalie', sys:'endoc', n:"Acromégalie",

const SYN_BY = {}; SYNDROMES.forEach(x=>{ SYN_BY[x.id]=x; });

UI.syn={view:'fiches', lang:'both', sys:'all', q:''};
function synMatch(x){ const u=UI.syn; if(u.sys!=='all' && x.sys!==u.sys) return false; const q=u.q.trim().toLowerCase(); if(!q) return true;
  return (x.n+' '+x.s.join(' ')+' '+x.c.join(' ')+' '+x.k).toLowerCase().includes(q); }
function synHas(id){ return Object.values(S.cards).some(c=>c.syn===id); }
function synAdd(id){
  const x=SYN_BY[id]; if(!x||synHas(id)) return 0;
  const li=a=>a.map(t=>'- '+t).join('\n');
  [ {front:'**'+x.n+'**\nDéfinis ce syndrome en langage hospitalier.', back:x.h, hint:x.e},
    {front:'**'+x.n+'**\nQuels sont les signes ?', back:li(x.s), hint:x.k},
    {front:'**'+x.n+'**\nQuelles sont les principales causes ?', back:li(x.c), hint:''}
  ].forEach(f=>saveCard(newCard({...f, type:'qa', syn:id})));
  return 3;
}
function synFiche(x){
  const u=UI.syn, has=synHas(x.id);
  const simple=`<div class="syn-box simple"><p class="eyebrow">En mots simples</p><p>${esc(x.e)}</p></div>`;
  const hosp=`<div class="syn-box hosp"><p class="eyebrow">En langage hospitalier</p><p>${esc(x.h)}</p></div>`;
  return `<details class="syn" data-syn="${x.id}" ${UI.synOpen===x.id?'open':''}><summary><span>${esc(x.n)}</span>${I.chev}</summary><div class="syn-body">
    ${u.lang!=='hosp'?simple:''}${u.lang!=='simple'?hosp:''}
    <div><h4>Signes</h4><ul>${x.s.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>
    <div><h4>Causes principales</h4><ul>${x.c.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>
    <p class="syn-key"><strong>À retenir.</strong> ${esc(x.k)}</p>
    ${has?`<div class="row"><span class="badge">Dans tes révisions</span><button class="btn btn-ghost" data-act="start" data-mode="cram" data-scope="syn" data-syn="${x.id}">Me tester sur cette fiche</button></div>`
        :`<button class="btn btn-soft" data-act="syn-add" data-id="${x.id}">${I.plus} Ajouter à mes révisions (3 cartes)</button>`}
  </div></details>`;
}
function synList(){
  const u=UI.syn; const list=SYNDROMES.filter(synMatch);
  if(!list.length) return '<p class="muted">Aucune fiche ne correspond à cette recherche.</p>';
  let html='';
  if(u.view==='table'){
    const col=u.lang==='simple'?'En mots simples':u.lang==='hosp'?'En langage hospitalier':'En mots simples';
    let rows=''; let cur='';
    for(const x of list){ if(x.sys!==cur){ cur=x.sys; rows+=`<tr class="sysrow"><td colspan="4">${esc(SYN_SYS[cur])}</td></tr>`; }
      rows+=`<tr><td>${esc(x.n)}</td><td>${esc(u.lang==='hosp'?x.h:x.e)}</td><td>${x.s.map(esc).join(' · ')}</td><td>${x.c.map(esc).join(' · ')}</td></tr>`; }
    return `<p class="small muted">Fais glisser le tableau vers la gauche pour voir toutes les colonnes.</p><div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Syndrome</th><th>${col}</th><th>Signes</th><th>Causes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  let cur='';
  for(const x of list){ if(x.sys!==cur){ cur=x.sys; const n=list.filter(y=>y.sys===cur).length; html+=`<h3 class="syn-sys">${esc(SYN_SYS[cur])} <span class="small muted">· ${n}</span></h3>`; } html+=synFiche(x); }
  return html;
}
function synSheet(){
  const u=UI.syn; const mine=new Set(Object.values(S.cards).filter(c=>c.syn).map(c=>c.syn)).size;
  const scope=u.sys==='all'?'syn':'y:'+u.sys; const nTest=liveCards(scope).length;
  const missing=SYNDROMES.filter(x=>(u.sys==='all'||x.sys===u.sys)&&!synHas(x.id)).length;
  return sheetTop('Fiches syndromes')+`
   <p>${SYNDROMES.length} syndromes. Chaque fiche donne l'explication simple, la version hospitalière, les signes, les causes et le point à retenir.</p>
   <div class="syn-tools">
    <div class="seg" role="group" aria-label="Présentation"><button data-act="syn-view" data-v="fiches" aria-pressed="${u.view==='fiches'}">Fiches</button><button data-act="syn-view" data-v="table" aria-pressed="${u.view==='table'}">Tableau</button></div>
    <div class="seg" role="group" aria-label="Langage"><button data-act="syn-lang" data-v="both" aria-pressed="${u.lang==='both'}">Les deux</button><button data-act="syn-lang" data-v="simple" aria-pressed="${u.lang==='simple'}">Simple</button><button data-act="syn-lang" data-v="hosp" aria-pressed="${u.lang==='hosp'}">Hospitalier</button></div>
    <label class="field">Appareil<select id="synSys" data-input="syn-sys"><option value="all" ${u.sys==='all'?'selected':''}>Tous les appareils</option>${Object.entries(SYN_SYS).map(([k,l])=>`<option value="${k}" ${u.sys===k?'selected':''}>${esc(l)} (${SYNDROMES.filter(x=>x.sys===k).length})</option>`).join('')}</select></label>
    <div class="search">${I.search}<input type="search" id="synSearch" placeholder="Chercher un syndrome ou un signe" value="${esc(u.q)}" data-input="syn-q" aria-label="Chercher un syndrome ou un signe"></div>
    <div class="stack">${nTest?`<button class="btn btn-primary" data-act="start" data-mode="cram" data-scope="${scope}">Me tester (${nTest} cartes)</button>`:''}
      ${missing?`<button class="btn btn-soft" data-act="syn-add-all">Tout ajouter à mes révisions (${missing})</button>`:''}</div>
    <p class="small muted">${mine} fiche${mine>1?'s':''} dans tes révisions. Ces fiches sont un résumé : en cas de différence, c'est le cours de ton professeur qui fait foi.</p>
   </div>
   <div id="synList" class="stack">${synList()}</div>`;
}

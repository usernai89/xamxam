 h:"Épanchement liquidien dans la cavité péritonéale. L'ascite de moyenne abondance se reconnaît à une matité déclive, mobile, à limite supérieure concave vers le haut.",
 s:["Augmentation du volume de l'abdomen, prise de poids","Ombilic déplissé, peau tendue et luisante","Matité des flancs, déclive, mobile, concave vers le haut","Signe du flot, signe du glaçon","Ponction : transsudat (moins de 25 g/L de protides) ou exsudat"],
 c:["Cirrhose (première cause)","Tuberculose péritonéale","Carcinose péritonéale","Insuffisance cardiaque droite, syndrome néphrotique"],
 k:"Toute ascite doit être ponctionnée. Fièvre ou douleur chez le cirrhotique : infection du liquide d'ascite."},
{id:'occlusif', sys:'dig', n:"Syndrome occlusif",
 e:"L'intestin est un tuyau. S'il est bouché ou s'il ne pousse plus, rien ne passe : le ventre gonfle et fait mal, on vomit, et on ne fait plus ni selles ni gaz.",
 h:"Arrêt complet et persistant du transit intestinal, par obstacle mécanique ou par paralysie du péristaltisme. Il se définit par le carré : douleur, vomissements, arrêt des matières et des gaz, météorisme.",
 s:["Douleur abdominale, à type de colique dans l'obstruction","Vomissements (précoces si l'occlusion est haute, tardifs et fécaloïdes si elle est basse)","Arrêt des matières et des gaz","Météorisme abdominal, tympanisme","Radiographie : niveaux hydro-aériques"],
 c:["Bride post-opératoire","Hernie étranglée (palper les orifices herniaires)","Volvulus du sigmoïde","Cancer colique","Invagination chez le nourrisson ; iléus paralytique"],
 k:"L'arrêt des gaz est le signe le plus fiable. Toujours palper les orifices herniaires et faire le toucher rectal."},
{id:'peritoneal', sys:'dig', n:"Syndrome péritonéal",
 e:"Le péritoine est le tapis qui recouvre l'intérieur du ventre. S'il est infecté, par exemple quand un organe se perce, le ventre devient dur comme du bois et fait horriblement mal dès qu'on le touche.",
 h:"Ensemble des signes traduisant une inflammation aiguë du péritoine, le plus souvent par perforation d'un organe creux ou diffusion d'un foyer infectieux intra-abdominal.",
 s:["Douleur abdominale intense, brutale, permanente","Contracture abdominale : rigide, tonique, permanente, invincible, douloureuse (ventre de bois)","Défense, douleur à la décompression","Cri de l'ombilic, douleur du cul-de-sac de Douglas aux touchers pelviens","Fièvre, vomissements, arrêt du transit, faciès altéré"],
 c:["Perforation d'ulcère gastro-duodénal","Appendicite compliquée","Perforation typhique du grêle","Perforation colique, cholécystite, salpingite"],
 k:"La contracture impose la chirurgie en urgence. Elle peut manquer chez le sujet âgé ou sous corticoïdes."},
{id:'dysenterique', sys:'dig', n:"Syndrome dysentérique",
 e:"Le gros intestin est blessé par un microbe. Il ne fait presque plus de vraies selles : il rejette des glaires et du sang, très souvent, avec des crampes et l'envie d'y aller tout le temps pour presque rien.",
 h:"Syndrome traduisant une atteinte organique de la muqueuse colique ou rectale, associant des évacuations glairo-sanglantes afécales, des épreintes et un ténesme.",
 s:["Selles nombreuses, glaireuses, sanglantes, parfois purulentes, pauvres en matières","Épreintes : coliques précédant l'évacuation","Ténesme : tension douloureuse du rectum","Faux besoins","Fièvre dans les causes bactériennes"],
 c:["Amibiase colique (pas de fièvre : dysenterie amibienne)","Shigellose (fièvre : dysenterie bacillaire)","Rectocolite hémorragique","Cancer du rectum"],
 k:"Dysenterie sans fièvre : amibe. Dysenterie avec fièvre : bactérie."},
{id:'choleriforme', sys:'dig', n:"Syndrome cholériforme",
 e:"Un microbe fabrique un poison qui ouvre les robinets de l'intestin. L'eau du corps s'en va par des selles liquides comme de l'eau de riz. Le danger, c'est de se vider de son eau en quelques heures.",
 h:"Diarrhée aqueuse profuse, par mécanisme sécrétoire toxinique, sans lésion de la muqueuse intestinale, exposant à une déshydratation aiguë.",
 s:["Selles liquides très abondantes, afécales, en eau de riz","Vomissements","Pas de fièvre, peu de douleurs","Déshydratation rapide et sévère, crampes"],
 c:["Choléra (Vibrio cholerae)","Escherichia coli entérotoxinogène (diarrhée du voyageur)","Toxi-infection à staphylocoque","Rotavirus chez l'enfant"],
 k:"Le traitement est la réhydratation, en urgence. Pas de sang ni de glaires dans les selles."},
{id:'ulcereux', sys:'dig', n:"Syndrome ulcéreux",
 e:"L'acide de l'estomac a creusé un petit trou dans sa paroi. Ça fait une crampe en haut du ventre quelques heures après le repas, qui se calme quand on mange.",
 h:"Douleur épigastrique typique de la maladie ulcéreuse gastro-duodénale, caractérisée par son rythme post-prandial et sa périodicité.",
 s:["Douleur épigastrique à type de crampe ou de faim douloureuse","Sans irradiation","Post-prandiale tardive (1 à 4 heures après le repas), parfois nocturne","Calmée par l'alimentation et les antiacides","Périodique : poussées de quelques semaines séparées de rémissions"],
 c:["Ulcère duodénal ou gastrique","Infection à Helicobacter pylori","Anti-inflammatoires non stéroïdiens, aspirine"],
 k:"Complications : hémorragie, perforation, sténose. Tout ulcère gastrique doit être biopsié (risque de cancer)."},
{id:'malabsorption', sys:'dig', n:"Syndrome de malabsorption",
 e:"L'intestin n'arrive plus à attraper les bons éléments de la nourriture. Ils repartent dans les selles, qui deviennent grasses et abondantes, et le corps manque de tout : on maigrit et on a des carences.",
 h:"Ensemble des manifestations cliniques et biologiques liées à un défaut d'absorption des nutriments par l'intestin grêle, par atteinte pariétale ou par maldigestion.",
 s:["Diarrhée chronique, selles abondantes, graisseuses (stéatorrhée)","Amaigrissement avec appétit conservé, retard de croissance chez l'enfant","Anémie par carence en fer, folates ou vitamine B12","Œdèmes (hypoalbuminémie)","Douleurs osseuses, tétanie (vitamine D, calcium), syndrome hémorragique (vitamine K)"],
 c:["Maladie cœliaque","Pancréatite chronique (maldigestion)","Parasitoses : giardiase","Résection du grêle, maladie de Crohn"],
 k:"Diarrhée chronique + amaigrissement + carences."},
/* ===== Néphrologie ===== */
{id:'nephrotique', sys:'nephro', n:"Syndrome néphrotique",
 e:"Le rein est une passoire qui doit garder les protéines dans le sang. Ici, les trous sont trop grands : les protéines partent dans les urines. Sans elles, l'eau ne reste plus dans les vaisseaux et va gonfler le visage et les jambes.",
 h:"Syndrome biologique défini par une protéinurie supérieure à 3 g par 24 heures (50 mg/kg/j chez l'enfant), une hypoalbuminémie inférieure à 30 g/L et une hypoprotidémie inférieure à 60 g/L. Il traduit une atteinte glomérulaire.",
 s:["Œdèmes blancs, mous, indolores, prenant le godet, déclives ; bouffissure des paupières le matin","Prise de poids, parfois anasarque","Urines mousseuses","Pur : pas d'hématurie, pas d'HTA, pas d'insuffisance rénale ; impur si l'un des trois est présent","Hyperlipidémie associée"],
 c:["Lésions glomérulaires minimes (enfant)","Hyalinose segmentaire et focale","Glomérulonéphrite extra-membraneuse","Diabète, amylose, lupus"],
 k:"Complications : thromboses veineuses, infections. La définition est biologique, pas clinique."},
{id:'nephritique', sys:'nephro', n:"Syndrome néphritique aigu",
 e:"Les filtres du rein s'enflamment d'un coup, souvent deux semaines après une angine. Le rein laisse passer du sang et garde l'eau et le sel : les urines sont foncées comme du coca, on gonfle et la tension monte.",
 h:"Syndrome glomérulaire d'installation brutale associant hématurie, protéinurie, œdèmes, hypertension artérielle et oligurie avec insuffisance rénale aiguë modérée. Il traduit une glomérulonéphrite aiguë.",
 s:["Début brutal, en quelques jours","Hématurie macroscopique (urines bouillon sale ou coca)","Protéinurie","Œdèmes du visage et des membres inférieurs","Hypertension artérielle, oligurie, insuffisance rénale aiguë"],
 c:["Glomérulonéphrite aiguë post-streptococcique (10 à 21 jours après une angine ou un impétigo)","Autres infections bactériennes"],
 k:"Intervalle libre après l'infection et baisse du complément C3 : deux arguments pour l'origine post-infectieuse."},
{id:'gnrp', sys:'nephro', n:"Syndrome de glomérulonéphrite rapidement progressive",
 e:"Les filtres du rein sont détruits très vite. En quelques semaines, le rein s'arrête presque de fonctionner. Il faut aller vite, sinon le rein est perdu.",
 h:"Syndrome glomérulaire associant hématurie, protéinurie et insuffisance rénale d'aggravation rapide, en quelques jours à quelques semaines. Il correspond histologiquement à une glomérulonéphrite extracapillaire à croissants.",
 s:["Insuffisance rénale s'aggravant en jours ou semaines","Hématurie, souvent macroscopique","Protéinurie","Signes extra-rénaux possibles : hémorragie alvéolaire, purpura, arthralgies"],
 c:["Maladie de Goodpasture (anticorps anti-membrane basale glomérulaire)","Vascularites à ANCA","Lupus, purpura rhumatoïde"],
 k:"Urgence néphrologique : ponction-biopsie rénale sans attendre."},
{id:'hematurierec', sys:'nephro', n:"Syndrome d'hématurie macroscopique récidivante",
 e:"De temps en temps, souvent un ou deux jours après un rhume ou une angine, les urines deviennent rouges, puis ça passe, puis ça revient.",
 h:"Syndrome glomérulaire fait d'épisodes répétés d'hématurie macroscopique, sans caillot ni douleur, parfois associés à une hématurie microscopique et à une protéinurie entre les épisodes.",
 s:["Hématurie macroscopique totale, sans caillot, indolore","Survenue 24 à 48 heures après une infection ORL","Récidives","Entre les épisodes : hématurie microscopique, protéinurie possible"],
 c:["Néphropathie à IgA (maladie de Berger)","Syndrome d'Alport (avec surdité)"],
 k:"Délai court après l'infection (1 à 2 jours), à l'inverse de la glomérulonéphrite post-streptococcique (2 à 3 semaines)."},
{id:'nti', sys:'nephro', n:"Syndrome de néphropathie tubulo-interstitielle",
 e:"Ce ne sont pas les filtres du rein qui sont malades, mais les petits tuyaux derrière et le tissu autour. Le rein n'arrive plus à concentrer l'urine ni à garder le sel : on urine beaucoup.",
 h:"Ensemble des signes traduisant une atteinte prédominante des tubules et de l'interstitium rénal, aiguë ou chronique.",
 s:["Protéinurie faible (moins de 1 g par 24 heures), de type tubulaire","Leucocyturie, souvent aseptique","Pas d'œdèmes ; HTA absente ou tardive","Polyurie, perte de sel, acidose métabolique","Forme aiguë immuno-allergique : fièvre, éruption, éosinophilie"],
 c:["Aiguës : médicaments (antibiotiques, AINS), pyélonéphrite","Chroniques : obstacle et reflux, analgésiques, plantes, lithiases, causes métaboliques"],
 k:"Peu de protéines, pas d'œdèmes, leucocytes dans les urines : pense tubule et interstitium, pas glomérule."},
{id:'nephrovasc', sys:'nephro', n:"Syndrome de néphropathie vasculaire",
 e:"Les petits tuyaux qui amènent le sang au rein sont abîmés ou rétrécis. Le rein est mal arrosé, il fait monter la tension, et il se fatigue peu à peu.",
 h:"Ensemble des signes traduisant une atteinte des vaisseaux rénaux, des artères aux capillaires, où l'hypertension artérielle est au premier plan.",
 s:["Hypertension artérielle, souvent sévère","Protéinurie faible ou absente","Hématurie rare","Insuffisance rénale d'évolution variable"],
 c:["Néphroangiosclérose (HTA ancienne)","Sténose de l'artère rénale","Microangiopathie thrombotique (syndrome hémolytique et urémique)","Emboles de cholestérol"],
 k:"L'HTA domine le tableau, le sédiment urinaire est pauvre."},
{id:'ira', sys:'nephro', n:"Syndrome d'insuffisance rénale aiguë",
 e:"Les reins s'arrêtent de nettoyer le sang en quelques heures ou quelques jours. Les déchets s'accumulent, et souvent on n'urine presque plus.",
 h:"Baisse brutale et potentiellement réversible du débit de filtration glomérulaire, avec élévation de la créatininémie et, souvent, oligo-anurie.",
 s:["Oligurie (moins de 500 mL par 24 heures) ou anurie ; la diurèse peut être conservée","Élévation rapide de la créatinine et de l'urée","Hyperkaliémie, acidose métabolique","Surcharge hydrosodée : œdèmes, œdème pulmonaire"],
 c:["Fonctionnelle (pré-rénale) : hypovolémie, déshydratation, état de choc","Organique (rénale) : nécrose tubulaire aiguë, glomérulonéphrites, néphrites interstitielles","Obstructive (post-rénale) : lithiase, adénome ou cancer de la prostate, tumeur pelvienne"],
 k:"Toujours éliminer un obstacle en premier (échographie, globe vésical). L'hyperkaliémie menace la vie : ECG."},
{id:'uremique', sys:'nephro', n:"Syndrome urémique (insuffisance rénale chronique)",
 e:"Les reins sont usés depuis longtemps et ne nettoient plus le sang. Les déchets restent et abîment tout le corps petit à petit : fatigue, pâleur, nausées, démangeaisons, tension élevée.",
 h:"Ensemble des manifestations cliniques et biologiques de l'insuffisance rénale chronique évoluée, liées à la rétention des toxines urémiques et à la perte des fonctions endocrines du rein.",
 s:["Asthénie, pâleur (anémie normochrome normocytaire arégénérative)","Nausées, vomissements, anorexie, haleine urémique","Prurit, crampes, polynévrite","Hypertension artérielle, péricardite urémique","Biologie : hypocalcémie, hyperphosphorémie, hyperkaliémie, acidose métabolique","Petits reins à l'échographie"],
 c:["Diabète","Hypertension artérielle (néphroangiosclérose)","Glomérulonéphrites chroniques","Polykystose rénale, néphropathies interstitielles chroniques"],
 k:"Arguments pour la chronicité : petits reins, anémie, hypocalcémie."},
{id:'coliquenephretique', sys:'nephro', n:"Colique néphrétique",
 e:"Un petit caillou bloque le tuyau qui va du rein à la vessie. L'urine pousse derrière, ça distend le rein et ça fait une douleur terrible dans le dos, qui descend vers le bas-ventre. On ne trouve aucune position qui soulage.",
 h:"Syndrome douloureux lombo-abdominal aigu résultant de la mise en tension brutale de la voie excrétrice supérieure en amont d'un obstacle.",
 s:["Douleur lombaire unilatérale, brutale, intense, paroxystique","Irradiation en bas et en avant vers la fosse iliaque et les organes génitaux externes","Agitation, pas de position antalgique","Signes urinaires (pollakiurie, hématurie) et digestifs (nausées, vomissements)","Pas de fièvre dans la forme simple"],
 c:["Lithiase urinaire (la plus fréquente)","Caillots, nécrose papillaire","Compression extrinsèque, tumeur de la voie excrétrice"],
 k:"Formes graves à hospitaliser : fébrile, anurique, hyperalgique."},
/* ===== Rhumatologie ===== */
{id:'artinflam', sys:'rhumato', n:"Syndrome articulaire inflammatoire (arthrite)",
 e:"L'articulation est en feu de l'intérieur. Elle est gonflée, chaude, rouge, et elle fait mal surtout la nuit et le matin au réveil. Il faut un long moment le matin pour la dérouiller.",
 h:"Atteinte articulaire dont la douleur a un horaire inflammatoire, associée à des signes locaux d'inflammation et à un liquide articulaire riche en cellules.",
 s:["Douleur nocturne, en deuxième partie de nuit, avec réveils","Raideur matinale avec dérouillage de plus de 30 minutes","Douleur améliorée par l'activité","Gonflement, chaleur, rougeur, épanchement articulaire","Syndrome inflammatoire biologique ; liquide articulaire de plus de 2 000 éléments par mm³"],
 c:["Arthrite septique (urgence)","Goutte, chondrocalcinose","Polyarthrite rhumatoïde","Spondyloarthrites, rhumatisme articulaire aigu"],
 k:"Une monoarthrite aiguë fébrile est une arthrite septique jusqu'à preuve du contraire : ponction articulaire."},
{id:'artmeca', sys:'rhumato', n:"Syndrome articulaire mécanique (arthrose)",
 e:"L'articulation est usée, comme une charnière qui a trop servi. Elle fait mal quand on s'en sert et en fin de journée, et elle se calme quand on se repose.",
 h:"Atteinte articulaire dont la douleur a un horaire mécanique, sans signe inflammatoire local ni biologique, traduisant le plus souvent une dégradation du cartilage.",
 s:["Douleur à l'effort et à la mise en charge, maximale en fin de journée","Calmée par le repos, pas de réveil nocturne (sauf aux changements de position)","Dérouillage matinal bref, de moins de 15 minutes","Pas de rougeur ni de chaleur ; déformations, craquements","Pas de syndrome inflammatoire ; liquide articulaire pauvre en cellules (moins de 1 000 par mm³)"],
 c:["Arthrose primitive (âge, surpoids)","Arthrose secondaire : traumatisme, dysplasie, déformation","Ostéonécrose, lésion méniscale"],
 k:"Trois questions suffisent : la nuit ? le matin ? à l'effort ?"},
{id:'radiculaire', sys:'rhumato', n:"Syndrome radiculaire (sciatique)",
 e:"Un nerf est pincé à sa sortie de la colonne, souvent par un disque qui a glissé. La douleur part du bas du dos et descend dans la jambe comme une décharge, en suivant toujours le même chemin.",
 h:"Ensemble des signes traduisant la souffrance d'une racine nerveuse : douleur de topographie radiculaire, impulsive à la toux, avec parfois un déficit sensitif, moteur et réflexe dans le territoire correspondant.",
 s:["Douleur de trajet systématisé, augmentée par la toux et la défécation","L5 : fesse, face externe de la cuisse et de la jambe, dos du pied, gros orteil ; marche sur les talons difficile","S1 : fesse, face postérieure de la cuisse et du mollet, talon, plante, bord externe du pied ; réflexe achilléen aboli ; marche sur les pointes difficile","Signe de Lasègue","Syndrome rachidien associé : raideur, contracture, attitude antalgique"],
 c:["Hernie discale (conflit disco-radiculaire)","Arthrose, canal lombaire étroit","Causes secondaires : tumeur, spondylodiscite"],
 k:"Urgences chirurgicales : sciatique paralysante, syndrome de la queue de cheval, sciatique hyperalgique."},
/* ===== Endocrinologie ===== */
{id:'thyrotoxicose', sys:'endoc', n:"Syndrome de thyrotoxicose (hyperthyroïdie)",
 e:"La thyroïde est la pédale d'accélérateur du corps. Ici, elle est bloquée à fond : le cœur bat vite, on a chaud, on transpire, on tremble, on maigrit alors qu'on mange beaucoup.",
 h:"Ensemble des manifestations liées à l'excès d'hormones thyroïdiennes au niveau des tissus cibles. La TSH est effondrée et la T4 libre élevée dans les formes périphériques.",
 s:["Amaigrissement avec appétit conservé ou augmenté","Tachycardie permanente, palpitations, éréthisme cardiaque","Thermophobie, hypersudation, mains chaudes et moites","Tremblement fin des extrémités, nervosité, insomnie","Diarrhée motrice, amyotrophie proximale (signe du tabouret)"],
 c:["Maladie de Basedow : goitre diffus vasculaire, exophtalmie, myxœdème prétibial","Adénome toxique, goitre multinodulaire toxique","Thyroïdites","Surcharge iodée (amiodarone), prise d'hormones thyroïdiennes"],
 k:"Complications : cardiothyréose (fibrillation atriale), crise aiguë thyrotoxique."},
{id:'hypothyroidie', sys:'endoc', n:"Syndrome d'hypothyroïdie",
 e:"La thyroïde ne donne plus assez de carburant. Tout le corps tourne au ralenti : on a froid, on est fatigué et lent, on grossit, le cœur bat doucement, on est constipé et le visage gonfle.",
 h:"Ensemble des manifestations liées à l'insuffisance de sécrétion des hormones thyroïdiennes. Dans la forme périphérique, la TSH est élevée et la T4 libre basse.",
 s:["Asthénie, ralentissement psychomoteur, somnolence","Frilosité, prise de poids modérée","Bradycardie, constipation","Peau sèche, froide, pâle, cireuse ; dépilation (queue du sourcil), cheveux secs","Myxœdème : visage bouffi, paupières gonflées, macroglossie, voix rauque, mains et pieds infiltrés"],
 c:["Thyroïdite de Hashimoto","Thyroïdectomie, iode radioactif","Carence iodée","Médicaments : amiodarone, lithium","Insuffisance hypophysaire (TSH basse ou normale)"],
 k:"Complication grave : le coma myxœdémateux. Le dépistage se fait par la TSH."},
{id:'cushing', sys:'endoc', n:"Syndrome de Cushing (hypercorticisme)",
 e:"Il y a trop de cortisol dans le corps. La graisse s'installe sur le visage et le ventre, alors que les bras et les jambes fondent. La peau devient fine et fragile, avec de larges vergetures violettes.",
 h:"Ensemble des manifestations cliniques et biologiques secondaires à un excès chronique de glucocorticoïdes, d'origine exogène ou endogène.",
 s:["Obésité facio-tronculaire : visage arrondi et rouge, bosse de bison, comblement des creux sus-claviculaires","Amyotrophie des racines des membres","Vergetures larges, pourpres ; peau fine, ecchymoses faciles","Hypertension artérielle, diabète","Ostéoporose, hirsutisme, troubles des règles, troubles psychiques"],
 c:["Corticothérapie prolongée (première cause)","Maladie de Cushing : adénome hypophysaire à ACTH","Adénome ou corticosurrénalome","Sécrétion ectopique d'ACTH (cancer bronchique)"],
 k:"Les signes les plus spécifiques sont ceux du catabolisme : amyotrophie, peau fine, vergetures pourpres, ecchymoses."},
{id:'addison', sys:'endoc', n:"Syndrome d'insuffisance surrénale (maladie d'Addison)",
 e:"Les glandes surrénales ne fabriquent plus assez de cortisol ni l'hormone qui garde le sel. On est épuisé, on maigrit, la tension est basse, on a envie de sel, et la peau fonce comme si on était bronzé.",
 h:"Déficit de sécrétion des hormones corticosurrénaliennes (glucocorticoïdes et minéralocorticoïdes), d'origine périphérique (surrénale) ou centrale (hypophyse).",
 s:["Asthénie physique et psychique, augmentant au cours de la journée","Amaigrissement, anorexie, troubles digestifs","Hypotension artérielle, surtout orthostatique","Mélanodermie : plis de flexion, cicatrices, mamelons, taches ardoisées des muqueuses (forme périphérique seulement)","Goût pour le sel ; hyponatrémie, hyperkaliémie, hypoglycémie"],
 c:["Tuberculose des surrénales (fréquente en Afrique)","Rétraction corticale auto-immune","Arrêt brutal d'une corticothérapie prolongée (forme centrale)","Infection par le VIH, métastases"],
 k:"L'insuffisance surrénale aiguë est une urgence vitale. Pas de mélanodermie dans la forme centrale."},
{id:'polyuropolydipsie', sys:'endoc', n:"Syndrome polyuro-polydipsique",
 e:"On urine énormément, donc on a tout le temps soif et on boit énormément. Soit le sucre en trop dans le sang entraîne l'eau dans les urines, soit le rein n'arrive plus à retenir l'eau.",
 h:"Association d'une polyurie supérieure à 3 litres par 24 heures et d'une polydipsie compensatrice.",
 s:["Diurèse supérieure à 3 L par 24 heures, nycturie","Soif intense, prises de boisson abondantes","Diabète sucré : syndrome cardinal (polyurie, polydipsie, polyphagie, amaigrissement)","Diabète insipide : urines claires, hypotoniques"],
 c:["Diabète sucré (polyurie osmotique)","Diabète insipide central (déficit en hormone antidiurétique) ou néphrogénique","Potomanie","Hypercalcémie, hypokaliémie"],
 k:"Premier geste : glycémie et bandelette urinaire."},
{id:'hypoglycemie', sys:'endoc', n:"Syndrome hypoglycémique",
 e:"Le sucre est l'essence du cerveau. Quand il en manque dans le sang, le corps sonne l'alarme (sueurs, tremblements, faim), puis le cerveau tombe en panne (confusion, convulsions, coma).",
 h:"Ensemble des manifestations liées à une baisse de la glycémie (en dessous de 0,50 g/L, ou 0,70 g/L chez le diabétique). Le diagnostic repose sur la triade de Whipple.",
 s:["Signes adrénergiques : sueurs, pâleur, tremblements, palpitations, faim impérieuse","Signes neuroglucopéniques : troubles de la concentration, troubles visuels, confusion, troubles du comportement","Convulsions, coma agité avec sueurs et signe de Babinski bilatéral","Triade de Whipple : symptômes, glycémie basse, correction par le sucre"],
 c:["Insuline, sulfamides hypoglycémiants","Alcool, jeûne","Insulinome","Insuffisance surrénale, hypophysaire ou hépatique"],
 k:"Tout trouble de conscience ou du comportement impose une glycémie capillaire."},
{id:'hypercalcemie', sys:'endoc', n:"Syndrome d'hypercalcémie (hyperparathyroïdie)",
 e:"Il y a trop de calcium dans le sang, souvent parce qu'une petite glande du cou le fait sortir des os. On est fatigué, on urine et on boit beaucoup, on est constipé, les os font mal et des cailloux se forment dans les reins.",
 h:"Ensemble des manifestations liées à l'élévation de la calcémie (au-dessus de 2,6 mmol/L), dont la cause la plus fréquente en ambulatoire est l'hyperparathyroïdie primaire.",
 s:["Asthénie, faiblesse musculaire","Syndrome polyuro-polydipsique, déshydratation","Constipation, nausées, vomissements, douleurs abdominales","Douleurs osseuses, lithiase rénale","Troubles psychiques, confusion ; raccourcissement de l'espace QT"],
 c:["Hyperparathyroïdie primaire (adénome parathyroïdien)","Cancers : métastases osseuses, myélome","Intoxication par la vitamine D, sarcoïdose"],
 k:"Moyen mnémotechnique : les os, les reins, le ventre, la tête."},
{id:'hypocalcemie', sys:'endoc', n:"Syndrome d'hypocalcémie (tétanie, hypoparathyroïdie)",
 e:"Il n'y a pas assez de calcium dans le sang. Les nerfs et les muscles deviennent trop excitables : ça fourmille autour de la bouche et au bout des doigts, puis les mains se crispent toutes seules.",
 h:"Ensemble des manifestations d'hyperexcitabilité neuromusculaire liées à la baisse du calcium ionisé plasmatique.",
 s:["Paresthésies péribuccales et des extrémités","Crampes, crise de tétanie : main d'accoucheur, spasme carpo-pédal","Signe de Chvostek, signe de Trousseau","Convulsions, laryngospasme","Allongement de l'espace QT"],
 c:["Hypoparathyroïdie, surtout après chirurgie thyroïdienne","Carence en vitamine D","Insuffisance rénale chronique","Hypomagnésémie"],
 k:"Chvostek : percussion du nerf facial. Trousseau : brassard gonflé 3 minutes qui déclenche la main d'accoucheur."},
{id:'acromegalie', sys:'endoc', n:"Acromégalie",
 e:"Une petite boule dans l'hypophyse fabrique trop d'hormone de croissance chez un adulte. Les os ne peuvent plus grandir en longueur, alors ils épaississent : les mains, les pieds et le visage s'élargissent lentement.",
 h:"Ensemble des manifestations liées à une hypersécrétion chronique d'hormone de croissance (GH) chez l'adulte, due le plus souvent à un adénome hypophysaire somatotrope.",
 s:["Élargissement des mains et des pieds (bagues, pointure)","Visage : prognathisme, saillie des arcades sourcilières, nez épaissi, macroglossie","Sueurs, peau épaisse, voix grave","Hypertension artérielle, diabète, syndrome du canal carpien, apnées du sommeil","Syndrome tumoral hypophysaire : céphalées, hémianopsie bitemporale"],
 c:["Adénome hypophysaire à GH"],
 k:"Comparer avec d'anciennes photos. Dosage de l'IGF-1. Chez l'enfant, le même excès donne un gigantisme."},
{id:'insufantehypo', sys:'endoc', n:"Syndrome d'insuffisance antéhypophysaire",
 e:"L'hypophyse est le chef qui commande les autres glandes. Quand le chef ne donne plus d'ordres, la thyroïde, les surrénales et les glandes sexuelles se mettent au repos : fatigue, pâleur, peau fine sans poils, plus de règles.",
 h:"Déficit de sécrétion d'une ou de plusieurs hormones de l'antéhypophyse (panhypopituitarisme si toutes sont touchées), avec retentissement sur les glandes périphériques.",
 s:["Pâleur, peau fine, dépigmentée ; dépilation axillaire et pubienne","Asthénie, hypotension, tendance à l'hypoglycémie (déficit corticotrope)","Frilosité, ralentissement (déficit thyréotrope)","Aménorrhée, baisse de la libido, impuissance (déficit gonadotrope)","Absence de montée laiteuse après l'accouchement"],
 c:["Adénome hypophysaire, craniopharyngiome","Syndrome de Sheehan (nécrose hypophysaire après hémorragie de la délivrance)","Chirurgie ou radiothérapie hypophysaire, traumatisme crânien"],
 k:"Pas de mélanodermie, à l'inverse de la maladie d'Addison : ici l'ACTH est basse."},
{id:'pheo', sys:'endoc', n:"Phéochromocytome",
 e:"Une petite boule dans la glande surrénale lâche de l'adrénaline par bouffées. D'un coup, la tension monte très haut, le cœur s'emballe, la tête fait mal et on est trempé de sueur.",
 h:"Tumeur de la médullosurrénale sécrétant des catécholamines, responsable d'une hypertension artérielle permanente ou paroxystique.",
 s:["Triade de Ménard : céphalées, sueurs, palpitations","Hypertension artérielle paroxystique ou permanente, parfois hypotension orthostatique","Pâleur pendant les accès, anxiété, tremblements","Amaigrissement, hyperglycémie"],
 c:["Tumeur de la médullosurrénale, le plus souvent bénigne","Formes familiales : néoplasies endocriniennes multiples de type 2, maladie de von Hippel-Lindau, neurofibromatose"],
 k:"Diagnostic biologique : dosage des métanéphrines plasmatiques ou urinaires. HTA du sujet jeune avec triade de Ménard."},
/* ===== Ajouts : syndromes complémentaires ===== */
{id:"x-confusionnel", sys:"neuro", n:"Syndrome confusionnel",
 e:"Le cerveau « se brouille » d'un coup : la personne ne sait plus où elle est ni quel jour on est, ne suit pas une conversation, et cela varie dans la journée, souvent pire la nuit.",
 h:"Défaillance aiguë et globale des fonctions cognitives, d'installation rapide (heures à jours) et d'évolution fluctuante, dominée par un trouble de la vigilance et de l'attention. C'est une urgence : il traduit presque toujours une cause organique.",
 s:["Début brutal, fluctuations dans la journée, aggravation nocturne", "Troubles de l'attention et de la vigilance (obnubilation)", "Désorientation temporo-spatiale, troubles de la mémoire récente", "Onirisme, hallucinations surtout visuelles, agitation ou au contraire prostration", "Inversion du rythme veille-sommeil"],
 c:["Infections (paludisme grave, méningo-encéphalite, sepsis, infection urinaire du sujet âgé)", "Troubles métaboliques : hypoglycémie, hyponatrémie, hypercalcémie, insuffisance hépatique ou rénale", "Médicaments et toxiques (benzodiazépines, anticholinergiques, opiacés), sevrage alcoolique", "Causes neurologiques : AVC, hématome sous-dural, état de mal non convulsif"],
 k:"Glycémie capillaire et goutte épaisse d'abord. Un délire d'apparition brutale avec trouble de la vigilance n'est pas « psychiatrique » tant qu'une cause organique n'a pas été éliminée."},
{id:"x-comateux", sys:"neuro", n:"Syndrome comateux (coma)",
 e:"La personne ne se réveille pas, même quand on lui parle fort ou qu'on la pince : le « bouton de l'éveil » du cerveau ne fonctionne plus.",
 h:"Abolition de la conscience et de la vigilance, non réversible par les stimulations, par atteinte de la substance réticulée activatrice du tronc cérébral ou atteinte diffuse des deux hémisphères. Sa profondeur se mesure par le score de Glasgow (3 à 15 ; coma si ≤ 8).",
 s:["Absence d'ouverture des yeux, de réponse verbale et motrice adaptées (score de Glasgow)", "Signes de localisation : hémiplégie, asymétrie pupillaire", "Réflexes du tronc : photomoteur, cornéen, oculocéphalique", "Troubles respiratoires (Cheyne-Stokes, Kussmaul), troubles végétatifs", "Signes d'engagement : mydriase unilatérale aréactive"],
 c:["Métaboliques : hypoglycémie, acidocétose, coma hyperosmolaire, encéphalopathie hépatique ou urémique", "Infectieuses : neuropaludisme, méningites, encéphalites", "Vasculaires : AVC, hémorragie méningée, hématomes", "Toxiques : barbituriques, alcool, monoxyde de carbone, organophosphorés", "Traumatiques et épileptiques (état post-critique, état de mal)"],
 k:"Devant tout coma : liberté des voies aériennes, glycémie capillaire, goutte épaisse en zone d'endémie. Un coma calme sans signe de localisation fait penser à une cause toxique ou métabolique."},
{id:"x-horner", sys:"neuro", n:"Syndrome de Claude Bernard-Horner",
 e:"Le petit nerf qui garde l'œil grand ouvert ne marche plus d'un côté : la paupière tombe un peu, la pupille est plus petite et l'œil paraît enfoncé.",
 h:"Atteinte de la voie sympathique oculaire, à n'importe quel niveau de son trajet (hypothalamus, tronc cérébral, moelle cervico-thoracique, apex pulmonaire, carotide). Il associe myosis, ptosis et énophtalmie du même côté.",
 s:["Myosis (pupille plus petite, surtout visible dans l'obscurité)", "Ptosis partiel (chute modérée de la paupière supérieure)", "Énophtalmie (œil paraissant enfoncé)", "Parfois anhidrose de l'hémiface et rougeur conjonctivale"],
 c:["Cancer de l'apex pulmonaire (syndrome de Pancoast-Tobias)", "Dissection de l'artère carotide interne (urgence)", "Syndrome de Wallenberg, tumeurs médullaires, syringomyélie", "Adénopathies et tumeurs cervicales, chirurgie du cou"],
 k:"Un Claude Bernard-Horner douloureux récent impose de chercher une dissection carotidienne ; chez un fumeur avec douleur de l'épaule, pense au cancer de l'apex."},
{id:"x-wallenberg", sys:"neuro", n:"Syndrome de Wallenberg (syndrome alterne)",
 e:"Un petit infarctus dans le bulbe, en bas du cerveau, abîme d'un côté le visage et l'équilibre, et de l'autre côté la sensibilité du corps à la chaleur et à la douleur.",
 h:"Syndrome alterne bulbaire latéral, le plus souvent par occlusion de l'artère vertébrale ou de la cérébelleuse postéro-inférieure. Atteinte des nerfs crâniens et du cervelet du côté de la lésion, sensibilité thermo-algique de l'hémicorps opposé.",
 s:["Du côté de la lésion : anesthésie thermo-algique de l'hémiface (V), Claude Bernard-Horner, syndrome cérébelleux", "Troubles de la déglutition et de la phonation (IX, X), syndrome vestibulaire (vertige, nystagmus)", "Du côté opposé : anesthésie thermo-algique de l'hémicorps, sans déficit moteur", "Début brutal par vertige, vomissements, hoquet, douleur de la nuque"],
 c:["Infarctus du bulbe latéral (athérome vertébral)", "Dissection de l'artère vertébrale chez le sujet jeune"],
 k:"Pas de paralysie dans le Wallenberg : c'est un AVC qui ne « paralyse » pas mais fait tomber et avaler de travers. Risque de pneumopathie d'inhalation : vérifier la déglutition avant de faire manger."},
{id:"x-gbs", sys:"neuro", n:"Syndrome de Guillain-Barré (polyradiculonévrite aiguë)",
 e:"Après une infection banale, les défenses du corps attaquent par erreur la gaine des nerfs : les jambes faiblissent, puis la faiblesse monte, parfois jusqu'aux muscles de la respiration.",
 h:"Polyradiculonévrite aiguë inflammatoire démyélinisante, d'origine auto-immune, survenant souvent 1 à 3 semaines après une infection (Campylobacter, virus). Déficit moteur ascendant, symétrique, aréflexique, avec dissociation albumino-cytologique du liquide cérébrospinal.",
 s:["Paresthésies distales puis déficit moteur ascendant, symétrique, en quelques jours (maximum en moins de 4 semaines)", "Aréflexie ostéotendineuse", "Atteinte des nerfs crâniens (diplégie faciale), troubles de la déglutition", "Troubles respiratoires (risque vital), dysautonomie (troubles du rythme, variations tensionnelles)", "Ponction lombaire : protéinorachie élevée, cellules normales (dissociation albumino-cytologique)"],
 c:["Infections précédentes : Campylobacter jejuni, CMV, EBV, VIH (primo-infection), Zika", "Vaccinations (exceptionnel), chirurgie"],
 k:"Surveiller la capacité vitale et la déglutition : la mort vient de la respiration et du cœur. Traitement : immunoglobulines ou échanges plasmatiques, jamais de corticoïdes."},
{id:"x-hta-maligne", sys:"cardio", n:"Hypertension artérielle maligne (urgence hypertensive)",
 e:"La tension est si haute qu'elle abîme en quelques heures ou jours le cerveau, les yeux, le cœur et les reins.",
 h:"Élévation tensionnelle sévère (souvent ≥ 180/120 mmHg) associée à une souffrance aiguë d'organes cibles. Elle se distingue de la simple poussée hypertensive, sans atteinte viscérale, qui ne demande pas de baisse brutale.",
 s:["Céphalées, troubles visuels, encéphalopathie (confusion, convulsions)", "Fond d'œil : hémorragies, exsudats, œdème papillaire (stade III-IV)", "Œdème aigu du poumon, douleur thoracique (dissection, syndrome coronarien)", "Insuffisance rénale aiguë, protéinurie, hématurie, microangiopathie thrombotique", "Soif, amaigrissement, syndrome polyuro-polydipsique (hyperaldostéronisme secondaire)"],
 c:["HTA essentielle mal traitée ou arrêt du traitement (fréquent en Afrique, sujet noir)", "Néphropathies, sténose des artères rénales", "Pré-éclampsie, phéochromocytome, toxiques (cocaïne)"],
 k:"Baisser la tension progressivement (environ 25 % la première heure) avec un traitement intraveineux : une chute brutale peut provoquer un AVC ou un infarctus."},
{id:"x-raynaud", sys:"cardio", n:"Syndrome de Raynaud",
 e:"Au froid ou au stress, les doigts deviennent tout blancs et engourdis, puis bleus, puis rouges et douloureux quand le sang revient.",
 h:"Acrosyndrome vasculaire paroxystique, déclenché par le froid ou l'émotion, lié à un spasme des artères digitales. Il est primitif (maladie de Raynaud) ou secondaire, notamment aux connectivites.",
 s:["Phase syncopale : doigts blancs, froids, insensibles, bien limités", "Phase asphyxique : doigts cyanosés", "Phase hyperhémique : rougeur, chaleur, douleurs, picotements", "Signes de gravité : ulcérations, nécroses pulpaires"],
 c:["Primitif : femme jeune, bilatéral, symétrique, sans complication", "Sclérodermie systémique et autres connectivites (lupus, Gougerot-Sjögren)", "Vibrations professionnelles, médicaments (bêtabloquants, dérivés de l'ergot), compression (défilé thoraco-brachial)"],
 k:"Une capillaroscopie anormale ou des anticorps antinucléaires orientent vers une sclérodermie. Le Raynaud unilatéral ou du sujet âgé doit faire chercher une cause artérielle."},
{id:"x-rm", sys:"cardio", n:"Syndrome de rétrécissement mitral",
 e:"La valve entre l'oreillette et le ventricule gauche, abîmée par un ancien rhumatisme, ne s'ouvre plus bien : le sang s'accumule en amont et remonte vers les poumons.",
 h:"Réduction de la surface de l'orifice mitral (< 2 cm² significatif, < 1,5 cm² serré), le plus souvent séquelle de rhumatisme articulaire aigu, encore fréquente en Afrique. Elle entraîne une hypertension auriculaire gauche puis pulmonaire.",
 s:["Dyspnée d'effort progressive, hémoptysie, œdème aigu du poumon (grossesse, fibrillation atriale)", "Auscultation : éclat du B1, claquement d'ouverture mitrale, roulement diastolique apexien avec renforcement présystolique", "Pouls irrégulier (fibrillation atriale), embolies systémiques (AVC)", "ECG : hypertrophie auriculaire gauche ; radiographie : arc moyen gauche convexe", "Échographie : valve épaissie, fusion commissurale, surface mitrale réduite"],
 c:["Rhumatisme articulaire aigu (cause de loin la plus fréquente)", "Calcifications de l'anneau mitral du sujet âgé, causes congénitales (rares)"],
 k:"Le rétrécissement mitral se décompense volontiers pendant la grossesse. Prévention : traiter toute angine de l'enfant par pénicilline (prévention du RAA)."},
{id:"x-bronchique", sys:"pneumo", n:"Syndrome bronchique",
 e:"Les tuyaux de l'air sont irrités ou encombrés : on tousse et on crache, et à l'écoute on entend des bruits de bulles ou de sifflement.",
 h:"Ensemble des signes traduisant une atteinte des bronches : toux, expectoration et râles bronchiques (ronchi, sibilants), sans signe de condensation ni d'épanchement.",
 s:["Toux sèche ou productive, expectoration muqueuse ou purulente", "Ronchi (râles graves qui se modifient à la toux), sibilants", "Dyspnée variable, sifflante dans l'asthme", "Radiographie souvent normale ou épaississement des parois bronchiques"],
 c:["Bronchite aiguë (virale), bronchite chronique, BPCO", "Asthme", "Bronchectasies (dilatation des bronches), corps étranger chez l'enfant"],
 k:"Une toux qui dure plus de 3 semaines en Afrique impose de chercher une tuberculose (crachats)."},
{id:"x-suppuration", sys:"pneumo", n:"Syndrome de suppuration bronchopulmonaire",
 e:"Du pus se forme dans le poumon ou les bronches et sort en crachats abondants, souvent malodorants.",
 h:"Production chronique ou aiguë d'expectorations purulentes abondantes (bronchorrhée), traduisant une infection d'une cavité pulmonaire (abcès) ou de bronches dilatées.",
 s:["Bronchorrhée purulente abondante, parfois fétide (anaérobies)", "Vomique : rejet brutal d'une grande quantité de pus (abcès)", "Fièvre, altération de l'état général, hippocratisme digital (chronique)", "Râles bronchiques ou crépitants en foyer ; radiographie : image hydro-aérique (abcès)"],
 c:["Abcès du poumon (inhalation, mauvaise hygiène bucco-dentaire, alcoolisme)", "Dilatation des bronches (séquelles de tuberculose, de rougeole, de coqueluche)", "Cancer bronchique abcédé, kyste hydatique surinfecté, empyème ouvert dans les bronches"],
 k:"En Afrique, les séquelles de tuberculose sont une grande cause de dilatation des bronches ; toujours chercher le bacille avant de conclure."},
{id:"x-mediastinal", sys:"pneumo", n:"Syndrome médiastinal",
 e:"Une masse au milieu de la poitrine écrase ce qui passe à côté : les grosses veines, l'œsophage, la trachée, les nerfs.",
 h:"Ensemble des signes de compression des organes du médiastin par un processus expansif (tumeur, adénopathies). Les signes dépendent de l'organe comprimé.",
 s:["Compression veineuse : syndrome cave supérieur (œdème en pèlerine, circulation collatérale)", "Compression trachéale : toux sèche, dyspnée, wheezing ; œsophagienne : dysphagie", "Compression nerveuse : dysphonie (récurrent gauche), hoquet ou paralysie diaphragmatique (phrénique), Claude Bernard-Horner (sympathique)", "Radiographie : élargissement du médiastin ; scanner thoracique pour la localisation"],
 c:["Cancer bronchique et ses adénopathies", "Lymphomes, tuberculose ganglionnaire", "Thymome (médiastin antérieur), goitre plongeant, tumeurs germinales, tumeurs neurogènes (postérieur)"],
 k:"Les « 4 T » du médiastin antérieur : thymome, thyroïde (goitre), tératome, « terrible » lymphome."},
{id:"x-sdra", sys:"pneumo", n:"Syndrome de détresse respiratoire aiguë (SDRA)",
 e:"Les poumons se remplissent de liquide à cause d'une agression grave du corps, sans que le cœur soit en cause : le sang n'arrive plus à prendre l'oxygène.",
 h:"Œdème pulmonaire lésionnel par atteinte de la membrane alvéolo-capillaire, survenant dans la semaine suivant une agression, avec hypoxémie sévère (rapport PaO2/FiO2 ≤ 300) et opacités bilatérales non expliquées par une cause cardiaque.",
 s:["Polypnée, tirage, cyanose, hypoxémie réfractaire à l'oxygène simple", "Radiographie : opacités alvéolaires bilatérales diffuses (« poumons blancs »)", "Pas de signe d'insuffisance cardiaque gauche (échographie)", "Souvent associé à une défaillance multiviscérale"],
 c:["Pneumonies graves (bactériennes, virales : grippe, COVID-19), paludisme grave", "Sepsis, choc, pancréatite aiguë, polytraumatisme, transfusions massives", "Inhalation (de liquide gastrique, noyade), fumées toxiques"],
 k:"Le traitement est surtout la ventilation protectrice (petits volumes) et le décubitus ventral ; traiter la cause."},
{id:"x-mononucleose", sys:"hemato", n:"Syndrome mononucléosique",
 e:"Dans le sang, on trouve beaucoup de grands globules blancs « activés », comme si le corps se battait fort contre un virus.",
 h:"Présence dans le sang d'un nombre élevé de grandes cellules mononucléées hyperbasophiles (lymphocytes T activés), dans le cadre d'une réaction immunitaire, le plus souvent virale.",
 s:["Hyperlymphocytose avec grands lymphocytes hyperbasophiles au frottis", "Fièvre, asthénie, angine (souvent pseudo-membraneuse dans la mononucléose)", "Adénopathies cervicales, splénomégalie", "Cytolyse hépatique modérée"],
 c:["Mononucléose infectieuse (virus d'Epstein-Barr)", "Primo-infection VIH (sérologie obligatoire)", "Cytomégalovirus, toxoplasmose, hépatites virales", "Médicaments (syndrome DRESS)"],
 k:"Devant un syndrome mononucléosique, la sérologie VIH est indispensable. Ampicilline dans la mononucléose : éruption presque constante."},
{id:"x-civd", sys:"hemato", n:"Coagulation intravasculaire disséminée (CIVD)",
 e:"La coagulation s'emballe partout dans les vaisseaux : elle consomme tous les éléments qui servent à coaguler, et le malade se met à saigner de partout.",
 h:"Activation systémique et excessive de la coagulation, avec formation de microthrombi et consommation des plaquettes et des facteurs de coagulation, aboutissant à des hémorragies et à des défaillances d'organes.",
 s:["Saignements diffus : points de ponction, gencives, purpura, hémorragies viscérales", "Thromboses, ischémies, défaillances d'organes (rein, poumon)", "Biologie : thrombopénie, TP abaissé, fibrinogène bas, D-dimères très élevés", "Schizocytes possibles au frottis"],
 c:["Obstétricales : hématome rétroplacentaire, embolie amniotique, mort fœtale, hémorragie du post-partum", "Sepsis graves (méningococcémie, purpura fulminans), paludisme grave", "Cancers (leucémie aiguë promyélocytaire), polytraumatismes, envenimations (vipères)"],
 k:"Le traitement est celui de la cause (vider l'utérus, antibiotiques) ; plasma, plaquettes et fibrinogène si hémorragie."},
{id:"x-drepano", sys:"hemato", n:"Syndrome drépanocytaire majeur",
 e:"Les globules rouges ont une mauvaise hémoglobine qui les déforme en faucille : ils se cassent (anémie) et bouchent les petits vaisseaux (crises douloureuses).",
 h:"Hémoglobinopathie héréditaire autosomique récessive (HbSS, HbSC, S-bêta-thalassémie), très fréquente au Sénégal et en Afrique. Elle associe anémie hémolytique chronique, crises vaso-occlusives et sensibilité aux infections.",
 s:["Crises vaso-occlusives douloureuses : os, abdomen, thorax ; syndrome pieds-mains du nourrisson (dactylite)", "Anémie hémolytique chronique : pâleur, ictère, splénomégalie du petit enfant", "Infections graves (pneumocoque, salmonelles : ostéomyélite), asplénie fonctionnelle", "Complications : syndrome thoracique aigu, séquestration splénique, AVC, priapisme, ulcères de jambe, ostéonécrose de hanche", "Diagnostic : électrophorèse de l'hémoglobine (HbS)"],
 c:["Transmission de deux gènes anormaux (parents porteurs AS)", "Facteurs déclenchant les crises : froid, déshydratation, infection, fièvre, effort, altitude"],
 k:"Prévention : pénicilline orale et vaccins (pneumocoque), acide folique, hydratation, hydroxyurée. Une fièvre chez un drépanocytaire est une urgence."},
{id:"x-sta", sys:"hemato", n:"Syndrome thoracique aigu (drépanocytose)",
 e:"Chez un drépanocytaire, les globules rouges en faucille bouchent les vaisseaux du poumon : douleur dans la poitrine, fièvre et manque d'oxygène.",
 h:"Complication pulmonaire aiguë de la drépanocytose, associant une nouvelle opacité pulmonaire à la radiographie et des signes respiratoires (douleur thoracique, fièvre, toux, hypoxémie). Première cause de décès de l'adulte drépanocytaire.",
 s:["Douleur thoracique, fièvre, toux, polypnée", "Hypoxémie (saturation qui baisse)", "Nouvel infiltrat pulmonaire à la radiographie", "Souvent après une crise osseuse ou une chirurgie"],
 c:["Infection (pneumocoque, germes atypiques), embolie graisseuse de moelle osseuse, thrombose in situ", "Hypoventilation (douleur thoracique, morphine)"],
 k:"Urgence : oxygène, antalgiques, antibiotiques, spirométrie incitative et transfusion ou échange transfusionnel si grave."},
{id:"x-sepsis", sys:"gen", n:"Sepsis et choc septique",
 e:"Une infection devient si forte que le corps, en se défendant, abîme ses propres organes : la tension baisse et les organes s'éteignent les uns après les autres.",
 h:"Le sepsis est une dysfonction d'organe menaçant la vie, due à une réponse inappropriée de l'hôte à une infection. Le choc septique associe une hypotension nécessitant des vasopresseurs et un lactate > 2 mmol/L malgré le remplissage.",
 s:["Fièvre ou hypothermie, frissons, tachycardie, polypnée", "Hypotension, marbrures, temps de recoloration allongé, oligurie", "Confusion, troubles de la conscience", "Lactates élevés, défaillances d'organes (rein, foie, coagulation)", "Score qSOFA : fréquence respiratoire ≥ 22, confusion, pression systolique ≤ 100 mmHg"],
 c:["Pneumonies, infections urinaires, abdominales, cutanées", "Méningococcémie, salmonelloses, paludisme grave (non bactérien mais tableau proche)", "Infections sur cathéter, post-partum et post-abortum"],
 k:"Antibiotiques dans l'heure, après hémocultures ; remplissage (30 mL/kg) ; noradrénaline si choc ; chercher et drainer la source."},
{id:"x-aeg", sys:"gen", n:"Altération de l'état général",
 e:"La personne est fatiguée, n'a plus faim et maigrit sans le vouloir : le corps signale qu'une maladie le ronge.",
 h:"Association d'asthénie, d'anorexie et d'amaigrissement involontaire (les « 3 A »), signe non spécifique mais souvent révélateur d'une maladie organique sérieuse.",
 s:["Asthénie (fatigue persistante, non améliorée par le repos)", "Anorexie (perte d'appétit)", "Amaigrissement involontaire (> 5 % du poids en un mois ou > 10 % en six mois)", "Fièvre, sueurs nocturnes associées (orientent vers une infection ou un lymphome)"],
 c:["Infections chroniques : tuberculose, VIH", "Cancers et hémopathies", "Endocrinopathies (diabète, hyperthyroïdie, insuffisance surrénale), maladies inflammatoires", "Dépression, causes digestives (malabsorption)"],
 k:"Une AEG avec fièvre et sueurs nocturnes en Afrique : tuberculose et VIH en premier. Toujours peser et noter l'évolution du poids."},
{id:"x-hemorragie", sys:"dig", n:"Syndrome d'hémorragie digestive",
 e:"Du sang s'écoule dans le tube digestif : on peut le vomir, rouge ou « marc de café », ou le retrouver dans les selles, noires ou rouges.",
 h:"Saignement d'origine digestive, haut (en amont de l'angle duodéno-jéjunal) ou bas. Il s'extériorise par hématémèse, méléna ou rectorragie et peut entraîner un choc hémorragique.",
 s:["Hématémèse (vomissement de sang) : hémorragie haute", "Méléna (selles noires, goudronneuses, fétides) : surtout haute", "Rectorragie (sang rouge par l'anus) : surtout basse, ou haute très abondante", "Retentissement : pâleur, tachycardie, hypotension, choc ; anémie"],
 c:["Hautes : ulcère gastro-duodénal (AINS), rupture de varices œsophagiennes (cirrhose, bilharziose hépatique), gastrite, Mallory-Weiss, cancer gastrique", "Basses : hémorroïdes, diverticules, cancer colorectal, colites infectieuses (amibiase, shigellose), angiodysplasies"],
 k:"Évaluer la gravité avant tout : deux voies veineuses, groupe sanguin, remplissage. Endoscopie haute dans les 24 heures ; vasoactifs et antibiotiques si cirrhose."},
{id:"x-dyspeptique", sys:"dig", n:"Syndrome dyspeptique",
 e:"Après les repas, l'estomac est lourd, on a vite le ventre plein, on brûle ou on a des nausées.",
 h:"Ensemble de symptômes digestifs hauts : douleur ou gêne épigastrique, sensation de plénitude postprandiale, satiété précoce, ballonnements, nausées. Il est fonctionnel ou lésionnel.",
 s:["Pesanteur, plénitude après les repas, satiété précoce", "Douleurs ou brûlures épigastriques", "Nausées, éructations, ballonnements", "Signes d'alarme : âge > 45-50 ans, amaigrissement, anémie, dysphagie, vomissements, hémorragie"],
 c:["Dyspepsie fonctionnelle (la plus fréquente)", "Ulcère gastro-duodénal, gastrite à Helicobacter pylori (très fréquent en Afrique)", "Cancer gastrique, médicaments (AINS), causes biliaires et pancréatiques"],
 k:"Devant des signes d'alarme : endoscopie haute avec biopsies. Recherche et traitement d'Helicobacter pylori."},
{id:"x-appendiculaire", sys:"dig", n:"Syndrome appendiculaire",
 e:"L'appendice, un petit morceau d'intestin en bas à droite du ventre, s'infecte : douleur à droite, petite fièvre, nausées.",
 h:"Tableau évocateur d'appendicite aiguë : douleur de la fosse iliaque droite, fébricule et signes digestifs, avec réaction péritonéale localisée à l'examen.",
 s:["Douleur épigastrique ou péri-ombilicale qui migre en fosse iliaque droite", "Fébricule (37,5 à 38 °C), nausées, vomissements, langue saburrale", "Douleur provoquée au point de McBurney, défense en fosse iliaque droite", "Signe de Blumberg (douleur à la décompression), signe de Rovsing ; toucher rectal douloureux à droite", "Hyperleucocytose, CRP élevée ; échographie ou scanner si doute"],
 c:["Obstruction de l'appendice (stercolithe, hyperplasie lymphoïde, parasites)", "Diagnostics différentiels : adénolymphite mésentérique, salpingite, grossesse extra-utérine, colique néphrétique, iléite (typhoïde, tuberculose)"],
 k:"Chez la femme jeune, faire un test de grossesse. Formes trompeuses chez l'enfant, le sujet âgé et la femme enceinte : se méfier de la péritonite."},
{id:"x-koenig", sys:"dig", n:"Syndrome de Koenig (subocclusion)",
 e:"Un rétrécissement de l'intestin gêne le passage : le ventre se gonfle et fait mal par crises, puis tout se débloque avec des gargouillements et des gaz.",
 h:"Crises douloureuses abdominales paroxystiques, avec ballonnement et ondulations péristaltiques, se terminant par une débâcle de gaz ou de selles ; il traduit une sténose incomplète de l'intestin grêle.",
 s:["Douleurs abdominales en crises, toujours au même endroit", "Ballonnement localisé pendant la crise, ondulations péristaltiques visibles", "Fin de crise par un gargouillement et une débâcle de gaz ou de selles", "Amaigrissement, signes de la cause"],
 c:["Tuberculose iléo-cæcale (fréquente en Afrique)", "Maladie de Crohn", "Tumeurs du grêle (lymphome, carcinoïde), brides"],
 k:"En Afrique, un syndrome de Koenig chez l'adulte jeune fait chercher une tuberculose intestinale."},
{id:"x-rachidien", sys:"rhumato", n:"Syndrome rachidien",
 e:"Le dos est raide et douloureux, la personne bouge mal la colonne et a des points douloureux quand on appuie.",
 h:"Ensemble de signes traduisant une atteinte du rachis : douleur rachidienne, raideur segmentaire, attitude antalgique et douleur à la pression des épineuses ou des muscles paravertébraux.",
 s:["Douleur rachidienne (cervicalgie, dorsalgie, lombalgie)", "Raideur, diminution des amplitudes (indice de Schober diminué), attitude antalgique", "Douleur à la pression des épineuses, contracture des muscles paravertébraux", "Rythme mécanique (dégénératif) ou inflammatoire (nocturne : infection, tumeur, spondyloarthrite)"],
 c:["Lombalgie commune, discopathie, arthrose", "Spondylodiscites : tuberculose (mal de Pott), brucellose, staphylocoque", "Métastases vertébrales, myélome, spondyloarthrites, tassements ostéoporotiques"],
 k:"Signes d'alerte (« drapeaux rouges ») : fièvre, douleur nocturne, âge > 50 ans, cancer connu, déficit neurologique. En Afrique, pense au mal de Pott."},
{id:"x-canal-carpien", sys:"rhumato", n:"Syndrome du canal carpien",
 e:"Le nerf de la main passe dans un petit tunnel au poignet ; quand il est serré, les doigts fourmillent, surtout la nuit.",
 h:"Neuropathie canalaire par compression du nerf médian sous le ligament annulaire antérieur du carpe. C'est la plus fréquente des neuropathies canalaires.",
 s:["Paresthésies des trois premiers doigts et de la moitié du 4e, surtout nocturnes, réveillant la patiente", "Soulagement en secouant la main ; maladresse, lâchage d'objets", "Signes de Tinel (percussion du poignet) et de Phalen (flexion forcée du poignet)", "Formes évoluées : amyotrophie de l'éminence thénar, déficit de l'abduction du pouce", "Électromyogramme : ralentissement de conduction du médian au poignet"],
 c:["Idiopathique (femme de 40 à 60 ans), travail manuel répétitif", "Grossesse, hypothyroïdie, diabète, acromégalie, polyarthrite rhumatoïde", "Amylose (dialysés), séquelles de fracture du poignet"],
 k:"Les fourmillements nocturnes des doigts chez une femme enceinte ou hypothyroïdienne : canal carpien. Attelle de nuit, infiltration, chirurgie si déficit."},
{id:"x-metabolique", sys:"endoc", n:"Syndrome métabolique",
 e:"Plusieurs petits problèmes ensemble : gros ventre, tension, sucre et graisses du sang un peu élevés. Ensemble, ils augmentent fortement le risque d'infarctus, d'AVC et de diabète.",
 h:"Association de facteurs de risque cardiovasculaire liés à l'insulinorésistance et à l'obésité abdominale. Défini (NCEP-ATP III / IDF) par au moins 3 critères : tour de taille élevé, triglycérides élevés, HDL bas, pression artérielle élevée, glycémie à jeun élevée.",
 s:["Obésité abdominale (tour de taille ≥ 94 cm chez l'homme, ≥ 80 cm chez la femme, selon les critères IDF)", "Triglycérides ≥ 1,5 g/L ; HDL-cholestérol < 0,4 g/L (homme) ou < 0,5 g/L (femme)", "Pression artérielle ≥ 130/85 mmHg", "Glycémie à jeun ≥ 1 g/L", "Associés : stéatose hépatique, hyperuricémie, syndrome des ovaires polykystiques, apnées du sommeil"],
 c:["Sédentarité, alimentation riche (sucres, graisses), urbanisation", "Prédisposition génétique, vieillissement"],
 k:"En forte hausse dans les villes africaines. Le traitement de fond est l'activité physique et l'alimentation, avant les médicaments."},
{id:"x-conn", sys:"endoc", n:"Hyperaldostéronisme primaire (syndrome de Conn)",
 e:"Une glande surrénale fabrique trop d'aldostérone, l'hormone qui retient le sel : la tension monte et le potassium du sang baisse.",
 h:"Production autonome et excessive d'aldostérone par la corticosurrénale (adénome de Conn ou hyperplasie bilatérale), responsable d'une HTA avec hypokaliémie et rénine basse.",
 s:["HTA souvent sévère ou résistante au traitement", "Hypokaliémie avec kaliurèse inadaptée (> 30 mmol/24 h) : crampes, faiblesse musculaire, polyurie", "Alcalose métabolique", "Biologie : aldostérone élevée, rénine basse (rapport aldostérone/rénine élevé)"],
 c:["Adénome de Conn (unilatéral, curable par chirurgie)", "Hyperplasie bilatérale des surrénales (traitement par spironolactone)", "Rares : formes familiales, corticosurrénalome"],
 k:"Penser à Conn devant toute HTA avec hypokaliémie, HTA résistante ou HTA du sujet jeune. Corriger la kaliémie avant les dosages."},
{id:"x-hyperkaliemie", sys:"meta", n:"Hyperkaliémie",
 e:"Il y a trop de potassium dans le sang. Le cœur y est très sensible : il peut ralentir puis s'arrêter.",
 h:"Kaliémie > 5 mmol/L (sévère si > 6,5 mmol/L ou avec signes ECG). Urgence vitale par risque de troubles du rythme et de conduction cardiaques.",
 s:["Souvent asymptomatique ; faiblesse musculaire, paresthésies", "ECG : ondes T amples, pointues et symétriques, puis allongement de PR, disparition de P, QRS larges, bradycardie", "Risque de fibrillation ventriculaire et d'asystolie"],
 c:["Insuffisance rénale aiguë ou chronique", "Médicaments : IEC, ARA2, spironolactone, AINS, cotrimoxazole", "Acidose (acidocétose), lyse cellulaire (rhabdomyolyse, hémolyse, lyse tumorale, brûlures), insuffisance surrénale", "Fausse hyperkaliémie : hémolyse du prélèvement"],
 k:"Hyperkaliémie avec signes ECG : gluconate de calcium IV d'abord (protège le cœur), puis insuline-glucose, bicarbonates si acidose, et dialyse si besoin."},
{id:"x-hypokaliemie", sys:"meta", n:"Hypokaliémie",
 e:"Il n'y a pas assez de potassium dans le sang : les muscles faiblissent et le cœur peut se dérégler.",
 h:"Kaliémie < 3,5 mmol/L (sévère si < 2,5 mmol/L). Elle résulte de pertes digestives ou rénales, d'apports insuffisants ou d'un transfert vers les cellules.",
 s:["Faiblesse musculaire, crampes, paralysies (formes sévères), constipation, iléus", "ECG : ondes T plates, ondes U, sous-décalage de ST, allongement de QT, extrasystoles, torsades de pointes", "Polyurie (atteinte rénale chronique)"],
 c:["Pertes digestives : diarrhée (choléra, gastro-entérites), vomissements", "Pertes rénales : diurétiques, hyperaldostéronisme, acidose tubulaire", "Transfert : insuline, bêta-2-mimétiques, alcalose ; apports insuffisants (malnutrition)"],
 k:"Corriger aussi le magnésium. Le potassium IV se donne toujours dilué et lentement, jamais en bolus."},
{id:"x-hyponatremie", sys:"meta", n:"Hyponatrémie",
 e:"Le sang est trop dilué en sel : l'eau entre dans les cellules du cerveau qui gonfle, d'où maux de tête, confusion et convulsions.",
 h:"Natrémie < 135 mmol/L, traduisant le plus souvent un excès d'eau par rapport au sodium (hyperhydratation intracellulaire). Le volume extracellulaire (diminué, normal ou augmenté) oriente la cause.",
 s:["Nausées, vomissements, céphalées", "Confusion, troubles de la conscience, convulsions, coma (formes aiguës sévères)", "Signes de la cause : déshydratation ou œdèmes"],
 c:["Volume extracellulaire diminué : pertes digestives ou rénales de sel (diurétiques thiazidiques, insuffisance surrénale)", "Volume normal : SIADH (pneumopathies, méningites, cancers, médicaments), potomanie, hypothyroïdie", "Volume augmenté : insuffisance cardiaque, cirrhose, syndrome néphrotique"],
 k:"Corriger lentement (pas plus de 8 à 10 mmol/L par 24 h) : une correction trop rapide provoque une myélinolyse centropontine."},
{id:"x-hypernatremie", sys:"meta", n:"Hypernatrémie",
 e:"Le sang est trop concentré en sel parce que le corps a perdu trop d'eau : les cellules du cerveau se dessèchent.",
 h:"Natrémie > 145 mmol/L, traduisant un déficit en eau (déshydratation intracellulaire), surtout chez ceux qui ne peuvent pas boire seuls : nourrisson, sujet âgé, patient comateux.",
 s:["Soif intense, sécheresse des muqueuses", "Fièvre, troubles de la conscience, agitation, convulsions", "Hémorragies cérébro-méningées chez le nourrisson"],
 c:["Pertes d'eau non compensées : fièvre, coup de chaleur, diarrhée du nourrisson", "Diabète insipide (central ou néphrogénique), diurèse osmotique (hyperglycémie)", "Apport excessif de sel (erreurs de préparation des biberons, solutés hypertoniques)"],
 k:"Corriger lentement (sur 48 heures chez l'enfant) : une correction trop rapide provoque un œdème cérébral."},
{id:"x-acidose", sys:"meta", n:"Acidose métabolique",
 e:"Le sang devient trop acide ; le corps essaie de rejeter l'acide en respirant vite et profondément.",
 h:"Baisse du pH (< 7,38) et des bicarbonates plasmatiques, avec compensation respiratoire (hyperventilation, baisse de la PaCO2). Le trou anionique oriente la cause.",
 s:["Respiration de Kussmaul (ample et profonde), polypnée", "Troubles de la conscience, collapsus, troubles du rythme (hyperkaliémie associée)", "Gaz du sang : pH bas, HCO3− bas, PaCO2 basse"],
 c:["Trou anionique élevé : acidocétose diabétique, acidose lactique (choc, sepsis, paludisme grave, metformine), insuffisance rénale, intoxications (méthanol, éthylène glycol, aspirine)", "Trou anionique normal : diarrhées (perte de bicarbonates), acidoses tubulaires rénales"],
 k:"Trou anionique = Na − (Cl + HCO3) ; normal environ 12 mmol/L. Traiter la cause ; les bicarbonates ne sont utiles que dans certains cas."},
{id:"x-palu-simple", sys:"infect", n:"Accès palustre simple",
 e:"Un moustique (anophèle) injecte un parasite qui envahit les globules rouges : grosse fièvre, frissons, maux de tête et courbatures.",
 h:"Paludisme sans signe de gravité, dû à Plasmodium falciparum dans la majorité des cas au Sénégal. Toute fièvre en zone d'endémie est un paludisme jusqu'à preuve du contraire.",
 s:["Fièvre, frissons, sueurs (accès typique : frissons, chaleur, sueurs)", "Céphalées, courbatures, asthénie", "Troubles digestifs : nausées, vomissements, diarrhée", "Splénomégalie possible, sans signe de gravité", "Diagnostic : test de diagnostic rapide ou goutte épaisse et frottis"],
 c:["Plasmodium falciparum (dominant en Afrique de l'Ouest), P. malariae, P. ovale", "Facteurs : saison des pluies, absence de moustiquaire imprégnée, voyage du non-immun"],
 k:"Traitement : combinaison à base d'artémisinine (CTA) ; surveiller l'apparition de signes de gravité. Prévention : moustiquaire imprégnée, chimioprévention saisonnière chez l'enfant."},
{id:"x-palu-grave", sys:"infect", n:"Paludisme grave",
 e:"Le parasite du paludisme se multiplie tellement qu'il bloque les petits vaisseaux du cerveau, des reins, des poumons : la vie est en danger.",
 h:"Paludisme à P. falciparum avec au moins un critère de gravité de l'OMS (neurologique, respiratoire, rénal, hématologique, métabolique ou parasitologique). Urgence absolue.",
 s:["Neuropaludisme : troubles de la conscience, coma, convulsions répétées", "Détresse respiratoire, acidose (respiration de Kussmaul), choc", "Anémie sévère, ictère, hémoglobinurie, saignements", "Insuffisance rénale, hypoglycémie, hyperlactatémie", "Prostration, hyperparasitémie"],
 c:["Plasmodium falciparum", "Terrain : enfant de moins de 5 ans, femme enceinte, sujet non immun, retard de traitement"],
 k:"Artésunate intraveineux sans attendre ; glycémie capillaire répétée (hypoglycémie fréquente, surtout chez l'enfant et la femme enceinte)."},
{id:"x-typhique", sys:"infect", n:"Syndrome typhique (fièvre typhoïde)",
 e:"Une bactérie avalée avec de l'eau ou des aliments sales passe dans le sang : fièvre qui monte par paliers, maux de tête, ventre douloureux, malade abruti.",
 h:"Infection systémique à Salmonella Typhi ou Paratyphi, transmise par voie oro-fécale. Fièvre progressive en plateau, tuphos et signes digestifs, avec risque de perforation et d'hémorragie intestinales.",
 s:["Fièvre progressive puis en plateau à 40 °C, avec pouls dissocié (relativement lent)", "Céphalées, insomnie, épistaxis, puis tuphos (prostration, obnubilation)", "Douleurs abdominales, diarrhée « jus de melon » ou constipation, langue saburrale, splénomégalie", "Taches rosées lenticulaires sur le tronc (inconstantes)", "Hémocultures positives (1re semaine), leucopénie"],
 c:["Salmonella enterica Typhi et Paratyphi A, B, C", "Eau et aliments contaminés, mauvaise hygiène, porteurs chroniques"],
 k:"Le sérodiagnostic de Widal est peu fiable : les hémocultures font le diagnostic. Complications à craindre : perforation intestinale (péritonite) et hémorragie."},
{id:"x-sida", sys:"infect", n:"Syndrome d'immunodéficience acquise (sida)",
 e:"Le VIH détruit petit à petit les globules blancs chefs de la défense ; quand il en reste trop peu, des microbes habituellement inoffensifs rendent très malade.",
 h:"Stade avancé de l'infection par le VIH, défini par la survenue d'infections opportunistes ou de cancers classants, ou par un taux de lymphocytes CD4 < 200/mm³.",
 s:["Altération de l'état général, amaigrissement (> 10 %), fièvre et diarrhée prolongées", "Infections opportunistes : tuberculose, pneumocystose, toxoplasmose cérébrale, cryptococcose neuroméningée, candidose œsophagienne", "Cancers : maladie de Kaposi, lymphomes", "Signes cutanéo-muqueux : candidose buccale, prurigo, zona"],
 c:["Virus VIH-1 (dominant) et VIH-2 (présent en Afrique de l'Ouest, Sénégal)", "Transmission sexuelle, sanguine, de la mère à l'enfant"],
 k:"Proposer le dépistage largement. Tuberculose et VIH vont souvent ensemble : chercher l'une chez tout patient atteint de l'autre."},
{id:"x-tetanos", sys:"infect", n:"Syndrome tétanique",
 e:"Une bactérie qui vit dans la terre entre par une plaie et fabrique un poison qui contracte les muscles : la mâchoire se bloque, puis tout le corps se raidit par crises.",
 h:"Toxi-infection due à la toxine tétanospasmine de Clostridium tetani, provoquant des contractures musculaires permanentes et des paroxysmes de spasmes, sans trouble de la conscience.",
 s:["Trismus (contracture des masséters), premier signe, avec rire sardonique", "Contractures généralisées permanentes : opisthotonos, ventre de bois", "Paroxysmes de spasmes douloureux déclenchés par les stimuli (bruit, lumière, toucher)", "Conscience normale ; dysphagie, spasmes laryngés, dysautonomie"],
 c:["Plaies souillées, injections non stériles, avortements septiques", "Tétanos néonatal (section du cordon non stérile)", "Absence de vaccination ou de rappels"],
 k:"Prévention par la vaccination (enfants, femmes enceintes) et la sérothérapie après plaie. Au Sénégal, le pronostic s'évalue avec le score de Dakar."},
{id:"x-icterohemorragique", sys:"infect", n:"Syndrome ictéro-hémorragique fébrile",
 e:"Une infection donne à la fois de la fièvre, un teint jaune et des saignements : le foie et la coagulation sont touchés en même temps.",
 h:"Association de fièvre, d'ictère et de manifestations hémorragiques, traduisant une atteinte hépatique et de l'hémostase au cours d'infections tropicales graves.",
 s:["Fièvre élevée, frissons, myalgies", "Ictère (cytolyse hépatique)", "Hémorragies : épistaxis, gingivorragies, hématémèse, purpura", "Atteinte rénale fréquente (oligurie, protéinurie)"],
 c:["Fièvre jaune (vaccination obligatoire, épidémies en Afrique de l'Ouest)", "Leptospirose (maladie de Weil : contact avec l'eau souillée par les rats)", "Paludisme grave, hépatites virales fulminantes, fièvres hémorragiques virales, sepsis avec CIVD"],
 k:"En zone d'endémie, faire d'abord la goutte épaisse. Isoler le patient jusqu'à ce qu'une fièvre hémorragique virale soit éliminée."},
{id:"x-fhv", sys:"infect", n:"Fièvre hémorragique virale",
 e:"Un virus très contagieux provoque une forte fièvre puis des saignements et une défaillance des organes ; les soignants doivent se protéger.",
 h:"Groupe d'infections virales (Ebola, Marburg, Lassa, Crimée-Congo, dengue sévère, fièvre jaune) associant fièvre, atteinte vasculaire avec fuite capillaire et hémorragies, parfois très contagieuses par les liquides biologiques.",
 s:["Début brutal : fièvre, céphalées, myalgies, grande asthénie", "Vomissements, diarrhée, douleurs abdominales", "Hémorragies (tardives et inconstantes), éruption, conjonctivite", "Choc, défaillance multiviscérale"],
 c:["Ebola et Marburg (filovirus), Lassa (arenavirus, Afrique de l'Ouest)", "Dengue sévère (moustique Aedes), fièvre jaune, fièvre de Crimée-Congo"],
 k:"Devant une fièvre au retour d'une zone d'épidémie ou après contact : isoler, se protéger (gants, blouse, masque, lunettes) et alerter."},
{id:"x-rabique", sys:"infect", n:"Syndrome rabique (rage)",
 e:"Un virus transmis par la morsure d'un chien remonte par les nerfs jusqu'au cerveau ; une fois les signes apparus, la maladie est mortelle.",
 h:"Encéphalite virale due au virus rabique (Lyssavirus), transmise surtout par la salive de chien. Mortelle dans presque 100 % des cas après l'apparition des symptômes ; évitable par la prophylaxie après exposition.",
 s:["Prodromes : paresthésies ou douleurs au site de la morsure, fièvre", "Forme furieuse : hydrophobie (spasmes à la vue de l'eau), aérophobie, agitation, hallucinations, hypersalivation", "Forme paralytique : paralysie ascendante", "Évolution vers le coma et la mort"],
 c:["Morsure, griffure ou léchage d'une plaie par un chien enragé (plus rarement chat, chauve-souris, singe)"],
 k:"Après morsure : laver la plaie à l'eau et au savon 15 minutes, vaccin antirabique et immunoglobulines selon le risque. Ne pas attendre les signes."},
{id:"x-bilharziose-u", sys:"infect", n:"Bilharziose urinaire",
 e:"Un ver, attrapé en se baignant dans l'eau douce, pond des œufs dans la vessie : on urine du sang à la fin de la miction.",
 h:"Schistosomose à Schistosoma haematobium, endémique au Sénégal (vallée du fleuve Sénégal, Casamance). Les œufs, retenus dans la paroi vésicale, provoquent une inflammation chronique.",
 s:["Hématurie terminale (sang en fin de miction), signe majeur", "Pollakiurie, brûlures mictionnelles", "Hyperéosinophilie (surtout en phase d'invasion : fièvre, urticaire = fièvre de Katayama)", "Diagnostic : œufs à éperon terminal dans les urines de midi", "Complications : sténose urétérale, hydronéphrose, cancer de la vessie, bilharziose génitale"],
 c:["Baignade, lessive ou pêche dans l'eau douce contaminée (mollusques Bulinus)"],
 k:"Traitement : praziquantel. Un enfant qui « urine du sang » en zone d'endémie : bilharziose jusqu'à preuve du contraire."},
{id:"x-cholinergique", sys:"tox", n:"Syndrome cholinergique (organophosphorés)",
 e:"Un pesticide bloque l'enzyme qui arrête l'action d'un messager nerveux : le corps « coule » de partout (salive, larmes, sueurs, diarrhée), les pupilles rétrécissent et les muscles tremblent.",
 h:"Toxidrome par inhibition des cholinestérases (insecticides organophosphorés et carbamates), associant des signes muscariniques, nicotiniques et centraux.",
 s:["Muscariniques : myosis, hypersalivation, larmoiement, sueurs, bronchorrhée, bronchospasme, bradycardie, vomissements, diarrhée, incontinence urinaire", "Nicotiniques : fasciculations, crampes, faiblesse puis paralysie musculaire (y compris respiratoire), tachycardie, HTA", "Centraux : agitation, confusion, convulsions, coma", "Odeur d'ail ou de solvant"],
 c:["Pesticides agricoles (ingestion volontaire ou accidentelle, exposition professionnelle)", "Carbamates, gaz de combat (sarin)"],
 k:"Traitement : décontamination (déshabiller, laver la peau), atropine à doses répétées jusqu'à l'assèchement des bronches, pralidoxime, ventilation si besoin."},
{id:"x-anticholinergique", sys:"tox", n:"Syndrome anticholinergique",
 e:"Certains médicaments ou plantes bloquent un messager nerveux : la personne est rouge, chaude, sèche, a les pupilles dilatées et délire.",
 h:"Toxidrome par blocage des récepteurs muscariniques, associant signes périphériques (sécheresse, mydriase, tachycardie, rétention) et centraux (confusion, agitation, hallucinations).",
 s:["Mydriase, vision floue", "Peau sèche, rouge, chaude ; bouche sèche ; hyperthermie", "Tachycardie, rétention urinaire, iléus", "Confusion, agitation, hallucinations, convulsions"],
 c:["Antidépresseurs tricycliques, antihistaminiques, neuroleptiques, antiparkinsoniens anticholinergiques", "Atropine, plantes (datura)"],
 k:"Moyen mnémotechnique : « rouge comme une tomate, sec comme un os, chaud comme un lièvre, aveugle comme une chauve-souris, fou comme un chapelier ». Tricycliques : surveiller l'ECG (QRS larges)."},
{id:"x-opioide", sys:"tox", n:"Syndrome opioïde",
 e:"Un produit de la famille de la morphine endort, rétrécit les pupilles comme des pointes d'aiguille et ralentit la respiration jusqu'à l'arrêter.",
 h:"Toxidrome par stimulation des récepteurs opioïdes, associant coma, myosis serré et dépression respiratoire (bradypnée).",
 s:["Troubles de la conscience, coma calme", "Myosis serré, bilatéral (« en tête d'épingle »)", "Bradypnée, apnées, cyanose", "Hypotension, bradycardie, hypothermie"],
 c:["Héroïne, morphine, tramadol (mésusage), méthadone, codéine, fentanyl"],
 k:"Antidote : naloxone IV en titration ; sa durée d'action est courte, surveiller la récidive. Le tramadol peut aussi donner des convulsions."},
{id:"x-serotoninergique", sys:"tox", n:"Syndrome sérotoninergique",
 e:"Trop de sérotonine dans le cerveau, souvent par mélange de médicaments : agitation, sueurs, fièvre et muscles qui sursautent.",
 h:"Toxidrome par excès de stimulation sérotoninergique, souvent après association ou surdosage de médicaments sérotoninergiques. Triade : troubles mentaux, dysautonomie, anomalies neuromusculaires.",
 s:["Agitation, confusion, anxiété", "Sueurs, tachycardie, hyperthermie, mydriase, diarrhée", "Myoclonies, hyperréflexie, clonus (surtout aux membres inférieurs), tremblements"],
 c:["Antidépresseurs (ISRS, IMAO, tricycliques) associés entre eux", "Tramadol, linézolide, triptans, ecstasy (MDMA)"],
 k:"Arrêter les médicaments en cause ; benzodiazépines, refroidissement. Le clonus et l'hyperréflexie le distinguent du syndrome malin des neuroleptiques (rigidité, réflexes lents)."},
{id:"x-smn", sys:"tox", n:"Syndrome malin des neuroleptiques",
 e:"Une réaction rare mais grave aux médicaments antipsychotiques : forte fièvre, muscles très raides, tension et pouls qui s'affolent.",
 h:"Complication rare et potentiellement mortelle des neuroleptiques, liée au blocage dopaminergique, associant hyperthermie, rigidité musculaire, dysautonomie et troubles de la conscience, avec élévation des CPK.",
 s:["Hyperthermie (> 38,5 °C)", "Rigidité musculaire intense (« en tuyau de plomb »)", "Dysautonomie : tachycardie, tension instable, sueurs", "Troubles de la conscience ; CPK très élevées, rhabdomyolyse, insuffisance rénale"],
 c:["Neuroleptiques (halopéridol surtout), début ou augmentation de dose", "Arrêt brutal des antiparkinsoniens dopaminergiques"],
 k:"Arrêter le neuroleptique, refroidir, hydrater, réanimation ; dantrolène ou bromocriptine dans les formes graves."},
{id:"x-preeclampsie", sys:"gyneco", n:"Pré-éclampsie",
 e:"Pendant la grossesse, le placenta fonctionne mal et libère des substances qui abîment les vaisseaux de la mère : la tension monte et les reins laissent passer des protéines.",
 h:"Association, après 20 semaines d'aménorrhée, d'une HTA gravidique (≥ 140/90 mmHg) et d'une protéinurie (≥ 0,3 g/24 h) ou d'une atteinte d'organe. Maladie du placenta, fréquente et grave en Afrique.",
 s:["HTA, protéinurie, œdèmes (surtout s'ils sont brutaux, du visage et des mains)", "Signes de gravité : céphalées, troubles visuels (phosphènes), acouphènes, barre épigastrique", "Oligurie, OAP, HTA sévère (≥ 160/110 mmHg)", "Retentissement fœtal : retard de croissance, souffrance fœtale"],
 c:["Primiparité, grossesse multiple, antécédent de pré-éclampsie", "HTA chronique, diabète, obésité, maladie rénale, âge extrême"],
 k:"Complications : éclampsie (convulsions), HELLP syndrome, hématome rétroplacentaire. Sulfate de magnésium pour prévenir les convulsions ; le seul traitement est l'accouchement."},
{id:"x-hellp", sys:"gyneco", n:"HELLP syndrome",
 e:"Une forme grave de la pré-éclampsie : les globules rouges se cassent, le foie souffre et les plaquettes chutent.",
 h:"Complication de la pré-éclampsie associant hémolyse (Hemolysis), cytolyse hépatique (Elevated Liver enzymes) et thrombopénie (Low Platelets), avec risque d'hématome sous-capsulaire du foie et de CIVD.",
 s:["Douleur épigastrique en barre ou de l'hypochondre droit, nausées, vomissements", "Hémolyse : schizocytes, LDH élevées, haptoglobine effondrée, bilirubine élevée", "Transaminases élevées", "Plaquettes < 100 000/mm³"],
 c:["Pré-éclampsie (parfois tension peu élevée)"],
 k:"Une « gastrite » du 3e trimestre chez une femme enceinte hypertendue : penser au HELLP et doser plaquettes et transaminases."},
{id:"x-geu", sys:"gyneco", n:"Grossesse extra-utérine",
 e:"L'œuf s'implante en dehors de l'utérus, le plus souvent dans une trompe ; en grossissant, il peut la faire éclater et provoquer une grave hémorragie interne.",
 h:"Implantation de l'œuf hors de la cavité utérine, tubaire dans plus de 95 % des cas. Urgence gynécologique : toute femme en âge de procréer avec douleurs pelviennes ou saignements doit avoir un dosage de βhCG.",
 s:["Retard de règles (aménorrhée), métrorragies peu abondantes, noirâtres", "Douleurs pelviennes latéralisées", "Rupture : douleur brutale, scapulalgie, malaise, choc hémorragique, cri du Douglas au toucher vaginal", "βhCG positive avec utérus vide à l'échographie (au-delà du seuil de discrimination)"],
 c:["Infections génitales hautes (salpingites, chlamydia), antécédent de GEU", "Chirurgie tubaire, stérilet, tabac, procréation médicalement assistée"],
 k:"Devant un état de choc chez une jeune femme : GEU rompue jusqu'à preuve du contraire, chirurgie en urgence."},
{id:"x-hrp", sys:"gyneco", n:"Hématome rétroplacentaire",
 e:"Le placenta se décolle de l'utérus avant la naissance ; du sang s'accumule derrière lui, l'utérus devient dur comme du bois et le bébé est en danger.",
 h:"Décollement prématuré du placenta normalement inséré, avec formation d'un hématome entre placenta et utérus. Urgence obstétricale grave pour l'enfant (mort fœtale) et la mère (choc, CIVD).",
 s:["Douleur abdominale brutale, intense, permanente (« en coup de poignard »)", "Métrorragies noirâtres, peu abondantes, sans rapport avec la gravité", "Contracture utérine permanente (« utérus de bois »), hauteur utérine qui augmente", "Bruits du cœur fœtal anormaux ou absents, choc maternel"],
 c:["Pré-éclampsie et HTA (cause principale)", "Traumatisme abdominal, cocaïne, tabac", "Décompression utérine brutale (rupture des membranes d'un hydramnios)"],
 k:"Extraction fœtale en urgence ; surveiller la coagulation (CIVD). Forme typique : femme hypertendue, douleur brutale, utérus de bois."},
{id:"x-prerupture", sys:"gyneco", n:"Syndrome de pré-rupture utérine (Bandl-Frommel)",
 e:"Pendant un travail bloqué, l'utérus se contracte si fort qu'il est sur le point de se déchirer.",
 h:"Signes précédant la rupture utérine au cours d'un travail dystocique (disproportion fœto-pelvienne, présentation vicieuse), surtout chez la multipare ou sur utérus cicatriciel.",
 s:["Contractions violentes, subintrantes, très douloureuses ; agitation de la parturiente", "Anneau de Bandl : utérus en sablier", "Signe de Frommel : ligaments ronds tendus comme des cordes", "Souffrance fœtale"],

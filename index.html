     steps:['FE = (VTD − VTS) / VTD × 100', `= (${vtd} − ${vts}) / ${vtd} × 100`, `= ${exNf(a,1)} %`],
     ch:{q:'Interprétation', o:['FE réduite (40 % ou moins)','FE modérément réduite (41 à 49 %)','FE préservée (50 % ou plus)'], a:a<=40?0:a<50?1:2},
     x:"Normale : 50 % ou plus (souvent 55 à 70 %). On distingue l'insuffisance cardiaque à FE réduite (≤ 40 %), modérément réduite (41 à 49 %) et préservée (≥ 50 %)."}; } }},
 {id:'pf', sys:'phy', n:'Rapport PaO₂ / FiO₂', f:'P/F = PaO₂ / FiO₂', g(){
   for(let k=0;k<80;k++){ const fi=exPick([0.21,0.3,0.4,0.5,0.6,0.8,1]), pao=exR(45,120), a=pao/fi; if([100,200,300].some(b=>Math.abs(a-b)<4)) continue;
    return {q:`Gaz du sang : PaO₂ **${pao} mmHg** sous FiO₂ **${Math.round(fi*100)} %**. Calcule le rapport PaO₂/FiO₂.`, a, d:0, u:'mmHg', abs:2,

     x:"Normal ≈ 400 à 500 mmHg. Définition de Berlin du SDRA (début aigu, opacités bilatérales, PEP ≥ 5 cmH₂O) : léger de 200 à 300, modéré de 100 à 200, sévère à 100 ou moins."}; } }},
 {id:'desh', sys:'ped', n:"Pourcentage de déshydratation de l'enfant", f:'Perte (%) = (poids avant − poids actuel) / poids avant × 100', g(){
   for(let k=0;k<80;k++){ const p0=exR(5,24,0.1), pc=exPick([exR(2,4.5,0.1),exR(5.5,9.5,0.1),exR(10.5,15,0.1)]), p1=Math.round(p0*(1-pc/100)*10)/10, a=(p0-p1)/p0*100; if([5,10].some(b=>Math.abs(a-b)<0.3)) continue;

     steps:['Perte (%) = (poids avant − poids actuel) / poids avant × 100', `= (${exNf(p0,1)} − ${exNf(p1,1)}) / ${exNf(p0,1)} × 100`, `= ${exNf(a,1)} %`],
     ch:{q:'Gravité', o:['Légère (moins de 5 %)','Modérée (5 à 10 %)','Sévère (plus de 10 %)'], a:a<5?0:a<=10?1:2},
     x:"La perte de poids est la meilleure mesure de la déshydratation. Au-delà de 10 %, c'est une urgence (risque de choc) : réhydratation par voie veineuse. En dessous, on privilégie le soluté de réhydratation orale (SRO)."}; } }},
 {id:'hs', sys:'ped', n:"Besoins en eau d'entretien (Holliday et Segar)", f:'100, puis 50, puis 20 mL/kg/j', g(){
   const w=exPick([exR(3,9.5,0.5),exR(11,19.5,0.5),exR(21,45)]), a=Math.min(w,10)*100+Math.max(0,Math.min(w,20)-10)*50+Math.max(0,w-20)*20;
   const st=['100 mL/kg pour les 10 premiers kg'+(w<=10?` : 100 × ${exNf(w,1)} = ${exNf(w*100,0)} mL`:' : 1 000 mL')];
   if(w>10) st.push('+ 50 mL/kg de 10 à 20 kg'+(w<=20?` : 50 × ${exNf(w-10,1)} = ${exNf((w-10)*50,0)} mL`:' : 500 mL'));
   if(w>20) st.push(`+ 20 mL/kg au-delà de 20 kg : 20 × ${exNf(w-20,1)} = ${exNf((w-20)*20,0)} mL`);
   st.push(`Total : ${exNf(a,0)} mL par 24 h (≈ ${exNf(a/24,0)} mL/h)`);
   return {q:`Enfant de **${exNf(w,1)} kg**. Quels sont ses besoins en eau d'entretien par 24 heures ?`, a, d:0, u:'mL/24 h', tol:0.01, abs:5, steps:st,
    x:"Règle de Holliday et Segar : 100 mL/kg/j pour les 10 premiers kg, 50 mL/kg/j pour les 10 kg suivants, puis 20 mL/kg/j. Ce sont les besoins d'entretien : on y ajoute les pertes (déshydratation, fièvre, diarrhée)."}; }},
 {id:'ge', sys:'par', n:'Densité parasitaire (goutte épaisse)', f:'Parasites/µL = parasites comptés × 8 000 / 200', g(){
   const n=exR(12,1500), a=n*8000/200;

    steps:['Densité = parasites comptés × 8 000 / leucocytes comptés', `= ${n} × 8 000 / 200 = ${n} × 40`, `= ${exNf(a,0)} parasites/µL`],
    x:"On compte les parasites en même temps que 200 leucocytes (500 si on trouve moins de 10 parasites), puis on rapporte à 8 000 leucocytes/µL (convention de l'OMS), ou au vrai nombre de leucocytes du malade s'il est connu. La densité sert aussi à suivre l'efficacité du traitement."}; }},
 {id:'frottis', sys:'par', n:'Parasitémie sur frottis', f:'Parasitémie (%) = hématies parasitées / hématies comptées × 100', g(){
   for(let k=0;k<80;k++){ const tot=exPick([500,1000,2000]), pc=exPick([exR(0.4,3.5,0.1),exR(4.5,9.5,0.1),exR(11,25,0.5)]), np=Math.round(pc/100*tot), a=np/tot*100; if(np<1||[4,10].some(b=>Math.abs(a-b)<0.15)) continue;
    return {q:`Frottis mince : **${np} hématies parasitées** sur **${exNf(tot,0)} hématies** comptées. Calcule la parasitémie.`, a, d:1, u:'%', abs:0.1,
     steps:['Parasitémie = hématies parasitées / hématies comptées × 100', `= ${np} / ${exNf(tot,0)} × 100`, `= ${exNf(a,1)} %`],
     ch:{q:'Interprétation', o:['Moins de 4 %','4 à 10 % : signe de gravité chez le voyageur non immun','Plus de 10 % : critère de paludisme grave (OMS)'], a:a<4?0:a<=10?1:2},
     x:"Pour l'OMS, une parasitémie à P. falciparum au-dessus de 10 % est un critère de paludisme grave. Les recommandations françaises retiennent 4 % chez le voyageur non immun. La clinique compte autant : un seul signe de gravité suffit."}; } }},

const EXO_BY={}; EXOS.forEach(x=>{ EXO_BY[x.id]=x; });
UI.exo=null;
function exoGen(id){ const x=EXO_BY[id]; if(!x) return null; for(let k=0;k<6;k++){ const v=x.g(); if(v) return v; } return null; }
function exoStats(){ if(!S.prefs.exo||typeof S.prefs.exo!=='object') S.prefs.exo={}; return S.prefs.exo; }
function exoLim(v){ return Math.max(v.abs||0, (v.tol||0)*Math.abs(v.a), 0.5*10**-v.d)+1e-9; } // l'arrondi affiché est toujours accepté
function exoPnum(v){ const s=String(v||'').replace(/[\s ]/g,'').replace(',','.').replace('−','-'); return s===''||isNaN(+s)?NaN:+s; }
function exoNew(id, ser){ UI.exo={id, v:exoGen(id), val:'', pick:null, done:false, ok:null, okNum:null, okCh:null, gave:false, ser:ser||null, end:false}; }
function exoOpenRun(){ const top=UI.sheetStack[UI.sheetStack.length-1]; if(top===exoRunSheet) paintSheet(); else openSheet(exoRunSheet); }
function exoStart(id){ exoNew(id); exoOpenRun(); }
function exoSeries(sys){
  const pool=EXOS.filter(x=>!sys||x.sys===sys).map(x=>x.id); if(!pool.length) return;
  const n=Math.min(10, sys?pool.length*2:10); let ids=[]; while(ids.length<n) ids=ids.concat(shuffle(pool.slice()));
  ids=ids.slice(0,n); exoNew(ids[0], {ids, i:0, res:[], sys:sys||''}); exoOpenRun();
}
function exoCheck(giveUp){
  const u=UI.exo; if(!u||u.done||!u.v) return; const v=u.v, num=exoPnum(u.val);
  if(!giveUp && isNaN(num)){ toast('Écris ton résultat : un nombre.'); return; }
  if(!giveUp && v.ch && u.pick===null){ toast('Choisis aussi une interprétation.'); return; }
  const lim=exoLim(v);
  u.gave=!!giveUp; u.okNum=!giveUp && Math.abs(num-v.a)<=lim; u.okCh=v.ch&&!giveUp?u.pick===v.ch.a:null; u.ok=u.okNum&&u.okCh!==false; u.done=true;
  const st=exoStats(), r=st[u.id]||[0,0]; st[u.id]=[r[0]+(u.ok?1:0), r[1]+1, now()]; savePrefs();
  if(u.ser) u.ser.res[u.ser.i]=u.ok;

// ---------- Programme de révision jusqu'à l'examen ----------
// Recalculé chaque jour à partir de l'état réel : leçons pas encore « Appris », cartes prévues, examens blancs.
const PLAN_REV=10; // période de révision générale avant l'examen (comme le compte à rebours)
const PLAN_MINS=[[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[180,'3 h'],[240,'4 h']];
const PLAN_CHAPS=[[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h']];
const WDS=['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'], WDL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const planMin = () => +S.prefs.planMin||120;
const planChapMin = () => +S.prefs.planChap||60;
const planRest = () => { const v=S.prefs.planRest; return v===undefined||v===null||v===''?-1:+v; };
const fmtMin = m => m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):'');
function planChaps(){ // leçons de l'année à apprendre : ordre des cours, matières entremêlées au prorata
  const t0=dayStart();
  const todo=m=>modChaps(m).filter(c=>{ const p=S.progress[c.id]; return !p||!(p.s>=2)||(p.t||0)>=t0; }); // apprise aujourd'hui : reste dans le programme du jour
  const mods=modsOf(myLvl(),mySem()).map(m=>({m, L:todo(m), k:0})).filter(x=>x.L.length);
  const out=[]; let left=mods.reduce((a,x)=>a+x.L.length,0);
  while(left-->0){ let best=null; for(const x of mods){ if(x.k>=x.L.length) continue; const f=(x.k+0.5)/x.L.length; if(!best||f<best.f) best={x,f}; } out.push(best.x.L[best.x.k++]); }
  return out;
}
function planWeak(){ // chapitres à retravailler : examens blancs sous 70 %, ou cartes souvent ratées
  const g={}; for(const e of Object.values(S.exams)) if(e.kind==='blanc') for(const a of (e.attempts||[])) for(const [ch,[p,n]] of Object.entries(a.byChap||{})){ if(!g[ch]) g[ch]=[0,0]; g[ch][0]+=p; g[ch][1]+=n; }
  const w={}; for(const [ch,[p,n]] of Object.entries(g)) if(CH[ch]&&n>=2&&p/n<0.7) w[ch]={ch, why:[Math.round(p/n*100)+' % en examen blanc'], s:1-p/n};
  const hard={}; for(const c of liveCards('all')) if(CH[c.chap]&&isHard(c)) hard[c.chap]=(hard[c.chap]||0)+1;
  for(const [ch,n] of Object.entries(hard)) if(n>=3){ const x=w[ch]||(w[ch]={ch, why:[], s:0}); x.why.push(plural(n,'carte')+' souvent ratée'+(n>1?'s':'')); x.s+=n/10; }
  return Object.values(w).sort((a,b)=>b.s-a.s).slice(0,8);
}
function planLoad(n){ // cartes déjà prévues pour chacun des n prochains jours
  const t0=dayStart(), b=new Array(n).fill(0); const c0=counts('all'); b[0]=c0.rev+c0.lrn+c0.nw;
  for(const c of liveCards('all')){ if(c.srs.state==='new') continue; const i=Math.floor((c.srs.due-t0)/DAY); if(i>=1&&i<n) b[i]++; }
  return b;
}
function planBuild(){
  const ex=examDate(), d0=midnight(new Date(now()-CUT)), N=Math.round((midnight(ex.date)-d0)/DAY);
  if(N<=0) return {ex, N, over:true};
  const rest=planRest(), revFrom=Math.max(0, N-PLAN_REV), days=[];
  for(let i=0;i<N;i++){ const d=new Date(d0); d.setDate(d0.getDate()+i); days.push({i, d, wd:d.getDay(), rev:i>=revFrom, rest:false, ch:[], blanc:false, focus:null, weak:[], eve:false}); }
  let learn=days.filter(x=>!x.rev&&x.wd!==rest), catchup=false;
  if(!learn.length && days.some(x=>!x.rev)) learn=days.filter(x=>!x.rev);
  days.forEach(x=>{ if(!x.rev&&!learn.includes(x)) x.rest=true; });
  const L=planChaps(), K=L.length;
  if(!learn.length && K){ learn=days.length>1?days.slice(0,-1):days; catchup=true; } // déjà en période de révision : rattrapage
  const rate=learn.length?K/learn.length:0, cut=j=>Math.min(K, Math.ceil(j*rate-1e-9));
  learn.forEach((x,j)=>{ x.ch=L.slice(cut(j), cut(j+1)); });
  const bday=rest>=0?(rest+6)%7:6; // examen blanc de la semaine : la veille du jour de repos, sinon le samedi
  days.forEach(x=>{ if(!x.rev&&!x.rest&&x.wd===bday) x.blanc=true; });
  const rv=days.filter(x=>x.rev), mods=modsOf(myLvl(),mySem()).filter(m=>modChaps(m).length), weak=planWeak();
  if(rv.length>1) rv[rv.length-1].eve=true;
  const work=rv.filter(x=>!x.eve);
  work.forEach((x,r)=>{ x.focus=mods.length?mods[r%mods.length]:null; x.blanc=r%2===1||work.length===1; });
  weak.forEach((w,k)=>{ if(work.length) work[k%work.length].weak.push(w); });
  const load=planLoad(Math.min(N,14)), cards7=load.slice(0,7), avgCards=cards7.reduce((a,b)=>a+b,0)/Math.max(1,cards7.length);
  const revMin=Math.round(avgCards*avgSec()/60), perDay=learn.length?K/learn.length:0;
  const need=Math.round(perDay*planChapMin()+revMin), budget=planMin();
  let finish=null;
  if(K && need>budget*1.05){ const cap=(budget-revMin)/planChapMin();
    if(cap>0.05){ let left=K, d=new Date(d0); for(let i=0;i<400&&left>0;i++){ if(d.getDay()!==rest||rest<0) left-=cap; if(left>0) d.setDate(d.getDate()+1); } finish=d; } }
  const learnSpan=days.filter(x=>!x.rev).length;
  return {ex, N, days, K, learn:learn.length, catchup, revFrom, load, revMin, need, budget, finish, weak, perWeek:learnSpan?K*7/learnSpan:K, rest};
}
function planDone(c){ return statusOf(c.id)>=2; }
const planDateTxt = d => fmtD(d, d.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'});
function planDayLabel(x){ return x.i===0?"Aujourd'hui":x.i===1?'Demain':WDS[x.wd]+' '+x.d.getDate(); }
function planChipsHTML(x, P){ // contenu d'un jour, en petites étiquettes (écran Programme)
  const out=[];
  for(const c of x.ch){ const ok=planDone(c); out.push(`<button class="pl-chip ${ok?'done':''}" data-act="chap" data-id="${c.id}" title="${esc(MODS[c.mod]?MODS[c.mod].short:'')}">${ok?'✓ ':''}${esc(c.title)}</button>`); }
  if(x.rest) out.push(`<span class="pl-note">Repos${x.i<7&&P.load[x.i]?' · '+plural(P.load[x.i],'carte'):''}</span>`);
  if(x.focus) out.push(`<button class="pl-chip focus" data-act="start" data-mode="cram" data-scope="m:${x.focus.id}">Revoir ${esc(x.focus.short)}</button>`);
  for(const w of x.weak) out.push(`<button class="pl-chip weak" data-act="chap" data-id="${w.ch}">À retravailler : ${esc(CH[w.ch].title)}</button>`);
  if(x.blanc) out.push(`<button class="pl-chip blanc" data-act="plan-blanc" data-n="${x.rev?40:20}">Examen blanc</button>`);
  if(x.eve) out.push(`<button class="pl-chip focus" data-act="start" data-mode="hard" data-scope="all">Veille : cartes difficiles, puis repos</button>`);
  if(!x.rest&&x.i<7&&P.load[x.i]) out.push(`<span class="pl-note">${plural(P.load[x.i],'carte')}</span>`);
  if(!out.length) out.push(`<span class="pl-note">Tes cartes du jour${x.i<7&&P.load[x.i]?' ('+P.load[x.i]+')':''}</span>`);
  return out.join('');
}
function planWeekLabel(mon, d0){ const w=Math.round((midnight(mon)-midnight(d0))/DAY);
  return w<=0?'Cette semaine':w<=7?'Semaine prochaine':'Semaine du '+fmtShort(mon); }
function planSheet(){
  const P=planBuild(), p=S.prefs, ex=examDate();

    <label class="field">Date de l'examen <span class="field-hint">${ex.set?'':'Pas encore fixée : estimation au '+esc(fmtShort(ex.date))+'.'}</span><input type="date" data-input="plan-pref" data-k="examDate" value="${esc(p.examDate||'')}"></label>

  const sum=`<section class="panel stack">
    <div class="stat-grid"><div><b>J-${P.N}</b><span>${esc(fmtShort(P.ex.date))}</span></div><div><b>${P.K}</b><span>${P.K>1?'leçons':'leçon'} à apprendre</span></div><div><b>${P.K?(P.perWeek<1?'< 1':Math.round(P.perWeek)):'–'}</b><span>par semaine</span></div></div>
    ${P.K?`<p style="margin:0">${P.catchup?`<strong>Période de révision commencée</strong> : les ${plural(P.K,'leçon')} pas encore apprises sont réparties sur les jours qui restent.`:`Pour finir avant la révision générale${revDate?' du '+esc(fmtShort(revDate)):''}, prévois environ <strong>${fmtMin(P.need)} par jour</strong>${P.revMin?' (leçons + '+fmtMin(P.revMin)+' de cartes)':''}.`}</p>`
      :`<p style="margin:0">Toutes les leçons de ton année sont marquées « Appris ». Le programme passe en révision : cartes, modules à revoir et examens blancs.</p>`}
    ${P.K&&!P.catchup?(P.need<=P.budget*1.05?`<p class="small" style="margin:0;color:var(--good)"><strong>Ça rentre dans tes ${fmtMin(P.budget)} par jour.</strong></p>`
      :`<p class="small" style="margin:0;color:var(--hard)"><strong>Il manque environ ${fmtMin(P.need-P.budget)} par jour.</strong> ${P.finish?'Avec '+fmtMin(P.budget)+' par jour, tu finirais vers le '+esc(planDateTxt(P.finish))+', après le début des révisions.':'Tes cartes du jour prennent déjà presque tout ton temps.'} Augmente ton temps, enlève le jour de repos, ou masque dans Cours une matière que tu ne passes pas.</p>`):''}
   </section>`;
  const weak=P.weak.length?`<section class="panel stack"><h3 style="margin:0">À retravailler</h3><div class="menu">${P.weak.map(w=>`<button data-act="chap" data-id="${w.ch}">${I.book}<span><span class="t">${esc(CH[w.ch].title)}</span><span class="d">${esc(w.why.join(' · '))}</span></span>${I.chev}</button>`).join('')}</div><p class="small muted" style="margin:0">Ces chapitres sont placés pendant la révision générale.</p></section>`:'';
  // jours regroupés par semaine (lundi → dimanche)
  const weeks=[]; for(const x of P.days){ const mon=new Date(x.d); mon.setDate(x.d.getDate()-((x.wd+6)%7)); const k=dayKey(mon.getTime()+CUT); let w=weeks[weeks.length-1]; if(!w||w.k!==k) weeks.push(w={k, mon, days:[]}); w.days.push(x); }
  const d0=P.days[0].d;

    const body=w.days.map(x=>`<div class="pl-day ${x.i===0?'pl-now':''} ${x.rest?'rest':''} ${x.rev?'rev':''}"><div class="pl-date"><b>${planDayLabel(x)}</b><span>J-${P.N-x.i}</span></div><div class="pl-items">${planChipsHTML(x,P)}</div></div>`).join('');
    const head=`${planWeekLabel(w.mon,d0)} <span class="small muted">· ${n?plural(n,'leçon'):''}${n&&rv?' · ':''}${rv?'révision générale':''}</span>`;
    return j<2?`<h3 class="syn-sys">${head}</h3><section class="panel pl-week">${body}</section>`:`<details class="pl-wk"><summary class="syn-sys">${head}</summary><section class="panel pl-week">${body}</section></details>`; }).join('');
  return top+sum+set+weak+wk+`<p class="small muted">Chaque jour : tes cartes prévues d'abord, puis les leçons du jour. Ouvre une leçon pour l'apprendre et marque-la « Appris » : ses cartes entrent alors dans tes révisions.</p>`;
}

  return sec(out.join(''));

    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') swUpdate(); });
  }
  // L'accueil se rafraîchit tout seul (nouveau jour, cartes qui deviennent à revoir)
  setInterval(()=>{ if(document.visibilityState!=='visible' || SESS || UI.sheetStack.length) return; if(UI.tab==='home') render(); }, 3*MIN);
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch{}
}
</script>

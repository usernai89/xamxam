// ---------- Session de révision ----------
let SESS=null;
function startSession(mode, scope, opt){
  opt=opt||{};
  const t=now();
  let cards=liveCards(scope);
  let queue=[];
  if(mode==='srs'){
    const c=counts(scope); const end=dayStart(t)+DAY;
    const lrn=cards.filter(x=>isLearning(x)&&x.srs.due<=end).sort((a,b)=>a.srs.due-b.srs.due);
    const rev=shuffle(cards.filter(x=>x.srs.state==='review'&&x.srs.due<end)).sort((a,b)=>a.srs.due-b.srs.due).slice(0,c.rev); // les plus en retard d'abord
    const dk=dayKey(); const nw=cards.filter(x=>x.srs.state==='new'&&x.later!==dk).sort((a,b)=>(a.created||0)-(b.created||0)).slice(0,c.nw);
    // on intercale les nouvelles parmi les révisions
    const mixed=[]; const step=nw.length?Math.max(1,Math.floor(rev.length/nw.length)):0; let ni=0;
    rev.forEach((r,i)=>{ mixed.push(r); if(step && (i+1)%step===0 && ni<nw.length) mixed.push(nw[ni++]); });
    while(ni<nw.length) mixed.push(nw[ni++]);
    queue=lrn.filter(x=>x.srs.due<=t).concat(opt.minutes?rev.concat(nw):mixed);
    SESS={mode, scope, queue:queue.map(x=>x.id), later:lrn.filter(x=>x.srs.due>t).map(x=>x.id), done:0, ok:0, start:t, shown:0, total:queue.length+lrn.filter(x=>x.srs.due>t).length, missed:[]};
    if(opt.minutes){ SESS.limit=opt.minutes*MIN; SESS.minutes=opt.minutes; }
  } else {
    if(mode==='hard') cards=cards.filter(isHard);
    if(mode==='recent'){ const lim=t-7*DAY; cards=cards.filter(c=>(c.created||0)>lim); }
    if(mode==='list'){ const ids=new Set(opt.ids||[]); cards=cards.filter(c=>ids.has(c.id)); }
    queue=shuffle(cards.slice()).map(x=>x.id);
    SESS={mode, scope, queue, later:[], done:0, ok:0, start:t, shown:0, total:queue.length, missed:[], seen:new Set()};
  }
  if(!SESS.queue.length && !SESS.later.length){ toast('Rien à réviser dans cette sélection.'); SESS=null; return; }
  $('#session').hidden=false; document.body.style.overflow='hidden'; histSync();
  nextCard();
}
function nextCard(){
  recStop(); if((S.prefs.ans||'flip')==='voice'){ try{ speechSynthesis.cancel(); }catch{} }
  const s=SESS; const t=now();
  if(s.limit && s.done>0 && t-s.start>=s.limit){ s.timeUp=true; sessionDone(); return; }
  let id=null;
  if(s.mode==='srs'){
    s.later.sort((a,b)=>(S.cards[a]?.srs.due||0)-(S.cards[b]?.srs.due||0));
    if(s.later.length && S.cards[s.later[0]] && S.cards[s.later[0]].srs.due<=t) id=s.later.shift();
    else if(s.queue.length) id=s.queue.shift();
    else if(s.later.length) id=s.later.shift(); // apprentissage en avance (comme Anki)
  } else if(s.queue.length) id=s.queue.shift();
  while(id && !S.cards[id]){ id=s.queue.shift()||null; }
  if(!id){ sessionDone(); return; }
  const cc=S.cards[id]; const disc=s.mode==='srs' && cc.srs.state==='new';
  s.cur={id, revealed:disc, disc, picked:new Set(), t0:now()};
  paintSession();
}
function remaining(){ const s=SESS; if(s.mode!=='srs') return {n:s.queue.length+(s.cur?1:0)};
  let nw=0,lrn=0,rev=0; const ids=s.queue.concat(s.later); if(s.cur) ids.push(s.cur.id);
  for(const id of ids){ const c=S.cards[id]; if(!c) continue; if(c.srs.state==='new') nw++; else if(isLearning(c)) lrn++; else rev++; }
  return {nw,lrn,rev}; }
function paintSession(anim){
  const s=SESS, cur=s.cur, c=S.cards[cur.id]; const ch=CH[c.chap];
  const r=remaining(); const prog=s.total?Math.min(100, s.done/(s.done+(s.mode==='srs'?r.nw+r.lrn+r.rev:r.n))*100):0;

function grade(g){
  const s=SESS, cur=s.cur, c=S.cards[cur.id]; if(!c) return nextCard();
  const ms=now()-cur.t0; const wasNew=c.srs.state==='new';
  s.undo={id:c.id, srs:clone(c.srs), queue:s.queue.slice(), later:s.later.slice(), done:s.done, ok:s.ok, missed:s.missed.slice(), day:S.stats.days[dayKey()]?clone(S.stats.days[dayKey()]):null, cur:{...cur, picked:new Set(cur.picked)}};
  s.done++; if(g>=3) s.ok++;
  if(s.mode==='srs'){
    c.srs=nextSrs(c.srs,g); saveCard(c,{fast:true});
    if(g===1) s.missed.push(c.id);
    if(isLearning(c)) s.later.push(c.id);
    logReview(g>=3, wasNew, ms);
  } else {
    if(!c.tmp) logReview(g>=3, false, ms);
    if(g===1){ s.missed.push(c.id); const pos=Math.min(s.queue.length, 3+Math.floor(Math.random()*4)); s.queue.splice(pos,0,c.id); }

}

async function generate(){
  const g=UI.gen; if(g.busy) return;
  if(!g.types.length){ toast('Choisis au moins un type de carte.'); return; }
  if(!g.chap){ toast('Choisis d\'abord la leçon : les cartes y seront rangées.'); return; }
  if(!g.text.trim()){ toast('Colle d\'abord le texte de ton cours, ou charge la leçon du chapitre.'); return; }
  const prompt=buildCardPrompt(g);
  g.busy=true; g.err=''; g.results=null; g.saved=null; rerender();
  aiCtl=new AbortController();
  try{
    const opts={signal:aiCtl.signal, modelTier:'default', onText:({text})=>{ const n=(text.match(/"front"\s*:/g)||[]).length; const el=$('#genCount'); if(el) el.textContent=n?n+'/'+g.n:''; }};
    const data=await AI.sample.json(prompt, opts);
    const res=normalizeGenerated(data);
    if(!res.length) g.err='Aucune carte exploitable. Vérifie le texte de ton cours (assez long et lisible), puis réessaie.';
    else g.results=res;
  }catch(e){ if(e&&e.code==='invalid_json'&&e.text){ const res=parseLoose(e.text); if(res.length) g.results=res; else g.err=aiErr(e); } else g.err=aiErr(e); }
  g.busy=false; if(g.results) saveGenerated(); else rerender();
  if(g.saved){ const el=$('#genResults'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
}

  if(g.chap && statusOf(g.chap)===0) setStatus(g.chap,1);

  toast(ids.length?plural(ids.length,'carte')+' ajoutée'+(ids.length>1?'s':'')+' à la leçon':'Aucune carte à ajouter.', 3200); rerender();
}

async function offerFile(filename, text){
  const C=window.claude; let dl=null;
  try{ dl=C&&C.use?await C.use('downloads'):null; }catch{}
  if(dl){ try{ await dl.save({filename, data:text}); return; }catch(e){ const c=e&&e.code; if(c==='declined') return; if(c==='rate_limited'){ toast('Un téléchargement est déjà en cours. Réessaie dans un instant.'); return; } } }
  if(!dl){ try{ const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Fichier enregistré dans tes téléchargements'); return; }catch{} }
  openSheet(()=>sheetTop(filename)+`<p class="small">Le téléchargement direct n'est pas disponible ici. Copie ce texte et enregistre-le dans un fichier.</p><textarea id="exportText" style="min-height:50vh" readonly>${esc(text)}</textarea><button class="btn btn-primary" data-act="copy-export">Copier</button>`);
}

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function getOcr(onProgress){
  if(!window.Tesseract) await loadScript(libUrl('lib/ocr/tesseract.min.js'));

    ocrWorker=await Tesseract.createWorker('fra', 1, {workerPath:libUrl('lib/ocr/worker.min.js'), corePath:libUrl('lib/ocr'), langPath:libUrl('lib/ocr'), gzip:true,

// Petit lecteur de fichiers .zip (docx et pptx sont des zip), sans bibliothèque.
async function unzipText(buf, want){
  const dv=new DataView(buf), dec=new TextDecoder();
  let e=buf.byteLength-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;

// ---------- Documents de cours et examens par module ----------
// Les fichiers (PDF, Word, photos…) sont gardés sur le téléphone, dans IndexedDB.
// S.docs : documents rangés dans un chapitre ; S.exams : épreuves d'un module, avec questions, corrigé et tentatives.
let FDB=null;
function fdb(){ return FDB||(FDB=new Promise((res,rej)=>{ const r=indexedDB.open('xamxam-files',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function fop(mode, fn){ const db=await fdb(); return new Promise((res,rej)=>{ const t=db.transaction('files',mode); const st=t.objectStore('files'); let out; const r=fn(st); if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const fput=(id,blob)=>fop('readwrite', st=>st.put(blob,id));
const fget=id=>fop('readonly', st=>st.get(id));
const fdel=id=>fop('readwrite', st=>st.delete(id));
async function storeFiles(list){ const out=[]; for(const f of list){ const id=uid('f'); await fput(id, f.blob||f); out.push({id, name:f.name||'Document', type:f.type||'', size:f.size||(f.blob&&f.blob.size)||0}); } return out; }
function fmtSize(n){ return n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko'; }
function fmtExamDate(s){ const d=parseDate(s); return d?fmtD(d,{day:'numeric',month:'long',year:'numeric'}):'Sans date'; }
function saveExams(){ saveLocal(); }
function fileKind(name, type){ const n=(name||'').toLowerCase();
  if(n.endsWith('.pdf')||type==='application/pdf') return 'pdf';
  if(/^image\//.test(type||'')||/\.(jpe?g|png|webp|gif|heic)$/.test(n)) return 'img';
  if(n.endsWith('.docx')) return 'docx'; if(n.endsWith('.pptx')) return 'pptx';
  if(/\.(txt|md|csv)$/.test(n)||/^text\//.test(type||'')) return 'txt';
  return 'other'; }
async function textOfBlob(blob, name){
  const k=fileKind(name, blob.type); const buf=await blob.arrayBuffer();
  if(k==='pdf') return (await pdfText(buf)).pages.join('\n\n');
  if(k==='docx') return docxText(buf); if(k==='pptx') return pptxText(buf);
  if(k==='txt') return new TextDecoder().decode(buf);
  return '';
}
function fileIcon(k){ return {pdf:'PDF',img:'Photo',docx:'Word',pptx:'Diapos',txt:'Texte'}[k]||'Fichier'; }

async function openDoc(meta, chap){

async function renderPdf(blob){
  const box=()=>$('#pdfPages');

    const lib=await loadPdf(); const doc=await lib.getDocument({data:await blob.arrayBuffer()}).promise;

    for(let i=1;i<=doc.numPages;i++){
      const el=box(); if(!el) return;
      const page=await doc.getPage(i); const vp0=page.getViewport({scale:1}); const sc=w/vp0.width*Math.min(2, window.devicePixelRatio||1);
      const vp=page.getViewport({scale:sc}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      c.style.cssText='width:100%;height:auto;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff';
      el.appendChild(c); await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    }

// --- Faire l'examen ---
// EXR = l'examen en cours. idx = les questions posées (toutes, ou seulement les erreurs à refaire).
// Il est gardé sur le téléphone : si l'appli se ferme, on reprend où on en était.
let EXR=null, exrTimer=null;
const EXR_KEY='xamxam.exr';
function exrLive(id){ const e=S.exams[id]; return !!(EXR && !EXR.done && EXR.examId===id && e && Array.isArray(EXR.idx) && EXR.idx.length && EXR.idx.every(i=>e.items[i])); }
function exrItems(){ const e=S.exams[EXR.examId]; return EXR.idx.map(i=>e.items[i]); }
function exrSave(){ if(EXR && !EXR.done) lsSet(EXR_KEY, JSON.stringify(EXR)); else { try{ localStorage.removeItem(EXR_KEY); }catch{} } }
function exrLoad(){ try{ const d=JSON.parse(lsGet(EXR_KEY)||'null'); if(!d) return; EXR=d; if(!exrLive(d.examId)){ EXR=null; exrSave(); } }catch{ EXR=null; } }
function exrStart(id, only){
  const e=S.exams[id]; if(!e||!e.items.length) return;
  const part=!!(only&&only.length); const idx=part?only.slice():e.items.map((_,i)=>i);
  EXR={examId:id, idx, partial:part, i:0, picks:idx.map(()=>[]), texts:idx.map(()=>''), self:idx.map(()=>null), done:false, elapsed:0, limit:part?0:(+e.dur||0)};
  exrSave(); exrOpen();
}
function exrOpen(){ if(UI.sheetStack[UI.sheetStack.length-1]!==examRunSheet) UI.sheetStack.push(examRunSheet); paintSheet(); exrRun(); }
function exrClock(){ const lim=EXR.limit*MIN; const s=Math.floor((lim?Math.max(0,lim-EXR.elapsed):EXR.elapsed)/1000); return (s>=3600?Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60)):Math.floor(s/60))+':'+pad(s%60); }
function exrLow(){ return !!EXR.limit && EXR.limit*MIN-EXR.elapsed<=Math.min(5*MIN, EXR.limit*MIN*0.1); }
function exrRun(){ // le temps ne compte que lorsque l'examen est à l'écran
  clearInterval(exrTimer); let last=now(), n=0;
  exrTimer=setInterval(()=>{
    if(!EXR||EXR.done||UI.sheetStack[UI.sheetStack.length-1]!==examRunSheet){ clearInterval(exrTimer); exrSave(); return; }
    const t=now(), d=t-last; last=t;
    if(document.visibilityState==='visible' && d<3000) EXR.elapsed+=d;
    const el=$('#exrClock'); if(el){ el.textContent=exrClock(); el.classList.toggle('low', exrLow()); }
    if(++n%5===0) exrSave();
    if(EXR.limit && EXR.elapsed>=EXR.limit*MIN){ toast('Temps écoulé : voici la correction.', 4000); exrFinish(); }
  }, 1000);
}
function exrAnswered(j){ return EXR.picks[j].length>0 || !!EXR.texts[j].trim(); }
function examRunSheet(){

function qState(k){ // juste / faux / null (pas encore de corrigé)

  if(EXR.self[k]===true||EXR.self[k]===false) return EXR.self[k];
  const a=qAuto(k); return a?a.frac>=0.5:null;
}

function examToCards(e, only){

  const have=new Set(Object.values(S.cards).filter(c=>c.exam===label||c.exam===e.title+' ('+y+')').map(c=>c.front));
  e.items.forEach((r,i)=>{
    if(only && !only.includes(i)) return;
    if(r.type==='qcm'?!r.answer.length:!r.back.trim()){ skip++; return; }

    saveCard(newCard({chap:'', type:r.type, front:r.front, back:r.back, hint:'', choices:r.type==='qcm'?r.choices:[], answer:r.type==='qcm'?r.answer:[], exam:label})); n++;

// ---------- Synchronisation entre appareils (gist GitHub secret) ----------
// Chaque appareil garde ses données ; elles sont fusionnées dans un fichier « xamxam-sync.json »
// rangé dans un gist secret du compte GitHub de l'étudiant. La clé (jeton « gist ») reste sur l'appareil.
// Les fichiers (PDF, photos…) ne sont pas synchronisés : seulement le texte (cartes, notes, examens, résultats).
let SWREG=null; function swUpdate(){ try{ if(SWREG) SWREG.update().catch(()=>{}); }catch{} }
const GS={ token:lsGet('xamxam.gh')||'', gist:lsGet('xamxam.gist')||'', login:lsGet('xamxam.ghlogin')||'', last:+(lsGet('xamxam.synced')||0), busy:false, err:'', timer:null, applying:false };
const GS_FILE='xamxam-sync.json';
async function gfetch(url, opt){ const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 30000); try{ return await fetch(url, {...opt, signal:ctl.signal}); } finally{ clearTimeout(to); } }
async function gh(method, path, body){
  const r=await gfetch('https://api.github.com'+path, {method, headers:{Authorization:'Bearer '+GS.token, Accept:'application/vnd.github+json', ...(body?{'Content-Type':'application/json'}:{})}, body:body?JSON.stringify(body):undefined, cache:'no-store'});
  if(r.status===401) throw Object.assign(new Error('auth'),{code:'auth'});
  if(r.status===404) throw Object.assign(new Error('404'),{code:'missing'});
  if(!r.ok) throw Object.assign(new Error('http'),{code:'http', status:r.status});
  return r.json();
}
function syncSnapshot(){ return {app:'xamxam', kind:'sync', v:1, appv:APP_VER, cards:Object.values(S.cards).filter(c=>!c.tmp), notes:S.notes, progress:S.progress, custom:S.custom, stats:S.stats, prefs:S.prefs, trash:S.trash, exams:S.exams, internat:S.internat, drive:DRV, docs:S.docs, fsync:S.fsync}; }
function applyRemote(d){
  const before=JSON.stringify([Object.keys(S.cards).length, Object.keys(S.exams).length]);
  const notes=Object.entries(d.notes||{}).map(([id,n])=>({...n, id}));
  const r=mergeData({cards:d.cards||[], notes, progress:{map:d.progress||{}, custom:d.custom||[]}, stats:d.stats||{days:{}}, prefs:d.prefs||null, trash:d.trash||{}});
  let ex=0;
  for(const e of Object.values(d.exams||{})){ if(!e||!e.id) continue; if(S.trash[e.id] && S.trash[e.id]>=(e.t||0)) continue;
    if(EXR && !EXR.done && EXR.examId===e.id) continue;
    const l=S.exams[e.id]; const seen=new Map(); for(const x of (l&&l.attempts)||[]) seen.set(x.t,x); for(const x of e.attempts||[]) if(!seen.has(x.t)) seen.set(x.t,x);
    const attempts=[...seen.values()].sort((x,y)=>x.t-y.t);
    if(!l||(e.t||0)>(l.t||0)){ S.exams[e.id]={...e, files:l?l.files:(e.files||[]), attempts}; ex++; }
    else if(attempts.length!==(l.attempts||[]).length){ l.attempts=attempts; ex++; } }
  for(const id of Object.keys(S.exams)){ if(S.trash[id] && S.trash[id]>=(S.exams[id].t||0)) delete S.exams[id]; }
  if(mergeInternat(d.internat)) ex++;
  if(mergeDrive(d.drive)) ex++;
  // Documents des leçons : la fiche arrive ici, le fichier lui-même passe par gsFiles()
  for(const x of Object.values(d.docs||{})){ if(!x||!x.id||S.trash[x.id]) continue; const l=S.docs[x.id];
    if(!l){ S.docs[x.id]={...x}; ex++; } else if((x.t||0)>(l.t||0)){ S.docs[x.id]={...l, ...x}; ex++; } }
  for(const id of Object.keys(S.docs)) if(S.trash[id]){ delete S.docs[id]; fdel(id).catch(()=>{}); FHAVE.delete(id); ex++; }
  if(d.fsync){ if(d.fsync.gist && !S.fsync.gist) S.fsync.gist=d.fsync.gist; for(const id of Object.keys(d.fsync.up||{})) if(!S.trash[id] && !S.fsync.up[id]){ S.fsync.up[id]=1; ex++; } }
  return r.fromInc.cards.length || r.fromInc.notes.length || r.fromInc.docs.size || ex || before!==JSON.stringify([Object.keys(S.cards).length, Object.keys(S.exams).length]);
}
// ---------- Documents : fichiers et photos, dans un second gist (lu seulement quand il manque un fichier) ----------
const GS_DOCS='xamxam-docs.json', DOC_MAX=5*1048576, FHAVE=new Set();
const docFile = id => 'xd-'+id+'.txt';
function fileMetas(){ const m={}; for(const d of Object.values(S.docs)) if(d&&d.id) m[d.id]=d; for(const e of Object.values(S.exams)) for(const f of (e&&e.files)||[]) if(f&&f.id) m[f.id]=f; return m; }
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
async function hasFile(id){ if(FHAVE.has(id)) return true; const b=await fget(id).catch(()=>null); if(b) FHAVE.add(id); return !!b; }
async function shrinkImage(b){ // les grosses photos sont réduites pour le voyage (l'original reste sur cet appareil)
  if(!/^image\/(jpeg|png|webp)$/.test(b.type||'') || b.size<1.2*1048576) return b;
  try{ const bmp=await createImageBitmap(b); const k=Math.min(1, 2000/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); const out=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82)); return out&&out.size<b.size?out:b; }catch{ return b; } }
async function gsDocsGist(){ if(S.fsync.gist) return S.fsync.gist;
  for(let page=1; page<=5; page++){ const list=await gh('GET','/gists?per_page=100&page='+page); const f=list.find(x=>x.files&&x.files[GS_DOCS]); if(f) return S.fsync.gist=f.id; if(list.length<100) break; }
  const g=await gh('POST','/gists',{description:'XamXam · documents de mes cours (ne pas supprimer)', public:false, files:{[GS_DOCS]:{content:'{"app":"xamxam-docs"}'}}});
  return S.fsync.gist=g.id; }
async function gsFiles(){
  const metas=fileMetas(), up=S.fsync.up; let got=0, dirty=false;
  // 1. Récupérer les fichiers ajoutés sur un autre appareil
  const missing=[]; for(const id of Object.keys(metas)) if(up[id] && !(await hasFile(id))) missing.push(id);
  if(missing.length && S.fsync.gist){ const g=await gh('GET','/gists/'+S.fsync.gist);
    for(const id of missing){ const f=g.files&&g.files[docFile(id)]; if(!f) continue;
      try{ const txt=f.truncated?await (await gfetch(f.raw_url,{cache:'no-store'})).text():f.content; const blob=await (await fetch(txt)).blob(); await fput(id, blob); FHAVE.add(id); got++; }catch{} } }
  // 2. Envoyer les fichiers ajoutés sur cet appareil
  for(const [id,m] of Object.entries(metas)){ if(up[id]||m.big) continue; const b=await fget(id).catch(()=>null); if(!b) continue; FHAVE.add(id);
    const s=await shrinkImage(b); if(s.size>DOC_MAX){ m.big=true; m.t=now(); dirty=true; continue; }
    const gist=await gsDocsGist();
    try{ await gh('PATCH','/gists/'+gist,{files:{[docFile(id)]:{content:await blobToDataURL(s)}}}); up[id]=1; dirty=true; }
    catch(e){ if(e&&e.code==='http'&&(e.status===413||e.status===422)){ m.big=true; m.t=now(); dirty=true; } else throw e; } }
  // 3. Effacer du gist les fichiers supprimés
  if(S.fsync.gist){ const gone=Object.keys(up).filter(id=>!metas[id] && S.trash[id]);
    if(gone.length){ try{ await gh('PATCH','/gists/'+S.fsync.gist,{files:Object.fromEntries(gone.map(id=>[docFile(id),null]))}); }catch{} gone.forEach(id=>delete up[id]); dirty=true; } }
  if(dirty||got) saveLocal(); return got;
}
async function gsSync(manual){
  if(!GS.token||!GS.gist) return;
  if(GS.busy){ GS.again=true; return; }
  if(!navigator.onLine){ if(manual){ GS.err='Pas de connexion internet.'; gsPaint(); } return; }
  GS.busy=true; GS.err=''; gsPaint();
  try{
    const g=await gh('GET','/gists/'+GS.gist); const f=g.files&&g.files[GS_FILE];
    let text=f?(f.truncated?await (await gfetch(f.raw_url,{cache:'no-store'})).text():f.content):''; GS.ver=(g.history&&g.history[0]&&g.history[0].version)||GS.ver;
    let changed=false;
    if(text){ const d=JSON.parse(text); if(d&&d.app==='xamxam'){ GS.otherVer=+d.appv||0; if(GS.otherVer>APP_VER) swUpdate(); GS.applying=true; changed=applyRemote(d); writeLocal(); GS.applying=false; } }
    try{ if(await gsFiles()) changed=true; }catch{}
    const mine=JSON.stringify(syncSnapshot());
    if(mine!==text){ const res=await gh('PATCH','/gists/'+GS.gist,{files:{[GS_FILE]:{content:mine}}}); GS.ver=(res.history&&res.history[0]&&res.history[0].version)||GS.ver; clearTimeout(GS.verify); GS.verify=setTimeout(gsCheck, 4000); }
    GS.last=now(); lsSet('xamxam.synced', String(GS.last));
    if(changed){ onDataChanged(true); if(manual) toast('Données des autres appareils récupérées'); }
    else if(manual) toast('Tout est à jour');
  }catch(e){
    GS.applying=false;
    GS.err=e&&e.code==='auth'?'La clé GitHub ne marche plus (expirée ou supprimée). Recrée-en une et relie à nouveau cet appareil.'
      :e&&e.code==='missing'?'Le fichier de synchronisation a disparu de GitHub. Relie à nouveau cet appareil.'
      :'Synchronisation impossible pour le moment. Elle reprendra toute seule.';
  }
  GS.busy=false; gsPaint();
  if(GS.again){ GS.again=false; gsSchedule(); }
}
function gsSchedule(){ if(!GS.token||!GS.gist||GS.applying) return; clearTimeout(GS.timer); const wait=Math.max(4000, 10000-(now()-GS.last)); GS.timer=setTimeout(()=>gsSync(false), wait); }
// Vérification légère : y a-t-il une version plus récente envoyée par un autre appareil ?
async function gsCheck(){
  if(!GS.token||!GS.gist||GS.busy||!navigator.onLine||document.visibilityState==='hidden') return;
  try{ const c=await gh('GET','/gists/'+GS.gist+'/commits?per_page=1'); const v=c&&c[0]&&c[0].version; if(v && v!==GS.ver) gsSync(false); }catch{}
}
async function gsConnect(token){
  GS.token=token.trim(); GS.err=''; GS.busy=true; gsPaint();
  try{
    const u=await gh('GET','/user'); GS.login=u.login||'';
    let found=null;
    for(let page=1; page<=5 && !found; page++){ const list=await gh('GET','/gists?per_page=100&page='+page); found=list.find(x=>x.files&&x.files[GS_FILE]); if(list.length<100) break; }
    if(!found) found=await gh('POST','/gists',{description:'XamXam · synchronisation de mes révisions (ne pas supprimer)', public:false, files:{[GS_FILE]:{content:JSON.stringify(syncSnapshot())}}});
    GS.gist=found.id; lsSet('xamxam.gh',GS.token); lsSet('xamxam.gist',GS.gist); lsSet('xamxam.ghlogin',GS.login);
    GS.busy=false; await gsSync(false);
    toast('Cet appareil est relié. Fais pareil sur tes autres appareils avec la même clé.', 4500);
  }catch(e){
    GS.busy=false; GS.token='';
    GS.err=e&&e.code==='auth'?'Clé refusée par GitHub. Vérifie que tu as copié toute la clé (elle commence par ghp_).':(!navigator.onLine?'Pas de connexion internet.':'Impossible de joindre GitHub. Vérifie que la case « gist » est bien cochée, puis réessaie.');
  }
  gsPaint();
}
function gsDisconnect(){ GS.token=''; GS.gist=''; GS.login=''; GS.err=''; ['xamxam.gh','xamxam.gist','xamxam.ghlogin','xamxam.synced'].forEach(k=>{ try{ localStorage.removeItem(k); }catch{} }); gsPaint(); toast('Cet appareil n\'est plus synchronisé. Tes données restent dessus.'); }
function ago(t){ const m=Math.round((now()-t)/MIN); if(m<1) return "à l'instant"; if(m<60) return 'il y a '+m+' min'; const h=Math.round(m/60); if(h<24) return 'il y a '+h+' h'; return 'le '+fmtShort(new Date(t)); }

   :`<p class="small">Pour retrouver les mêmes cartes, notes et examens sur ton téléphone et ton ordinateur. Ça passe par ton compte GitHub, une seule fois par appareil :</p>

// ---------- Partager des questions ----------
function shareCardData(c){ return {type:c.type, front:c.front, back:c.back, hint:c.hint||'', choices:c.choices||[], answer:c.answer||[], img:c.img||'', imgSide:c.imgSide||'front', exam:c.exam||'', chap:c.chap||'', syn:c.syn||'', tri:c.tri||''}; }
async function shareFile(title, cards, exams){
  if(!cards.length && !exams.length){ toast('Rien à partager ici.'); return; }
  const d={app:'xamxam', kind:'share', v:1, title, from:S.prefs.name||'', created:new Date().toISOString(), cards:cards.map(shareCardData), exams:exams.map(e=>({mod:e.mod, title:e.title, date:e.date||'', items:e.items}))};
  const name='xamxam-'+title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'.json';
  const text=JSON.stringify(d);
  try{
    const file=new File([text], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'XamXam · '+title, text:'Questions XamXam : '+title+'. Pour les ajouter : ouvre XamXam → Créer → Importer → « Importer un fichier .json ».'}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  offerFile(name, text);
}
function importShare(d){
  const have=new Set(Object.values(S.cards).map(c=>c.type+'|'+c.front+'|'+(c.exam||'')));
  let n=0, ne=0;
  for(const c of d.cards||[]){ if(!c||!c.front) continue; const k=(c.type||'qa')+'|'+c.front+'|'+(c.exam||''); if(have.has(k)) continue; have.add(k);
    saveCard(newCard({type:['qa','cloze','qcm'].includes(c.type)?c.type:'qa', front:String(c.front), back:String(c.back||''), hint:String(c.hint||''), choices:Array.isArray(c.choices)?c.choices:[], answer:Array.isArray(c.answer)?c.answer:[], img:c.img||'', imgSide:c.imgSide||'front', exam:c.exam||'', chap:CH[c.chap]?c.chap:'', syn:c.syn&&SYN_BY[c.syn]?c.syn:'', tri:c.tri&&TRI_BY[c.tri]?c.tri:''})); n++; }
  for(const e of d.exams||[]){ if(!e||!Array.isArray(e.items)) continue;
    if(Object.values(S.exams).some(x=>x.title===e.title && x.date===(e.date||'') && x.items.length===e.items.length)) continue;
    const id=uid('e'); S.exams[id]={id, mod:MODS[e.mod]?e.mod:PROGRAMME[0].id, title:String(e.title||'Examen'), date:e.date||'', files:[], items:e.items, attempts:[], created:now(), t:now()}; ne++; }
  saveLocal(); onDataChanged(true);
  toast(n||ne?'Reçu'+(d.from?' de '+d.from:'')+' : '+[n?plural(n,'carte'):'', ne?plural(ne,'examen'):''].filter(Boolean).join(' et '):'Tu avais déjà tout ce qui est dans ce fichier.', 4200);
}
async function handleSharedLaunch(){
  if(!/[?&]shared=1/.test(location.search)) return;
  try{ history.replaceState(null,'',location.pathname); }catch{}
  try{ const c=await caches.open('xamxam-share'); const r=await c.match('shared-file'); if(!r) return; const text=await r.text(); await c.delete('shared-file'); importBackup(text); }catch{ toast("Impossible d'ouvrir le fichier partagé."); }
}

// ---------- Drive de la promo ----------
// Les liens vers les fichiers du Drive (cours, QCM, examens, copies modèles d'internat) ne sont pas publiés avec l'appli :
// ils arrivent par un fichier à importer et restent sur les appareils de l'étudiant (et dans sa synchronisation).
let DRV=null; try{ DRV=JSON.parse(lsGet('xamxam.drive')||'null'); }catch{ DRV=null; }
const drv=(kind,id)=>(DRV&&!DRV.removed&&DRV[kind]&&DRV[kind][id])||[];
const driveUrl=e=>e[2]==='p'?'https://docs.google.com/presentation/d/'+e[1]+'/view':'https://drive.google.com/file/d/'+e[1]+'/view';
function driveList(list){ return `<div class="clist">${list.map(e=>{ const m=String(e[0]).match(/^(.*?)(?: · (PDF|Word|PowerPoint|Présentation))?$/);
  return `<a class="citem" href="${driveUrl(e)}" target="_blank" rel="noopener"><span style="min-width:0"><span class="q">${esc(m[1])}</span><span class="meta"><span class="badge">${esc(m[2]||'Fichier')}</span><span>Drive</span></span></span>${I.chev}</a>`; }).join('')}</div>`; }
function cleanDrive(d){ const ok=e=>Array.isArray(e)&&typeof e[0]==='string'&&/^[\w-]{10,100}$/.test(String(e[1]||''));
  const lists=o=>{ const r={}; for(const [k,v] of Object.entries(o&&typeof o==='object'?o:{})) if(Array.isArray(v)){ const l=v.filter(ok).map(e=>e[2]==='p'?[e[0].slice(0,200),e[1],'p']:[e[0].slice(0,200),e[1]]); if(l.length) r[k]=l; } return r; };
  const mod={}; for(const [k,v] of Object.entries(d.mod&&typeof d.mod==='object'?d.mod:{})){ const g=lists(v); if(Object.keys(g).length) mod[k]=g; }
  return {name:String(d.name||'Drive de la promo').slice(0,80), at:+d.at||now(), chap:lists(d.chap), mod, int:lists(d.int)}; }
function mergeDrive(inc){ if(!inc||typeof inc!=='object'||!inc.at) return false; if(DRV&&(DRV.at||0)>=inc.at) return false;
  DRV=inc.removed?{removed:true, at:+inc.at}:cleanDrive(inc); lsSet('xamxam.drive', JSON.stringify(DRV)); return true; }
function importDrive(d){ DRV=cleanDrive({...d, at:now()}); lsSet('xamxam.drive', JSON.stringify(DRV)); if(typeof gsSchedule==='function') gsSchedule();
  const nC=Object.keys(DRV.chap).length, nI=Object.keys(DRV.int).length;
  onDataChanged(true); toast(`Drive relié : ${plural(nC,'cours','cours')} et ${plural(nI,'question')} d'internat s'ouvrent maintenant sur leurs fichiers.`, 4800); }
function driveModBlock(mid){ const g=DRV&&!DRV.removed&&DRV.mod&&DRV.mod[mid]; if(!g) return '';
  const parts=[['doc','Autres documents'],['qcm','QCM'],['exam','Examens et devoirs'],['td','TD et TP'],['cas','Cas cliniques']].filter(([k])=>g[k]&&g[k].length);
  if(!parts.length) return '';
  return `<section class="panel"><h3>Sur le Drive de la promo</h3>${parts.map(([k,n])=>`<details class="syn"><summary><span>${n} <span class="small muted">· ${g[k].length}</span></span>${I.chev}</summary><div class="syn-body">${driveList(g[k])}</div></details>`).join('')}</section>`; }
function driveIntBlock(id){ const l=drv('int',id); if(!l.length) return '';
  return `<section class="panel"><h3>Copies modèles sur le Drive</h3><p class="small muted" style="margin-bottom:8px">Rédactions de cette question rangées dans le Drive de ta promo. Compare-les à ton plan et garde les mots-clés.</p>${driveList(l)}</section>`; }
function drivePanel(){ const on=DRV&&!DRV.removed;
  return `<section class="panel stack"><h3>Drive de la promo</h3>${on?`<p class="small">${plural(Object.keys(DRV.chap).length,'cours','cours')} et ${plural(Object.keys(DRV.int).length,'question')} d'internat ouvrent leurs fichiers du Drive. Liens importés le ${esc(fmtShort(new Date(DRV.at)))}.</p>
    <p class="small muted">Ces liens restent sur tes appareils et dans ta synchronisation : ils ne sont pas publiés avec l'appli.</p><button class="btn" data-act="drive-del">Retirer les liens du Drive</button>`
   :`<p class="small">Pour ouvrir depuis XamXam les cours, QCM, examens et copies modèles d'internat du Drive de ta promo, importe le fichier de liens (« xamxam-drive-promo103.json ») avec « Importer une sauvegarde ».</p>`}</section>`; }

function parseLesson(text){
  const out={plan:'',lecon:'',expl:'',apps:'',figs:[]}; let cur=null, fig=null;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    if(/^\s*```/.test(line)) continue;
    const m=line.match(/^[\s>*#_`-]*@@\s*([A-Za-zÀ-ÿ]+)[*_`\s:]*(.*)$/);
    if(m){ const k=fold(m[1]); fig=null;
      if(k==='schema'||k==='figure'){ fig={title:m[2].trim(), svg:''}; out.figs.push(fig); cur='fig'; }
      else cur={plan:'plan', lecon:'lecon', explications:'expl', explication:'expl', applications:'apps'}[k]||null;
      continue; }
    if(cur==='fig') fig.svg+=line+'\n'; else if(cur) out[cur]+=line+'\n';
  }
  for(const k of ['plan','lecon','expl','apps']) out[k]=out[k].replace(/\s+$/,'').replace(/^\n+/,'');
  return out;
}

function mdLesson(text){
  const lines=esc(text||'').split('\n'); let html='', list=false, table=false;

  for(const raw of lines){ const l=raw.trim(); let m;
    if(!l){ close(); continue; }
    if((m=l.match(/^(#{2,5})\s+(.*)/))){ close(); const lv=m[1].length-1; html+=`<h${Math.min(lv+2,6)} class="lz-h${lv}">${inline(m[2])}</h${Math.min(lv+2,6)}>`; continue; }

      if(!table){ close(); html+='<div class="tbl-mini"><table><thead><tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'; table=true; }
      else html+='<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; continue; }
    if((m=l.match(/^[-•]\s+(.*)/))){ if(!list){ close(); html+='<ul>'; list=true; } html+='<li'+(raw.match(/^\s*/)[0].length>=2?' class="li2"':'')+'>'+inline(m[1])+'</li>'; continue; }

  }
  close(); return html;
}

    if(!shown && (q||f!=='all')) continue;
    if(!q && f==='all') inner+=`<button class="add-chap" data-act="int-add" data-ep="${ep.id}">+ Ajouter une question</button>`;
    total+=shown;
    const cc=intCounts(ep.all), known=cc[2]+cc[3]; const open=UI.open.has('int-'+ep.id)||q||f!=='all';
    const w=ep.all.filter(x=>!x.oral&&!x.extra).length, o=ep.all.filter(x=>x.oral).length;
    html+=`<details class="mod" data-mod="int-${ep.id}" ${open?'open':''}><summary><span class="stack" style="gap:2px"><strong style="font-family:var(--font-display);font-size:1.0625rem">${esc(ep.name)}</strong><span class="small muted">coefficient ${ep.coef} · ${w} à l'écrit${o?' · '+o+' à l\'oral':''}${known?' · '+known+' sue'+(known>1?'s':''):''}</span></span>${I.chev}</summary>${inner}</details>`;
  }
  if(!total) html+=`<p class="muted">Aucune question ne correspond.</p>`;
  html+=`<p class="small muted">Programme officiel du concours (écrit et oral), tiré du Drive de ta promo. Les leçons sont des modèles : en cas de différence, c'est le cours de tes professeurs qui fait foi.</p>`;
  return html;
}

let ITR=null, itrTimer=null; const ITR_KEY='xamxam.itr';
function itrSave(){ if(ITR) lsSet(ITR_KEY, JSON.stringify(ITR)); else { try{ localStorage.removeItem(ITR_KEY); }catch{} } }
function itrLoad(){ try{ const d=JSON.parse(lsGet(ITR_KEY)||'null'); if(d && INTQ[d.id]) ITR=d; else if(d) localStorage.removeItem(ITR_KEY); }catch{ ITR=null; } }
function itrElapsed(){ return ITR.acc+(ITR.run?now()-ITR.run:0); }
function itrLeft(){ return ITR.dur*MIN-itrElapsed(); }
function itrClock(){ const left=itrLeft(), s=Math.floor(Math.abs(left)/1000); return (left<0?'+ ':'')+Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function itrBegin(id){
  if(ITR && ITR.id!==id){ toast('Une épreuve blanche est déjà en cours : termine-la ou abandonne-la d\'abord.', 3600); itrResume(); return; }
  if(!ITR){ ITR={id, acc:0, run:now(), dur:INT_DUR, aid:false, phase:'run', keys:[], plan:null, rang:false}; itrSave(); }
  itrResume();
}
function itrResume(){ if(!ITR) return; const fn=ITR.phase==='check'?intCheckSheet:intRunSheet; UI.sheetStack=UI.sheetStack.filter(s=>s!==intRunSheet&&s!==intCheckSheet&&s!==intPickSheet); UI.sheetStack.push(fn); paintSheet(); intLoad(ITR.id); itrTick(); }
function itrTick(){ clearInterval(itrTimer);
  itrTimer=setInterval(()=>{ if(!ITR||ITR.phase!=='run'||UI.sheetStack[UI.sheetStack.length-1]!==intRunSheet){ clearInterval(itrTimer); return; }
    const el=$('#itrClock'); if(el){ el.textContent=itrClock(); el.classList.toggle('low', itrLeft()<10*MIN); }
    if(ITR.run && !ITR.rang && itrLeft()<=0){ ITR.rang=true; itrSave(); toast('Temps écoulé : pose ton stylo.', 6000); try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch{} } }, 1000); }

function mergeInternat(inc){ if(!inc) return false; let ch=false; const T=S.internat;
  for(const k of ['prog','fiches','rev']) for(const [id,v] of Object.entries(inc[k]||{})){ T[k]=T[k]||{}; const l=T[k][id]; if(v && (!l||(v.t||0)>(l.t||0))){ T[k][id]=v; ch=true; } }
  for(const [id,arr] of Object.entries(inc.tries||{})){ const seen=new Set((T.tries[id]||[]).map(a=>a.t)); for(const a of arr||[]) if(a && !seen.has(a.t)){ (T.tries[id]=T.tries[id]||[]).push(a); seen.add(a.t); ch=true; } if(T.tries[id]) T.tries[id].sort((a,b)=>a.t-b.t); }
  const cm={}; for(const c of T.custom) cm[c.id]=c; for(const c of inc.custom||[]){ const l=cm[c.id]; if(c && c.id && (!l||(c.t||0)>(l.t||0))){ cm[c.id]=c; ch=true; } } T.custom=Object.values(cm);
  return ch;
}

    case 'int-train': if(d.id) itrBegin(d.id); else if(ITR) itrResume(); else openSheet(intPickSheet); break;

const modChaps = m => m.allSubs.flatMap(s=>s.all);
function progOf(chs){ const st=[0,0,0,0]; chs.forEach(c=>st[statusOf(c.id)]++); const n=chs.length; return {n, st, pct:n?Math.round((st[2]+st[3])/n*100):0}; }

function viewLevel(lvl, sem){

const READY_DATA={};
async function readyLoad(chap){ if(READY_DATA[chap]) return READY_DATA[chap]; const r=await fetch('cours/cartes/'+chap+'.json'); if(!r.ok) throw new Error('http'); return READY_DATA[chap]=await r.json(); }
const readyHas = chap => Object.values(S.cards).some(c=>c.ready===chap);
async function readyAdd(chap){ const d=await readyLoad(chap); let n=0;
  d.cards.forEach((c,i)=>{ const id='P.'+chap+'.'+i; if(S.cards[id]) return; saveCard(newCard({id, chap, ready:chap, type:c[0]==='c'?'cloze':'qa', front:c[1], back:c[2]||'', hint:''})); n++; });
  updateDueDot(); return n; }
function readyRemove(chap){ let n=0; for(const c of Object.values(S.cards)) if(c.ready===chap){ deleteCard(c.id); n++; } updateDueDot(); return n; }
// Règle : les cartes d'une leçon n'entrent dans les révisions qu'une fois la leçon marquée « Appris ».
function readyPanel(chap){ const n=READY[chap]; if(!n) return ''; const has=readyHas(chap), st=statusOf(chap);
  let body;
  if(st>=2 && has) body=`<div class="row"><span class="badge">Dans tes révisions</span><button class="btn btn-ghost" data-act="ready-del" data-id="${chap}">Retirer</button></div>`;
  else if(st>=2) body=`<p class="small">Tu as appris cette leçon : ses cartes peuvent entrer dans tes révisions.</p><button class="btn btn-primary" data-act="ready-add" data-id="${chap}">${I.plus} Ajouter les ${n} cartes à mes révisions</button>`;
  else if(has) body=`<p class="small"><strong>En attente.</strong> Ces cartes ne viendront pas dans tes révisions tant que la leçon n'est pas marquée « Appris ».</p><div class="row"><button class="btn btn-soft" style="flex:1" data-act="ready-learned" data-id="${chap}">J'ai appris cette leçon</button><button class="btn btn-ghost" data-act="ready-del" data-id="${chap}">Retirer</button></div>`;
  else body=`<p class="small">${st===1?'Tu as vu cette leçon en cours.':'Leçon pas encore vue.'} Ses cartes te seront proposées quand tu l'auras apprise.</p><button class="btn btn-soft" data-act="ready-learned" data-id="${chap}">J'ai appris cette leçon : ajouter ses ${n} cartes</button>`;
  return `<section class="panel stack"><div class="section-title" style="margin-bottom:0"><h3>Cartes prêtes</h3><span class="small muted">${n} cartes</span></div>
    <p class="small muted">Faites à partir des objectifs de ton cours, avec ses définitions. Elles n'entrent dans tes révisions qu'une fois la leçon apprise.</p>${body}
    <button class="btn btn-ghost" data-act="ready-read" data-id="${chap}">Lire les cartes sans les réviser</button><div id="readyRead" class="stack" style="gap:10px" hidden></div></section>`; }
function readySubPanel(s){ const chs=s.all.filter(c=>READY[c.id]); if(!chs.length) return '';
  const learned=chs.filter(c=>statusOf(c.id)>=2), todo=learned.filter(c=>!readyHas(c.id)), wait=chs.length-learned.length, added=chs.filter(c=>readyHas(c.id));
  const n=todo.reduce((a,c)=>a+READY[c.id],0); const out=[];
  if(todo.length) out.push(`<button class="btn btn-soft" data-act="ready-add-many" data-ids="${todo.map(c=>c.id).join(' ')}">${I.plus} Ajouter les cartes de ${plural(todo.length,'leçon apprise','leçons apprises')} (${n} cartes)</button>`);
  if(wait) out.push(`<p class="small muted">${plural(wait,'leçon')} pas encore ${wait>1?'marquées':'marquée'} « Appris » : leurs cartes te seront proposées à ce moment-là.</p>`);
  if(added.length) out.push(`<div class="row"><span class="badge">Cartes prêtes ajoutées : ${plural(added.length,'leçon')}</span><button class="btn btn-ghost" data-act="ready-del-many" data-ids="${added.map(c=>c.id).join(' ')}">Tout retirer</button></div>`);
  return out.join(''); }
// Accueil : propose les cartes des leçons apprises qui ne sont pas encore dans les révisions
function readyProposeHTML(){ const ids=Object.keys(READY).filter(id=>CH[id]&&statusOf(id)>=2&&!readyHas(id)); if(!ids.length) return '';
  const n=ids.reduce((a,id)=>a+READY[id],0);
  return `<div class="stack" style="gap:6px"><p class="today-line" style="margin:0"><strong>${plural(ids.length,'leçon apprise','leçons apprises')}</strong> avec des cartes prêtes : ${ids.slice(0,3).map(id=>esc(CH[id].title)).join(' · ')}${ids.length>3?' …':''}</p>
    <button class="btn btn-soft" data-act="ready-add-many" data-ids="${ids.join(' ')}">${I.plus} Ajouter leurs ${n} cartes à mes révisions</button></div>`; }
function readyReadHTML(d){ return d.cards.map(c=>c[0]==='c'
    ? `<div class="panel" style="padding:12px">${md(c[1].replace(/\{\{(.+?)\}\}/g,'**$1**'))}</div>`
    : `<div class="panel" style="padding:12px"><p style="margin:0 0 6px"><strong>${esc(c[1])}</strong></p>${md(c[2]||'')}</div>`).join(''); }

  return sheetTop(m.short)+`

function subAddSheet(){ const m=MODS[UI.subAddMod];

function levelPickHome(){ return `<section class="panel stack"><h3 style="margin:0">En quelle année es-tu ?</h3>
   <p class="small muted">Tes cours, tes révisions et tes examens suivront le programme de ton année. Tu pourras changer dans Moi.</p>
   ${CYCLES.map(c=>`<div class="lvlrow"><span class="small muted">${c}</span><div class="lvlpick">${LEVELS.filter(l=>l.cyc===c).map(l=>`<button data-act="set-level" data-l="${l.id}" style="${cov(l.color)}"><strong>${l.id}</strong><span>${l.an}</span></button>`).join('')}</div></div>`).join('')}</section>`; }
function removeCustom(pred){ const gone=new Set(); for(const c of S.custom){ if(!c.del && pred(c)){ c.del=true; c.t=now(); gone.add(c.id); } } return gone; }
function orphanCards(test){ for(const c of Object.values(S.cards)){ const ch=CH[c.chap]; if(ch && test(ch)){ c.chap=''; saveCard(c); } } }
function goMod(id, subId){ const m=MODS[id]; if(!m) return; UI.tab='prog'; lsSet('xamxam.tab','prog'); UI.progView='l3'; UI.pvLvl=m.lvl; UI.pvSem=m.sem; UI.progQuery=''; UI.sheetStack=[]; window.scrollTo(0,0); render();
  UI.modId=id; UI.sheetStack.push(modSheet); if(subId && SUBS[subId] && m.allSubs.length>1){ UI.subId=subId; UI.sheetStack.push(subSheet); } paintSheet(); }
document.addEventListener('click', e=>{

  if(!/^(pv-|mod-|sub-|set-level$|pref-lsem$)/.test(act)) return;
  switch(act){
    case 'pv-root': UI.pvLvl='root'; UI.progQuery=''; window.scrollTo(0,0); render(); break;
    case 'pv-lvl': if(UI.pvLvl!==d.l){ UI.pvSem=(d.l===S.prefs.level)?mySem():1; } UI.pvLvl=d.l; UI.progQuery=''; window.scrollTo(0,0); render(); break;
    case 'pv-sem': UI.pvSem=+d.s===2?2:1; rerender(); break;
    case 'pv-mine': case 'set-level': { S.prefs.level=d.l; S.prefs.levelSem=+d.s===2?2:1; savePrefs(); UI.pvLvl=d.l; UI.pvSem=S.prefs.levelSem; updateDueDot();
      toast(`C'est noté : ${LV[d.l].name}, semestre ${S.prefs.levelSem}.`); if(act==='set-level'){ UI.tab='prog'; UI.progView='l3'; lsSet('xamxam.tab','prog'); window.scrollTo(0,0); render(); } else rerender(); break; }
    case 'pref-lsem': S.prefs.levelSem=+d.s===2?2:1; if(!S.prefs.level) S.prefs.level=myLvl(); savePrefs(); rerender(); break;
    case 'mod-open': UI.modId=d.id; openSheet(modSheet); break;
    case 'sub-open': UI.subId=d.id; openSheet(subSheet); break;
    case 'mod-add': UI.modAdd={lvl:d.l, sem:+d.s===2?2:1, name:'', icon:'book', color:(modsOf(d.l,+d.s,true).length+3)%10}; openSheet(modAddSheet); break;
    case 'mod-add-ico': UI.modAdd.icon=d.k; paintSheet(true); break;
    case 'mod-add-col': UI.modAdd.color=+d.i; paintSheet(true); break;
    case 'mod-add-go': { const A=UI.modAdd, name=(A.name||'').trim(); if(!name){ toast('Écris le nom de la matière.'); break; }
      const id=uid('m'), t=now(); S.custom.push({id, kind:'mod', lvl:A.lvl, sem:A.sem, title:name, icon:A.icon, color:A.color, created:t, t});
      S.custom.push({id:uid('s'), kind:'sub', mod:id, title:name, created:t+1, t}); saveLocal(); cloudPut('progress'); buildIndex();
      UI.sheetStack.pop(); UI.modId=id; UI.sheetStack.push(modSheet); paintSheet(); rerender(); toast('Matière ajoutée. Ajoute maintenant ses cours.'); break; }
    case 'sub-add': UI.subAddMod=d.mod; openSheet(subAddSheet); break;
    case 'sub-add-go': { const name=(($('#subAddName')||{}).value||'').trim(); if(!name){ toast('Écris le nom de la sous-matière.'); break; }
      const t=now(); S.custom.push({id:uid('s'), kind:'sub', mod:UI.subAddMod, title:name, created:t, t}); saveLocal(); cloudPut('progress'); buildIndex(); closeSheet(); toast('Sous-matière ajoutée'); break; }
    case 'mod-hide': { const id=d.id; S.prefs.hide=hiddenMods().filter(x=>x!==id).concat(id); savePrefs(); closeSheet(); toast('Matière masquée. Tu peux la réafficher en bas de la page.', 3600); break; }
    case 'mod-unhide': S.prefs.hide=hiddenMods().filter(x=>x!==d.id); savePrefs(); rerender(); break;
    case 'mod-del': armConfirm(a,'Confirmer : supprimer la matière',()=>{ const id=d.id; const subs=new Set(MODS[id].allSubs.map(s=>s.id));
      orphanCards(ch=>ch.mod===id); removeCustom(c=>c.id===id || (c.kind==='sub'&&c.mod===id) || (!c.kind&&subs.has(c.sub)));
      saveLocal(); cloudPut('progress'); buildIndex(); closeSheet(); toast('Matière supprimée (ses cartes sont gardées sans chapitre)'); }); break;
    case 'sub-del': armConfirm(a,'Confirmer : supprimer la sous-matière',()=>{ const id=d.id;
      orphanCards(ch=>ch.sub===id); removeCustom(c=>c.id===id || (!c.kind&&c.sub===id));
      saveLocal(); cloudPut('progress'); buildIndex(); closeSheet(); toast('Sous-matière supprimée'); }); break;
  }
});
document.addEventListener('input', e=>{ const el=e.target; if(!el.dataset||el.dataset.input!=='mod-add-name') return;
  UI.modAdd.name=el.value; const pv=$('#modAddPrev'); if(pv) pv.innerHTML=cahierCard({name:el.value, icon:UI.modAdd.icon, color:UI.modAdd.color, allSubs:[]}, true); });

 e:"La moelle épinière est un gros câble dans la colonne. Si quelque chose l'écrase peu à peu, ça fait mal en ceinture à l'endroit écrasé, et en dessous les jambes deviennent faibles, raides et sentent mal.",
 h:"Souffrance progressive de la moelle par un processus expansif intracanalaire. Elle associe un syndrome lésionnel radiculaire, un syndrome sous-lésionnel et un syndrome rachidien.",
 s:["Syndrome lésionnel : douleurs radiculaires en ceinture ou en hémi-ceinture, fixes, impulsives à la toux ; donne le niveau de la compression","Syndrome sous-lésionnel : syndrome pyramidal (paraparésie spastique), troubles sensitifs avec niveau supérieur net, troubles sphinctériens","Syndrome rachidien : douleur et raideur du rachis, douleur à la percussion des épineuses"],
 c:["Mal de Pott (tuberculose vertébrale), fréquent en Afrique","Métastases vertébrales","Tumeurs intrarachidiennes : neurinome, méningiome","Hernie discale, myélopathie cervicarthrosique"],
 k:"Urgence diagnostique : IRM médullaire. Sans traitement, évolution vers la paraplégie définitive."},
{id:'queuecheval', sys:'neuro', n:"Syndrome de la queue de cheval",
 e:"En bas de la colonne, la moelle se termine par un paquet de nerfs qui ressemble à une queue de cheval. S'ils sont coincés, les jambes deviennent molles, on ne sent plus la zone où on s'assoit, et on ne contrôle plus ses urines.",
 h:"Atteinte pluriradiculaire des racines lombo-sacrées (L2 à S5) en dessous du cône terminal. C'est un syndrome neurogène périphérique : il n'y a aucun signe pyramidal.",
 s:["Paraplégie ou paraparésie flasque, amyotrophie","Abolition des réflexes rotuliens et achilléens","Anesthésie en selle (périnée, organes génitaux, face interne des cuisses)","Troubles sphinctériens : rétention ou incontinence urinaire, constipation","Troubles génitaux ; pas de signe de Babinski"],
 c:["Hernie discale lombaire volumineuse","Tumeur (épendymome, neurinome, métastase)","Canal lombaire étroit"],
 k:"Urgence neurochirurgicale. L'anesthésie en selle et les troubles sphinctériens doivent être cherchés devant toute sciatique."},
{id:'brownsequard', sys:'neuro', n:"Syndrome de Brown-Séquard",
 e:"La moelle est coupée seulement sur une moitié. Du côté coupé, la jambe ne bouge plus bien et ne sent plus sa position. De l'autre côté, la jambe bouge mais ne sent plus le chaud, le froid ni la piqûre.",
 h:"Syndrome d'hémisection de la moelle. Il associe, du côté de la lésion, un syndrome pyramidal et une atteinte de la sensibilité profonde, et du côté opposé une anesthésie thermo-algique.",
 s:["Côté de la lésion : déficit moteur avec syndrome pyramidal","Côté de la lésion : perte de la sensibilité proprioceptive et du tact fin (cordon postérieur)","Côté opposé : perte de la sensibilité à la douleur et à la température (faisceau spino-thalamique, qui croise)"],
 c:["Traumatisme médullaire (plaie par arme blanche)","Compression médullaire latérale","Sclérose en plaques"],
 k:"Dissociation croisée : moteur et profond d'un côté, thermo-algique de l'autre."},
{id:'neurogene', sys:'neuro', n:"Syndrome neurogène périphérique",
 e:"Ici, c'est le dernier bout du fil qui est malade : le nerf qui va jusqu'au muscle. Le muscle ne reçoit plus rien, il devient mou, il fond, il tressaute, et le réflexe disparaît.",
 h:"Ensemble des signes traduisant l'atteinte du neurone moteur périphérique (corne antérieure, racine, plexus, tronc nerveux) et, souvent, des fibres sensitives et végétatives associées.",
 s:["Déficit moteur flasque, hypotonie","Amyotrophie, fasciculations","Réflexes ostéotendineux diminués ou abolis","Troubles sensitifs : paresthésies, hypoesthésie (en chaussettes dans la polynévrite)","Troubles végétatifs et trophiques : peau sèche, maux perforants"],
 c:["Diabète","Alcool et carences vitaminiques (B1)","Lèpre","Médicaments et toxiques","Polyradiculonévrite aiguë (syndrome de Guillain-Barré)"],
 k:"S'oppose point par point au syndrome pyramidal : flasque, réflexes abolis, amyotrophie, pas de Babinski."},
{id:'myogene', sys:'neuro', n:"Syndrome myogène",
 e:"Le fil marche bien, c'est le muscle lui-même qui est malade. Les gros muscles près du corps (épaules, cuisses) deviennent faibles : difficile de se relever d'une chaise ou de se coiffer.",
 h:"Ensemble des signes traduisant une atteinte primitive de la fibre musculaire striée. Le déficit est proximal, bilatéral et symétrique, sans trouble sensitif.",
 s:["Déficit moteur des ceintures (scapulaire et pelvienne), symétrique","Démarche dandinante, signe du tabouret, signe de Gowers (se relever en prenant appui sur ses cuisses)","Amyotrophie ou pseudo-hypertrophie des mollets","Abolition du réflexe idiomusculaire ; réflexes ostéotendineux longtemps conservés","Pas de trouble sensitif, pas de fasciculations ; CPK élevées"],
 c:["Dystrophies musculaires (Duchenne, Becker)","Myosites inflammatoires","Causes endocriniennes : hyperthyroïdie, hypothyroïdie, Cushing","Médicaments : corticoïdes, statines"],
 k:"Proximal + symétrique + sensibilité normale = muscle."},
{id:'myasthenique', sys:'neuro', n:"Syndrome myasthénique",
 e:"Entre le nerf et le muscle, il y a une petite prise électrique. Quand elle fonctionne mal, le muscle se fatigue très vite : les paupières tombent le soir, on voit double, puis ça va mieux après le repos.",
 h:"Ensemble des signes traduisant un bloc de la transmission neuromusculaire. Il est caractérisé par une fatigabilité musculaire à l'effort, fluctuante, corrigée par le repos et les anticholinestérasiques.",
 s:["Fatigabilité à l'effort, variable, plus marquée en fin de journée, améliorée par le repos","Ptosis, diplopie","Troubles de la phonation (voix nasonnée), de la mastication et de la déglutition","Déficit des muscles proximaux et de la nuque","Réflexes normaux, pas de trouble sensitif, pas d'amyotrophie"],
 c:["Myasthénie auto-immune (anticorps anti-récepteurs de l'acétylcholine), chercher un thymome","Syndrome de Lambert-Eaton (paranéoplasique)","Botulisme"],
 k:"Gravité : troubles de la déglutition et atteinte respiratoire (crise myasthénique). Beaucoup de médicaments sont contre-indiqués."},
{id:'vestibulaire', sys:'neuro', n:"Syndrome vestibulaire",
 e:"Dans l'oreille, il y a un petit niveau à bulle qui dit au cerveau si on est droit. Quand il est en panne, tout tourne comme sur un manège, on tombe d'un côté et les yeux font des secousses.",
 h:"Ensemble des signes traduisant l'atteinte du système vestibulaire, périphérique (labyrinthe, nerf vestibulaire) ou central (noyaux vestibulaires et leurs connexions).",
 s:["Vertige rotatoire, nausées, vomissements","Nystagmus","Déviation des index, déviation à la marche aveugle, signe de Romberg latéralisé","Périphérique : syndrome harmonieux et complet, toutes les déviations lentes vont du côté atteint, signes cochléaires (surdité, acouphènes)","Central : syndrome dysharmonieux, nystagmus multidirectionnel ou vertical, autres signes neurologiques"],
 c:["Périphérique : vertige positionnel paroxystique bénin, névrite vestibulaire, maladie de Ménière","Central : accident vasculaire de la fosse postérieure, sclérose en plaques, tumeur"],
 k:"Harmonieux = périphérique. Dysharmonieux ou nystagmus vertical = central, donc imagerie."},
/* ===== Cardio-vasculaire ===== */
{id:'icg', sys:'cardio', n:"Insuffisance cardiaque gauche",
 e:"Le côté gauche du cœur est la pompe qui envoie le sang dans tout le corps. Quand elle est fatiguée, le sang attend derrière elle, dans les poumons : les poumons se remplissent d'eau et on s'essouffle, surtout couché.",
 h:"Incapacité du ventricule gauche à assurer un débit adapté aux besoins de l'organisme, avec élévation des pressions de remplissage et retentissement en amont sur la circulation pulmonaire.",
 s:["Dyspnée d'effort (classification NYHA), orthopnée, dyspnée paroxystique nocturne","Toux d'effort ou de décubitus","Œdème aigu du poumon : polypnée, grésillement laryngé, expectoration mousseuse rosée, râles crépitants en marée montante","Tachycardie, bruit de galop gauche (B3)","Choc de pointe dévié en bas et à gauche, souffle d'insuffisance mitrale fonctionnelle","Râles crépitants des bases"],
 c:["Hypertension artérielle","Cardiopathie ischémique","Valvulopathies : insuffisance mitrale, insuffisance et rétrécissement aortiques","Cardiomyopathies"],
 k:"Le signe maître est la dyspnée. Le galop signe la défaillance ventriculaire."},
{id:'icd', sys:'cardio', n:"Insuffisance cardiaque droite",
 e:"Le côté droit du cœur envoie le sang vers les poumons. Quand il est fatigué, le sang s'accumule derrière lui, dans tout le corps : le foie gonfle et fait mal, les veines du cou sont gonflées, les pieds enflent.",
 h:"Incapacité du ventricule droit à assurer un débit adapté, avec retentissement en amont sur la circulation veineuse systémique (stase veineuse périphérique).",
 s:["Hépatalgie d'effort puis permanente","Hépatomégalie douloureuse, à bord inférieur mousse","Turgescence spontanée des jugulaires, reflux hépato-jugulaire","Œdèmes des membres inférieurs, blancs, mous, indolores, déclives, prenant le godet","Ascite, oligurie, prise de poids","Signe de Harzer, galop droit, souffle d'insuffisance tricuspide augmenté à l'inspiration (signe de Carvallo)"],
 c:["Insuffisance cardiaque gauche évoluée (première cause)","Cœur pulmonaire chronique (BPCO)","Embolie pulmonaire","Rétrécissement mitral","Péricardite constrictive, cardiopathies congénitales"],
 k:"Foie douloureux + jugulaires turgescentes + reflux hépato-jugulaire = foie cardiaque."},
{id:'coronarien', sys:'cardio', n:"Syndrome coronarien aigu",
 e:"Le cœur est un muscle nourri par de petits tuyaux, les coronaires. Si un tuyau se bouche, le morceau de cœur derrière n'a plus d'oxygène et il crie : une douleur très forte qui serre la poitrine comme un étau.",
 h:"Ensemble des manifestations cliniques, électriques et biologiques liées à une ischémie myocardique aiguë, le plus souvent par rupture d'une plaque d'athérome compliquée d'un thrombus coronaire.",
 s:["Douleur thoracique rétrosternale, constrictive, en barre ou en étau","Irradiations : mâchoire, épaule et bras gauches, poignets","Infarctus : douleur prolongée de plus de 20 minutes, résistante à la trinitrine","Sueurs, nausées, vomissements, angoisse","ECG : sus-décalage du segment ST (avec image en miroir) ou sous-décalage, ondes T négatives ; troponine élevée"],
 c:["Athérosclérose coronaire (facteurs de risque : tabac, HTA, diabète, dyslipidémie, âge, hérédité)","Spasme coronaire","Embolie coronaire (rare)"],
 k:"Toute douleur thoracique = ECG dans les 10 minutes. Attention aux formes trompeuses : douleur épigastrique, sujet diabétique ou âgé."},
{id:'pericardique', sys:'cardio', n:"Syndrome péricardique",
 e:"Le cœur est dans un petit sac. Quand ce sac est enflammé ou rempli de liquide, ça frotte et ça fait mal, surtout quand on respire fort ou qu'on est couché. Si le sac est trop plein, il serre le cœur qui ne peut plus se remplir.",
 h:"Ensemble des signes traduisant une inflammation du péricarde, avec ou sans épanchement. La tamponnade est la compression aiguë des cavités cardiaques par l'épanchement.",
 s:["Douleur thoracique augmentée par l'inspiration profonde et le décubitus, soulagée par la position assise penchée en avant","Frottement péricardique : bruit de cuir neuf, superficiel, qui persiste en apnée","Fièvre, dyspnée","ECG : sus-décalage diffus du segment ST, concave en haut, sans image en miroir ; sous-décalage du PQ ; microvoltage","Tamponnade : hypotension, turgescence jugulaire, bruits du cœur assourdis, pouls paradoxal"],
 c:["Péricardite virale ou idiopathique","Tuberculose (fréquente en Afrique)","Péricardite purulente","Cancer, insuffisance rénale chronique (urémique)","Infarctus du myocarde, maladies de système"],
 k:"Le frottement persiste en apnée (le frottement pleural disparaît). Tamponnade = drainage en urgence."},
{id:'choc', sys:'cardio', n:"État de choc (collapsus cardio-vasculaire)",
 e:"Le sang n'arrive plus avec assez de force jusqu'aux organes, comme un robinet qui ne coule presque plus. Les organes manquent d'oxygène : la peau devient froide et marbrée, le cœur bat très vite, on n'urine plus.",
 h:"Insuffisance circulatoire aiguë entraînant une hypoperfusion tissulaire et une inadéquation entre les apports et les besoins en oxygène des organes.",
 s:["Hypotension artérielle (PAS inférieure à 90 mmHg), pincement de la différentielle","Tachycardie, pouls filant","Marbrures (genoux), extrémités froides et cyanosées, temps de recoloration cutanée allongé","Oligurie","Polypnée, troubles de la conscience","Hyperlactatémie"],
 c:["Hypovolémique : hémorragie, déshydratation","Cardiogénique : infarctus, troubles du rythme","Septique (la peau peut être chaude au début)","Anaphylactique","Obstructif : embolie pulmonaire, tamponnade, pneumothorax compressif"],
 k:"Urgence vitale. Les marbrures et l'oligurie sont des signes d'hypoperfusion plus précoces que la chute de la tension."},
{id:'ischemieaigue', sys:'cardio', n:"Ischémie aiguë de membre",
 e:"L'artère qui nourrit une jambe se bouche d'un coup. La jambe n'a plus de sang : elle fait très mal, devient blanche et froide, et on ne sent plus le pouls.",
 h:"Interruption brutale du flux artériel d'un membre, par embolie ou thrombose, mettant en jeu le pronostic du membre et parfois le pronostic vital.",
 s:["Douleur brutale et intense","Pâleur, froideur du membre","Abolition des pouls en aval de l'obstacle","Veines plates","Signes de gravité : anesthésie, paralysie"],
 c:["Embolie d'origine cardiaque (fibrillation atriale)","Thrombose sur artère athéromateuse","Traumatisme artériel"],
 k:"Urgence : revascularisation dans les 6 heures. Le déficit sensitivo-moteur signe la gravité."},
{id:'tvp', sys:'cardio', n:"Thrombose veineuse profonde (phlébite)",
 e:"Un caillot bouche une grosse veine de la jambe. Le sang ne remonte plus bien : le mollet gonfle, devient chaud et douloureux. Le danger, c'est que le caillot parte dans les poumons.",
 h:"Obstruction d'une veine profonde par un thrombus fibrino-cruorique, favorisée par la triade de Virchow : stase veineuse, lésion endothéliale, hypercoagulabilité.",
 s:["Douleur spontanée ou provoquée du mollet","Œdème unilatéral, dur, ne prenant pas le godet","Chaleur locale, dilatation des veines superficielles","Diminution du ballottement du mollet, signe de Homans","Fébricule, tachycardie progressive"],
 c:["Immobilisation, alitement, chirurgie (orthopédique surtout)","Grossesse, post-partum, œstroprogestatifs","Cancer","Thrombophilie"],
 k:"Les signes cliniques sont peu fiables : écho-Doppler veineux. Complication redoutée : l'embolie pulmonaire."},
{id:'aomi', sys:'cardio', n:"Insuffisance artérielle chronique des membres inférieurs",
 e:"Les artères des jambes sont rétrécies par des dépôts de graisse. Au repos ça va, mais quand on marche, les muscles demandent plus de sang et n'en reçoivent pas assez : une crampe oblige à s'arrêter.",
 h:"Rétrécissement progressif du calibre des artères des membres inférieurs, le plus souvent par athérosclérose, responsable d'une ischémie d'effort puis de repos (classification de Leriche et Fontaine).",
 s:["Stade I : abolition d'un pouls, sans symptôme","Stade II : claudication intermittente (crampe du mollet à la marche, cédant à l'arrêt)","Stade III : douleurs de décubitus, soulagées jambes pendantes","Stade IV : troubles trophiques (ulcère, gangrène)","Pouls diminués ou abolis, souffle sur les trajets artériels, peau froide et dépilée"],
 c:["Athérosclérose : tabac, diabète, HTA, dyslipidémie","Artérites inflammatoires (maladie de Buerger chez le jeune fumeur)"],
 k:"L'artériopathie est un marqueur du risque coronaire et cérébral : il faut chercher les autres localisations."},
/* ===== Pleuro-pulmonaire ===== */
{id:'condensation', sys:'pneumo', n:"Syndrome de condensation pulmonaire",
 e:"Normalement le poumon est une éponge pleine d'air. Ici, un morceau de l'éponge est rempli de liquide ou de pus : il devient plein comme un morceau de foie. Il sonne mat et il transmet mieux la voix.",
 h:"Ensemble des signes traduisant le comblement des alvéoles d'un territoire pulmonaire par un produit pathologique, avec bronches perméables.",
 s:["Inspection : diminution de l'ampliation thoracique du côté atteint","Palpation : vibrations vocales augmentées","Percussion : matité","Auscultation : diminution du murmure vésiculaire, râles crépitants, souffle tubaire"],
 c:["Pneumonie franche lobaire aiguë (pneumocoque)","Tuberculose pulmonaire","Infarctus pulmonaire","Atélectasie (condensation rétractile, vibrations vocales alors diminuées)"],
 k:"Vibrations vocales AUGMENTÉES + matité = condensation. C'est le seul syndrome où elles augmentent."},
{id:'pleuresie', sys:'pneumo', n:"Syndrome d'épanchement pleural liquidien",
 e:"Entre le poumon et la paroi, il y a un petit espace normalement presque vide. Quand il se remplit de liquide, le poumon est repoussé : on n'entend plus rien à cet endroit et ça sonne plein comme une cuisse.",
 h:"Ensemble des signes traduisant la présence de liquide dans la cavité pleurale. Le trépied pleurétique associe l'abolition des vibrations vocales, une matité franche et l'abolition du murmure vésiculaire.",
 s:["Signes fonctionnels : douleur basithoracique augmentée par l'inspiration, toux sèche aux changements de position, dyspnée","Vibrations vocales abolies","Matité franche, hydrique, déclive","Murmure vésiculaire aboli","Souffle pleurétique et frottement pleural à la limite supérieure de l'épanchement"],
 c:["Transsudat : insuffisance cardiaque, cirrhose, syndrome néphrotique","Exsudat : tuberculose, cancer, pneumonie (pleurésie parapneumonique), embolie pulmonaire"],
 k:"Trépied : vibrations abolies, matité, silence. Toute pleurésie doit être ponctionnée (sauf insuffisance cardiaque typique)."},
{id:'pneumothorax', sys:'pneumo', n:"Syndrome d'épanchement pleural gazeux (pneumothorax)",
 e:"De l'air est entré entre le poumon et la paroi. Le poumon se dégonfle comme un ballon percé. Ça fait mal d'un coup, on respire mal, et la poitrine sonne creux comme un tambour.",
 h:"Présence d'air dans la cavité pleurale, avec collapsus pulmonaire plus ou moins complet. Le trépied de Gaillard associe l'abolition des vibrations vocales, un tympanisme et l'abolition du murmure vésiculaire.",
 s:["Douleur thoracique brutale, en coup de poignard, augmentée par l'inspiration","Dyspnée, toux sèche","Vibrations vocales abolies","Tympanisme à la percussion","Murmure vésiculaire aboli"],
 c:["Spontané primitif : sujet jeune, longiligne, fumeur","Secondaire : BPCO, emphysème, tuberculose","Traumatique ou iatrogène"],
 k:"Tympanisme = air ; matité = liquide. Pneumothorax compressif (détresse, turgescence jugulaire) = exsufflation en urgence."},
{id:'cavesup', sys:'pneumo', n:"Syndrome cave supérieur",
 e:"La grosse veine qui ramène le sang de la tête et des bras vers le cœur est écrasée. Le sang reste coincé en haut : le visage et le cou gonflent et deviennent bleutés, des veines apparaissent sur la poitrine.",
 h:"Ensemble des signes liés à l'obstruction ou à la compression de la veine cave supérieure, entraînant une stase veineuse dans le territoire céphalique et brachial.",
 s:["Œdème du visage, du cou et de la partie haute du thorax (œdème en pèlerine), comblement des creux sus-claviculaires","Cyanose du visage, augmentée par la position penchée en avant","Turgescence jugulaire","Circulation veineuse collatérale thoracique","Céphalées, somnolence, bourdonnements d'oreilles"],
 c:["Cancer bronchique","Lymphomes","Thrombose sur cathéter central","Goitre plongeant, tumeurs médiastinales"],
 k:"Chez un fumeur, il fait d'abord chercher un cancer bronchique."},
/* ===== Hématologie ===== */
{id:'anemique', sys:'hemato', n:"Syndrome anémique",
 e:"Les globules rouges sont les camions qui transportent l'oxygène. S'il n'y en a pas assez, tout le corps manque d'oxygène : on est pâle, fatigué, essoufflé, et le cœur bat vite pour compenser.",
 h:"Ensemble des signes liés à la diminution du taux d'hémoglobine circulante (moins de 13 g/dL chez l'homme, 12 chez la femme, 11 chez la femme enceinte), responsable d'une hypoxie tissulaire.",
 s:["Pâleur cutanéo-muqueuse (conjonctives, paumes, ongles)","Asthénie, dyspnée d'effort","Tachycardie, palpitations, souffle systolique fonctionnel","Céphalées, vertiges, bourdonnements d'oreilles, mouches volantes","Signes de gravité : angor, dyspnée de repos, troubles de conscience"],
 c:["Microcytaire : carence en fer, inflammation, thalassémie","Normocytaire régénérative : hémorragie aiguë, hémolyse","Normocytaire arégénérative : insuffisance rénale chronique, atteinte médullaire","Macrocytaire : carence en vitamine B12 ou en folates, alcool"],
 k:"La tolérance dépend de la vitesse d'installation plus que du chiffre. Raisonner avec le VGM puis les réticulocytes."},
{id:'hemorragique', sys:'hemato', n:"Syndrome hémorragique",
 e:"Quand on se blesse, le corps fabrique un bouchon pour arrêter le sang. Si le bouchon se fait mal, on saigne pour un rien : des petits points rouges sur la peau, des bleus, le nez ou les gencives qui saignent.",
 h:"Ensemble des manifestations hémorragiques spontanées ou provoquées par un traumatisme minime, traduisant une anomalie de l'hémostase primaire, de la coagulation ou de la fibrinolyse.",
 s:["Purpura : pétéchies, ecchymoses, ne s'effaçant pas à la vitropression","Hémorragies muqueuses : épistaxis, gingivorragies, ménorragies","Hématomes profonds, hémarthroses","Hémorragies viscérales : digestives, urinaires, cérébro-méningées","Saignement prolongé aux points de ponction"],
 c:["Hémostase primaire (purpura, saignements muqueux) : thrombopénie, maladie de Willebrand, thrombopathies","Coagulation (hématomes, hémarthroses) : hémophilie, antivitamines K, insuffisance hépatocellulaire","Coagulation intravasculaire disséminée"],
 k:"Purpura et muqueuses = plaquettes. Hématomes et articulations = facteurs de la coagulation. Bulles hémorragiques buccales = gravité."},
{id:'tumoralhemato', sys:'hemato', n:"Syndrome tumoral hématologique",
 e:"Des cellules du sang se multiplient trop et s'entassent dans leurs maisons : les ganglions, la rate et le foie. Ces organes grossissent et on peut les sentir sous les doigts.",
 h:"Ensemble des signes traduisant l'infiltration des organes hématopoïétiques et lymphoïdes par une prolifération cellulaire, le plus souvent maligne.",
 s:["Adénopathies superficielles ou profondes (fermes, indolores, mobiles dans les hémopathies)","Splénomégalie","Hépatomégalie","Douleurs osseuses","Hypertrophie gingivale, infiltration cutanée, atteinte testiculaire ou méningée"],
 c:["Leucémies aiguës et chroniques","Lymphomes (hodgkinien et non hodgkiniens)","Syndromes myéloprolifératifs"],
 k:"Devant une adénopathie : préciser siège, taille, consistance, sensibilité, mobilité, et examiner toutes les aires ganglionnaires, la rate et le foie."},
{id:'insufmed', sys:'hemato', n:"Syndrome d'insuffisance médullaire",
 e:"La moelle des os est l'usine qui fabrique les cellules du sang. Quand l'usine s'arrête, il manque tout : des globules rouges (pâleur), des globules blancs (infections) et des plaquettes (saignements).",
 h:"Ensemble des signes liés à un défaut de production des trois lignées sanguines par la moelle osseuse. Il associe un syndrome anémique, un syndrome infectieux et un syndrome hémorragique.",
 s:["Syndrome anémique : pâleur, asthénie, dyspnée","Syndrome infectieux (neutropénie) : fièvre, angine ulcéro-nécrotique, infections à répétition","Syndrome hémorragique (thrombopénie) : purpura, épistaxis, gingivorragies","Hémogramme : pancytopénie, anémie arégénérative"],
 c:["Leucémies aiguës, envahissement médullaire","Aplasie médullaire","Chimiothérapie, radiothérapie, toxiques","Carence en vitamine B12 ou en folates","Myélodysplasies"],
 k:"Fièvre chez un neutropénique = urgence. Le myélogramme est l'examen clé."},
{id:'hemolytique', sys:'hemato', n:"Syndrome hémolytique",
 e:"Les globules rouges éclatent trop tôt. On en manque, donc on est pâle. En éclatant, ils libèrent un pigment jaune qui colore la peau et les yeux. Et la rate, qui les détruit, grossit.",
 h:"Ensemble des signes traduisant un raccourcissement de la durée de vie des hématies. L'hémolyse chronique réalise la triade : pâleur, ictère, splénomégalie.",
 s:["Pâleur, ictère ou subictère conjonctival","Splénomégalie","Urines foncées ; urines rouge porto si hémolyse intravasculaire (hémoglobinurie)","Hémolyse aiguë : fièvre, frissons, douleurs lombaires, état de choc","Biologie : anémie régénérative, bilirubine libre élevée, LDH élevées, haptoglobine effondrée"],
 c:["Corpusculaires : drépanocytose, thalassémies, déficit en G6PD, sphérocytose héréditaire","Extra-corpusculaires : paludisme, anémie hémolytique auto-immune, accident transfusionnel, toxiques"],
 k:"Selles de couleur normale, urines foncées, bilirubine libre : c'est ce qui l'oppose à la cholestase."},
/* ===== Général ===== */
{id:'inflammatoire', sys:'gen', n:"Syndrome inflammatoire",
 e:"Quand le corps est attaqué, il sonne l'alarme et envoie ses soldats. Cette bagarre donne de la fièvre et de la fatigue, et laisse des traces qu'on retrouve dans la prise de sang.",
 h:"Ensemble des modifications cliniques et biologiques, non spécifiques, accompagnant la réaction de l'organisme à une agression infectieuse, immunologique, tumorale ou traumatique.",
 s:["Clinique : fièvre, asthénie, anorexie, amaigrissement","Vitesse de sédimentation accélérée","Élévation de la CRP (cinétique rapide) et du fibrinogène","Électrophorèse : augmentation des alpha-2 globulines","Anémie inflammatoire, hyperleucocytose, thrombocytose"],
 c:["Infections bactériennes, tuberculose","Maladies auto-immunes et inflammatoires","Cancers et hémopathies","Nécrose tissulaire (infarctus), traumatismes"],
 k:"C'est un signal d'alarme, pas un diagnostic : il faut chercher la cause. La CRP monte et descend vite, la VS lentement."},
{id:'dec', sys:'gen', n:"Déshydratation extracellulaire",
 e:"Le corps a perdu de l'eau et du sel en même temps, comme après une grosse diarrhée. Il n'y a plus assez de liquide dans les tuyaux : la peau garde le pli quand on la pince, la tension baisse, le cœur accélère.",
 h:"Diminution du volume du secteur extracellulaire (plasmatique et interstitiel) par perte iso-osmotique d'eau et de sodium. La natrémie est normale.",
 s:["Perte de poids","Pli cutané persistant","Hypotension artérielle, d'abord orthostatique ; tachycardie","Veines superficielles aplaties","Yeux cernés, hypotonie des globes oculaires ; fontanelle déprimée chez le nourrisson","Oligurie, soif modérée ; hémoconcentration (hématocrite et protides élevés)"],
 c:["Pertes digestives : diarrhées, vomissements, fistules","Pertes rénales : diurétiques, polyurie osmotique (diabète), insuffisance surrénale","Pertes cutanées : brûlures étendues, sudation importante","Troisième secteur : occlusion, péritonite, pancréatite"],
 k:"Le pli cutané et l'hypotension signent le secteur extracellulaire. Natrémie normale."},
{id:'dic', sys:'gen', n:"Déshydratation intracellulaire",
 e:"Le sang est devenu trop salé. Pour le diluer, l'eau sort des cellules, qui se ratatinent comme des raisins secs. Les cellules du cerveau souffrent : on a une soif terrible et on devient confus.",
 h:"Diminution du volume intracellulaire secondaire à une hyperosmolalité plasmatique, le plus souvent par hypernatrémie (natrémie supérieure à 145 mmol/L), par déficit en eau libre.",
 s:["Soif intense","Sécheresse des muqueuses (face interne des joues, langue rôtie)","Perte de poids","Fièvre","Troubles neurologiques : somnolence, confusion, irritabilité, convulsions, coma"],
 c:["Défaut d'apport d'eau : nourrisson, sujet âgé, coma","Pertes d'eau : diabète insipide, pertes cutanées et respiratoires (fièvre, coup de chaleur)","Diurèse osmotique : coma hyperosmolaire du diabétique"],
 k:"Soif + muqueuses sèches + signes neurologiques + hypernatrémie. La correction doit être lente (risque d'œdème cérébral)."},
{id:'oedemateux', sys:'gen', n:"Syndrome œdémateux (hyperhydratation extracellulaire)",
 e:"Il y a trop d'eau et de sel dans le corps. L'eau sort des tuyaux et s'installe sous la peau, là où ça descend : les pieds le soir, le dos chez la personne couchée. Si on appuie avec le doigt, il reste un petit creux.",
 h:"Augmentation du volume du secteur interstitiel par rétention d'eau et de sodium, se traduisant par des œdèmes généralisés, parfois associés à des épanchements des séreuses (anasarque).",
 s:["Œdèmes blancs, mous, indolores, prenant le godet","Bilatéraux, symétriques, déclives (chevilles debout, lombes couché), paupières le matin","Prise de poids","Épanchements : ascite, pleurésie, hydrocèle (anasarque)"],
 c:["Insuffisance cardiaque","Cirrhose","Syndrome néphrotique, insuffisance rénale","Dénutrition protéique (kwashiorkor)"],
 k:"Trois organes à chercher : cœur, foie, rein. La bandelette urinaire est le premier examen."},
/* ===== Digestif ===== */
{id:'htp', sys:'dig', n:"Syndrome d'hypertension portale",
 e:"La veine porte est le gros tuyau qui amène le sang de l'intestin au foie. Si le foie est dur ou le tuyau bouché, le sang fait un embouteillage : la rate grossit, de l'eau s'accumule dans le ventre, et le sang passe par de petites veines fragiles qui peuvent éclater.",
 h:"Élévation de la pression dans le système porte (supérieure à 15 mmHg ou gradient porto-cave supérieur à 5 mmHg), par obstacle sous-hépatique, intra-hépatique ou sus-hépatique.",
 s:["Splénomégalie","Circulation veineuse collatérale abdominale (au maximum, tête de méduse)","Ascite","Varices œsophagiennes et gastriques : hématémèse, méléna","Hémorroïdes ; hypersplénisme (cytopénies)"],
 c:["Bloc intra-hépatique : cirrhose, bilharziose hépatique (fréquente en Afrique)","Bloc sous-hépatique : thrombose de la veine porte","Bloc sus-hépatique : syndrome de Budd-Chiari, insuffisance cardiaque droite, péricardite constrictive"],
 k:"Complication la plus grave : la rupture de varices œsophagiennes."},
{id:'ihc', sys:'dig', n:"Syndrome d'insuffisance hépatocellulaire",
 e:"Le foie est une usine qui fabrique des protéines et nettoie le sang. Quand l'usine tourne au ralenti, la peau jaunit, on saigne facilement, de petites étoiles rouges apparaissent sur la peau, et le cerveau s'embrouille parce que le sang est mal nettoyé.",
 h:"Ensemble des manifestations cliniques et biologiques liées à la diminution des fonctions de synthèse, d'épuration et de sécrétion biliaire de l'hépatocyte.",
 s:["Asthénie, ictère","Angiomes stellaires, érythrose palmaire, ongles blancs, hippocratisme digital","Gynécomastie, atrophie testiculaire, aménorrhée","Fœtor hepaticus","Encéphalopathie hépatique : astérixis (flapping tremor), inversion du sommeil, confusion, coma","Syndrome hémorragique ; biologie : baisse du TP et du facteur V, hypoalbuminémie"],
 c:["Cirrhose (alcool, hépatites virales B et C)","Hépatites aiguës graves : virales, médicamenteuses (paracétamol), toxiques"],
 k:"Le facteur V bas distingue l'insuffisance hépatique de la carence en vitamine K (facteur V normal)."},
{id:'cholestase', sys:'dig', n:"Syndrome de cholestase",
 e:"La bile est un liquide jaune-vert que le foie envoie dans l'intestin. Si elle ne coule plus, elle reste dans le sang : la peau devient jaune et gratte, les urines sont foncées comme du thé, et les selles deviennent claires comme du mastic.",
 h:"Ensemble des manifestations liées à la diminution ou à l'arrêt de la sécrétion biliaire, par obstacle sur les voies biliaires (extra-hépatique) ou par atteinte hépatocytaire ou canaliculaire (intra-hépatique).",
 s:["Ictère cutanéo-muqueux","Urines foncées, mousseuses","Selles décolorées, mastic","Prurit, lésions de grattage","Biologie : bilirubine conjuguée, phosphatases alcalines et gamma-GT élevées"],
 c:["Extra-hépatique : lithiase de la voie biliaire principale, cancer de la tête du pancréas, cholangiocarcinome, ampullome","Intra-hépatique : hépatites, médicaments, cholangite biliaire primitive"],
 k:"Loi de Courvoisier et Terrier : ictère + grosse vésicule palpable = obstacle néoplasique (tête du pancréas). Fièvre + douleur + ictère = angiocholite."},
{id:'cytolyse', sys:'dig', n:"Syndrome de cytolyse hépatique",
 e:"Des cellules du foie sont abîmées et éclatent. Ce qu'elles contenaient part dans le sang, et on le retrouve dans la prise de sang : ce sont les transaminases.",
 h:"Syndrome biologique traduisant une atteinte de la membrane hépatocytaire, défini par l'élévation des transaminases sériques (ALAT et ASAT).",
 s:["Clinique souvent pauvre : asthénie, nausées, parfois ictère","ALAT et ASAT élevées","Cytolyse majeure (plus de 10 fois la normale) dans les hépatites aiguës"],
 c:["Hépatites virales (A, B, C, E)","Médicaments et toxiques (paracétamol, plantes)","Alcool (ASAT supérieures aux ALAT)","Ischémie hépatique (foie de choc), migration lithiasique"],
 k:"ALAT > ASAT : virus ou médicament. ASAT > ALAT : alcool."},
{id:'ascite', sys:'dig', n:"Syndrome ascitique",
 e:"De l'eau s'est accumulée dans le ventre, autour des intestins. Le ventre gonfle comme un ballon rempli d'eau, et l'eau se déplace quand la personne change de position.",

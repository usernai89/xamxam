<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="XamXam : révisions de médecine L3 par répétition espacée, fiches syndromes, hors ligne.">
<meta name="theme-color" content="#5B3FA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XamXam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>window.XAMXAM_PWA=true;</script>
<title>XamXam Révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: mobile app shell. One column of panels per tab, a fixed tab bar at the bottom,
   the review session and detail sheets are full-screen layers above it.
   Palette: histology stains (hematoxylin violet + eosin pink) by default; the user can switch themes. */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --surface2:#EEEAF5; --fg:#1D1928; --muted:#655F76; --line:#E1DCEA;
  --accent:#5B3FA8; --accent-ink:#FFFFFF; --accent-soft:#E7E1F5; --accent2:#C93C6E; --accent2-soft:#F8E1EA;
  --bad:#B83A33; --hard:#A16207; --good:#15803D; --easy:#1D63B8;
  --bad-soft:#F6E2E0; --hard-soft:#F3EAD8; --good-soft:#DFF0E5; --easy-soft:#DFE9F6;
  --a28:#D1C9E7; --a55:#A595CF; --a78:#7F69BB;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --fs:17px; --r:18px; --r-sm:12px; --sp:1.4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14111B; --surface:#1E1928; --surface2:#282236; --fg:#EEEAF6; --muted:#A39CB7; --line:#342D44;
    --accent:#A993F2; --accent-ink:#14111B; --accent-soft:#2E2745; --accent2:#F27BA3; --accent2-soft:#3A2230;
    --bad:#F87171; --hard:#FBBF24; --good:#4ADE80; --easy:#60A5FA;
    --bad-soft:#3A2024; --hard-soft:#372D17; --good-soft:#1B3325; --easy-soft:#1B2A40;
    --a28:#453B61; --a55:#6A5C97; --a78:#8A78C6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14111B; --surface:#1E1928; --surface2:#282236; --fg:#EEEAF6; --muted:#A39CB7; --line:#342D44;
  --accent:#A993F2; --accent-ink:#14111B; --accent-soft:#2E2745; --accent2:#F27BA3; --accent2-soft:#3A2230;
  --bad:#F87171; --hard:#FBBF24; --good:#4ADE80; --easy:#60A5FA;
  --bad-soft:#3A2024; --hard-soft:#372D17; --good-soft:#1B3325; --easy-soft:#1B2A40;
  --a28:#453B61; --a55:#6A5C97; --a78:#8A78C6;
  color-scheme:dark;
}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-0.01em}
h1{font-size:2.125rem;font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:0.8125rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.small{font-size:0.875rem}

#app{max-width:640px;margin:0 auto;padding-block:calc(22px*var(--sp)) calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:calc(22px*var(--sp))}
.stack{display:flex;flex-direction:column;gap:calc(14px*var(--sp))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(18px*var(--sp)) calc(18px*var(--sp))}
.panel>h3{margin-bottom:calc(12px*var(--sp))}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:calc(12px*var(--sp))}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn-lg{min-height:62px;font-size:1.125rem;width:100%}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg,.icon{width:20px;height:20px;flex:none}
.icon-btn{width:48px;height:48px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.danger{color:var(--bad)}

/* Inputs */
.field{display:flex;flex-direction:column;gap:10px;font-weight:700;font-size:1rem}
.field input,.field select,.field textarea{font-weight:400;font-size:1rem}
.field-hint{font-weight:400;font-size:0.8125rem;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:54px;padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:140px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

/* Segmented + chips */
.seg{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:4px;gap:4px}
.seg button{flex:1 1 0;min-width:0;min-height:48px;border:0;border-radius:calc(var(--r-sm) - 2px);background:transparent;font-weight:700;font-size:0.9375rem;color:var(--muted);padding:0 6px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:0.9375rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:0.8125rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ex{background:var(--accent2-soft);color:var(--accent2)}

/* Status pills (chapter progress) */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:0.8125rem;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box}
.pill.s1{color:var(--accent2);border-color:transparent;background:var(--accent2-soft)}
.pill.s2{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.pill.s2::before{background:currentColor}
.pill.s3{color:var(--good);border-color:transparent;background:var(--good-soft)}
.pill.s3::before{background:currentColor;border-radius:2px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:var(--r-sm);color:var(--muted);font-size:0.75rem;font-weight:700}
.tab svg{width:26px;height:26px}
.tab[aria-current=page]{color:var(--accent)}
.tab[aria-current=page] svg{stroke-width:2.4}
.tab .dot{position:absolute;top:2px;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent2);color:#fff;font-size:0.625rem;line-height:16px;font-family:var(--font-mono)}

/* Home */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.streak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700}
.streak svg{width:18px;height:18px;color:var(--accent2)}
.today{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:calc(22px*var(--sp)) calc(20px*var(--sp));display:flex;flex-direction:column;gap:calc(18px*var(--sp))}
.today .eyebrow{color:inherit;opacity:.8}
.today-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.today-nums .big{display:block;font-family:var(--font-display);font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:6px}
.today-nums .lbl{font-size:0.9375rem;opacity:.85}
.today .btn-primary{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.today .btn-ghost{color:inherit;opacity:.9}
.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(18px*var(--sp)) calc(16px*var(--sp));display:flex;flex-direction:column;gap:8px}
.count .num{font-family:var(--font-display);font-size:2.25rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.count .num small{font-size:0.9375rem;font-weight:700;color:var(--muted);margin-left:2px}
.edt-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:calc(14px*var(--sp)) 0;border-top:1px solid var(--line)}
.edt-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.edt-row:first-of-type{border-top:0}
.edt-time{font-family:var(--font-mono);font-size:0.875rem;color:var(--muted)}
.edt-room{font-size:0.8125rem;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:8px;padding:4px 10px}
.edt-row.now .edt-time{color:var(--accent);font-weight:700}
.mod-prog{display:flex;flex-direction:column;gap:10px;padding:calc(16px*var(--sp)) 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.mod-prog:first-of-type{border-top:0;padding-top:0}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);gap:2px}
.bar i{display:block;height:100%}
.bar .b3{background:var(--accent)}
.bar .b2{background:var(--a55)}
.bar .b1{background:var(--a28)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:0.8125rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;width:max-content;margin:0 auto}
.heat button{width:18px;height:18px;border-radius:5px;border:0;padding:0;background:var(--surface2)}
.heat .l1{background:var(--a28)}
.heat .l2{background:var(--a55)}
.heat .l3{background:var(--a78)}
.heat .l4{background:var(--accent)}
.heat .today-cell{outline:2px solid var(--accent2);outline-offset:1px}
.heat .future{visibility:hidden}

/* Programme */
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
details.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.mod>summary{list-style:none;padding:calc(18px*var(--sp)) 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary .chev{transition:transform .2s}
details.mod[open]>summary .chev{transform:rotate(90deg)}
.sub-h{padding:calc(16px*var(--sp)) 18px calc(10px*var(--sp));display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);background:var(--surface2)}
.sub-h h3{font-size:1.0625rem}
.chap{display:grid;grid-template-columns:2.4em 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:calc(14px*var(--sp)) 18px;border:0;border-top:1px solid var(--line);background:var(--surface)}
.chap-n{font-family:var(--font-mono);font-size:0.8125rem;color:var(--muted);width:2.4em;height:2.4em;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.chap-t{min-width:0;font-weight:700;font-size:1rem;line-height:1.35}
.chap-meta{display:block;font-weight:400;font-size:0.8125rem;color:var(--muted);margin-top:4px}
.add-chap{width:100%;border:0;border-top:1px dashed var(--line);background:transparent;color:var(--accent);font-weight:700;padding:calc(14px*var(--sp)) 18px;text-align:left;font-size:0.9375rem}

/* Lists of cards */
.clist{display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;text-align:left;width:100%;padding:calc(14px*var(--sp)) 0;border:0;border-top:1px solid var(--line);background:transparent}
.citem:first-child{border-top:0}
.citem .q{font-weight:700;font-size:1rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.citem .meta{font-size:0.8125rem;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}

/* Rich text */
.rt{line-height:1.55;overflow-wrap:anywhere}
.rt p+p,.rt p+ul,.rt ul+p,.rt p+ol,.rt ol+p{margin-top:.55em}
.rt h4{font-family:var(--font-display);font-size:1.0625rem;margin:1em 0 .35em;color:var(--accent)}
.rt h4:first-child{margin-top:0}
.rt ul,.rt ol{margin:.3em 0;padding-left:1.25em}
.rt li+li{margin-top:.2em}
.rt mark{background:var(--accent2-soft);color:inherit;border-radius:3px;padding:0 2px}
.rt strong{font-weight:700}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;font-weight:700}
mark.filled{background:var(--accent-soft)!important;color:var(--accent)!important;font-weight:700;padding:0 4px!important}

/* Overlays */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.layer-in{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:calc(22px*var(--sp));padding-block:0 calc(40px + env(safe-area-inset-bottom,0px))}
.layer-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;z-index:2}
.layer-top h2{flex:1;min-width:0;font-size:1.1875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{z-index:50}
#sheet2{z-index:55}

/* Session */
#session .layer-in{gap:18px;padding-bottom:0}
.sess-bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.sess-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sess-counts{display:flex;gap:10px;font-family:var(--font-mono);font-size:0.875rem;font-weight:700}
.c-new{color:var(--easy)} .c-lrn{color:var(--bad)} .c-rev{color:var(--good)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(24px*var(--sp)) calc(20px*var(--sp));display:flex;flex-direction:column;gap:20px;min-height:50vh;box-shadow:0 10px 30px -18px rgba(20,10,40,.35)}
.flash .front{font-size:1.375rem;font-weight:700;line-height:1.4}
.flash .divider{height:1px;background:var(--line);margin:4px 0}
.flash img{border-radius:var(--r-sm);max-height:38vh;object-fit:contain;align-self:center;background:var(--surface2)}
.hintbox{background:var(--accent2-soft);border-radius:var(--r-sm);padding:16px 18px}
.hintbox .eyebrow{color:var(--accent2);margin-bottom:4px}
.qcm{display:flex;flex-direction:column;gap:12px}
.qcm button{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);min-height:58px;font-weight:400}
.qcm button .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:0.8125rem;font-family:var(--font-mono)}
.qcm button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.qcm button.ok{border-color:var(--good);background:var(--good-soft)}
.qcm button.ok .k{background:var(--good);color:var(--surface)}
.qcm button.ko{border-color:var(--bad);background:var(--bad-soft)}
.qcm button.ko .k{background:var(--bad);color:var(--surface)}
.qcm button.miss{border-style:dashed;border-color:var(--good)}
.sess-actions{position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grades.two{grid-template-columns:1fr 1fr}
.grade{border:0;border-radius:var(--r-sm);min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:0.9375rem}
.grade small{font-family:var(--font-mono);font-size:0.75rem;font-weight:400;opacity:.85}
.g1{background:var(--bad-soft);color:var(--bad)} .g2{background:var(--hard-soft);color:var(--hard)}
.g3{background:var(--good-soft);color:var(--good)} .g4{background:var(--easy-soft);color:var(--easy)}
.tools{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.anim-flip{animation:flip .34s ease}
.anim-fade{animation:fade .3s ease}
@keyframes flip{0%{transform:perspective(900px) rotateY(0)}50%{transform:perspective(900px) rotateY(90deg)}100%{transform:perspective(900px) rotateY(0)}}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.anim-flip,.anim-fade{animation:none}}
.done{display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center;padding-top:6vh}

/* Create */
.gen-card{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.gen-card[data-off=true]{opacity:.5}
.gen-card textarea{min-height:60px;font-size:0.9375rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.notice{background:var(--surface2);border-radius:var(--r-sm);padding:16px 18px;font-size:0.9375rem}
.notice.warn{background:var(--hard-soft)}
.stream{white-space:pre-wrap;font-family:var(--font-mono);font-size:0.75rem;color:var(--muted);max-height:120px;overflow:auto}

/* Settings */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.swatch{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:700;font-size:0.8125rem;min-width:0}
.swatch[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatch .dots{display:flex;flex:none}
.swatch .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);display:block}
.swatch .dots i+i{margin-left:-6px}
.colors{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.colors button{width:42px;height:42px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.colors button[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:2px}
.layout-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:calc(12px*var(--sp)) 0;border-top:1px solid var(--line)}
.layout-row:first-child{border-top:0}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.toggle:checked{background:var(--accent);border-color:var(--accent)}
.toggle:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.toggle:disabled{opacity:.5}
.mini-btn{width:42px;height:42px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.mini-btn svg{width:16px;height:16px}
.preview-card{border:1px dashed var(--line);border-radius:var(--r);padding:12px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:12px 16px;font-size:1rem}
.kv b{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.fbars{display:grid;grid-template-columns:auto 1fr auto;gap:12px 14px;align-items:center;font-size:0.875rem}
.fbars .track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.fbars .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.sync{display:flex;align-items:center;gap:8px;font-size:0.875rem}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--hard)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:0.875rem;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{text-align:center;padding:24px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:44px;height:44px;color:var(--accent)}
.week-day{padding:calc(14px*var(--sp)) 0;border-top:1px solid var(--line)}
.week-day:first-child{border-top:0}

/* v3 : révisions renforcées + fiches syndromes */
.today-line{font-size:1rem;opacity:.92}
.today .btn-line{background:transparent;border:1.5px solid currentColor;color:inherit;min-height:54px;width:100%}
.today .today-weak{justify-content:flex-start;text-align:left;padding:0;min-height:44px;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.c-time{color:var(--muted)}
.syn-tools{display:flex;flex-direction:column;gap:calc(12px*var(--sp))}
details.syn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.syn>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px*var(--sp)) 18px;cursor:pointer;font-weight:700;font-family:var(--font-display);font-size:1.0625rem;line-height:1.3}
details.syn>summary::-webkit-details-marker{display:none}
details.syn>summary .chev{flex:none;transition:transform .2s}
details.syn[open]>summary .chev{transform:rotate(90deg)}
.syn-body{padding:0 18px calc(18px*var(--sp));display:flex;flex-direction:column;gap:calc(14px*var(--sp))}
.syn-box{border-radius:var(--r-sm);padding:14px 16px;line-height:1.55}
.syn-box.simple{background:var(--accent2-soft)}
.syn-box.hosp{background:var(--accent-soft)}
.syn-box .eyebrow{margin-bottom:6px}
.syn-body h4{font-size:0.9375rem;margin-bottom:6px}
.syn-body ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.syn-key{border-left:4px solid var(--accent2);padding:6px 0 6px 14px;line-height:1.5}
.syn-sys{font-family:var(--font-display);font-size:1.125rem;margin:calc(10px*var(--sp)) 2px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.tbl-wrap table{border-collapse:collapse;min-width:760px;width:100%;font-size:0.9375rem;line-height:1.45}
.tbl-wrap th,.tbl-wrap td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl-wrap th{position:sticky;top:0;background:var(--surface2);font-size:0.8125rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl-wrap td:first-child{font-weight:700;min-width:150px}
.tbl-wrap tr.sysrow td{background:var(--accent-soft);font-family:var(--font-display);font-weight:800}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr}
</style>

// ---------- Helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const MIN = 6e4, HOUR = 36e5, DAY = 864e5, CUT = 4*HOUR; // la journée de révision commence à 4h
const now = () => Date.now();
const uid = p => (p||'c') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
function dayKey(t=now()){ const d=new Date(t-CUT); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayStart(t=now()){ const d=new Date(t-CUT); d.setHours(0,0,0,0); return d.getTime()+CUT; }
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function midnight(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function daysUntil(d){ return Math.round((midnight(d)-midnight(new Date()))/DAY); }
const fmtD = (d,o) => new Intl.DateTimeFormat('fr-FR',o).format(d);
const fmtLong = d => fmtD(d,{weekday:'long',day:'numeric',month:'long'});
const fmtShort = d => fmtD(d,{day:'numeric',month:'short'});
function plural(n,w,ws){ return n+' '+(n>1?(ws||w+'s'):w); }
function fmtIvl(ms){
  if(ms<HOUR){ const m=Math.max(1,Math.round(ms/MIN)); return m<2?'<1 min':m+' min'; }
  if(ms<DAY*0.9) return Math.round(ms/HOUR)+' h';
  const d=ms/DAY; if(d<30) return Math.round(d)+' j';
  if(d<365) return (Math.round(d/30*10)/10).toString().replace('.',',')+' mois';
  return (Math.round(d/365*10)/10).toString().replace('.',',')+' an';
}
function lum(hex){ const h=hex.replace('#',''); const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)); return .2126*r+.7152*g+.0722*b; }
function mix(a,b,t){ const pa=a.replace('#',''), pb=b.replace('#',''); const o=[0,2,4].map(i=>Math.round(parseInt(pa.substr(i,2),16)*t+parseInt(pb.substr(i,2),16)*(1-t))); return '#'+o.map(v=>pad(v.toString(16))).join(''); }
function inkFor(hex){ return lum(hex)>0.42?'#14111B':'#FFFFFF'; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch{ return false; } }
let toastTimer;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, ms); }
async function copyText(text, fallbackEl){

function armConfirm(btn, label, fn){

// Markdown léger : ## titres, - listes, 1. listes, **gras**, *italique*, ==surligné==
function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>'); }
function md(text){
  const lines=esc(text||'').split(/\r?\n/); let html='', list=null;
  const close=()=>{ if(list){ html+='</'+list+'>'; list=null; } };
  for(const raw of lines){ const l=raw.trim(); let m;
    if(!l){ close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); html+='<h4>'+inline(m[1])+'</h4>'; continue; }
    if((m=l.match(/^[-•*]\s+(.*)/))){ if(list!=='ul'){ close(); html+='<ul>'; list='ul'; } html+='<li>'+inline(m[1])+'</li>'; continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); html+='<ol>'; list='ol'; } html+='<li>'+inline(m[1])+'</li>'; continue; }
    close(); html+='<p>'+inline(l)+'</p>';
  }
  close(); return html;
}
const clozeFront = s => md(s).replace(/\{\{(.+?)\}\}/g,'<span class="blank">[ … ]</span>');
const clozeBack = s => md(s).replace(/\{\{(.+?)\}\}/g,'<mark class="filled">$1</mark>');
const plain = s => String(s||'').replace(/\{\{(.+?)\}\}/g,'[$1]').replace(/[*#=]/g,'').replace(/\s+/g,' ').trim();

const MODS={}, SUBS={}, CH={};
function buildIndex(){
  for(const k in CH) delete CH[k];
  for(const m of PROGRAMME){ MODS[m.id]=m; for(const s of m.subs){ s.mod=m.id; SUBS[s.id]=s;
    const list=s.ch.map((t,i)=>({id:s.id+'-'+(i+1), title:t, sub:s.id, mod:m.id, custom:false}));
    const extra=(S.custom||[]).filter(c=>c.sub===s.id && !c.del).sort((a,b)=>a.created-b.created).map(c=>({id:c.id, title:c.title, sub:s.id, mod:m.id, custom:true}));
    s.all=list.concat(extra); s.all.forEach((c,i)=>{ c.n=i+1; CH[c.id]=c; });
  }}
}

// ---------- Sauvegarde en ligne (capacité db) ----------
const W = { db:null, base:'', status:'local', q:new Map(), timers:{}, running:new Set(), active:0, readOnly:false };
const docKeys = ['prefs','progress','stats','trash'];
function refFor(key){
  if(key.startsWith('cards/')) return W.db.doc(W.base+'/main/'+key);
  if(key.startsWith('notes/')) return W.db.doc(W.base+'/main/'+key);
  return W.db.doc(W.base+'/'+key);
}
function docBody(key){
  if(key==='prefs') return {...S.prefs};
  if(key==='progress') return {map:S.progress, custom:S.custom, t:now()};
  if(key==='stats') return {days:S.stats.days};
  if(key==='trash') return {ids:S.trash};
  if(key.startsWith('cards/')){ const c=S.cards[key.slice(6)]; return c?{...c}:null; }
  if(key.startsWith('notes/')){ const id=key.slice(6); const n=S.notes[id]; return n?{...n, id}:null; }
  return null;
}
function cloudPut(key, delay=700){ if(!W.db||W.readOnly) return; W.q.set(key,'set'); queue(key, delay); }
function cloudDel(key){ if(!W.db||W.readOnly) return; W.q.set(key,'del'); queue(key, 300); }
function queue(key, delay){ clearTimeout(W.timers[key]); W.timers[key]=setTimeout(()=>flush(key), delay); }
async function flush(key){
  if(!W.db || W.running.has(key) || !W.q.has(key)) return;
  if(W.active>=4){ W.timers[key]=setTimeout(()=>flush(key), 250); return; }
  const op=W.q.get(key); W.q.delete(key); W.running.add(key); W.active++;
  try{
    const ref=refFor(key);
    if(op==='del') await ref.delete();
    else { const body=docBody(key); if(body && body.imgCloud && !body.img){ const {img, imgCloud, ...rest}=body; await ref.update(rest); } else if(body){ delete body.imgCloud; await ref.set(body); } }
    if(W.status!=='ok') setSync('ok');
  }catch(e){ cloudError(e, key, op); }
  finally{ W.running.delete(key); W.active--; if(W.q.has(key)) queue(key, 400); }
}
function flushAll(){ for(const k of Array.from(W.q.keys())){ clearTimeout(W.timers[k]); flush(k); } }
function cloudError(e, key, op){
  const code=e&&e.code;
  if(code==='unavailable' && !W.q.has(key)){ W.q.set(key,op); queue(key, 1500+Math.random()*1500); setSync('warn'); return; }
  if(code==='quota_exceeded'){ toast('Ta sauvegarde en ligne est pleine : supprime des cartes ou des images.'); setSync('warn'); return; }
  if(code==='invalid_argument' && key.startsWith('cards/')){ toast('Carte trop lourde pour la sauvegarde en ligne : utilise une image plus petite.'); return; }
  if(code==='invalid_argument'){ W.readOnly=true; setSync('local'); return; }
  if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){ W.db=null; setSync('local'); return; }
  setSync('warn');
}
function setSync(s){ W.status=s; const el=$('#syncLine'); if(el) el.outerHTML=syncHTML(); }
function syncHTML(){
  const map={ok:['ok','Synchronisé avec ton compte Claude. Tes cartes te suivent sur tous tes appareils.'],
    connecting:['warn','Connexion à ta sauvegarde en ligne…'], slow:['warn',"La sauvegarde en ligne ne répond pas encore. Tu travailles sur les données de ce téléphone ; elles seront envoyées dès que possible."],
    warn:['warn',"Sauvegarde en ligne momentanément indisponible. Tes changements sont gardés sur ce téléphone."],
    local:['', PWA ? "Tes cartes sont enregistrées sur ce téléphone, sans compte ni connexion. Exporte une sauvegarde chaque semaine pour ne rien perdre."+(S.prefs.lastExport?" Dernière sauvegarde : "+fmtShort(new Date(S.prefs.lastExport))+".":" Aucune sauvegarde pour l'instant.") : "Enregistré sur ce téléphone uniquement. Ouvre l'appli connecté à ton compte Claude pour la sauvegarde en ligne, et exporte régulièrement une copie."]};
  const [cls,txt]=map[W.status]||map.local; return '<p class="sync '+cls+'" id="syncLine"><i></i><span>'+txt+'</span></p>';
}
async function loadAll(coll){
  const out=[]; let last=-1;
  for(let i=0;i<80;i++){
    const snap=await coll.where('created','>',last).orderBy('created').limit(400).get();
    for(const d of snap.docs){ const v=d.data(); if(v) out.push({...clone(v), id:d.id}); }
    if(snap.size<400) break;
    last=snap.docs[snap.docs.length-1].data().created;
  }
  return out;
}
async function cloudInit(){
  const C=window.claude; if(!C||!C.use){ setSync('local'); return; }
  setSync('connecting');
  let db=null, user=null;
  try{ [db,user]=await Promise.all([C.use('db'), C.use('user')]); }catch{}
  if(!db||!user){ setSync('local'); return; }
  let id=null; try{ id=await user.id(); }catch{}
  if(!id){ setSync('local'); return; }
  W.db=db; W.base='data/users/'+id;
  const slow=setTimeout(()=>{ if(W.status==='connecting') setSync('slow'); }, 10000);
  try{
    const docs=await Promise.all(docKeys.map(k=>db.doc(W.base+'/'+k).get()));
    const main=db.doc(W.base+'/main');
    const [cards, notes]=await Promise.all([loadAll(main.collection('cards')), loadAll(main.collection('notes'))]);
    clearTimeout(slow);
    const inc={ prefs:docs[0].exists?clone(docs[0].data()):null, progress:docs[1].exists?clone(docs[1].data()):null,
      stats:docs[2].exists?clone(docs[2].data()):null, trash:docs[3].exists?clone(docs[3].data()).ids:{}, cards, notes };
    const r=mergeData(inc);
    // ce que le téléphone a de plus récent part en ligne
    r.toInc.cards.forEach(cid=>cloudPut('cards/'+cid, 200));
    r.toInc.cardsDel.forEach(cid=>cloudDel('cards/'+cid));
    r.toInc.notes.forEach(nid=>cloudPut('notes/'+nid, 200));
    r.toInc.docs.forEach(k=>cloudPut(k, 200));
    setSync('ok'); writeLocal(); onDataChanged(true);
  }catch(e){ clearTimeout(slow); cloudError(e,'load','set'); if(W.status!=='local') setSync('warn'); }
}

// Fusion "le plus récent gagne". Renvoie ce qui a changé dans chaque sens.
function mergeData(inc){
  const fromInc={cards:[],notes:[],docs:new Set()}, toInc={cards:[],cardsDel:[],notes:[],docs:new Set()};
  // corbeille
  const trash={...S.trash}; let trashChanged=false;
  for(const [k,v] of Object.entries(inc.trash||{})){ if(!trash[k]||v>trash[k]){ trash[k]=v; fromInc.docs.add('trash'); } }
  for(const k of Object.keys(S.trash)){ if(!(inc.trash||{})[k]) { trashChanged=true; } }
  if(trashChanged) toInc.docs.add('trash');
  S.trash=trash;
  // cartes
  const incCards={}; for(const c of inc.cards||[]) incCards[c.id]=c;
  const merged={...S.cards};
  for(const [id,c] of Object.entries(incCards)){
    const l=merged[id];
    if(!l || (c.updated||0)>(l.updated||0) || (l.imgCloud && (c.updated||0)>=(l.updated||0))){ merged[id]=c; fromInc.cards.push(id); }
    else if((l.updated||0)>(c.updated||0)) toInc.cards.push(id);
  }
  for(const id of Object.keys(S.cards)) if(!incCards[id] && !S.cards[id].imgCloud) toInc.cards.push(id);
  for(const [id,t] of Object.entries(trash)){ if(merged[id] && (merged[id].updated||0)<=t){ if(incCards[id]) toInc.cardsDel.push(id); delete merged[id]; } }
  toInc.cards=[...new Set(toInc.cards)].filter(id=>merged[id]); fromInc.cards=fromInc.cards.filter(id=>merged[id]);
  S.cards=merged;
  // notes
  const incNotes={}; for(const n of inc.notes||[]) incNotes[n.id]=n;
  for(const [id,n] of Object.entries(incNotes)){ const l=S.notes[id]; if(!l||(n.t||0)>(l.t||0)){ S.notes[id]={text:n.text||'', t:n.t||0, created:n.created||n.t||now()}; fromInc.notes.push(id); } else if((l.t||0)>(n.t||0)) toInc.notes.push(id); }
  for(const id of Object.keys(S.notes)) if(!incNotes[id]) toInc.notes.push(id);
  toInc.notes=[...new Set(toInc.notes)];
  // progression + chapitres perso
  if(inc.progress){
    const map=inc.progress.map||{};
    for(const [id,v] of Object.entries(map)){ const l=S.progress[id]; if(!l||(v.t||0)>(l.t||0)){ S.progress[id]=v; fromInc.docs.add('progress'); } else if((l.t||0)>(v.t||0)) toInc.docs.add('progress'); }
    for(const id of Object.keys(S.progress)) if(!map[id]) toInc.docs.add('progress');
    const cm={}; for(const c of S.custom) cm[c.id]=c;
    for(const c of inc.progress.custom||[]){ const l=cm[c.id]; if(!l||(c.t||0)>(l.t||0)){ cm[c.id]=c; fromInc.docs.add('progress'); } else if((l.t||0)>(c.t||0)) toInc.docs.add('progress'); }
    const incIds=new Set((inc.progress.custom||[]).map(c=>c.id)); if(S.custom.some(c=>!incIds.has(c.id))) toInc.docs.add('progress');
    S.custom=Object.values(cm);
  } else if(Object.keys(S.progress).length||S.custom.length) toInc.docs.add('progress');
  // stats
  if(inc.stats){
    const days=inc.stats.days||{};
    for(const [k,v] of Object.entries(days)){ const l=S.stats.days[k]; if(!l){ S.stats.days[k]=v; fromInc.docs.add('stats'); continue; }
      const m={r:Math.max(l.r||0,v.r||0), ok:Math.max(l.ok||0,v.ok||0), n:Math.max(l.n||0,v.n||0), ms:Math.max(l.ms||0,v.ms||0)};
      if(m.r!==(l.r||0)||m.ms!==(l.ms||0)||m.n!==(l.n||0)) fromInc.docs.add('stats');
      if(m.r!==(v.r||0)||m.ms!==(v.ms||0)||m.n!==(v.n||0)) toInc.docs.add('stats');
      S.stats.days[k]=m; }
    for(const k of Object.keys(S.stats.days)) if(!days[k]) toInc.docs.add('stats');
  } else if(Object.keys(S.stats.days).length) toInc.docs.add('stats');
  // préférences
  if(inc.prefs){ if((inc.prefs.t||0)>(S.prefs.t||0)){ S.prefs={...clone(DEFAULT_PREFS), ...inc.prefs}; fromInc.docs.add('prefs'); } else if((S.prefs.t||0)>(inc.prefs.t||0)) toInc.docs.add('prefs'); }
  else if(S.prefs.t) toInc.docs.add('prefs');
  return {fromInc, toInc};
}

// ---------- Répétition espacée (inspirée d'Anki / SM-2) ----------
const STEPS=[1,10], RSTEPS=[10];
function examCap(){
  if(!S.prefs.capExam) return Infinity;
  const ex=examDate(); if(!ex.set) return Infinity;
  const left=daysUntil(ex.date); return left>2 ? left-1 : Infinity;
}
function nextSrs(srs, g, fuzz=true){
  const s={...srs}; const t=now(); const cap=examCap();
  const reviewIn = ivl => { ivl=Math.min(ivl, Math.max(1,cap)); if(fuzz && ivl>=3) ivl=Math.max(1, Math.round(ivl*(0.95+Math.random()*0.1))); s.ivl=ivl; s.due=dayStart(t)+ivl*DAY; };
  if(s.state==='review'){
    const overdue=Math.max(0,(dayStart(t)-dayStart(s.due||t))/DAY);
    if(g===1){ s.lapses++; s.ease=Math.max(1.3,s.ease-0.2); s.ivl=Math.max(1,Math.round(s.ivl*0.2)); s.state='relearning'; s.step=0; s.due=t+RSTEPS[0]*MIN; }
    else if(g===2){ s.ease=Math.max(1.3,s.ease-0.15); reviewIn(Math.max(s.ivl+1, Math.round(s.ivl*1.2))); }
    else if(g===3){ reviewIn(Math.max(s.ivl+1, Math.round((s.ivl+overdue/2)*s.ease))); }
    else { s.ease+=0.15; reviewIn(Math.max(s.ivl+2, Math.round((s.ivl+overdue)*s.ease*1.3))); }
  } else {
    if(s.state==='new'){ s.state='learning'; s.step=0; }
    const steps = s.state==='relearning'?RSTEPS:STEPS;
    const grad = ivl => { s.state='review'; s.step=0; reviewIn(ivl); };
    if(g===1){ s.step=0; s.due=t+steps[0]*MIN; }
    else if(g===2){ const cur=steps[Math.min(s.step,steps.length-1)]; const d=(s.step===0&&steps.length>1)?(steps[0]+steps[1])/2:cur; s.due=t+d*MIN; }
    else if(g===3){ s.step++; if(s.step>=steps.length) grad(s.state==='relearning'?Math.max(1,s.ivl):1); else s.due=t+steps[s.step]*MIN; }
    else grad(s.state==='relearning'?Math.max(1,s.ivl)+1:4);
  }
  s.reps=(s.reps||0)+1; s.last=t; s.lastGrade=g; return s;
}
const isLearning = c => c.srs.state==='learning'||c.srs.state==='relearning';

// ---------- Portée & files ----------
function inScope(c, scope){
  if(!scope||scope==='all') return true;
  if(scope==='syn') return !!c.syn;
  const [k,v]=scope.split(':'); const ch=CH[c.chap];
  if(k==='y') return !!c.syn && !!SYN_BY[c.syn] && SYN_BY[c.syn].sys===v;
  if(k==='c') return c.chap===v;
  if(!ch) return false;
  if(k==='s') return ch.sub===v;
  if(k==='m') return ch.mod===v;
  return true;

function scopeLabel(scope){

async function toJpegBlob(file, max=1600, q=0.8){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return {canvas:c, blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q))};
  } finally { URL.revokeObjectURL(url); }
}
async function compressForCard(file){
  const {canvas}=await toJpegBlob(file, 900, 0.75);
  let q=0.75, data=canvas.toDataURL('image/jpeg', q);
  while(data.length>170000 && q>0.35){ q-=0.1; data=canvas.toDataURL('image/jpeg', q); }
  if(data.length>170000){ const c2=document.createElement('canvas'); c2.width=Math.round(canvas.width*0.7); c2.height=Math.round(canvas.height*0.7); c2.getContext('2d').drawImage(canvas,0,0,c2.width,c2.height); data=c2.toDataURL('image/jpeg',0.6); }
  return data;
}

function normalizeGenerated(arr){
  if(!Array.isArray(arr)){ if(arr&&Array.isArray(arr.cards)) arr=arr.cards; else return []; }
  const out=[];
  for(const x of arr){
    if(!x||typeof x!=='object') continue;
    let type=['qa','cloze','qcm'].includes(x.type)?x.type:'qa';
    const front=String(x.front||x.question||'').trim(); if(!front) continue;
    const c={type, front, back:String(x.back||x.answer_text||x.reponse||'').trim(), hint:String(x.hint||'').trim(), choices:[], answer:[]};
    if(type==='qcm'){
      c.choices=Array.isArray(x.choices)?x.choices.map(s=>String(s).trim()).filter(Boolean).slice(0,6):[];
      let ans=Array.isArray(x.answer)?x.answer:(typeof x.answer==='number'?[x.answer]:[]);
      c.answer=ans.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<c.choices.length);
      if(c.choices.length<2||!c.answer.length){ c.type='qa'; if(c.choices.length) c.back=(c.back?c.back+'\n':'')+c.choices.filter((_,i)=>c.answer.includes(i)).join(' ; '); c.choices=[]; c.answer=[]; }
    }
    if(type==='cloze' && !/\{\{.+?\}\}/.test(front)) c.type='qa';
    out.push(c);
  }
  return out;
}
function parseLoose(text){
  text=String(text||'').trim(); if(!text) return [];
  const a=text.indexOf('['), b=text.lastIndexOf(']');
  if(a>=0&&b>a){ try{ return normalizeGenerated(JSON.parse(text.slice(a,b+1))); }catch{} }
  try{ return normalizeGenerated(JSON.parse(text)); }catch{}
  // lignes "question :: réponse :: astuce" ou séparées par tabulation
  const out=[];
  for(const line of text.split(/\r?\n/)){
    const parts=line.includes('::')?line.split('::'):line.split('\t');
    if(parts.length>=2 && parts[0].trim() && parts[1].trim()){
      const front=parts[0].trim(); out.push({type:/\{\{.+?\}\}/.test(front)?'cloze':'qa', front, back:parts[1].trim(), hint:(parts[2]||'').trim(), choices:[], answer:[]});
    }
  }
  return out;
}

      rows+=`<button class="mod-prog" data-act="goto-mod" data-mod="${m.id}"><span class="spread"><strong>${esc(m.short)}</strong><span class="small muted">${n?`${st[2]+st[3]}/${n} appris`:'Pas de chapitre'} · ${plural(nc,'carte')} · ${m.credits} cr.</span></span>
        <span class="bar" role="img" aria-label="${st[3]} maîtrisés, ${st[2]} appris, ${st[1]} vus sur ${n}">${st[3]?`<i class="b3" style="width:${w(3)}%"></i>`:''}${st[2]?`<i class="b2" style="width:${w(2)}%"></i>`:''}${st[1]?`<i class="b1" style="width:${w(1)}%"></i>`:''}</span></button>`;
    }
    return `<section class="panel"><div class="section-title"><h3>Progression par module</h3></div>${rows}
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Maîtrisé</span><span><i style="background:var(--a55)"></i>Appris</span><span><i style="background:var(--a28)"></i>Vu en cours</span></div></section>`;
  }
  if(k==='heatmap'){
    const t=new Date(); const todayK=dayKey();
    const start=new Date(t); start.setHours(12,0,0,0); const dow=(start.getDay()+6)%7; start.setDate(start.getDate()-dow-14*7);
    let cells='';
    for(let i=0;i<15*7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      const r=(S.stats.days[k]||{}).r||0; const fut=k>todayK;
      const l=r===0?'':r<20?'l1':r<50?'l2':r<100?'l3':'l4';
      cells+=`<button class="${l} ${k===todayK?'today-cell':''} ${fut?'future':''}" data-act="heat" data-k="${k}" data-r="${r}" aria-label="${esc(fmtShort(d))} : ${r} cartes" ${fut?'tabindex="-1"':''}></button>`;
    }
    const last30=Object.entries(S.stats.days).filter(([k])=>k>dayKey(now()-30*DAY)).filter(([,v])=>v.r>0).length;
    return `<section class="panel"><div class="section-title"><h3>Calendrier d'activité</h3><span class="small muted">${last30} jours actifs sur 30</span></div>
      <div class="heat-wrap"><div class="heat">${cells}</div></div>
      <div class="legend" style="margin-top:10px"><span>Moins</span><span><i style="background:var(--surface2)"></i><i style="background:var(--a28)"></i><i style="background:var(--a55)"></i><i style="background:var(--a78)"></i><i style="background:var(--accent)"></i></span><span>Plus</span></div></section>`;
  }
  if(k==='plan'){
    const chs=allChapters(); const remaining=chs.filter(c=>statusOf(c.id)<2).length;
    const ex=examDate(); const revStart=new Date(ex.date); revStart.setDate(revStart.getDate()-10);
    const from=daysUntil(semStart())>0?semStart():new Date();
    const days=Math.max(1, Math.round((midnight(revStart)-midnight(from))/DAY));
    const perWeek=Math.ceil(remaining/days*7);
    const tomorrow=Object.values(S.cards).filter(c=>!c.suspended&&c.srs.state!=='new'&&c.srs.due>=dayStart()+DAY&&c.srs.due<dayStart()+2*DAY).length;
    return `<section class="panel"><div class="section-title"><h3>Rythme conseillé</h3></div>
      <p>Il te reste <strong>${plural(remaining,'chapitre')}</strong> à apprendre et <strong>${plural(days,'jour')}</strong> avant la période de révision${ex.set?'':' (date estimée)'}.</p>
      <p style="margin-top:6px">Objectif : <strong>${perWeek} chapitres par semaine</strong>, soit environ ${Math.max(1,Math.round(perWeek/6))} par jour de cours. Marque un chapitre « Appris » quand tu le maîtrises.</p>
      <p class="small muted" style="margin-top:8px">${plural(tomorrow,'carte')} à revoir demain.</p></section>`;
  }
  return '';
}

function scopeOptions(sel, withNone){

  for(const m of PROGRAMME){

    for(const s of m.subs){
      if(!withNone && m.subs.length>1) o+=`<option value="s:${s.id}" ${sel==='s:'+s.id?'selected':''}>${esc(s.name)} (tout)</option>`;
      for(const c of s.all){ const v=withNone?c.id:'c:'+c.id; o+=`<option value="${v}" ${sel===v?'selected':''}>${withNone?esc(s.name.replace('Sémiologie ','Sémio. '))+' · ':'   '}${pad(c.n)}. ${esc(c.title)}</option>`; }

// ---------- Session de révision ----------
let SESS=null;
function startSession(mode, scope, opt){
  opt=opt||{};
  const t=now();
  let cards=liveCards(scope);
  let queue=[];
  if(mode==='srs'){
    const c=counts(scope); const end=dayStart(t)+DAY;
    const lrn=cards.filter(x=>isLearning(x)&&x.srs.due<=end).sort((a,b)=>a.srs.due-b.srs.due);
    const rev=shuffle(cards.filter(x=>x.srs.state==='review'&&x.srs.due<end)).sort((a,b)=>a.srs.due-b.srs.due).slice(0,c.rev); // les plus en retard d'abord
    const nw=cards.filter(x=>x.srs.state==='new').sort((a,b)=>(a.created||0)-(b.created||0)).slice(0,c.nw);
    // on intercale les nouvelles parmi les révisions
    const mixed=[]; const step=nw.length?Math.max(1,Math.floor(rev.length/nw.length)):0; let ni=0;
    rev.forEach((r,i)=>{ mixed.push(r); if(step && (i+1)%step===0 && ni<nw.length) mixed.push(nw[ni++]); });
    while(ni<nw.length) mixed.push(nw[ni++]);
    queue=lrn.filter(x=>x.srs.due<=t).concat(opt.minutes?rev.concat(nw):mixed);
    SESS={mode, scope, queue:queue.map(x=>x.id), later:lrn.filter(x=>x.srs.due>t).map(x=>x.id), done:0, ok:0, start:t, shown:0, total:queue.length+lrn.filter(x=>x.srs.due>t).length, missed:[]};
    if(opt.minutes){ SESS.limit=opt.minutes*MIN; SESS.minutes=opt.minutes; }
  } else {
    if(mode==='hard') cards=cards.filter(isHard);
    if(mode==='recent'){ const lim=t-7*DAY; cards=cards.filter(c=>(c.created||0)>lim); }
    if(mode==='list'){ const ids=new Set(opt.ids||[]); cards=cards.filter(c=>ids.has(c.id)); }
    queue=shuffle(cards.slice()).map(x=>x.id);
    SESS={mode, scope, queue, later:[], done:0, ok:0, start:t, shown:0, total:queue.length, missed:[], seen:new Set()};
  }
  if(!SESS.queue.length && !SESS.later.length){ toast('Rien à réviser dans cette sélection.'); SESS=null; return; }
  $('#session').hidden=false; document.body.style.overflow='hidden';
  nextCard();
}
function nextCard(){
  const s=SESS; const t=now();
  if(s.limit && s.done>0 && t-s.start>=s.limit){ s.timeUp=true; sessionDone(); return; }
  let id=null;
  if(s.mode==='srs'){
    s.later.sort((a,b)=>(S.cards[a]?.srs.due||0)-(S.cards[b]?.srs.due||0));
    if(s.later.length && S.cards[s.later[0]] && S.cards[s.later[0]].srs.due<=t) id=s.later.shift();
    else if(s.queue.length) id=s.queue.shift();
    else if(s.later.length) id=s.later.shift(); // apprentissage en avance (comme Anki)
  } else if(s.queue.length) id=s.queue.shift();
  while(id && !S.cards[id]){ id=s.queue.shift()||null; }
  if(!id){ sessionDone(); return; }
  s.cur={id, revealed:false, picked:new Set(), t0:now()};
  paintSession();
}
function remaining(){ const s=SESS; if(s.mode!=='srs') return {n:s.queue.length+(s.cur?1:0)};
  let nw=0,lrn=0,rev=0; const ids=s.queue.concat(s.later); if(s.cur) ids.push(s.cur.id);
  for(const id of ids){ const c=S.cards[id]; if(!c) continue; if(c.srs.state==='new') nw++; else if(isLearning(c)) lrn++; else rev++; }
  return {nw,lrn,rev}; }
function paintSession(anim){
  const s=SESS, cur=s.cur, c=S.cards[cur.id]; const ch=CH[c.chap];
  const r=remaining(); const prog=s.total?Math.min(100, s.done/(s.done+(s.mode==='srs'?r.nw+r.lrn+r.rev:r.n))*100):0;
  const tl=s.limit?`<span class="c-time">${Math.max(1,Math.ceil((s.limit-(now()-s.start))/MIN))} min</span>`:'';
  const counter=s.mode==='srs'?`<div class="sess-counts">${tl}<span class="c-new">${r.nw}</span><span class="c-lrn">${r.lrn}</span><span class="c-rev">${r.rev}</span></div>`:`<div class="sess-counts"><span>${r.n}</span></div>`;
  const img = pos => (c.img && ((c.imgSide||'front')===pos))?`<img src="${c.img}" alt="Image de la carte">`:'';
  let front='', back='';
  if(c.type==='cloze'){ front=`<div class="front rt">${cur.revealed?clozeBack(c.front):clozeFront(c.front)}</div>`; }
  else front=`<div class="front rt">${md(c.front)}</div>`;
  if(c.type==='qcm'){
    front+=`<div class="qcm">${c.choices.map((x,i)=>{ let cls=''; if(cur.revealed){ const good=c.answer.includes(i), p=cur.picked.has(i); cls=good&&p?'ok':(!good&&p?'ko':(good?'ok miss':'')); }
      return `<button class="${cls}" data-act="qcm-pick" data-i="${i}" aria-pressed="${cur.picked.has(i)}" ${cur.revealed?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`; }).join('')}</div>`;
  }
  if(cur.revealed){

   <div class="sess-actions">${actions}</div>`;
  $('#session').scrollTop=0;

function gradeButtons(c){
  const s=SESS;
  if(s.mode!=='srs') return `<div class="grades two"><button class="grade g1" data-act="grade" data-g="1">À revoir<small>remise plus loin</small></button><button class="grade g3" data-act="grade" data-g="3">Je savais<small>suivante</small></button></div>`;
  const t=now(); const iv=g=>{ const n=nextSrs(c.srs,g,false); return fmtIvl(n.due-t); };
  if(String(S.prefs.buttons)==='2') return `<div class="grades two"><button class="grade g1" data-act="grade" data-g="1">Raté<small>${iv(1)}</small></button><button class="grade g3" data-act="grade" data-g="3">Réussi<small>${iv(3)}</small></button></div>`;
  return `<div class="grades"><button class="grade g1" data-act="grade" data-g="1">À revoir<small>${iv(1)}</small></button><button class="grade g2" data-act="grade" data-g="2">Difficile<small>${iv(2)}</small></button><button class="grade g3" data-act="grade" data-g="3">Bien<small>${iv(3)}</small></button><button class="grade g4" data-act="grade" data-g="4">Facile<small>${iv(4)}</small></button></div>`;
}
function reveal(){
  const cur=SESS.cur; if(cur.revealed) return; cur.revealed=true; paintSession(true);
}
function grade(g){
  const s=SESS, cur=s.cur, c=S.cards[cur.id]; if(!c) return nextCard();
  const ms=now()-cur.t0; const wasNew=c.srs.state==='new';
  s.done++; if(g>=3) s.ok++;
  if(s.mode==='srs'){
    c.srs=nextSrs(c.srs,g); saveCard(c,{fast:true});
    if(g===1) s.missed.push(c.id);
    if(isLearning(c)) s.later.push(c.id);
    logReview(g>=3, wasNew, ms);
  } else {
    logReview(g>=3, false, ms);
    if(g===1){ s.missed.push(c.id); const pos=Math.min(s.queue.length, 3+Math.floor(Math.random()*4)); s.queue.splice(pos,0,c.id); }
  }
  updateDueDot(); nextCard();
}
function sessionDone(){

  const a=dayStart()+DAY, tomorrow=Object.values(S.cards).filter(x=>!x.suspended&&x.srs.state!=='new'&&x.srs.due>=a&&x.srs.due<a+DAY).length;
  const more=s.timeUp&&left>0;
  $('#sessIn').innerHTML=`<div class="layer-top"><button class="icon-btn" data-act="sess-close" aria-label="Fermer">${I.x}</button><div class="sess-bar"><i style="width:100%"></i></div></div>
   <div class="done"><svg viewBox="0 0 24 24" style="width:56px;height:56px;align-self:center;color:var(--good)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
   <h1>${s.timeUp?`${s.minutes} minutes : c'est fait`:'Session terminée'}</h1>
   <div class="count-grid"><div class="count"><span class="eyebrow">Cartes</span><span class="num">${s.done}</span></div><div class="count"><span class="eyebrow">Réussite</span><span class="num">${pct}<small>%</small></span></div></div>
   <p class="muted">${plural(mins,'minute')} · série de ${plural(streak(),'jour')} · demain : ${plural(tomorrow,'carte')}</p>
   ${more?`<p>Il reste ${plural(left,'carte')} pour aujourd'hui. Tu peux t'arrêter ici : ce que tu as fait compte.</p>
     <button class="btn btn-primary btn-lg" data-act="sess-close">Terminer</button>
     <button class="btn" data-act="start" data-mode="srs" data-scope="${esc(s.scope)}" data-min="${s.minutes}">Encore ${s.minutes} minutes</button>`

   ${missed.length?`<button class="btn" data-act="start-missed">Revoir ${missed.length>1?'les '+missed.length+' cartes ratées':'la carte ratée'}</button>`:''}
   ${s.mode==='srs'&&!more?`<button class="btn" data-act="start" data-mode="cram" data-scope="${esc(s.scope)}">Bachoter cette sélection</button>`:''}
   </div>`;
  SESS.cur=null; SESS.finished=true;
}

// ---------- Explication / leçon (Claude) ----------
let aiCtl=null;
async function streamTo(el, prompt, opts={}){
  if(!AI.sample) return null;
  aiCtl=new AbortController();
  el.hidden=false; el.innerHTML='<p class="muted">Claude réfléchit…</p>';
  try{
    const r=await AI.sample(prompt,{signal:aiCtl.signal, modelTier:opts.tier||'default', onText:({text})=>{ el.innerHTML=md(text); }});
    el.innerHTML=md(r.text); return r.text;
  }catch(e){ const m=aiErr(e); if(e&&e.text) el.innerHTML=md(e.text); else el.innerHTML=''; if(m) el.insertAdjacentHTML('beforeend','<p class="notice warn">'+esc(m)+'</p>'); return null; }
}
function explainSheet(){ return sheetTop('Explication')+`<div class="panel"><p class="eyebrow" style="margin-bottom:6px">La carte</p><div class="rt">${md(plain(UI.explainCard.front))}</div></div><div id="explainOut" class="rt panel"></div><p class="small muted">Vérifie toujours avec ton cours : Claude peut se tromper.</p>`; }

// ---------- Génération de cartes ----------
async function generate(){
  const g=UI.gen; if(g.busy) return;
  if(!g.types.length){ toast('Choisis au moins un type de carte.'); return; }
  if(!g.chap && !g.focus.trim() && g.source==='focus'){ toast('Choisis un chapitre ou écris une notion.'); return; }
  if(g.source==='text' && !g.text.trim()){ toast('Colle d\'abord le texte du cours.'); return; }
  if(g.source==='photo' && !g.photos.length){ toast('Ajoute au moins une photo.'); return; }
  const prompt=buildCardPrompt(g);
  g.busy=true; g.err=''; g.results=null; rerender();
  aiCtl=new AbortController();
  try{
    const opts={signal:aiCtl.signal, modelTier:'default', onText:({text})=>{ const n=(text.match(/"front"\s*:/g)||[]).length; const el=$('#genCount'); if(el) el.textContent=n?n+'/'+g.n:''; }};
    if(g.source==='photo') opts.images=g.photos.map(p=>p.blob);
    const data=await AI.sample.json(prompt, opts);
    const res=normalizeGenerated(data);
    if(!res.length) g.err='Aucune carte exploitable. Précise la notion ou ajoute ton cours, puis réessaie.';
    else g.results=res;
  }catch(e){ if(e&&e.code==='invalid_json'&&e.text){ const res=parseLoose(e.text); if(res.length) g.results=res; else g.err=aiErr(e); } else g.err=aiErr(e); }
  g.busy=false; rerender();
  if(g.results){ const el=$('#genResults'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
}
function saveGenerated(){
  const g=UI.gen; let n=0;
  for(const r of g.results){ if(r.off) continue; const c=newCard({chap:g.chap, type:r.type, front:r.front, back:r.back, hint:r.hint||'', choices:r.choices||[], answer:r.answer||[]}); saveCard(c); n++; }
  toast(plural(n,'carte')+' ajoutée'+(n>1?'s':''));
  if(g.chap && statusOf(g.chap)===0) setStatus(g.chap,1);
  g.results=null; updateDueDot(); rerender();
}

// ---------- Export / import ----------
async function offerFile(filename, text){
  const C=window.claude; let dl=null;
  try{ dl=C&&C.use?await C.use('downloads'):null; }catch{}
  if(dl){ try{ await dl.save({filename, data:text}); return; }catch(e){ const c=e&&e.code; if(c==='declined') return; if(c==='rate_limited'){ toast('Un téléchargement est déjà en cours. Réessaie dans un instant.'); return; } } }
  if(!dl){ try{ const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Fichier enregistré dans tes téléchargements'); return; }catch{} }
  openSheet(()=>sheetTop(filename)+`<p class="small">Le téléchargement direct n'est pas disponible ici. Copie ce texte et enregistre-le dans un fichier.</p><textarea id="exportText" style="min-height:50vh" readonly>${esc(text)}</textarea><button class="btn btn-primary" data-act="copy-export">Copier</button>`);
}
function exportJSON(){
  const d={app:'xamxam', v:1, exported:new Date().toISOString(), cards:Object.values(S.cards), progress:S.progress, custom:S.custom, notes:S.notes, stats:S.stats, prefs:S.prefs, trash:S.trash};
  S.prefs.lastExport=now(); savePrefs(); setSync(W.status);
  offerFile('xamxam-sauvegarde-'+dayKey()+'.json', JSON.stringify(d));
}
function exportAnki(){
  const clean=s=>String(s||'').replace(/\t/g,' ').replace(/\r?\n/g,'<br>');
  const lines=['#separator:tab','#html:true','#tags column:3'];
  for(const c of Object.values(S.cards)){
    const ch=CH[c.chap]; const tag=ch?(SUBS[ch.sub].name+'::'+ch.title).replace(/\s+/g,'_'):'XamXam';
    let f=c.front, b=c.back;
    if(c.type==='cloze'){ f=c.front.replace(/\{\{(.+?)\}\}/g,'[…]'); b=c.front.replace(/\{\{(.+?)\}\}/g,'<b>$1</b>')+(c.back?'<br><br>'+c.back:''); }
    if(c.type==='qcm'){ f=c.front+'<br>'+c.choices.map((x,i)=>String.fromCharCode(65+i)+'. '+x).join('<br>'); b='Bonnes réponses : '+c.answer.map(i=>String.fromCharCode(65+i)).join(', ')+(c.back?'<br><br>'+c.back:''); }
    if(c.hint) b+='<br><br><i>'+c.hint+'</i>';
    lines.push(clean(f)+'\t'+clean(b)+'\t'+tag);
  }
  offerFile('xamxam-anki-'+dayKey()+'.txt', lines.join('\n'));
}
function importBackup(text){
  let d; try{ d=JSON.parse(text); }catch{ toast("Ce fichier n'est pas une sauvegarde XamXam."); return; }
  if(!d||d.app!=='xamxam'){ toast("Ce fichier n'est pas une sauvegarde XamXam."); return; }
  const notes=Object.entries(d.notes||{}).map(([id,n])=>({...n, id}));
  const r=mergeData({cards:d.cards||[], notes, progress:{map:d.progress||{}, custom:d.custom||[]}, stats:d.stats||{days:{}}, prefs:d.prefs||null, trash:d.trash||{}});
  r.fromInc.cards.forEach(id=>cloudPut('cards/'+id,200)); r.fromInc.notes.forEach(id=>cloudPut('notes/'+id,200)); r.fromInc.docs.forEach(k=>cloudPut(k,200));
  writeLocal(); onDataChanged(true); toast('Sauvegarde importée : '+plural(r.fromInc.cards.length,'carte')+' mise'+(r.fromInc.cards.length>1?'s':'')+' à jour');
}

document.addEventListener('input', e=>{

    case 'gen-focus': UI.gen.focus=el.value; break;
    case 'gen-text': UI.gen.text=el.value; break;

    case 'pref-size': S.prefs.size=+el.value; $('#sizeVal').textContent=el.value+'px'; applyTheme(); savePrefs(); break;
    case 'accent': S.prefs.accent=el.value; applyTheme(); savePrefs(); break;

});
document.addEventListener('change', async e=>{
  const el=e.target; const k=el.dataset&&el.dataset.input; const d=el.dataset||{};
  if(el.id==='fileImg'){
    const files=Array.from(el.files||[]); el.value=''; if(!files.length) return;
    if(UI.fileFor==='card'){ try{ ED.img=await compressForCard(files[0]); ED.imgCloud=false; paintSheet(true); }catch{ toast("Impossible de lire cette image."); } }
    else { const max=AI.images?AI.images.maxCount:5; for(const f of files.slice(0, Math.max(0,max-UI.gen.photos.length))){ try{ const {blob}=await toJpegBlob(f,1600,0.8); UI.gen.photos.push({blob, url:URL.createObjectURL(blob)}); }catch{ toast('Une photo est illisible.'); } } rerender(); }
    return;
  }
  if(el.id==='fileJson'){ const f=el.files&&el.files[0]; el.value=''; if(!f) return; const text=await f.text(); if(UI.tab==='new' && UI.newTab==='import' && !/"app"\s*:\s*"xamxam"/.test(text)){ UI.impText=text; rerender(); return; } importBackup(text); return; }
  if(!k) return;
  switch(k){
    case 'syn-sys': UI.syn.sys=el.value; UI.synOpen=null; paintSheet(true); break;
    case 'rev-scope': UI.rev.scope=el.value; rerender(); break;
    case 'gen-chap': UI.gen.chap=el.value; rerender(); break;
    case 'imp-chap': UI.impChap=el.value; break;
    case 'gen-hint': UI.gen.hint=el.checked; break;
    case 'gen-keep': UI.gen.results[+d.i].off=!el.checked; rerender(); break;
    case 'ed-ans': { const i=+d.i; ED.answer=ED.answer.filter(x=>x!==i); if(el.checked) ED.answer.push(i); break; }
    case 'pref-bool': S.prefs[d.k]=el.checked; savePrefs(); break;
    case 'pref': if(d.k==='semStart'||d.k==='examDate') rerender(); break;
    case 'home-toggle': { const row=S.prefs.home.find(r=>r[0]===d.k); if(row) row[1]=el.checked?1:0; savePrefs(); break; }
  }
});

document.addEventListener('keydown', e=>{
  if(!SESS||!SESS.cur||$('#session').hidden||!$('#sheet').hidden) return;
  if(e.target.closest('input,textarea,select')) return;
  if(e.key===' '||e.key==='Enter'){ if(!SESS.cur.revealed){ e.preventDefault(); reveal(); } else { e.preventDefault(); grade(3); } }
  else if(SESS.cur.revealed && ['1','2','3','4'].includes(e.key)){ const g=+e.key; if(SESS.mode!=='srs'&&(g===2||g===4)) return; grade(g); }
});

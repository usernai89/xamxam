 c:["Disproportion fœto-pelvienne, présentation de l'épaule", "Utérus cicatriciel (césarienne), multiparité", "Mauvais usage de l'ocytocine, travail prolongé sans surveillance"],
 k:"Urgence : arrêter les ocytociques, tocolyse et césarienne immédiate. La surveillance du travail (partogramme) prévient cette complication encore fréquente en Afrique."},
{id:"x-hpp", sys:"gyneco", n:"Hémorragie du post-partum",
 e:"Après l'accouchement, la femme saigne trop, souvent parce que l'utérus ne se contracte pas : c'est la première cause de mort maternelle.",
 h:"Perte sanguine ≥ 500 mL dans les 24 heures suivant l'accouchement (sévère ≥ 1 000 mL), quelle que soit la voie d'accouchement. Première cause de mortalité maternelle en Afrique.",
 s:["Saignement vaginal abondant après la naissance", "Utérus mou, haut situé, mal rétracté (atonie)", "Signes de choc : tachycardie, hypotension, pâleur, sueurs"],
 c:["Atonie utérine (la plus fréquente) : travail long, grossesse multiple, hydramnios, gros enfant", "Rétention placentaire, déchirures du col ou du vagin", "Troubles de la coagulation (HRP, CIVD), inversion utérine, rupture utérine"],
 k:"Prévention : ocytocine après la naissance (délivrance dirigée). Traitement : massage utérin, révision utérine, ocytocine, acide tranexamique, puis gestes chirurgicaux."},
{id:"x-dr-nn", sys:"ped", n:"Détresse respiratoire du nouveau-né",
 e:"Le nouveau-né respire vite et avec effort : on voit ses côtes se creuser et ses narines battre.",
 h:"Association de signes de lutte respiratoire et/ou de cyanose chez le nouveau-né. Sa gravité se mesure par le score de Silverman (0 à 10).",
 s:["Polypnée (> 60/min), cyanose", "Signes de lutte (score de Silverman) : battement des ailes du nez, tirage intercostal, entonnoir xiphoïdien, balancement thoraco-abdominal, geignement expiratoire", "Radiographie selon la cause"],
 c:["Maladie des membranes hyalines (prématuré : déficit en surfactant)", "Retard de résorption du liquide pulmonaire (césarienne), inhalation de liquide méconial", "Infection néonatale, pneumothorax, hernie diaphragmatique, cardiopathies"],
 k:"Score de Silverman > 4 : détresse grave. Chez le prématuré, la corticothérapie anténatale prévient la maladie des membranes hyalines."},
{id:"x-ictere-nn", sys:"ped", n:"Ictère du nouveau-né",
 e:"La peau du bébé devient jaune parce que son foie encore immature n'élimine pas assez vite la bilirubine. Souvent bénin, mais un excès peut abîmer le cerveau.",
 h:"Coloration jaune de la peau et des muqueuses par hyperbilirubinémie, le plus souvent libre (non conjuguée). La bilirubine libre en excès peut entraîner un ictère nucléaire (encéphalopathie).",

const SYN_BY = {}; SYNDROMES.forEach(x=>{ SYN_BY[x.id]=x; });

UI.syn={view:'fiches', lang:'both', sys:'all', q:''};
function synMatch(x){ const u=UI.syn; if(u.sys!=='all' && x.sys!==u.sys) return false; const q=u.q.trim().toLowerCase(); if(!q) return true;
  return (x.n+' '+x.s.join(' ')+' '+x.c.join(' ')+' '+x.k).toLowerCase().includes(q); }
function synHas(id){ return Object.values(S.cards).some(c=>c.syn===id); }
function synAdd(id){
  const x=SYN_BY[id]; if(!x||synHas(id)) return 0;
  const li=a=>a.map(t=>'- '+t).join('\n');
  [ {front:'**'+x.n+'**\nDéfinis ce syndrome en langage hospitalier.', back:x.h, hint:x.e},
    {front:'**'+x.n+'**\nQuels sont les signes ?', back:li(x.s), hint:x.k},
    {front:'**'+x.n+'**\nQuelles sont les principales causes ?', back:li(x.c), hint:''}
  ].forEach(f=>saveCard(newCard({...f, type:'qa', syn:id})));
  return 3;
}
function synRemove(id){ let n=0; for(const c of Object.values(S.cards)){ if(c.syn===id){ deleteCard(c.id); n++; } } return n; }
function triRemove(id){ let n=0; for(const c of Object.values(S.cards)){ if(c.tri===id){ deleteCard(c.id); n++; } } return n; }
function synFiche(x){
  const u=UI.syn, has=synHas(x.id);
  const simple=`<div class="syn-box simple"><p class="eyebrow">En mots simples</p><p>${esc(x.e)}</p></div>`;
  const hosp=`<div class="syn-box hosp"><p class="eyebrow">En langage hospitalier</p><p>${esc(x.h)}</p></div>`;
  return `<details class="syn" data-syn="${x.id}" ${UI.synOpen===x.id?'open':''}><summary><span>${esc(x.n)}</span>${I.chev}</summary><div class="syn-body">
    ${u.lang!=='hosp'?simple:''}${u.lang!=='simple'?hosp:''}
    <div><h4>Signes</h4><ul>${x.s.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>
    <div><h4>Causes principales</h4><ul>${x.c.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>
    <p class="syn-key"><strong>À retenir.</strong> ${esc(x.k)}</p>
    ${has?`<div class="row"><span class="badge">Dans tes révisions</span><button class="btn btn-ghost" data-act="start" data-mode="cram" data-scope="syn" data-syn="${x.id}">Me tester sur cette fiche</button><button class="btn btn-ghost" data-act="syn-del" data-id="${x.id}">Retirer de mes révisions</button></div>`
        :`<button class="btn btn-soft" data-act="syn-add" data-id="${x.id}">${I.plus} Ajouter à mes révisions (3 cartes)</button>`}
  </div></details>`;
}
function synList(){
  const u=UI.syn; const ord=Object.keys(SYN_SYS); const list=SYNDROMES.filter(synMatch).sort((a,b)=>ord.indexOf(a.sys)-ord.indexOf(b.sys));
  if(!list.length) return '<p class="muted">Aucune fiche ne correspond à cette recherche.</p>';
  let html='';
  if(u.view==='table'){
    const col=u.lang==='simple'?'En mots simples':u.lang==='hosp'?'En langage hospitalier':'En mots simples';
    let rows=''; let cur='';
    for(const x of list){ if(x.sys!==cur){ cur=x.sys; rows+=`<tr class="sysrow"><td colspan="4">${esc(SYN_SYS[cur])}</td></tr>`; }
      rows+=`<tr><td>${esc(x.n)}</td><td>${esc(u.lang==='hosp'?x.h:x.e)}</td><td>${x.s.map(esc).join(' · ')}</td><td>${x.c.map(esc).join(' · ')}</td></tr>`; }
    return `<p class="small muted">Fais glisser le tableau vers la gauche pour voir toutes les colonnes.</p><div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Syndrome</th><th>${col}</th><th>Signes</th><th>Causes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  let cur='';
  for(const x of list){ if(x.sys!==cur){ cur=x.sys; const n=list.filter(y=>y.sys===cur).length; html+=`<h3 class="syn-sys">${esc(SYN_SYS[cur])} <span class="small muted">· ${n}</span></h3>`; } html+=synFiche(x); }
  return html;
}
function synSheet(){
  const u=UI.syn; const mine=new Set(Object.values(S.cards).filter(c=>c.syn).map(c=>c.syn)).size;
  const scope=u.sys==='all'?'syn':'y:'+u.sys; const nTest=liveCards(scope).length;
  const missing=SYNDROMES.filter(x=>(u.sys==='all'||x.sys===u.sys)&&!synHas(x.id)).length;
  return sheetTop('Fiches syndromes')+`
   <p>${SYNDROMES.length} syndromes. Chaque fiche donne l'explication simple, la version hospitalière, les signes, les causes et le point à retenir.</p>
   <div class="syn-tools">
    <div class="seg" role="group" aria-label="Présentation"><button data-act="syn-view" data-v="fiches" aria-pressed="${u.view==='fiches'}">Fiches</button><button data-act="syn-view" data-v="table" aria-pressed="${u.view==='table'}">Tableau</button></div>
    <div class="seg" role="group" aria-label="Langage"><button data-act="syn-lang" data-v="both" aria-pressed="${u.lang==='both'}">Les deux</button><button data-act="syn-lang" data-v="simple" aria-pressed="${u.lang==='simple'}">Simple</button><button data-act="syn-lang" data-v="hosp" aria-pressed="${u.lang==='hosp'}">Hospitalier</button></div>
    <label class="field">Appareil<select id="synSys" data-input="syn-sys"><option value="all" ${u.sys==='all'?'selected':''}>Tous les appareils</option>${Object.entries(SYN_SYS).map(([k,l])=>`<option value="${k}" ${u.sys===k?'selected':''}>${esc(l)} (${SYNDROMES.filter(x=>x.sys===k).length})</option>`).join('')}</select></label>
    <div class="search">${I.search}<input type="search" id="synSearch" placeholder="Chercher un syndrome ou un signe" value="${esc(u.q)}" data-input="syn-q" aria-label="Chercher un syndrome ou un signe"></div>
    <div class="stack">${nTest?`<button class="btn btn-primary" data-act="start" data-mode="cram" data-scope="${scope}">Me tester (${nTest} cartes)</button>`:''}
      ${missing?`<button class="btn btn-soft" data-act="syn-add-all">Tout ajouter à mes révisions (${missing})</button>`:''}
      ${mine?`<button class="btn btn-ghost" data-act="syn-del-all">Retirer ${u.sys==='all'?'toutes les fiches':'les fiches de cet appareil'} de mes révisions</button>`:''}</div>
    <p class="small muted">Rien n'entre dans tes révisions sans ton accord : ajoute une fiche, toutes, ou aucune. ${mine} fiche${mine>1?'s':''} dans tes révisions. Ces fiches sont un résumé : en cas de différence, c'est le cours de ton professeur qui fait foi.</p>
   </div>
   <div id="synList" class="stack">${synList()}</div>`;
}

const TRI_BY = {}; TRIADES.forEach(x=>{ TRI_BY[x.id]=x; });
UI.tri={view:'fiches', sys:'all', sn:false, q:''};
function triMatch(x){ const u=UI.tri; if(u.sys!=='all' && x.sys!==u.sys) return false; if(u.sn && !x.sn) return false; const q=fold(u.q.trim()); if(!q) return true;
  return fold(x.n+' '+x.t.join(' ')+' '+x.m+' '+x.k).includes(q); }
function triHas(id){ return Object.values(S.cards).some(c=>c.tri===id); }
function triAdd(id){
  const x=TRI_BY[id]; if(!x||triHas(id)) return 0;
  [ {front:'**'+x.n+'**\nQuels sont ses 3 éléments ?', back:x.t.map(s=>'- '+s).join('\n')+'\n\n**Évoque :** '+x.m, hint:''},
    {front:'Quelle triade associe :\n'+x.t.map(s=>'- '+s).join('\n'), back:'**'+x.n+'**\n\n'+x.m, hint:x.k}
  ].forEach(f=>saveCard(newCard({...f, type:'qa', tri:id})));
  return 2;
}
function triFiche(x){
  const has=triHas(x.id);
  return `<details class="syn" data-tri="${x.id}" ${UI.triOpen===x.id?'open':''}><summary><span>${esc(x.n)}${x.sn?' <span class="badge sn">Sénégal</span>':''}</span>${I.chev}</summary><div class="syn-body">
    <ol class="tri-ol">${x.t.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol>
    <p><strong>Évoque :</strong> ${esc(x.m)}</p>
    <p class="syn-key"><strong>À retenir.</strong> ${esc(x.k)}</p>
    ${has?`<div class="row"><span class="badge">Dans tes révisions</span><button class="btn btn-ghost" data-act="start" data-mode="cram" data-scope="tri" data-tri="${x.id}">Me tester sur cette triade</button><button class="btn btn-ghost" data-act="tri-del" data-id="${x.id}">Retirer de mes révisions</button></div>`
        :`<button class="btn btn-soft" data-act="tri-add" data-id="${x.id}">${I.plus} Ajouter à mes révisions (2 cartes)</button>`}
  </div></details>`;
}
function triList(){
  const u=UI.tri; const ord=Object.keys(TRI_SYS); const list=TRIADES.filter(triMatch).sort((a,b)=>ord.indexOf(a.sys)-ord.indexOf(b.sys));
  if(!list.length) return '<p class="muted">Aucune triade ne correspond à cette recherche.</p>';
  if(u.view==='table'){
    let rows=''; let cur='';
    for(const x of list){ if(x.sys!==cur){ cur=x.sys; rows+=`<tr class="sysrow"><td colspan="3">${esc(TRI_SYS[cur])}</td></tr>`; }
      rows+=`<tr><td>${esc(x.n)}${x.sn?' <span class="badge sn">Sénégal</span>':''}</td><td>${x.t.map((s,i)=>(i+1)+'. '+esc(s)).join('<br>')}</td><td>${esc(x.m)}</td></tr>`; }
    return `<p class="small muted">Fais glisser le tableau vers la gauche pour voir toutes les colonnes.</p><div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Triade</th><th>Les 3 éléments</th><th>Évoque</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  let html=''; let cur='';
  for(const x of list){ if(x.sys!==cur){ cur=x.sys; const n=list.filter(y=>y.sys===cur).length; html+=`<h3 class="syn-sys">${esc(TRI_SYS[cur])} <span class="small muted">· ${n}</span></h3>`; } html+=triFiche(x); }
  return html;
}
function triSheet(){
  const u=UI.tri; const mine=new Set(Object.values(S.cards).filter(c=>c.tri).map(c=>c.tri)).size;
  const nTest=liveCards('tri').length; const nSn=TRIADES.filter(x=>x.sn).length;
  const missing=TRIADES.filter(x=>triMatch(x)&&!triHas(x.id)).length;
  return sheetTop('Triades')+`
   <p>${TRIADES.length} triades de médecine, dont ${nSn} fréquentes au Sénégal et en Afrique (marquées « Sénégal »). Chaque triade donne ses 3 éléments, ce qu'elle évoque et le point à retenir.</p>
   <div class="syn-tools">
    <div class="seg" role="group" aria-label="Présentation"><button data-act="tri-view" data-v="fiches" aria-pressed="${u.view==='fiches'}">Fiches</button><button data-act="tri-view" data-v="table" aria-pressed="${u.view==='table'}">Tableau</button></div>
    <div class="seg" role="group" aria-label="Lesquelles"><button data-act="tri-sn" data-v="0" aria-pressed="${!u.sn}">Toutes</button><button data-act="tri-sn" data-v="1" aria-pressed="${u.sn}">Fréquentes au Sénégal (${nSn})</button></div>
    <label class="field">Appareil<select id="triSys" data-input="tri-sys"><option value="all" ${u.sys==='all'?'selected':''}>Tous les appareils</option>${Object.entries(TRI_SYS).map(([k,l])=>`<option value="${k}" ${u.sys===k?'selected':''}>${esc(l)} (${TRIADES.filter(x=>x.sys===k).length})</option>`).join('')}</select></label>
    <div class="search">${I.search}<input type="search" id="triSearch" placeholder="Chercher une triade ou un signe" value="${esc(u.q)}" data-input="tri-q" aria-label="Chercher une triade ou un signe"></div>
    <div class="stack">${nTest?`<button class="btn btn-primary" data-act="start" data-mode="cram" data-scope="tri">Me tester (${nTest} cartes)</button>`:''}
      ${missing?`<button class="btn btn-soft" data-act="tri-add-all">Tout ajouter à mes révisions (${missing})</button>`:''}
      ${mine?`<button class="btn btn-ghost" data-act="tri-del-all">Retirer les triades affichées de mes révisions</button>`:''}</div>
    <p class="small muted">Rien n'entre dans tes révisions sans ton accord : ajoute une triade, toutes, ou aucune. ${mine} triade${mine>1?'s':''} dans tes révisions. En cas de différence, c'est le cours de ton professeur qui fait foi.</p>
   </div>
   <div id="triList" class="stack">${triList()}</div>`;
}

// k : 'm' = manœuvre (comment faire), 's' = signe (ce qu'on voit). t : étapes. nl : résultat normal. r : résultat anormal. v : ce que ça évoque. p : à retenir. ch : leçons liées. m : photos et vidéos.
const EXAMENS = [
// ----- Examen général et peau -----
{id:"pli", sys:"gen", k:"m", n:"Pli cutané", ch:["gen-3","endoc-6","endoc-4"],
 t:["Pincer la peau entre le pouce et l'index, la soulever puis la relâcher.","Siège : abdomen, face antérieure de l'avant-bras ou des cuisses ; chez le sujet âgé, front ou face antérieure du sternum."],
 nl:"Le pli s'efface aussitôt.",
 r:"Le pli reste marqué : il s'efface en 3 à 5 secondes dans une déshydratation modérée, il persiste 5 secondes ou plus dans une déshydratation sévère.",
 v:"Déshydratation extracellulaire (perte d'eau et de sel) : diarrhées, vomissements, diabète décompensé, insuffisance surrénale aiguë.",
 p:"Difficile à interpréter : faussement négatif chez l'enfant, faussement positif chez le sujet âgé et le dénutri (peau moins élastique)."},
{id:"paleur", sys:"gen", k:"s", n:"Pâleur cutanéo-muqueuse", ch:["hemsemio-2"],
 t:["Examiner à la lumière du jour.","Regarder les conjonctives (abaisser la paupière inférieure), la muqueuse de la bouche, la pulpe des doigts, le lit des ongles et les paumes."],
 r:"Muqueuses et paumes décolorées, blanchâtres.",
 v:"Anémie. Pâleur isolée des muqueuses : anémie clinique. Pâleur avec signes neurosensoriels (vertiges, céphalées, bourdonnements d'oreilles) ou physiques (tachycardie, souffle) : syndrome anémique.",
 p:"Sur peau noire, la pâleur se juge surtout aux conjonctives, aux lèvres, aux paumes et aux ongles."},
{id:"ictere", sys:"gen", k:"s", n:"Ictère", ch:["dig-7"],
 t:["Examiner à la lumière du jour : la lumière artificielle masque le jaune.","Regarder les conjonctives, le dessous de la langue et le palais, puis la peau.","Demander la couleur des urines et des selles, et s'il y a un prurit."],
 r:"Coloration jaune des conjonctives (subictère quand seules les conjonctives sont jaunes), puis de la peau.",
 v:"Excès de bilirubine. Urines foncées, selles décolorées et prurit : cholestase (obstacle biliaire, hépatite). Urines claires et selles normales : ictère à bilirubine libre (hémolyse).",
 p:"Seuils de ton cours : subictère de 30 à 50 µmol/L, ictère franc au-delà de 50 µmol/L. Une peau jaune avec des conjonctives blanches n'est pas un ictère (excès de carotène)."},
{id:"cyanose", sys:"gen", k:"s", n:"Cyanose", ch:["cardio-12","cardio-1"],
 t:["Examiner à la lumière du jour les lèvres, la langue, les ongles et les extrémités (doigts, nez, oreilles)."],
 r:"Coloration bleutée de la peau et des muqueuses.",
 v:"Trop d'hémoglobine réduite dans les capillaires (plus de 5 g/dL). Cyanose centrale (lèvres et langue bleues, extrémités chaudes) : manque d'oxygène d'origine respiratoire ou cardiaque. Cyanose périphérique (extrémités froides, langue rose) : bas débit, froid, obstruction d'une artère.",
 p:"Elle peut manquer chez l'anémique sévère : il n'y a pas assez d'hémoglobine pour la produire."},
{id:"godet", sys:"gen", k:"m", n:"Œdème prenant le godet", ch:["cardio-1","cardio-9","nephro-4"],
 t:["Appuyer fermement avec le pouce pendant quelques secondes sur un plan osseux : face antérieure du tibia, cheville, dos du pied ; région lombaire et sacrum chez le malade alité.","Relâcher, regarder, puis passer le doigt sur la zone."],
 r:"Une dépression, le godet, persiste après le retrait du doigt.",
 v:"Œdèmes blancs, mous, indolores, bilatéraux et symétriques = rétention d'eau et de sel : insuffisance cardiaque (prédominent le soir, aux parties déclives), néphropathies glomérulaires (visage et paupières le matin), cirrhose, dénutrition. Œdème d'un seul membre, douloureux, chaud : penser à une phlébite.",
 p:"Chez le malade couché, l'œdème descend vers les lombes et le sacrum : y appuyer aussi. Mesurer les mollets et les chevilles pour le suivi (différence significative au-delà de 2 cm)."},
{id:"hippocratisme", sys:"gen", k:"s", n:"Hippocratisme digital", ch:["dig-6"],
 t:["Regarder les doigts de profil : angle entre l'ongle et la peau à sa base.","Signe de Schamroth : accoler les faces dorsales des dernières phalanges des deux index ; normalement, une petite fenêtre en losange apparaît entre les ongles."],
 r:"Ongles bombés « en verre de montre », bout des doigts élargi « en baguette de tambour », angle de l'ongle effacé, fenêtre de Schamroth disparue.",
 v:"Surtout pulmonaire : cancer bronchique, suppurations (dilatation des bronches, abcès), fibrose. Aussi cardiopathies cyanogènes, endocardite, cirrhose, maladies inflammatoires de l'intestin. Parfois familial, sans maladie."},
{id:"purpura", sys:"gen", k:"m", n:"Purpura et vitropression", ch:["gen-1","nephro-7"],
 t:["Appuyer sur la tache rouge avec une lame de verre transparente (ou un verre) : c'est la vitropression.","Chercher aussi des bulles de sang dans la bouche et un saignement des gencives ou du nez ; prendre la température."],
 r:"La tache ne s'efface pas sous le verre : c'est un purpura (du sang sorti des vaisseaux). Un érythème, lui, s'efface.",
 v:"Purpura plat en points (pétéchies) et en ecchymoses : thrombopénie. Purpura en relief, palpable : vascularite. Purpura avec fièvre : purpura fulminans possible (méningocoque), urgence absolue.",
 p:"Des bulles de sang dans la bouche sont un signe de gravité : risque d'hémorragie grave."},
{id:"angiome", sys:"gen", k:"s", n:"Angiomes stellaires", ch:["dig-5","dig-7"],
 t:["Regarder le visage, le cou, le haut du thorax, les épaules et les bras.","Appuyer sur le point central avec une pointe mousse : l'angiome s'efface, puis se recolore du centre vers la périphérie quand on relâche."],
 r:"Petit point rouge central (une artériole, parfois battante) d'où partent de fins vaisseaux en « pattes d'araignée ».",
 v:"Insuffisance hépatocellulaire (cirrhose surtout), avec l'érythrose palmaire et les ongles blancs. Quelques angiomes isolés sont possibles pendant la grossesse."},
{id:"erythrose", sys:"gen", k:"s", n:"Érythrose palmaire", ch:["dig-5","dig-7"],
 t:["Regarder la paume des deux mains, à la lumière du jour."],
 r:"Rougeur des éminences thénar et hypothénar (les bords de la paume), le centre restant plus clair.",
 v:"Insuffisance hépatocellulaire (cirrhose). Aussi grossesse, hyperthyroïdie."},
{id:"cvc", sys:"gen", k:"m", n:"Circulation veineuse collatérale", ch:["dig-4","cardio-1"],
 t:["Regarder l'abdomen et le thorax en position demi-assise, puis après un effort de toux : les veines se voient mieux.","Sens du courant : vider un segment de veine entre deux index, lever un seul doigt et regarder de quel côté la veine se remplit."],
 r:"Veines sous la peau anormalement visibles et dilatées.",
 v:"Type porte : au-dessus et autour de l'ombilic, le sang va de l'ombilic vers le thorax : hypertension portale (cirrhose) ; « tête de méduse » autour de l'ombilic (syndrome de Cruveilhier-Baumgarten). Type cave inférieure : sur les flancs, le sang monte : obstruction de la veine cave inférieure. Type cave supérieure : sur le thorax, le sang descend : obstruction de la veine cave supérieure."},
{id:"xanthelasma", sys:"gen", k:"s", n:"Xanthélasma", ch:[],
 t:["Regarder l'angle interne des paupières."],
 r:"Plaques jaunâtres, molles, planes ou un peu en relief, à l'angle interne des paupières.",
 v:"Dépôts de cholestérol : rechercher une hypercholestérolémie, facteur de risque cardiovasculaire. Il existe aussi avec un bilan lipidique normal."},
{id:"koilonychie", sys:"gen", k:"s", n:"Koïlonychie", ch:["hemsemio-2"],
 t:["Regarder les ongles de profil ; on peut poser une goutte d'eau sur l'ongle."],
 r:"Ongles minces, cassants, aplatis puis creusés « en cuillère » (la goutte d'eau reste dans le creux).",
 v:"Carence en fer ancienne (anémie ferriprive)."},
// ----- Cœur et vaisseaux -----
{id:"pa", sys:"cardio", k:"m", n:"Mesure de la pression artérielle", ch:["cardio-7","cardio-1"],
 t:["Endroit calme, malade couché ou assis, au repos depuis au moins 10 minutes, à distance d'un effort, d'un repas ou d'un excitant.","Bras nu, soutenu à hauteur du cœur ; brassard adapté, couvrant les 2/3 de la longueur du bras.","Gonfler au-delà de la disparition du pouls, poser le stéthoscope sur l'artère humérale au pli du coude, puis dégonfler lentement.","Première fois : aux deux bras, couché puis assis puis debout ; au moins 2 mesures à 1 ou 2 minutes d'intervalle."],
 nl:"Moins de 140/90 mmHg (optimale : moins de 120/80).",
 r:"Pression systolique de 140 mmHg ou plus et/ou diastolique de 90 mmHg ou plus, confirmée à plusieurs reprises.",
 v:"Hypertension artérielle : grade 1 de 140-159/90-99, grade 2 de 160-179/100-109, grade 3 à partir de 180/110. Éliminer un effet « blouse blanche » par l'automesure ou la MAPA.",
 p:"Systolique : apparition des bruits au dégonflage. Diastolique : disparition des bruits. La méthode palpatoire ne donne qu'une valeur approximative de la systolique."},
{id:"orthostatique", sys:"cardio", k:"m", n:"Recherche d'une hypotension orthostatique", ch:["cardio-7"],
 t:["Mesurer la pression artérielle et le pouls après le repos en position couchée.","Faire lever le malade, puis mesurer à nouveau debout, à 1 minute et à 3 minutes."],
 r:"Baisse de la pression systolique d'au moins 20 mmHg et/ou de la diastolique d'au moins 10 mmHg en position debout.",
 v:"Hypotension orthostatique : médicaments (antihypertenseurs, diurétiques), déshydratation, atteinte nerveuse (diabète), sujet âgé. Cause de malaises et de chutes."},
{id:"pouls", sys:"cardio", k:"m", n:"Palpation des pouls", ch:["cardio-1"],
 t:["Palper avec la pulpe des 2e, 3e et 4e doigts, jamais avec le pouce, en appuyant juste assez pour ne pas sentir son propre pouls ni écraser l'artère.","Toujours comparer les deux côtés : carotidien (un côté à la fois), huméral, radial, fémoral, poplité, tibial postérieur (derrière la malléole interne), pédieux (dos du pied).","Noter la fréquence, la régularité et l'amplitude ; ausculter le trajet des artères."],
 r:"Pouls diminué ou aboli d'un côté ; souffle ou frémissement (thrill) sur le trajet.",
 v:"Pouls aboli : obstruction artérielle en amont (artériopathie des membres inférieurs, embolie). Pouls paradoxal de Kussmaul (diminue ou disparaît à l'inspiration) : tamponnade. Souffle avec thrill : rétrécissement de l'artère ou fistule."},
{id:"ips", sys:"cardio", k:"m", n:"Index de pression systolique (IPS)", ch:["cardio-1"],
 t:["Mesurer la pression systolique au bras (humérale) de façon classique.","Placer un brassard au-dessus de la malléole et une sonde Doppler sur l'artère pédieuse ou tibiale postérieure ; gonfler jusqu'à la disparition du flux, puis dégonfler : la réapparition du flux donne la pression systolique de cheville.","IPS = pression systolique de cheville ÷ pression systolique humérale du même côté."],
 nl:"IPS entre 0,9 et 1,3.",
 r:"IPS inférieur à 0,9, ou supérieur à 1,3.",
 v:"Moins de 0,9 : artériopathie oblitérante des membres inférieurs. Moins de 0,5 : ischémie sévère (critique). Plus de 1,3 : artères incompressibles, calcifiées (médiacalcose : diabète, insuffisance rénale)."},
{id:"turgescence", sys:"cardio", k:"s", n:"Turgescence jugulaire", ch:["cardio-9","cardio-5","cardio-1"],
 t:["Malade en position demi-assise (30 à 45°), tête un peu tournée vers la gauche, cou détendu.","Regarder la veine jugulaire externe droite au-dessus de la clavicule, de préférence en lumière rasante."],
 r:"Veine jugulaire gonflée en permanence, visible au-dessus de la clavicule en position demi-assise.",
 v:"Pression veineuse élevée : insuffisance cardiaque droite, tamponnade, péricardite constrictive, compression de la veine cave supérieure."},
{id:"rhj", sys:"cardio", k:"m", n:"Reflux hépato-jugulaire", ch:["cardio-9","dig-5","dig-7"],
 t:["Malade en position demi-assise à 30-45°, respirant calmement, sans bloquer sa respiration.","Comprimer fermement l'hypochondre droit (ou la région péri-ombilicale droite) avec la paume de la main, pendant une dizaine de secondes.","Regarder la veine jugulaire pendant la compression."],
 r:"La compression fait apparaître ou augmente la turgescence jugulaire ; elle persiste pendant la compression et disparaît quand on relâche.",
 v:"Insuffisance ventriculaire droite (foie cardiaque, foie de stase).",
 p:"Si le malade pousse ou bloque sa respiration, le résultat est faussement positif."},
{id:"harzer", sys:"cardio", k:"m", n:"Signe de Harzer", ch:["cardio-9"],
 t:["Malade couché sur le dos.","Glisser le pouce sous l'appendice xiphoïde, dirigé vers le haut, et faire inspirer profondément."],
 r:"Le pouce sent une impulsion systolique : les battements du ventricule droit.",
 v:"Ventricule droit dilaté : insuffisance ventriculaire droite, hypertension pulmonaire."},
{id:"chocpointe", sys:"cardio", k:"m", n:"Choc de pointe", ch:["cardio-11","cardio-5"],
 t:["Inspection à jour frisant (lumière rasante) : on cherche un soulèvement intermittent et localisé.","Palpation : main droite à plat sur le thorax, puis la pulpe des doigts à l'endroit du choc ; en décubitus latéral gauche si on le sent mal."],
 nl:"Petit choc bref « en chiquenaude », au 4e ou 5e espace intercostal gauche, en dedans de la ligne médio-claviculaire.",
 r:"Choc dévié en bas et en dehors, étalé ; ou choc mal perçu, absent.",
 v:"Dévié en bas et en dehors : gros ventricule gauche (dilatation, hypertrophie). Mal perçu : épanchement péricardique, obésité, emphysème."},
{id:"auscultcoeur", sys:"cardio", k:"m", n:"Auscultation cardiaque : les 4 foyers", ch:["cardio-11","cardio-4"],
 t:["Salle calme, stéthoscope adapté, malade torse nu ; prendre le pouls en même temps pour situer les bruits dans le cycle.","Foyer mitral : à la pointe (choc de pointe). Foyer aortique : 2e espace intercostal droit, au bord du sternum. Foyer pulmonaire : 2e espace intercostal gauche, au bord du sternum. Foyer tricuspide : à la base de l'appendice xiphoïde.","Ausculter dans plusieurs positions : couché sur le dos, en décubitus latéral gauche (foyer mitral), assis penché en avant (foyer aortique)."],
 nl:"Deux bruits, B1 (début de la systole) puis B2 (fin de la systole), sans souffle.",
 r:"Souffle, roulement, bruit surajouté (galop, claquement), bruits assourdis ou éclatants.",
 v:"Souffle systolique au foyer aortique, irradiant vers le cou : rétrécissement aortique. Souffle systolique à la pointe, irradiant vers l'aisselle : insuffisance mitrale. Roulement diastolique à la pointe : rétrécissement mitral. Souffle diastolique le long du bord gauche du sternum : insuffisance aortique."},
{id:"homans", sys:"cardio", k:"m", n:"Signe de Homans", ch:["cardio-1"],
 t:["Malade couché, jambe tendue : faire une flexion dorsale passive du pied (relever la pointe du pied vers la jambe).","Palper aussi les mollets et chercher une diminution du ballottement du mollet par rapport à l'autre côté."],
 r:"Douleur du mollet lors de la flexion dorsale du pied.",
 v:"Thrombose veineuse profonde du membre inférieur (phlébite), surtout avec fièvre modérée, pouls accéléré (pouls grimpant de Mahler) et chaleur locale.",
 p:"Signe peu fiable : son absence n'élimine pas une phlébite. C'est l'échodoppler veineux qui confirme."},
// ----- Poumons et plèvre -----
{id:"vv", sys:"pneumo", k:"m", n:"Vibrations vocales", ch:[],
 t:["Poser la paume de la main à plat sur le thorax.","Faire dire « trente-trois » au malade, d'une voix forte et régulière.","Comparer les deux côtés, de haut en bas, en arrière, sur les côtés et en avant."],
 nl:"Vibration perçue de la même façon des deux côtés.",
 r:"Vibrations augmentées, ou diminuées voire abolies d'un côté.",
 v:"Augmentées : condensation pulmonaire (pneumonie). Diminuées ou abolies : épanchement pleural liquidien (pleurésie) ou gazeux (pneumothorax), atélectasie."},
{id:"percussion", sys:"pneumo", k:"m", n:"Percussion du thorax", ch:[],
 t:["Poser le majeur de la main gauche bien à plat dans un espace intercostal, les autres doigts soulevés.","Frapper sa 2e phalange avec le bout du majeur droit replié, par un mouvement souple du poignet : deux coups secs.","Comparer les deux côtés, de haut en bas."],
 nl:"Sonorité.",
 r:"Matité (son mat, comme sur la cuisse) ou tympanisme (son creux, plus sonore que la normale).",
 v:"Matité franche et déclive : épanchement pleural liquidien. Matité localisée : condensation pulmonaire. Tympanisme : pneumothorax, emphysème."},
{id:"auscultpoumon", sys:"pneumo", k:"m", n:"Auscultation pulmonaire", ch:[],
 t:["Malade assis, torse nu, respirant bouche ouverte, un peu plus profondément que d'habitude.","Ausculter avec la membrane du stéthoscope, de haut en bas, en comparant à chaque niveau la droite et la gauche, en arrière, sur les côtés et en avant.","Faire tousser pour voir si un bruit anormal change."],
 nl:"Murmure vésiculaire doux, surtout inspiratoire, identique des deux côtés.",
 r:"Murmure diminué ou aboli, souffle, râles (crépitants, ronchi, sibilants), frottement pleural.",
 v:"Crépitants (fins, en fin d'inspiration, comme des cheveux froissés près de l'oreille) : atteinte alvéolaire, pneumonie, œdème pulmonaire. Ronchi (graves, modifiés par la toux) : encombrement des bronches. Sibilants (aigus, sifflants, à l'expiration) : bronches rétrécies, asthme. Frottement (aux deux temps, non modifié par la toux) : atteinte de la plèvre. Murmure aboli : épanchement pleural, pneumothorax."},
// ----- Abdomen et foie -----
{id:"palpabdo", sys:"dig", k:"m", n:"Palpation de l'abdomen", ch:["dig-3","dig-5"],
 t:["Malade couché sur le dos, à plat, bras le long du corps, jambes un peu fléchies pour relâcher la paroi.","Mains réchauffées, posées bien à plat : palper doucement d'abord, puis plus profondément.","Commencer loin de la zone douloureuse et finir par elle, en regardant le visage du malade.","Explorer les 9 régions : hypochondres, flancs, fosses iliaques, épigastre, région ombilicale, hypogastre."],
 nl:"Abdomen souple, indolore, sans masse.",
 r:"Douleur provoquée, défense, contracture, masse, gros foie, grosse rate.",
 v:"Défense : contraction localisée que l'on peut vaincre doucement (irritation péritonéale localisée, par exemple une appendicite). Contracture : ventre dur « de bois », permanent, douloureux, impossible à vaincre : péritonite."},
{id:"murphy", sys:"dig", k:"m", n:"Signe de Murphy", ch:[],
 t:["Malade couché sur le dos. Placer les doigts sous le rebord costal droit, au point vésiculaire (croisement du rebord costal et du bord externe du muscle grand droit).","Appuyer doucement puis demander une inspiration profonde."],
 r:"La douleur bloque brutalement l'inspiration : le malade s'arrête net de respirer.",
 v:"Cholécystite aiguë (inflammation de la vésicule biliaire)."},
{id:"courvoisier", sys:"dig", k:"m", n:"Signe de Courvoisier-Terrier", ch:["dig-7"],
 t:["Placer la main à plat sous le rebord costal droit, à son croisement avec le bord latéral du muscle grand droit.","Demander au malade de respirer profondément."],
 r:"On perçoit une grosse vésicule : une saillie oblongue, mobile avec la respiration, habituellement indolore.",
 v:"Obstacle sur la voie biliaire principale, en aval du canal cystique. Loi de Courvoisier-Terrier : ictère cholestatique + grosse vésicule = cancer de la tête du pancréas, du bas cholédoque ou de l'ampoule de Vater, plutôt qu'un calcul.",
 p:"Signe rare (environ 5 % des cas) mais très évocateur."},
{id:"foie", sys:"dig", k:"m", n:"Palpation du foie et flèche hépatique", ch:["dig-5"],
 t:["Méthode de Chauffard (une main) : examinateur à droite du malade, face à lui, main gauche sous la région lombaire droite, main droite à plat sur l'abdomen, doigts vers le haut. Le malade respire profondément : le bord inférieur du foie vient buter contre la pulpe des doigts.","Méthode de Mathieu (deux mains) : examinateur à la tête du malade, regardant vers ses pieds ; les doigts en crochet sous le rebord costal accrochent le bord inférieur du foie à l'inspiration.","Percussion de haut en bas, de la sonorité du poumon vers la matité du foie, doigts parallèles aux espaces intercostaux : elle situe le bord supérieur. Mesurer la flèche hépatique sur la ligne médio-claviculaire droite."],
 r:"Hépatomégalie : flèche hépatique supérieure à 12 cm. Décrire la surface (régulière ou non), la consistance (molle, ferme, dure), le bord inférieur (mousse ou tranchant), la sensibilité, un reflux hépato-jugulaire, une expansion systolique.",
 v:"Foie ferme à bord tranchant : cirrhose. Foie dur, irrégulier, nodulaire : cancer (primitif ou métastases). Foie ferme, lisse, à bord mousse, sensible, avec reflux hépato-jugulaire : foie cardiaque. Foie lisse et douloureux à la palpation et à l'ébranlement, avec fièvre : abcès (amibien ou à pyogène)."},
{id:"flot", sys:"dig", k:"m", n:"Signe du flot", ch:["dig-3"],
 t:["Malade couché sur le dos.","Un aide applique le bord cubital de sa main sur la ligne médiane de l'abdomen : il bloque la vibration transmise par la paroi.","Donner une chiquenaude sur un flanc, l'autre main posée bien à plat sur le flanc opposé."],
 r:"La main posée sur le flanc opposé perçoit l'onde transmise par le liquide.",
 v:"Ascite libre de moyenne abondance.",
 p:"Il ne peut pas être perçu dans l'ascite de grande abondance : l'abdomen est trop tendu."},
{id:"glacon", sys:"dig", k:"m", n:"Signe du glaçon", ch:["dig-3","dig-5"],
 t:["En cas d'ascite, déprimer brusquement la paroi avec les doigts en regard du foie, de la rate ou d'une masse."],
 r:"L'organe refoulé revient buter contre les doigts, comme un glaçon que l'on enfonce dans l'eau et qui remonte.",
 v:"Ascite avec gros foie, grosse rate ou tumeur mobile. Absent dans l'ascite de grande abondance."},
{id:"matite", sys:"dig", k:"m", n:"Matité déclive et mobile des flancs", ch:["dig-3"],
 t:["Malade couché sur le dos : percuter de l'ombilic vers les flancs.","Puis le tourner sur le côté (décubitus latéral), attendre un peu que le liquide se déplace, et percuter de nouveau."],
 r:"Matité des flancs et de l'hypogastre, à limite supérieure concave vers le haut, encadrant une sonorité autour de l'ombilic. En décubitus latéral, la matité augmente dans le flanc du dessous et le flanc du dessus devient sonore.",
 v:"Ascite libre (matité déclive et mobile). Petite ascite : seule une percussion patiente en décubitus latéral la montre. Grande ascite : matité de tout l'abdomen, ni déclive ni mobile."},
{id:"tr", sys:"dig", k:"m", n:"Toucher rectal", ch:["dig-2","dig-3","gen-6"],
 t:["Expliquer le geste et obtenir l'accord du malade.","Position : couché sur le dos, cuisses fléchies et écartées (ou couché sur le côté, ou à genoux penché en avant).","Inspecter la marge anale, puis introduire doucement l'index ganté et lubrifié ; explorer le canal anal, l'ampoule rectale, la prostate chez l'homme, et le cul-de-sac de Douglas.","Au retrait, regarder le doigtier : sang, glaires, selles noires (méléna)."],
 r:"Masse, induration, douleur ou bombement du cul-de-sac de Douglas, sang ou méléna sur le doigtier.",
 v:"Cancer du rectum, hémorragie digestive (méléna), irritation péritonéale (péritonite, appendicite), ascite (Douglas bombé), anomalie de la prostate.",
 p:"Les touchers pelviens sont systématiques devant un amaigrissement, une hémorragie digestive, une diarrhée ou une ascite : « leur omission est un crime commis contre le malade »."},
// ----- Ganglions et rate -----
{id:"ganglions", sys:"hemato", k:"m", n:"Palpation des aires ganglionnaires", ch:["hemsemio-1","dig-1"],
 t:["Examiner toutes les aires, des deux côtés, en comparant : cervicales (sous-mentale, sous-mandibulaires, jugulo-carotidiennes, spinales), sus-claviculaires, axillaires, épitrochléennes, inguinales, poplitées.","Palper avec la pulpe des doigts, par petits mouvements circulaires ; pour le cou et les creux sus-claviculaires, se placer derrière le malade assis, tête légèrement fléchie."],
 r:"Adénopathie : ganglion augmenté de volume (plus de 1 cm en général). Préciser le siège, la taille, la consistance (molle, ferme, dure), la sensibilité, la mobilité, la répartition, la tendance à la fistulisation.",
 v:"Ganglion douloureux, inflammatoire : infection. Ganglion dur, indolore, fixé : métastase d'un cancer. Plusieurs aires touchées : lymphome, leucémie, VIH, tuberculose (ganglions qui peuvent se fistuliser).",
 p:"Ganglion de Troisier (creux sus-claviculaire gauche) : penser à un cancer abdominal, de l'estomac surtout."},
{id:"troisier", sys:"hemato", k:"s", n:"Ganglion de Troisier", ch:["dig-1","dig-5","hemsemio-1"],
 t:["Malade assis, examinateur derrière lui : palper le creux sus-claviculaire gauche, derrière la clavicule."],
 r:"Ganglion dur, indolore, parfois fixé, dans le creux sus-claviculaire gauche.",
 v:"Métastase d'un cancer abdominal : estomac surtout, aussi pancréas, foie, côlon. Le canal thoracique se jette à gauche, à la base du cou."},
{id:"rate", sys:"hemato", k:"m", n:"Palpation de la rate et classification de Hackett", ch:["hemsemio-3","dig-4"],
 t:["Malade couché sur le dos, ou en décubitus latéral droit.","Main à plat, remonter de la fosse iliaque gauche vers le rebord costal gauche.","Faire inspirer profondément : en fin d'inspiration, le pôle inférieur de la rate vient au contact des doigts."],
 nl:"La rate n'est pas palpable.",
 r:"Splénomégalie : masse de l'hypochondre gauche, superficielle, mobile avec la respiration, à bord antéro-interne crénelé, dirigée en bas et en dedans, sans contact lombaire.",
 v:"Hackett d'après ton cours : 1 sous le grill costal ; 2 n'atteint pas la ligne passant par l'ombilic ; 3 atteint l'ombilic ; 4 atteint la ligne passant par les épines iliaques ; 5 plonge dans la fosse iliaque. Causes : paludisme, hypertension portale, hémolyse, hémopathies, infections.",
 p:"Un gros rein gauche donne le contact lombaire et le ballottement ; la rate, non."},
// ----- Neurologie -----
{id:"rot", sys:"neuro", k:"m", n:"Réflexes ostéo-tendineux", ch:["neuro-1","neuro-2","neuro-7"],
 t:["Malade détendu, membre relâché ; percuter le tendon d'un coup bref de marteau, toujours des deux côtés pour comparer.","Bicipital (C5) au pli du coude ; stylo-radial (C6) à l'extrémité inférieure du radius ; tricipital (C7) au-dessus du coude ; ulnaire (C8) sur la styloïde ulnaire.","Rotulien (L4) : malade assis jambes pendantes, ou couché genou demi-fléchi soutenu sous le creux poplité ; percuter le tendon entre la rotule et la tubérosité tibiale.","Achilléen (S1) : malade à genoux sur une chaise, ou couché, cheville soutenue en demi-flexion ; percuter le tendon d'Achille."],
 nl:"Une seule contraction, la même des deux côtés.",
 r:"Réflexe aboli ou diminué ; ou exagéré : vif (par rapport à l'autre côté), polycinétique (plusieurs réponses), diffusé (contraction d'autres muscles), avec clonus.",
 v:"Aboli ou diminué : lésion de l'arc réflexe (nerf, racine) = syndrome neurogène périphérique. Exagéré : lésion centrale = syndrome pyramidal.",
 p:"À la phase flasque d'une lésion pyramidale brutale, les ROT peuvent être abolis."},
{id:"babinski", sys:"neuro", k:"m", n:"Signe de Babinski", ch:["neuro-1","neuro-2","neuro-7"],
 t:["Malade couché, genoux et chevilles demi-fléchis.","Gratter avec une pointe mousse le bord externe de la plante du pied, d'arrière en avant, du talon vers la base du gros orteil."],
 nl:"Flexion plantaire du gros orteil, avec ou sans flexion des autres orteils.",
 r:"Extension lente et majestueuse du gros orteil, avec ou sans écartement des autres orteils (signe de l'éventail).",
 v:"Lésion de la voie pyramidale en un point quelconque de son trajet : excellente valeur localisatrice.",
 p:"Normal chez le nourrisson avant l'âge de la marche. Au membre supérieur, l'équivalent est le signe de Hoffmann : on relâche brusquement la dernière phalange du majeur fléchie de force, et les autres doigts se fléchissent."},
{id:"clonus", sys:"neuro", k:"m", n:"Clonus et trépidation épileptoïde", ch:["neuro-1","neuro-2","neuro-7"],
 t:["Trépidation épileptoïde du pied : genou un peu fléchi, relever brusquement la pointe du pied (flexion dorsale) et la maintenir.","Clonus de la rotule : jambe tendue et relâchée, saisir la rotule et la basculer brusquement vers le bas."],
 r:"Série de contractions rythmiques qui se répètent tant qu'on maintient l'étirement.",
 v:"Réflexes exagérés : syndrome pyramidal.",
 p:"Quelques secousses qui s'épuisent vite peuvent se voir chez un sujet anxieux ; c'est le clonus inépuisable qui est pathologique."},
{id:"barre", sys:"neuro", k:"m", n:"Manœuvres de Barré et de Mingazzini", ch:["neuro-2"],
 t:["Barré aux membres supérieurs : malade couché sur le dos, bras et avant-bras maintenus au-dessus du plan du lit, doigts écartés, pendant au moins 10 secondes.","Mingazzini aux membres inférieurs : malade couché sur le dos, genoux fléchis maintenus au-dessus du plan du lit pendant au moins 5 secondes.","Toujours comparer les deux côtés."],
 r:"Manœuvre impossible, ou chute brutale ou progressive d'un membre par rapport à l'autre.",
 v:"Déficit moteur du membre qui chute. Préciser la topographie : un membre (monoplégie), les deux membres inférieurs (paraplégie), un hémicorps (hémiplégie), les quatre membres (tétraplégie)."},
{id:"romberg", sys:"neuro", k:"m", n:"Signe de Romberg", ch:["neuro-3","neuro-7"],
 t:["Malade debout, pieds joints, bras le long du corps, regard droit devant.","Observer, puis lui demander de fermer les yeux ; rester prêt à le retenir."],
 r:"Le malade oscille et tombe, ou doit écarter les pieds, quand il ferme les yeux.",
 v:"Romberg vestibulaire : déviation latéralisée du corps, aggravée par la fermeture des yeux, du côté de l'oreille atteinte (avec déviation lente et retardée des index). Romberg proprioceptif : chute dans tous les sens dès la fermeture des yeux, par atteinte de la sensibilité profonde (cordons postérieurs de la moelle, neuropathie).",
 p:"Dans le syndrome cérébelleux, l'instabilité existe déjà les yeux ouverts et n'est pas aggravée par leur fermeture."},
{id:"cervelet", sys:"neuro", k:"m", n:"Épreuves doigt-nez et talon-genou", ch:["neuro-9"],
 t:["Doigt-nez : bras tendu sur le côté, le malade vient toucher le bout de son nez avec l'index, lentement puis vite.","Talon-genou : malade couché, il pose le talon sur le genou opposé puis le fait glisser le long du tibia.","Marionnettes : il fait tourner rapidement ses mains (pronation-supination)."],
 r:"Le geste dépasse le but (dysmétrie), se décompose, tremble en approchant du but ; les marionnettes sont lentes et maladroites (adiadococinésie).",
 v:"Syndrome cérébelleux, du même côté que la lésion du cervelet."},
{id:"meninge", sys:"neuro", k:"m", n:"Raideur de nuque, signes de Kernig et de Brudzinski", ch:["neuro-5"],
 t:["Raideur de nuque : malade couché sur le dos, essayer de fléchir doucement la tête vers le thorax.","Kernig : membres inférieurs tendus ; l'examinateur empaume les deux talons d'une main et s'oppose de l'autre à la flexion des genoux, en essayant de ramener les membres inférieurs à la verticale.","Brudzinski : faire une flexion forcée de la nuque en regardant les membres inférieurs."],
 r:"Raideur : flexion de la nuque impossible, limitée par une contracture douloureuse invincible. Kernig : douleur lombaire vive et flexion des genoux. Brudzinski : la flexion de la nuque réveille la douleur et fait fléchir les jambes sur les cuisses.",
 v:"Syndrome méningé : méningite, hémorragie méningée. Urgence : chercher une fièvre et un purpura ; la ponction lombaire confirme.",
 p:"Autres signes : hyperesthésie cutanée, raie méningitique (une pointe mousse passée sur l'abdomen laisse une raie rouge longue à disparaître)."},
{id:"tonus", sys:"neuro", k:"m", n:"Hypertonie pyramidale ou extrapyramidale", ch:["neuro-2","neuro-9"],
 t:["Mobiliser passivement, lentement puis vite, le coude, le poignet et le genou du malade détendu, en comparant les deux côtés.","Manœuvre de Froment (pour une hypertonie discrète) : pendant qu'on mobilise le poignet du malade, il fait un geste volontaire avec l'autre main (saisir un objet, faire les marionnettes)."],
 r:"Pyramidale (spastique) : résistance qui augmente avec la vitesse et l'amplitude, ne cède pas ; lâché, le membre revient à sa position de repos (élastique). Extrapyramidale (plastique) : résistance d'emblée maximale, qui cède par à-coups (roue dentée), « tuyau de plomb » ; le membre garde la position donnée. Avec la manœuvre de Froment, la rigidité augmente.",
 v:"Spastique : syndrome pyramidal (prédomine sur les fléchisseurs aux membres supérieurs et les extenseurs aux membres inférieurs). Plastique : syndrome extrapyramidal (maladie de Parkinson)."},
{id:"flapping", sys:"neuro", k:"m", n:"Flapping tremor (astérixis)", ch:["neuro-9"],
 t:["Demander au malade de tendre les bras devant lui, poignets relevés (mains en extension), doigts écartés, et de garder la position."],
 r:"Chute lente et brusque de la main, puis retour rapide vers le haut, de façon irrégulière : comme un battement d'ailes.",
 v:"Encéphalopathie hépatique (insuffisance hépatique grave). Aussi insuffisance respiratoire avec hypercapnie, insuffisance rénale sévère."},
{id:"bell", sys:"neuro", k:"s", n:"Signe de Charles Bell", ch:["neuro-3"],
 t:["Demander au malade de fermer les yeux."],
 r:"Du côté paralysé, les paupières ne se ferment pas et le globe oculaire part en haut et en dehors : on voit le blanc de l'œil. Forme discrète : signe des cils de Souques (yeux fermés très fort, les cils restent plus visibles du côté atteint).",
 v:"Paralysie faciale périphérique (nerf facial, VII) : elle touche le haut et le bas du visage. La paralysie faciale centrale ne touche que le bas du visage."},
// ----- Endocrinologie -----
{id:"tabouret", sys:"endoc", k:"m", n:"Signe du tabouret", ch:["endoc-1","endoc-3"],
 t:["Demander au malade, assis sur un tabouret bas (ou accroupi), de se relever sans s'aider de ses mains."],
 r:"Il ne peut pas se relever sans prendre appui avec les mains.",
 v:"Faiblesse des muscles de la racine des cuisses (amyotrophie proximale) : hyperthyroïdie, hypercorticisme (Cushing), hypokaliémie, myopathies."},
{id:"serment", sys:"endoc", k:"m", n:"Épreuve du serment", ch:["endoc-1"],
 t:["Le malade tend les bras en avant, doigts écartés ; on peut poser une feuille de papier sur le dos de ses mains pour mieux voir."],
 r:"Tremblement fin, rapide et régulier des extrémités, exagéré par l'émotion.",
 v:"Thyrotoxicose (hyperthyroïdie, maladie de Basedow)."},
{id:"thyroide", sys:"endoc", k:"m", n:"Examen de la thyroïde", ch:["endoc-1","endoc-2"],
 t:["Inspection de face et de profil ; faire avaler une gorgée d'eau : un goitre monte avec la déglutition.","Palpation : examinateur derrière le malade assis, cou en légère extension ; les doigts de part et d'autre de la trachée, sous le cartilage cricoïde ; refaire avaler.","En cas de goitre : ausculter avec la cloche du stéthoscope à la recherche d'un souffle."],
 nl:"Thyroïde à peine visible, souple.",
 r:"Goitre (augmentation diffuse) ou nodule (tuméfaction localisée). Préciser la taille, la consistance, la sensibilité, la mobilité, un souffle, des ganglions du cou.",
 v:"Goitre diffus avec souffle et signes de thyrotoxicose : maladie de Basedow. Nodule dur, fixé, avec ganglions : craindre un cancer. Goitre douloureux et fièvre : thyroïdite."},
{id:"exophtalmie", sys:"endoc", k:"s", n:"Exophtalmie", ch:["endoc-1"],
 t:["Regarder le malade de face, de profil, et d'en haut (debout derrière lui, en regardant par-dessus son front)."],
 r:"Œil qui fait saillie hors de l'orbite, souvent avec une rétraction de la paupière supérieure (blanc visible au-dessus de l'iris).",
 v:"Bilatérale : orbitopathie de la maladie de Basedow. Unilatérale : penser aussi à une tumeur de l'orbite."},
{id:"chvostek", sys:"endoc", k:"m", n:"Signe de Chvostek", ch:["endoc-3","gen-5"],
 t:["Percuter avec le marteau à réflexes (ou le doigt) la joue, au milieu de la ligne qui va du lobe de l'oreille à la commissure des lèvres (trajet du nerf facial)."],
 r:"Contraction brève de la lèvre supérieure, parfois de l'aile du nez et de la paupière, du même côté.",
 v:"Hyperexcitabilité neuromusculaire (tétanie) : hypocalcémie, hypomagnésémie, alcalose.",
 p:"Il existe chez une partie des sujets normaux : il a moins de valeur que le signe de Trousseau."},
{id:"trousseau", sys:"endoc", k:"m", n:"Signe de Trousseau", ch:["endoc-3","gen-5"],
 t:["Gonfler le brassard du tensiomètre au bras au-dessus de la pression systolique et le laisser 2 à 3 minutes."],
 r:"Contracture de la main « en main d'accoucheur » : doigts tendus et serrés, pouce collé, poignet fléchi.",
 v:"Tétanie : hypocalcémie surtout, hypomagnésémie, alcalose."},
{id:"vergetures", sys:"endoc", k:"s", n:"Vergetures pourpres", ch:["endoc-3"],
 t:["Regarder l'abdomen, les flancs, la racine des cuisses, les seins, les aisselles."],
 r:"Vergetures larges (plus de 5 mm), de couleur pourpre.",
 v:"Hypercorticisme (syndrome de Cushing), avec obésité du visage et du tronc, peau fine, ecchymoses, amyotrophie."},
{id:"melanodermie", sys:"endoc", k:"s", n:"Mélanodermie", ch:["endoc-4"],
 t:["Regarder les zones découvertes et de frottement (visage, mains, coudes, genoux, cicatrices), les plis de la paume, et l'intérieur de la bouche (gencives, face interne des joues)."],
 r:"Peau anormalement foncée, surtout aux plis et aux zones de frottement, avec des taches ardoisées sur la muqueuse de la bouche.",
 v:"Insuffisance surrénale primitive (maladie d'Addison) : l'excès d'ACTH et de MSH fonce la peau.",
 p:"Sur peau noire, comparer avec la couleur habituelle (demander au malade et à sa famille) et chercher surtout les taches de la bouche."},
{id:"monofilament", sys:"endoc", k:"m", n:"Test au monofilament", ch:[],
 t:["Malade couché, yeux fermés ; montrer d'abord le test sur sa main.","Appuyer le monofilament de 10 g perpendiculairement à la peau jusqu'à ce qu'il se courbe, 1 à 2 secondes, sur 3 points de chaque pied : pulpe du gros orteil, têtes du 1er et du 5e métatarsien (pas sur une callosité).","Demander à chaque fois : « Sentez-vous ? »."],
 r:"Le malade ne sent pas le monofilament sur un ou plusieurs points.",
 v:"Neuropathie diabétique avec perte de la sensibilité de protection : pied à risque d'ulcère (mal perforant plantaire). Examiner les pieds et les chaussures à chaque consultation."},
// ----- Reins et voies urinaires -----
{id:"contactlombaire", sys:"nephro", k:"m", n:"Contact lombaire et ballottement rénal", ch:["nephro-4","hemsemio-3"],
 t:["Malade couché sur le dos, jambes un peu fléchies. Une main à plat sous la fosse lombaire, l'autre à plat sur l'abdomen, sous le rebord costal.","Contact lombaire : la main de devant déprime la paroi ; la main de derrière sent la masse venir au contact de la région lombaire.","Ballottement : la main de derrière donne de petites impulsions brèves vers l'avant ; la main de devant sent la masse venir la frapper puis repartir."],
 r:"Une masse donne le contact lombaire et le ballottement.",
 v:"Gros rein : tumeur, polykystose, hydronéphrose. Distingue un gros rein gauche d'une grosse rate (la rate est superficielle, a un bord crénelé et ne donne pas de contact lombaire)."},
{id:"globe", sys:"nephro", k:"s", n:"Globe vésical", ch:["nephro-2","nephro-4"],
 t:["Regarder, palper et percuter l'hypogastre, au-dessus du pubis."],
 r:"Masse médiane au-dessus du pubis, arrondie, convexe vers le haut, mate à la percussion, souvent douloureuse avec un besoin pressant d'uriner. Elle peut être indolore et énorme (2 à 3 litres) dans une rétention chronique.",
 v:"Rétention d'urine : obstacle (adénome ou cancer de la prostate, rétrécissement de l'urètre) ou cause neurologique. En cas de doute (obésité) : échographie."},
{id:"ebranlement", sys:"nephro", k:"m", n:"Douleur à l'ébranlement lombaire", ch:["nephro-4","nephro-6"],
 t:["Malade assis ou couché sur le côté : poser une main à plat sur la fosse lombaire et frapper doucement dessus avec le bord du poing de l'autre main.","Comparer les deux côtés."],
 r:"Douleur vive provoquée d'un côté.",
 v:"Pyélonéphrite aiguë (avec fièvre et signes urinaires), colique néphrétique, abcès du rein."},
// ----- Appareil locomoteur -----
{id:"schober", sys:"rhumato", k:"m", n:"Indice de Schöber", ch:["rhumato-2"],
 t:["Malade debout. Marquer un point A sur l'épineuse de L5 (ou L4), et un point B 10 cm au-dessus.","Lui demander de se pencher en avant au maximum, genoux tendus, puis mesurer la distance entre A et B."],
 nl:"La distance dépasse 10 + 4 cm (plus de 14 cm).",
 r:"Distance de 14 cm ou moins.",
 v:"Raideur du rachis lombaire : spondyloarthrite (spondylarthrite ankylosante), lombalgie aiguë, syndrome rachidien.",
 p:"À compléter par la distance doigts-sol (normale : moins de 20 cm) et, au thorax, l'ampliation thoracique au ruban sous les seins (normale : plus de 5 cm)."},
{id:"lasegue", sys:"rhumato", k:"m", n:"Signe de Lasègue", ch:["rhumato-2"],
 t:["Malade couché sur le dos, membres inférieurs tendus.","Soulever doucement le membre inférieur, jambe tendue, en fléchissant la hanche."],
 r:"La douleur radiculaire du membre inférieur est reproduite. Mesurer l'angle entre le membre et le plan du lit au moment où elle apparaît.",
 v:"Conflit disco-radiculaire : sciatique L5 ou S1 (hernie discale le plus souvent).",
 p:"Une simple douleur lombaire ou une tension derrière la cuisse ne suffit pas : il faut reproduire la douleur radiculaire. Lasègue croisé (douleur du côté malade quand on lève la jambe saine) : très évocateur de hernie discale."},
{id:"leri", sys:"rhumato", k:"m", n:"Signe de Léri", ch:["rhumato-2"],
 t:["Malade couché sur le ventre, genou fléchi à 90°.","Soulever la cuisse (extension de la hanche)."],
 r:"La douleur radiculaire est reproduite à la face antérieure de la cuisse.",
 v:"Conflit disco-radiculaire L3 ou L4 : cruralgie."},
{id:"sonnette", sys:"rhumato", k:"m", n:"Signe de la sonnette", ch:["rhumato-2"],
 t:["Appuyer avec le pouce sur l'espace para-épineux (à côté des épineuses lombaires), du côté douloureux, étage par étage."],
 r:"La pression déclenche la douleur radiculaire le long du membre inférieur.",
 v:"Conflit disco-radiculaire (sciatique ou cruralgie), à l'étage où l'on appuie."},
{id:"sacroiliaques", sys:"rhumato", k:"m", n:"Tests des sacro-iliaques", ch:["rhumato-2"],
 t:["Écartement : malade couché sur le dos, appuyer sur les deux épines iliaques antéro-supérieures.","Rapprochement : malade couché sur le côté, appuyer sur l'aile iliaque.","Appui sur le sacrum : malade couché sur le ventre.","Test de Patrick : malade sur le dos, jambe fléchie, talon posé sur le genou opposé ; appuyer sur le genou fléchi en maintenant de l'autre main l'épine iliaque antéro-supérieure opposée."],
 r:"Le test reproduit la douleur de la fesse (fessalgie).",
 v:"Atteinte des articulations sacro-iliaques : spondyloarthrites, infection."},
{id:"cle", sys:"rhumato", k:"m", n:"Signe de la clé (roulé de la hanche)", ch:["rhumato-2"],
 t:["Malade couché sur le dos.","L'examinateur empaume le membre inférieur à deux mains et lui imprime des mouvements de rotation interne et externe, comme on tourne une clé."],
 r:"La manœuvre reproduit la douleur habituelle du malade (souvent dans l'aine).",
 v:"Atteinte articulaire de la hanche."},
{id:"salutcoxal", sys:"rhumato", k:"m", n:"Manœuvre du salut coxal", ch:["rhumato-2"],
 t:["Malade couché sur le dos : il lève la jambe tendue (flexion de la hanche à 30°).","L'examinateur s'oppose au mouvement en appuyant sur le membre vers le bas."],
 r:"Apparition d'une douleur dans l'aine.",
 v:"Atteinte articulaire de la hanche."},
{id:"clinostatisme", sys:"rhumato", k:"s", n:"Clinostatisme", ch:["rhumato-2"],
 t:["Malade couché sur le dos : lui demander de décoller le talon du lit, jambe tendue."],
 r:"Il ne peut pas décoller le talon, sans aucun déficit neurologique.",
 v:"Atteinte osseuse de la hanche : fracture du col du fémur, ostéolyse du fond du cotyle."},
{id:"chocrotulien", sys:"rhumato", k:"m", n:"Choc rotulien", ch:["rhumato-2"],
 t:["Malade couché sur le dos, genou tendu, quadriceps relâché.","Empaumer les culs-de-sac au-dessus et au-dessous de la rotule pour chasser le liquide sous la rotule.","Avec l'index, appuyer d'un coup sec sur la face antérieure de la rotule."],
 r:"La rotule s'enfonce et vient heurter la trochlée : on sent un choc, puis elle remonte.",
 v:"Épanchement dans le genou (hydarthrose, hémarthrose). La ponction précise la nature du liquide."},
{id:"rabot", sys:"rhumato", k:"m", n:"Signe du rabot", ch:["rhumato-2"],
 t:["Genou tendu, quadriceps relâché : faire glisser la rotule sur la trochlée, transversalement et de haut en bas, en appuyant un peu."],
 r:"Crissement, souvent douloureux.",
 v:"Atteinte fémoro-patellaire (chondropathie, arthrose fémoro-patellaire)."},

// ---------- Réponses écrites ou dites : correction par éléments attendus ----------
// Les éléments attendus sont les passages en gras du verso (ou les trous d'une carte à trous, ou les lignes d'une liste).
// Chaque élément vaut la même part des points ; un élément est trouvé si la plupart de ses mots sont dans la réponse
// (pluriels et petites fautes de frappe acceptés, jamais un mot de sens contraire : hyper/hypo, tachy/brady…).
const ANS_STOP = new Set(('le la les un une des du de d l au aux et ou en a dans par pour sur avec sans ce cet cette ces son sa ses leur leurs qui que qu quoi dont est sont etre il elle ils elles on se ne pas plus tres '+
  'the of and or to in on at for with is are be an by as it its this that from').split(' '));
function ansTokens(s){ return (fold(s).match(/[a-z0-9]+(?:[.,][0-9]+)?/g)||[]).filter(w=>!ANS_STOP.has(w) && (w.length>1 || /\d/.test(w))); }
function lev(a,b){ if(a===b) return 0; const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function tokMatch(t, words){
  if(words.has(t)) return true; if(/\d/.test(t)) return false;
  for(const w of words){ if(/\d/.test(w)) continue;
    if(t.length>=5 && w.length>=5){ const k=Math.max(5, Math.min(t.length,w.length)-2); if(t.slice(0,k)===w.slice(0,k)) return true; }
    if(t.length>=6 && Math.abs(t.length-w.length)<=1 && t[0]===w[0] && lev(t,w)<=1) return true; }
  return false;
}
function ansElements(c){
  if(c.type==='cloze'){ const m=[...String(c.front||'').matchAll(/\{\{(.+?)\}\}/g)].map(x=>x[1].split('::')[0].trim()).filter(Boolean); return m.length?m:null; }
  const back=String(c.back||'');
  const bold=[...new Set([...back.matchAll(/\*\*([^*]+)\*\*/g)].map(x=>x[1].trim()).filter(Boolean))];
  if(bold.length) return bold.slice(0,10);
  const lines=back.split('\n').map(l=>l.trim()).filter(l=>/^[-•]\s/.test(l)).map(l=>l.replace(/^[-•]\s+/,''));
  if(lines.length>=2) return lines.slice(0,10);
  const p=back.replace(/[*_#>`]/g,'').trim(); return p?[p]:null;
}
function engNorm(s){ return fold(s).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim().replace(/^(the|a|an|to) /,''); }
function engSame(a,b){ const x=engNorm(a), y=engNorm(b); if(!x||!y) return false; if(x===y || (' '+x+' ').includes(' '+y+' ')) return true; return lev(x,y)<=Math.max(1,Math.floor(y.length/8)); }
function gradeAnswer(c, text){
  const t=String(text||'').trim(); if(!t) return null;
  if(c.alt && c.alt.length){ const ok=c.alt.some(a=>engSame(t,a)); return {els:[{t:c.alt[0], v:ok?1:0}], frac:ok?1:0, g:ok?3:1, alt:true}; }
  const els=ansElements(c); if(!els) return null;
  const words=new Set(ansTokens(t)), raw=fold(t);
  const res=els.map(e=>{ const tk=ansTokens(e); if(!tk.length) return {t:e, v:raw.includes(fold(e).trim())?1:0};
    const ok=tk.filter(w=>tokMatch(w,words)), n=tk.length, r=ok.length/n;
    const key=tk.find(w=>/\d/.test(w))||tk.reduce((a,w)=>w.length>a.length?w:a,''), hasKey=ok.includes(key); // le nombre, sinon le mot le plus précis (hypertension, et non artérielle), doit y être
    return {t:e, v:n<=3?(ok.length===n?1:hasKey?0.5:0):(r>=0.75?1:hasKey&&r>=0.4?0.5:0)}; });
  const frac=res.reduce((a,e)=>a+e.v,0)/res.length;
  return {els:res, frac, g:frac>=0.85?3:frac>=0.5?2:1};
}

    u.rate=p==='en'?0.9:1; speechSynthesis.speak(u); return true; }catch{ return false; }

function recStart(lang, onText, onEnd){
  if(!SRX) return false;
  try{ recStop(); const r=new SRX(); r.lang=lang; r.interimResults=true; r.continuous=true; r.maxAlternatives=1; let fin='';
    r.onresult=e=>{ let tmp=''; for(let i=e.resultIndex;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal) fin=(fin+' '+tr).trim(); else tmp+=tr; } onText((fin+' '+tmp).trim()); };
    r.onerror=ev=>{ if(ev&&(ev.error==='not-allowed'||ev.error==='service-not-allowed')) toast("Le micro n'est pas autorisé pour XamXam : autorise-le dans les réglages du navigateur.", 4200); };
    r.onend=()=>{ if(REC===r) REC=null; if(onEnd) onEnd(); };

    return {type:'qa', front:c.front.replace(/\{\{(.+?)\}\}/g,'_____')+'\n\n*Complète les blancs.*', choices:[], answer:[], back:dels.map(x=>'**'+x+'**').join(' · '), chap:c.chap||'', card:c.id}; }

// ---------- Cas cliniques progressifs ----------
const CAS_BY = {}; CASES.forEach(x=>{ CAS_BY[x.id]=x; });
UI.cas=null;
function casBest(id){ const e=S.exams['cas-'+id]; return e?bestScore(e):-1; }
function casSheet(){
  const groups={}; CASES.forEach(x=>{ (groups[x.sys]=groups[x.sys]||[]).push(x); });
  return sheetTop('Cas cliniques')+`<p>${CASES.length} cas tirés de tes cours de sémiologie. Les données arrivent étape par étape, comme au lit du malade : tu réponds à l'écrit ou à voix haute, puis tu vois la correction point par point et l'explication.</p>
   ${Object.entries(groups).map(([sys,list])=>`<h3 class="syn-sys">${esc(sys)} <span class="small muted">· ${list.length}</span></h3><div class="menu">${list.map(x=>{ const b=casBest(x.id);
     return `<button data-act="cas-start" data-id="${x.id}">${I.stetho||I.exam}<span><span class="t">${esc(x.n)}</span><span class="d">${plural(x.s.length,'étape')}${b>=0?' · meilleure note : '+fmt20(b):''}</span></span>${I.chev}</button>`; }).join('')}</div>`).join('')}`;
}
function casStart(id){ const x=CAS_BY[id]; if(!x) return; recStop();
  UI.cas={id, i:0, texts:x.s.map(()=>''), res:x.s.map(()=>null), self:x.s.map(()=>null), hint:x.s.map(()=>false), t0:now(), saved:false, rec:false};
  if(UI.sheetStack[UI.sheetStack.length-1]===casRunSheet) paintSheet(); else openSheet(casRunSheet); }
function casPts(k){ const u=UI.cas; if(u.self[k]===true) return 1; if(u.self[k]===false) return 0; const r=u.res[k]; if(!r) return null; return Math.max(0, (r.frac||0)-(u.hint[k]?0.25:0)); }
function casScore(){ const u=UI.cas, x=CAS_BY[u.id]; let s=0; x.s.forEach((_,k)=>{ s+=casPts(k)||0; }); return {s:Math.round(s*100)/100, t:x.s.length}; }
function casSave(){ const u=UI.cas, x=CAS_BY[u.id]; const {s,t}=casScore(); const key='cas-'+u.id;
  const e=S.exams[key]||(S.exams[key]={id:key, kind:'cas', mod:'', title:'Cas clinique · '+x.n, date:'', dur:0, files:[], items:[], attempts:[], created:now(), t:now()});
  if(!u.saved){ u.att={t:now(), score:s, total:t, ms:now()-u.t0}; e.attempts.push(u.att); u.saved=true; }
  else { const a=e.attempts.find(a=>a.t===u.att.t); if(a) a.score=s; u.att.score=s; }
  e.t=now(); saveExams(); }
function casHintText(st){ const els=ansElements({type:'qa', back:st.a})||[]; const f=els[0]||''; const w=f.split(/\s+/)[0]||'';
  return `Pense à ${plural(els.length,'élément')}. Le premier commence par « ${esc(w.slice(0,Math.min(3,w.length)))}… ».`; }
function casRunSheet(){
  const u=UI.cas, x=u&&CAS_BY[u.id]; if(!x) return sheetTop('Cas clinique')+'<p>Cas introuvable.</p>';
  const n=x.s.length, end=u.i>=n;
  let h=sheetTop('Cas clinique')+`<div class="stack" style="gap:4px"><p class="eyebrow">${esc(x.sys)}</p><h2>${esc(x.n)}</h2></div>
   <ol class="cas-steps" aria-label="Étapes du cas">${x.s.map((_,k)=>`<li class="${k<u.i||end?'done':k===u.i?'cur':''}"><span></span>Étape ${k+1}</li>`).join('')}</ol>`;
  x.s.forEach((st,k)=>{ if(k>u.i) return;
    const r=u.res[k];
    h+=`<section class="panel stack cas-step"><p class="eyebrow">Étape ${k+1}</p><p class="cas-d">${esc(st.d)}</p><p style="margin:0"><strong>${esc(st.q)}</strong></p>`;
    if(k===u.i && !end && !r){
      h+=`<label class="field">Ta réponse<textarea id="casText" data-input="cas-text" rows="4" placeholder="Écris ta réponse, ou touche « Parler »…">${esc(u.texts[k])}</textarea></label>
       <div class="row">${SRX?`<button class="btn ${u.rec?'btn-primary':''}" data-act="cas-mic">${u.rec?"J'ai fini de parler":'Parler'}</button>`:''}<button class="btn btn-ghost" data-act="cas-hint" ${u.hint[k]?'disabled':''}>${u.hint[k]?'Indice donné':'Indice (−0,25 point)'}</button></div>
       ${u.hint[k]?`<p class="small cas-hint">${casHintText(st)}</p>`:''}
       <button class="btn btn-primary btn-lg" data-act="cas-check">Valider cette étape</button>`;
    } else if(r){
      h+=`<p class="small" style="margin:0"><strong>Ta réponse :</strong> ${u.texts[k].trim()?esc(u.texts[k]):'<span class="muted">(vide)</span>'}</p>
       ${r.els&&r.els.length?ansElsHTML(r.els):''}
       <div class="hintbox"><p class="eyebrow">Réponse attendue</p><div class="rt">${md(st.a)}</div>${st.x?`<p class="small" style="margin:6px 0 0">${esc(st.x)}</p>`:''}</div>
       <div class="spread" style="flex-wrap:wrap;gap:6px"><span class="small"><strong>${fmtPts(casPts(k)||0)} / 1</strong>${u.hint[k]?' · indice utilisé':''}</span><span class="row" style="gap:6px"><button class="btn ${u.self[k]===true?'btn-primary':'btn-ghost'}" data-act="cas-self" data-k="${k}" data-v="1">J'avais juste</button><button class="btn ${u.self[k]===false?'btn-primary':'btn-ghost'}" data-act="cas-self" data-k="${k}" data-v="0">J'avais faux</button></span></div>
       ${k===u.i&&!end?`<button class="btn btn-primary btn-lg" data-act="cas-next">${k+1<n?'Étape suivante':'Voir mon résultat'}</button>`:''}`;
    }
    h+=`</section>`;
  });
  if(end){ const {s,t}=casScore();
    h+=`<section class="panel stack" style="text-align:center;gap:8px"><p class="eyebrow">Résultat</p><p class="score">${String(Math.round(s/t*200)/10).replace('.',',')}<small>/20</small></p><p class="small">${fmtPts(s)} point${s>1?'s':''} sur ${t} étapes · ${fmtDur(now()-u.t0)}</p></section>
     <div class="row"><button class="btn btn-primary" style="flex:1" data-act="cas-start" data-id="${x.id}">Refaire ce cas</button><button class="btn" style="flex:1" data-act="cas-other">Un autre cas</button></div>
     ${x.ch.filter(c=>CH[c]).map(c=>`<button class="btn btn-ghost" data-act="chap" data-id="${c}">Revoir la leçon : ${esc(CH[c].title)}</button>`).join('')}`;
  }
  return h;
}

// ---------- Analyse d'images : schémas à légender ----------
const SCH_BY = {}; SCHEMAS.forEach(x=>{ SCH_BY[x.id]=x; });
UI.sch=null;
function schHas(id){ return Object.values(S.cards).some(c=>c.sch===id); }
function schSheet(){
  return sheetTop("Analyse d'images")+`<p>Des schémas à légender : touche un repère, choisis sa légende, puis valide. Ensuite, tu peux ajouter une carte par repère à tes révisions.</p>
   <div class="sch-grid">${SCHEMAS.map(x=>`<button class="sch-tile" data-act="sch-start" data-id="${x.id}"><img src="${x.f}" alt="" loading="lazy"><span><strong>${esc(x.n)}</strong><span class="small muted">${esc(x.sys)} · ${plural(x.m.length,'repère')}${schHas(x.id)?' · dans tes révisions':''}</span></span></button>`).join('')}</div>`;
}
function schStart(id){ const x=SCH_BY[id]; if(!x) return; UI.sch={id, pick:x.m.map(()=>''), cur:0, done:false, labels:shuffle(x.m.map(m=>m[2]))};
  if(UI.sheetStack[UI.sheetStack.length-1]===schRunSheet) paintSheet(); else openSheet(schRunSheet); }
function schRunSheet(){
  const u=UI.sch, x=u&&SCH_BY[u.id]; if(!x) return sheetTop("Analyse d'images")+'<p>Schéma introuvable.</p>';
  const ok=u.done?x.m.filter((m,i)=>u.pick[i]===m[2]).length:0;
  return sheetTop(x.n)+`<p class="small muted">${esc(x.note)}</p>
   <div class="sch-img"><img src="${x.f}" alt="${esc(x.n)}, avec ${x.m.length} repères numérotés">${x.m.map((m,i)=>{ const st=u.done?(u.pick[i]===m[2]?'ok':'ko'):(i===u.cur?'cur':'');
     return `<button class="sch-mk ${st}" style="left:${(m[0]/240*100).toFixed(2)}%;top:${(m[1]/180*100).toFixed(2)}%" data-act="sch-mk" data-i="${i}" aria-label="Repère ${i+1}">${i+1}</button>`; }).join('')}</div>
   <section class="panel stack" style="gap:6px">${x.m.map((m,i)=>`<div class="sch-row ${i===u.cur&&!u.done?'cur':''}"><span class="sch-n">${i+1}</span>${u.done
     ?(u.pick[i]===m[2]?`<span class="ok">${esc(m[2])}</span>`:`<span class="ko">${u.pick[i]?'<s>'+esc(u.pick[i])+'</s> · ':''}<strong>${esc(m[2])}</strong></span>`)
     :`<select data-input="sch-pick" data-i="${i}" aria-label="Légende du repère ${i+1}"><option value="">Choisir…</option>${u.labels.map(l=>`<option ${u.pick[i]===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`}</div>`).join('')}</section>
   ${u.done?`<section class="panel" style="text-align:center"><p class="score">${ok}<small>/${x.m.length}</small></p></section>
     <div class="row"><button class="btn btn-primary" style="flex:1" data-act="sch-start" data-id="${x.id}">Recommencer</button>${schHas(x.id)?`<button class="btn" style="flex:1" data-act="sch-del" data-id="${x.id}">Retirer des révisions</button>`:`<button class="btn" style="flex:1" data-act="sch-add" data-id="${x.id}">Ajouter aux révisions</button>`}</div>`
     :`<button class="btn btn-primary btn-lg" data-act="sch-check">Valider mes légendes</button>`}`;
}
async function schAdd(id){ const x=SCH_BY[id]; if(!x||schHas(id)) return 0; let svg='';
  try{ const r=await fetch(x.f); if(!r.ok) throw 0; svg=await r.text(); }catch{ toast("Le schéma n'a pas pu être chargé : vérifie ta connexion."); return 0; }
  x.m.forEach(([cx,cy,label])=>{ const mk=`<circle cx="${cx}" cy="${cy}" r="11" fill="#FFD84D" stroke="#1E1C18" stroke-width="2.5"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1C18">?</text>`;
    saveCard(newCard({type:'qa', front:`**${x.n}**\nQue montre le repère jaune ?`, back:`**${label}**`, img:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('</svg>', mk+'</svg>')), imgSide:'front', sch:id})); });
  return x.m.length; }
function schRemove(id){ let n=0; for(const c of Object.values(S.cards)) if(c.sch===id){ deleteCard(c.id); n++; } return n; }

     x:"Cockcroft et Gault estime la clairance de la créatinine ; on s'en sert surtout pour adapter les doses de médicaments. Elle est moins fiable chez le sujet âgé, obèse ou dénutri. Pour classer une maladie rénale, on préfère le DFG estimé (CKD-EPI)."}; } }},
 {id:'uvp', sys:'rein', n:'Clairance urinaire (U × V / P)', f:'Cl = U × V / P', g(){
   const u=exR(4,16,0.5), vol=exR(0.6,2.6,0.1), p=exR(60,400,5), v=vol*1000/1440, a=u*1000*v/p;
   return {q:`Urines de 24 h : **${exNf(vol,1)} L**, créatinine urinaire **${exNf(u,1)} mmol/L**. Créatininémie **${p} µmol/L**. Calcule la clairance de la créatinine.`, a, d:0, u:'mL/min', tol:0.04, abs:2,
    steps:['V (mL/min) = volume des 24 h (mL) / 1 440', `V = ${exNf(vol*1000,0)} / 1 440 = ${exNf(v,2)} mL/min`, `U et P dans la même unité : U = ${exNf(u,1)} mmol/L = ${exNf(u*1000,0)} µmol/L`, `Cl = U × V / P = ${exNf(u*1000,0)} × ${exNf(v,2)} / ${p} = ${exNf(a,0)} mL/min`],
    x:"U et P doivent être dans la même unité, et V en mL/min (1 440 minutes par jour). Norme : environ 90 à 130 mL/min. Si le recueil des urines de 24 h est incomplet, la clairance est sous-estimée."}; }},
 {id:'dose', sys:'pha', n:'Dose selon le poids', f:'Dose = mg/kg × poids', g(){
   const t=exPick(['para','amox','ceftri','arte']);
   if(t==='para'){ const w=exR(4,40,0.5), a=15*w; return {q:`Enfant de **${exNf(w,1)} kg**. Paracétamol : **15 mg/kg par prise**, toutes les 6 heures. Quelle dose par prise ?`, a, d:0, u:'mg', tol:0.01,
     steps:['Dose par prise = 15 mg/kg × poids', `= 15 × ${exNf(w,1)}`, `= ${exNf(a,0)} mg par prise, soit ${exNf(a*4,0)} mg par jour`], x:"Paracétamol : 15 mg/kg toutes les 6 heures, sans dépasser 60 mg/kg par jour chez l'enfant (ni 4 g par jour chez l'adulte)."}; }
   if(t==='amox'){ const w=exR(5,30,0.5), a=50*w/2; return {q:`Enfant de **${exNf(w,1)} kg**. Prescription : amoxicilline **50 mg/kg/j en 2 prises**. Quelle dose par prise ?`, a, d:0, u:'mg', tol:0.01,
     steps:[`Dose par jour = 50 mg/kg/j × poids = 50 × ${exNf(w,1)} = ${exNf(50*w,0)} mg`, 'Dose par prise = dose par jour / 2', `= ${exNf(a,0)} mg par prise`], x:"Lis bien si la dose est « par jour » ou « par prise ». Une dose par jour se divise ensuite par le nombre de prises."}; }
   if(t==='ceftri'){ const w=exPick([exR(8,35,0.5),exR(45,80)]), raw=100*w, a=Math.min(raw,4000); return {q:`Méningite chez un malade de **${exNf(w,1)} kg**. Ceftriaxone **100 mg/kg/j en 1 injection**, sans dépasser **4 g par jour**. Quelle dose par jour ?`, a, d:0, u:'mg', tol:0.01,
     steps:['Dose = 100 mg/kg/j × poids', `= 100 × ${exNf(w,1)} = ${exNf(raw,0)} mg`, raw>4000?`C'est plus que le maximum : on donne 4 000 mg (4 g)`:`C'est sous le maximum de 4 g : on donne ${exNf(a,0)} mg`], x:"Vérifie toujours la dose maximale : chez le grand enfant et l'adulte, le calcul selon le poids peut la dépasser."}; }
   const w=exR(20,85), a=2.4*w, fl=Math.ceil(a/60); return {q:`Paludisme grave chez un malade de **${w} kg**. Artésunate IV : **2,4 mg/kg** par injection (à H0, H12 et H24, puis une fois par jour). Quelle dose par injection ?`, a, d:0, u:'mg', tol:0.02,
     steps:['Dose = 2,4 mg/kg × poids', `= 2,4 × ${w}`, `= ${exNf(a,0)} mg par injection, soit ${fl} flacon${fl>1?'s':''} de 60 mg`], x:"Artésunate IV : 2,4 mg/kg à H0, H12 et H24, puis une fois par jour jusqu'à ce que le malade puisse avaler, avec un relais oral complet (CTA). Chez l'enfant de moins de 20 kg, l'OMS recommande 3 mg/kg."}; }},
 {id:'perf', sys:'pha', n:'Débit de perfusion', f:'gouttes/min = volume × 20 / minutes', g(){
   const v=exPick([250,500,500,1000,1000,1500,2000]), h=exPick([1,2,4,6,8,12,24]), a=v*20/(h*60);

    steps:['Débit = volume (mL) × 20 / durée (min)', `= ${exNf(v,0)} × 20 / (${h} × 60)`, `= ${exNf(a,1)}, soit environ ${Math.round(a)} gouttes/min`],
    x:"Perfuseur standard : 1 mL = 20 gouttes. Raccourci : gouttes/min = volume (mL) / (3 × heures). Exemple : 1 L en 8 h ≈ 42 gouttes/min. Au pousse-seringue, on raisonne en mL/h : volume / heures."}; }},
 {id:'t12c', sys:'pha', n:'Concentration après plusieurs demi-vies', f:'C = C₀ / 2ⁿ', g(){

   if(Math.random()<0.3) return {q:`Un médicament a une demi-vie de **${th} heures**. Au bout de combien de temps est-il presque entièrement éliminé (environ 97 %) ?`, a:5*th, d:0, u:'heures', abs:0,
     steps:['Il faut environ 5 demi-vies', `= 5 × ${th}`, `= ${5*th} heures`], x:"Après 5 demi-vies, il reste 1/32 du médicament, soit environ 3 %. C'est aussi le temps qu'il faut pour atteindre l'état d'équilibre avec des prises répétées."};

 {id:'vd', sys:'pha', n:'Volume de distribution et dose de charge', f:'Vd = dose / C₀ ; dose de charge = Vd × C', g(){
   if(Math.random()<0.5){ const dose=exPick([100,200,250,400,500,750,1000]), c0=exPick([2,4,5,8,10,12.5,20,25,40]), a=dose/c0;

 {id:'t12', sys:'pha', n:'Demi-vie à partir du Vd et de la clairance', f:'T½ = 0,693 × Vd / Cl', g(){

 {id:'pam', sys:'phy', n:'Pression artérielle moyenne (PAM)', f:'PAM = (PAS + 2 × PAD) / 3', g(){

 {id:'imc', sys:'phy', n:'Indice de masse corporelle (IMC)', f:'IMC = poids / taille²', g(){
   for(let k=0;k<80;k++){ const t=exR(1.48,1.95,0.01), tgt=exPick([exR(15,18,0.1),exR(19,24.5,0.1),exR(25.5,29.5,0.1),exR(30.5,45,0.1)]), w=Math.round(tgt*t*t), a=w/(t*t); if([18.5,25,30].some(b=>Math.abs(a-b)<0.15)) continue;

     ch:{q:'Classe (OMS)', o:['Maigreur (< 18,5)','Corpulence normale (18,5 à 24,9)','Surpoids (25 à 29,9)','Obésité (30 ou plus)'], a:a<18.5?0:a<25?1:a<30?2:3},
     x:"Classes de l'OMS. L'obésité se divise en classe I (30 à 34,9), II (35 à 39,9) et III (40 ou plus). Le tour de taille complète l'IMC pour juger la graisse abdominale."}; } }},
 {id:'sc', sys:'phy', n:'Surface corporelle (Mosteller)', f:'SC = √(taille × poids / 3600)', g(){
   const kid=Math.random()<0.35, t=kid?exR(75,145):exR(150,192), w=Math.round((kid?exR(14.5,18,0.1):exR(18.5,31,0.1))*(t/100)**2), a=Math.sqrt(t*w/3600);
   return {q:`${kid?'Enfant':'Adulte'} de **${t} cm** et **${w} kg**. Calcule sa surface corporelle.`, a, d:2, u:'m²', abs:0.02,
    steps:['SC (m²) = √(taille en cm × poids en kg / 3 600)', `= √(${t} × ${w} / 3 600) = √${exNf(t*w/3600,3)}`, `= ${exNf(a,2)} m²`], x:"Formule de Mosteller. Adulte moyen ≈ 1,7 à 1,9 m². On s'en sert pour doser les chimiothérapies et pour indexer le débit cardiaque ou le DFG (par 1,73 m²)."}; }},
 {id:'dc', sys:'phy', n:'Débit cardiaque', f:'DC = FC × VES', g(){
   const fc=exR(45,140), ves=exR(35,100,5), a=fc*ves/1000;
   return {q:`Fréquence cardiaque **${fc} /min**, volume d'éjection systolique **${ves} mL**. Calcule le débit cardiaque.`, a, d:2, u:'L/min', abs:0.05,
    steps:['DC = FC × VES', `= ${fc} × ${ves} mL = ${exNf(fc*ves,0)} mL/min`, `= ${exNf(a,2)} L/min`], x:"Norme au repos : environ 4 à 8 L/min. Divisé par la surface corporelle, il donne l'index cardiaque (2,5 à 4 L/min/m²). Quand le VES baisse, le cœur compense en accélérant."}; }},
 {id:'fe', sys:'phy', n:"Fraction d'éjection (FE)", f:'FE = (VTD − VTS) / VTD × 100', g(){
   for(let k=0;k<80;k++){ const vtd=exR(90,260,5), fe=exPick([exR(15,38),exR(42,48),exR(52,72)]), vts=Math.round(vtd*(1-fe/100)), a=(vtd-vts)/vtd*100; if([40,50].some(b=>Math.abs(a-b)<1)) continue;

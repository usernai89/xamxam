<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="XamXam : révisions de médecine L3. Cartes, cours, annales d'examen corrigées, hors ligne.">
<meta name="theme-color" content="#F5F0E6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XamXam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>window.XAMXAM_PWA=true;</script>
<title>XamXam Révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@400;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Style « Cahier » : papier, encre, surligneur.
   Mise en page : une colonne de blocs par onglet, barre d'onglets fixe en bas,
   séance de révision et fiches en plein écran par-dessus.
   Clair = cahier (papier crème, encre noire, stylo bleu, surligneur jaune). Sombre = tableau noir (craie).
   Les couleurs ci-dessous sont celles du thème par défaut ; applyTheme() les remplace selon les réglages. */
:root{
  --bg:#F5F0E6; --surface:#FFFCF6; --surface2:#EAE3D4; --fg:#1E1C18; --muted:#6B6558; --line:#DDD5C4; --line2:#B9B09D;
  --accent:#1E1C18; --accent-ink:#FBF7EE; --accent-soft:#E6E0D3; --accent2:#2742A0; --accent2-soft:#E0E4F2;
  --link:#2742A0; --hl:#FFD84D; --hl-ink:#1E1C18; --hl-soft:#FFF3C4;
  --bad:#B3261E; --hard:#8A5A00; --good:#1E6B3A; --easy:#2742A0;
  --bad-soft:#F6E3DF; --hard-soft:#F3E9D2; --good-soft:#DFEEDF; --easy-soft:#E0E4F2;
  --a28:#C9C4B9; --a55:#8D897F; --a78:#55524B;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:var(--font-body);
  --fs:17px; --r:10px; --r-sm:7px; --sp:1.15;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A17; --surface:#1F2521; --surface2:#2A312C; --fg:#ECE7DA; --muted:#A3A597; --line:#333B35; --line2:#4C564E;
    --accent:#ECE7DA; --accent-ink:#161A17; --accent-soft:#343A35; --accent2:#93BDEB; --accent2-soft:#27343D;
    --link:#93BDEB; --hl:#F2C744; --hl-ink:#1E1C18; --hl-soft:#4A4426;
    --bad:#F0958A; --hard:#EBC06A; --good:#8FD3A6; --easy:#93BDEB;
    --bad-soft:#3A2927; --hard-soft:#3A3323; --good-soft:#26372D; --easy-soft:#27343D;
    --a28:#4A504A; --a55:#7F8379; --a78:#B4B3A6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A17; --surface:#1F2521; --surface2:#2A312C; --fg:#ECE7DA; --muted:#A3A597; --line:#333B35; --line2:#4C564E;
  --accent:#ECE7DA; --accent-ink:#161A17; --accent-soft:#343A35; --accent2:#93BDEB; --accent2-soft:#27343D;
  --link:#93BDEB; --hl:#F2C744; --hl-ink:#1E1C18; --hl-soft:#4A4426;
  --bad:#F0958A; --hard:#EBC06A; --good:#8FD3A6; --easy:#93BDEB;
  --bad-soft:#3A2927; --hard-soft:#3A3323; --good-soft:#26372D; --easy-soft:#27343D;
  --a28:#4A504A; --a55:#7F8379; --a78:#B4B3A6;
  color-scheme:dark;
}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);font-optical-sizing:auto;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-0.01em}
h1{font-size:2.125rem;font-weight:700}
h2{font-size:1.4375rem;font-weight:700}
h3{font-size:1.1875rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:0.875rem;color:var(--muted);font-weight:400}
.small{font-size:0.875rem}
.hl{background:var(--hl);color:var(--hl-ink);padding:0 4px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

#app{max-width:640px;margin:0 auto;padding-block:calc(20px*var(--sp)) calc(112px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:calc(20px*var(--sp))}
.view>header{border-bottom:2px solid var(--fg);padding-bottom:calc(12px*var(--sp))}
.stack{display:flex;flex-direction:column;gap:calc(13px*var(--sp))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(17px*var(--sp)) calc(16px*var(--sp))}
.panel>h3{margin-bottom:calc(11px*var(--sp))}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:calc(11px*var(--sp))}
.section-title>.row{flex-wrap:nowrap;flex:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:var(--r-sm);
  border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:700;text-decoration:none;line-height:1.25;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--surface2);border-color:var(--surface2);color:var(--fg)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--link);padding:0 8px;min-height:44px}
.btn-lg{min-height:58px;font-size:1.0625rem;width:100%}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.icon{width:20px;height:20px;flex:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:0;background:transparent;color:var(--fg);flex:none;margin-left:-8px}
.icon-btn svg{width:24px;height:24px}
.danger{color:var(--bad)}

/* Champs */
.field{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:1rem}
.field input,.field select,.field textarea{font-weight:400;font-size:1rem}
.field-hint{font-weight:400;font-size:0.8125rem;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;min-height:50px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
textarea{min-height:130px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}

/* Choix (segments) et filtres : le choix actif est surligné */
.seg{display:flex;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;border-radius:calc(var(--r-sm) - 3px);background:transparent;font-weight:700;font-size:0.9375rem;color:var(--muted);padding:0 6px;line-height:1.2}
.seg button[aria-pressed=true]{background:var(--hl);color:var(--hl-ink)}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:700;font-size:0.9375rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:0.75rem;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ex{background:var(--accent2-soft);color:var(--accent2)}

/* État d'un chapitre : rond vide, à moitié plein, plein, coche verte */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:0.8125rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.pill::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box;flex:none}
.pill.s1{color:var(--fg)}
.pill.s1::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.pill.s2{color:var(--fg)}
.pill.s2::before{background:currentColor}
.pill.s3{color:var(--good)}
.pill.s3::before{content:"✓";width:auto;height:auto;border:0;border-radius:0;font-size:0.9375rem;line-height:1}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line2);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 5px;color:var(--muted);font-size:0.75rem;font-weight:700}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--fg)}
.tab[aria-current=page] svg{stroke-width:2.2}
.tab[aria-current=page]::before{content:"";position:absolute;top:-7px;left:50%;width:36px;height:4px;margin-left:-18px;background:var(--hl);border-radius:0 0 3px 3px}
.tab .dot{position:absolute;top:3px;left:50%;margin-left:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--hl);color:var(--hl-ink);font-size:0.625rem;line-height:17px;font-weight:700;box-shadow:0 0 0 1.5px var(--surface)}

/* Accueil */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.streak{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:4px 0;font-weight:700;color:var(--fg);white-space:nowrap}
.streak svg{width:18px;height:18px;color:#D9641E}
.today{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:calc(19px*var(--sp)) calc(17px*var(--sp));display:flex;flex-direction:column;gap:calc(14px*var(--sp))}
.today .eyebrow{color:inherit;opacity:.75}
.today-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.today-nums .big{display:block;font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums lining-nums;margin-bottom:5px}
.today-nums .lbl{font-size:0.9375rem;opacity:.8}
.today .btn-primary{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.today .btn-ghost{color:inherit;text-decoration:underline;text-underline-offset:4px}
.today-line{font-size:1rem}
.today-line strong{text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:3px;text-underline-offset:5px}
.today .btn-line{background:transparent;border:1.5px solid currentColor;color:inherit;min-height:52px;width:100%}
.today .today-weak{justify-content:flex-start;text-align:left;padding:0;min-height:44px;font-weight:700}
.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.count-grid>label{align-self:end}
.count{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(15px*var(--sp)) calc(14px*var(--sp));display:flex;flex-direction:column;gap:6px}
.count .num{font-family:var(--font-display);font-size:2.125rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.count .num small{font-family:var(--font-body);font-size:0.9375rem;font-weight:700;color:var(--muted);margin-left:2px}
.edt-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:calc(12px*var(--sp)) 0;border-top:1px solid var(--line)}
.edt-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.edt-row:first-of-type{border-top:0}
.edt-time{font-size:0.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.edt-room{font-size:0.8125rem;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:4px;padding:3px 9px}
.edt-row.now .edt-time{color:var(--fg);font-weight:700}
.edt-row.now .edt-time::before{content:"● ";color:var(--bad)}
.mod-prog{display:flex;flex-direction:column;gap:9px;padding:calc(14px*var(--sp)) 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:var(--fg)}
.mod-prog:first-of-type{border-top:0;padding-top:0}
.bar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--surface2);gap:1px}
.bar i{display:block;height:100%}
.bar .b3,.lg3{background:var(--accent)}
.bar .b2,.lg2{background:repeating-linear-gradient(135deg,var(--accent) 0 1.5px,var(--surface2) 1.5px 4.5px)}
.bar .b1,.lg1{background:var(--a28)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:0.8125rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;width:max-content;margin:0 auto}
.heat button{width:18px;height:18px;border-radius:3px;border:0;padding:0;background:var(--surface2)}
.heat .l1{background:var(--a28)}
.heat .l2{background:var(--a55)}
.heat .l3{background:var(--a78)}
.heat .l4{background:var(--accent)}
.heat .today-cell{outline:2px solid var(--accent2);outline-offset:1px}
.heat .future{visibility:hidden}
.exam-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:calc(12px*var(--sp)) 0;border-top:1px solid var(--line)}
.exam-row:first-of-type{border-top:0;padding-top:0}
.exam-row .t{display:block;font-weight:700;line-height:1.3}
.exam-row .m{display:block;font-size:0.8125rem;color:var(--muted);margin-top:3px}
.exam-row .btn{min-height:42px;padding:0 14px;font-size:0.9375rem}

/* Programme */
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
details.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.mod>summary{list-style:none;padding:calc(15px*var(--sp)) 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary .chev{transition:transform .2s}
details.mod[open]>summary .chev{transform:rotate(90deg)}
details.mod[open]>summary{border-bottom:2px solid var(--fg)}
.sub-h{padding:calc(9px*var(--sp)) 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);background:var(--surface2)}
.sub-h h3{font-family:var(--font-body);font-size:0.875rem;font-weight:700;letter-spacing:0}
details.mod>summary+.sub-h{border-top:0}
.chap{display:grid;grid-template-columns:1.9em 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:calc(12px*var(--sp)) 16px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--fg)}
.chap-n{font-size:0.8125rem;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;place-items:center start}
.chap-n svg{width:20px;height:20px;color:var(--fg)}
.chap-t{min-width:0;font-weight:700;font-size:1rem;line-height:1.35}
.chap-meta{display:block;font-weight:400;font-size:0.8125rem;color:var(--muted);margin-top:3px}
.add-chap{width:100%;border:0;border-top:1px dashed var(--line2);background:transparent;color:var(--link);font-weight:700;padding:calc(12px*var(--sp)) 16px;text-align:left;font-size:0.9375rem}

/* Listes de cartes */
.clist{display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:calc(12px*var(--sp)) 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--fg)}
.citem:first-child{border-top:0}
a.citem{text-decoration:none}
.drv-h{font-size:0.8125rem;font-weight:700;color:var(--muted);margin:14px 0 4px;letter-spacing:.02em}
.citem .q{font-weight:700;font-size:1rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.citem .meta{font-size:0.8125rem;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Texte mis en forme */
.rt{line-height:1.55;overflow-wrap:anywhere}
.rt p+p,.rt p+ul,.rt ul+p,.rt p+ol,.rt ol+p{margin-top:.55em}
.rt h4{font-family:var(--font-display);font-size:1.0625rem;margin:1em 0 .35em;color:var(--fg)}
.rt h4:first-child{margin-top:0}
.rt ul,.rt ol{margin:.3em 0;padding-left:1.25em}
.rt li+li{margin-top:.2em}
.rt mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 3px}
.rt strong{font-weight:700}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--fg);color:var(--muted);text-align:center;font-weight:700}
mark.filled{background:var(--hl)!important;color:var(--hl-ink)!important;font-weight:700;padding:0 4px!important}

/* Écrans plein écran (fiches, séance) */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.layer-in{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:calc(18px*var(--sp));padding-block:0 calc(36px + env(safe-area-inset-bottom,0px))}
.layer-top{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:calc(6px + env(safe-area-inset-top,0px)) 0 6px;z-index:2;border-bottom:1px solid var(--line)}
.layer-top h2{flex:1;min-width:0;font-size:1.0625rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{z-index:50}
#sheet2{z-index:55}

/* Séance : la carte est une fiche bristol posée sur une pile */
#session .layer-in{gap:16px;padding-bottom:0}
.sess-bar{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.sess-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sess-counts{display:flex;gap:10px;font-size:0.875rem;font-weight:700;font-variant-numeric:tabular-nums}
.c-new{color:var(--easy)} .c-lrn{color:var(--bad)} .c-rev{color:var(--good)}
.c-time{color:var(--muted)}
.flash{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:calc(18px*var(--sp)) calc(17px*var(--sp));display:flex;flex-direction:column;gap:16px;min-height:46vh;margin-bottom:8px;
  box-shadow:0 5px 0 -2px var(--surface),0 5px 0 -1px var(--line2),0 10px 0 -4px var(--surface),0 10px 0 -3px var(--line2)}
.flash>.spread:first-child{padding-bottom:10px;border-bottom:1.5px solid var(--bad);border-bottom-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.flash .front{font-size:1.3125rem;font-weight:700;line-height:1.4}
.flash .divider{height:0;border-top:1px dashed var(--line2);margin:2px 0}
.flash img{border-radius:var(--r-sm);max-height:38vh;object-fit:contain;align-self:center;background:var(--surface2)}
.hintbox{background:var(--hl-soft);border-left:4px solid var(--hl);border-radius:2px var(--r-sm) var(--r-sm) 2px;padding:13px 15px}
.hintbox .eyebrow{color:var(--fg);font-weight:700;margin-bottom:3px}
.qcm{display:flex;flex-direction:column;gap:10px}
.qcm button{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--fg);min-height:56px;font-weight:400}
.qcm button .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--fg);background:transparent;font-weight:700;font-size:0.8125rem}
.qcm button[aria-pressed=true]{border-color:var(--fg);background:var(--hl-soft)}
.qcm button[aria-pressed=true] .k{background:var(--fg);color:var(--surface)}
.qcm button.ok{border-color:var(--good);background:var(--good-soft)}
.qcm button.ok .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.qcm button.ko{border-color:var(--bad);background:var(--bad-soft)}
.qcm button.ko .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.qcm button.miss{border-style:dashed;border-color:var(--good);background:var(--surface)}
.qcm button.miss .k{background:transparent;border-color:var(--good);color:var(--good)}
.qcm button[disabled]{opacity:1;cursor:default}
.sess-actions{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades.two{grid-template-columns:1fr 1fr}
.grade{border:1.5px solid currentColor;border-radius:var(--r-sm);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:0.9375rem;padding:4px 2px}
.grade small{font-size:0.75rem;font-weight:400}
.g1{background:var(--bad-soft);color:var(--bad)} .g2{background:var(--hard-soft);color:var(--hard)}
.g3{background:var(--good-soft);color:var(--good)} .g4{background:var(--easy-soft);color:var(--easy)}
.tools{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.anim-flip{animation:flip .34s ease}
.anim-fade{animation:fade .3s ease}
@keyframes flip{0%{transform:perspective(900px) rotateY(0)}50%{transform:perspective(900px) rotateY(90deg)}100%{transform:perspective(900px) rotateY(0)}}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.anim-flip,.anim-fade{animation:none}}
.done{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;padding-top:5vh}

/* Examen */
.clock{font-weight:700;font-variant-numeric:tabular-nums;font-size:0.9375rem;white-space:nowrap}
.clock.low{color:var(--bad)}
.qnav{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 1px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qnav::-webkit-scrollbar{display:none}
.qnav button{flex:none;min-width:40px;height:40px;padding:0 6px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:700;font-size:0.875rem;font-variant-numeric:tabular-nums}
.qnav .ans{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.qnav .cur{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.score{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:lining-nums}
.score small{font-size:1.25rem;color:var(--muted);font-weight:700}
.verdict{display:inline-flex;align-items:center;font-size:0.75rem;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.ko{background:var(--bad-soft);color:var(--bad)}
.verdict.todo{background:var(--hard-soft);color:var(--hard)}

/* Internat */
.plan{display:flex;flex-direction:column}
.pl{padding:3px 0;line-height:1.4}
.pl0{font-family:var(--font-display);font-weight:700;font-size:1.0625rem;margin-top:9px}
.pl0:first-child{margin-top:0}
.pl1{padding-left:16px;font-weight:700}
.pl2{padding-left:32px}
.pl3{padding-left:48px;color:var(--muted);font-size:0.9375rem}
.plq{color:var(--muted);font-style:italic;margin-top:6px}
.lz .lz-h1{font-family:var(--font-display);font-size:1.1875rem;font-weight:700;margin:1.3em 0 .5em;padding-bottom:5px;border-bottom:2px solid var(--fg);line-height:1.25}
.lz .lz-h1:first-child{margin-top:0}
.lz .lz-h2{font-family:var(--font-body);font-size:1rem;font-weight:700;margin:1.1em 0 .35em;line-height:1.3}
.lz .lz-h3{font-family:var(--font-body);font-size:0.9375rem;font-weight:700;margin:.9em 0 .25em;color:var(--muted)}
.lz p{margin:.45em 0}
.tbl-mini{overflow-x:auto;margin:.6em 0}
.tbl-mini table{border-collapse:collapse;font-size:0.875rem;width:100%;line-height:1.35}
.tbl-mini th,.tbl-mini td{border:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
.tbl-mini th{background:var(--surface2)}
.fig{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.fig figcaption{font-family:var(--font-display);font-weight:700;margin-bottom:8px}
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;min-width:540px;height:auto}
.lz li.li2{margin-left:1.25em;list-style-type:circle}
.sch text{font-family:var(--font-body);font-size:13px;fill:var(--fg)}
.sch .t{font-weight:700}
.sch .s{font-size:11px;fill:var(--muted)}
.sch .c{text-anchor:middle}
.sch .e{text-anchor:end}
.sch .b{fill:var(--surface);stroke:var(--fg);stroke-width:1.5}
.sch .y{fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5}
.sch .g{fill:var(--surface2);stroke:var(--line2);stroke-width:1.5}
.sch .a{stroke:var(--fg);stroke-width:1.5;fill:none}
.sch .d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.sch .m{fill:var(--fg)}
.sch .sr{stroke:var(--bad)} .sch .tr{fill:var(--bad)}
.sch .sb{stroke:var(--accent2)} .sch .tb{fill:var(--accent2)}
.clock-big{font-family:var(--font-display);font-size:3.25rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.clock-big.low{color:var(--bad)}
.kchips .chip{min-height:38px;height:auto;padding:7px 12px;text-align:left;line-height:1.25;font-weight:400}
.kchips .chip[aria-pressed=true]{font-weight:700}
details.peek{border-top:1px solid var(--line);padding-top:6px}
details.peek>summary{color:var(--link);font-weight:700;cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center}
details.peek>summary::-webkit-details-marker{display:none}

/* Niveaux et matières : chaque matière est un cahier */
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:0.875rem}
.crumbs button{display:inline-flex;align-items:center;gap:3px;min-height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--fg);font-weight:700}
.crumbs button svg{width:15px;height:15px;margin-left:-4px}
.crumbs button[aria-current=page]{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.crumbs>span{color:var(--muted)}
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:calc(18px*var(--sp)) 18px;display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:1.75rem;position:relative}
.hero p{position:relative}
.hero .eyebrow{color:inherit;opacity:.75}
.hero .ecg{position:absolute;right:-12px;top:-2px;width:50%;height:46px;color:var(--hl);opacity:.55;pointer-events:none}
.hero-stats{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hero-stats span{border:1.5px solid currentColor;border-radius:999px;padding:3px 12px;font-weight:700;font-size:0.875rem}
.cahiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.cahiers{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cahier{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:200px;padding:11px 11px 12px 25px;border:0;border-radius:4px 12px 12px 4px;background:var(--c);color:var(--ci);overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.14),0 8px 16px -12px rgba(0,0,0,.55)}
.cahier::before,.mod-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:rgba(0,0,0,.24)}
.cahier::after,.mod-cover::after{content:"";position:absolute;left:5px;top:9px;bottom:9px;border-left:2px dashed rgba(255,255,255,.5)}
.cahier-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:0.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.cahier-top svg{width:16px;height:16px;flex:none}
.cahier-ico{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);color:var(--ci)}
.cahier-ico svg{width:32px;height:32px}
.etq{background:#FFFCF4;color:#1E1C18;border-radius:3px;padding:7px 9px 9px;box-shadow:0 1px 0 rgba(0,0,0,.18);
  background-image:linear-gradient(to bottom,transparent calc(100% - 6px),rgba(39,66,160,.28) calc(100% - 6px),rgba(39,66,160,.28) calc(100% - 5px),transparent calc(100% - 5px))}
.etq-t{font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cahier-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;font-size:0.8125rem;font-weight:700}
.cahier-foot .n{background:rgba(0,0,0,.2);border-radius:999px;padding:2px 10px}
.cahier-bar{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.cahier-bar i{display:block;height:100%;background:var(--hl)}
.cahier.add{align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--muted);border:2px dashed var(--line2);box-shadow:none;padding:12px;font-weight:700}
.cahier.add::before,.cahier.add::after{display:none}
.cahier.add svg{width:30px;height:30px}
.mod-cover{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px 16px 16px 30px;border-radius:4px 14px 14px 4px;background:var(--c);color:var(--ci);overflow:hidden}
.mod-cover h2{font-size:1.4375rem;overflow-wrap:anywhere}
.mod-cover .eyebrow{color:inherit;opacity:.8}
.mod-cover .cahier-bar{grid-column:1/-1}
.subrows{display:flex;flex-direction:column;gap:10px}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;text-align:left;width:100%;padding:13px 14px 13px 16px;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:var(--r-sm);background:var(--surface);color:var(--fg)}
.subrow .st{display:flex;flex-direction:column;gap:3px;min-width:0}
.subrow .t{font-weight:700;line-height:1.3}
.subrow .m{font-size:0.8125rem;color:var(--muted)}
.subrow .bar{grid-column:1/-1;height:6px}
.dotc{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c)}
.listbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.listbox>:first-child{border-top:0}
.add-chap.boxed{border:2px dashed var(--line2);border-radius:var(--r)}
.lvls{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg)}
.lvl.mine{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.lvl-no{width:56px;height:56px;border-radius:4px 12px 12px 4px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.375rem;background:var(--c);color:var(--ci);box-shadow:inset 7px 0 0 rgba(0,0,0,.2)}
.lvl-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.lvl-t strong{font-family:var(--font-display);font-size:1.125rem}
.lvl-t .bar{height:6px;margin-top:4px}
.badge.mine-b{background:var(--hl);color:var(--hl-ink)}
.lvlrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.lvlpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
h3.cyc{font-size:1.0625rem;margin:6px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.lvlpick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border:0;border-radius:4px 10px 10px 4px;background:var(--c);color:var(--ci);font-size:0.6875rem;box-shadow:inset 6px 0 0 rgba(0,0,0,.2)}
.lvlpick strong{font-family:var(--font-display);font-size:1.125rem}
.icopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icopick button{height:44px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);color:var(--fg);display:grid;place-items:center}
.icopick button svg{width:24px;height:24px}
.icopick button[aria-pressed=true]{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}

/* Créer */
.gen-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:11px;background:var(--surface)}
.gen-card[data-off=true]{opacity:.5}
.gen-card textarea{min-height:60px;font-size:0.9375rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.notice{background:var(--surface2);border-radius:var(--r-sm);padding:13px 15px;font-size:0.9375rem}
.notice.warn{background:var(--hard-soft);box-shadow:inset 3px 0 0 var(--hard)}
.stream{white-space:pre-wrap;font-size:0.75rem;color:var(--muted);max-height:120px;overflow:auto}
.menu{display:flex;flex-direction:column}
.menu button{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:calc(13px*var(--sp)) 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--fg)}
.menu button:first-child{border-top:0;padding-top:0}
.menu button:last-child{padding-bottom:0}
.menu svg:first-child{width:24px;height:24px}
.menu .t{font-weight:700;line-height:1.3}
.menu .d{display:block;font-weight:400;font-size:0.8125rem;color:var(--muted);margin-top:2px}

/* Réglages */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.swatch{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--fg);text-align:left;font-weight:700;font-size:0.8125rem;min-width:0}
.swatch[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);background:var(--hl-soft)}
.swatch .dots{display:flex;flex:none}
.swatch .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);display:block}
.swatch .dots i+i{margin-left:-6px}
.colors{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.colors button{width:40px;height:40px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2)}
.colors button[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);padding:2px}
.layout-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:calc(10px*var(--sp)) 0;border-top:1px solid var(--line)}
.layout-row:first-child{border-top:0}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.toggle:checked{background:var(--accent);border-color:var(--accent)}
.toggle:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.toggle:disabled{opacity:.5}
.mini-btn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--fg);display:grid;place-items:center}
.mini-btn svg{width:16px;height:16px}
.mini-btn[disabled]{opacity:.35}
.preview-card{border:1px dashed var(--line2);border-radius:var(--r);padding:12px 12px 20px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:1rem}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.fbars{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:0.875rem}
.fbars .track{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden}
.fbars .track i{display:block;height:100%;background:var(--accent);border-radius:2px}
.sync{display:flex;align-items:flex-start;gap:8px;font-size:0.875rem}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin-top:6px}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--hard)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--bg);
  padding:10px 15px;border-radius:var(--r-sm);font-weight:700;font-size:0.875rem;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.empty{text-align:center;padding:24px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:44px;height:44px;color:var(--fg)}
.week-day{padding:calc(12px*var(--sp)) 0;border-top:1px solid var(--line)}
.week-day:first-child{border-top:0}

/* Fiches syndromes */
.syn-tools{display:flex;flex-direction:column;gap:calc(11px*var(--sp))}
details.syn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.syn>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px*var(--sp)) 16px;cursor:pointer;font-weight:700;font-family:var(--font-display);font-size:1.0625rem;line-height:1.3}
details.syn>summary::-webkit-details-marker{display:none}
details.syn>summary .chev{flex:none;transition:transform .2s}
details.syn[open]>summary .chev{transform:rotate(90deg)}
.syn-body{padding:0 16px calc(16px*var(--sp));display:flex;flex-direction:column;gap:calc(13px*var(--sp))}
.syn-box{border-radius:var(--r-sm);padding:13px 15px;line-height:1.55}
.syn-box.simple{background:var(--hl-soft)}
.syn-box.hosp{background:var(--surface2)}
.syn-box .eyebrow{margin-bottom:5px;font-weight:700;color:var(--fg)}
.syn-body h4{font-size:0.9375rem;margin-bottom:6px}
.syn-body ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.syn-key{border-left:4px solid var(--hl);padding:6px 0 6px 14px;line-height:1.5}
.syn-sys{font-family:var(--font-display);font-size:1.125rem;margin:calc(10px*var(--sp)) 2px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.tbl-wrap table{border-collapse:collapse;min-width:760px;width:100%;font-size:0.9375rem;line-height:1.45}
.tbl-wrap th,.tbl-wrap td{text-align:left;vertical-align:top;padding:11px 13px;border-bottom:1px solid var(--line)}
.tbl-wrap th{position:sticky;top:0;background:var(--surface2);font-size:0.8125rem;color:var(--muted)}
.tbl-wrap td:first-child{font-weight:700;min-width:150px}
.tbl-wrap tr.sysrow td{background:var(--fg);color:var(--surface);font-family:var(--font-display);font-weight:700}
</style>

function parseCurr(txt){
  const out=[]; let lvl='L1', sem=1, m=null;
  for(const raw of txt.split('\n')){ const l=raw.trim(); if(!l) continue;
    if(l[0]==='='){ const [a,b]=l.slice(1).trim().split(/\s+/); lvl=a; sem=+b===2?2:1; m=null; continue; }
    const parts=l.slice(1).split('|').map(x=>x.trim());
    if(l[0]==='#'){ m={id:parts[0], name:parts[1], short:parts[2]||parts[1], icon:parts[3]||'book', color:+parts[4]||0, lvl, sem, subs:[]}; out.push(m); }
    else if(l[0]==='-' && m) m.subs.push({id:parts[0], name:parts[1], ch:parts.slice(2).filter(Boolean)});
  }
  return out;
}

})();

// ---------- Helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const MIN = 6e4, HOUR = 36e5, DAY = 864e5, CUT = 4*HOUR; // la journée de révision commence à 4h
const now = () => Date.now();
const uid = p => (p||'c') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
function dayKey(t=now()){ const d=new Date(t-CUT); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayStart(t=now()){ const d=new Date(t-CUT); d.setHours(0,0,0,0); return d.getTime()+CUT; }
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function midnight(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function daysUntil(d){ return Math.round((midnight(d)-midnight(new Date()))/DAY); }
const fmtD = (d,o) => new Intl.DateTimeFormat('fr-FR',o).format(d);
const fmtLong = d => fmtD(d,{weekday:'long',day:'numeric',month:'long'});
const fmtShort = d => fmtD(d,{day:'numeric',month:'short'});
function plural(n,w,ws){ return n+' '+(n>1?(ws||w+'s'):w); }
function fmtIvl(ms){
  if(ms<HOUR){ const m=Math.max(1,Math.round(ms/MIN)); return m<2?'<1 min':m+' min'; }
  if(ms<DAY*0.9) return Math.round(ms/HOUR)+' h';
  const d=ms/DAY; if(d<30) return Math.round(d)+' j';
  if(d<365) return (Math.round(d/30*10)/10).toString().replace('.',',')+' mois';
  return (Math.round(d/365*10)/10).toString().replace('.',',')+' an';
}
function lum(hex){ const h=hex.replace('#',''); const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)); return .2126*r+.7152*g+.0722*b; }
function mix(a,b,t){ const pa=a.replace('#',''), pb=b.replace('#',''); const o=[0,2,4].map(i=>Math.round(parseInt(pa.substr(i,2),16)*t+parseInt(pb.substr(i,2),16)*(1-t))); return '#'+o.map(v=>pad(v.toString(16))).join(''); }
function inkFor(hex){ return lum(hex)>0.42?'#14111B':'#FFFFFF'; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch{ return false; } }

function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, ms); }

// Markdown léger : ## titres, - listes, 1. listes, **gras**, *italique*, ==surligné==
function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>'); }
function md(text){
  const lines=esc(text||'').split(/\r?\n/); let html='', list=null;
  const close=()=>{ if(list){ html+='</'+list+'>'; list=null; } };
  for(const raw of lines){ const l=raw.trim(); let m;
    if(!l){ close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); html+='<h4>'+inline(m[1])+'</h4>'; continue; }
    if((m=l.match(/^[-•*]\s+(.*)/))){ if(list!=='ul'){ close(); html+='<ul>'; list='ul'; } html+='<li>'+inline(m[1])+'</li>'; continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); html+='<ol>'; list='ol'; } html+='<li>'+inline(m[1])+'</li>'; continue; }
    close(); html+='<p>'+inline(l)+'</p>';
  }
  close(); return html;
}
const clozeFront = s => md(s).replace(/\{\{(.+?)\}\}/g,'<span class="blank">[ … ]</span>');
const clozeBack = s => md(s).replace(/\{\{(.+?)\}\}/g,'<mark class="filled">$1</mark>');
const plain = s => String(s||'').replace(/\{\{(.+?)\}\}/g,'[$1]').replace(/[*#=]/g,'').replace(/\s+/g,' ').trim();

// ---------- Index du programme ----------
const MODS={}, SUBS={}, CH={}, ALLMODS=[];
const byCreated=(x,y)=>(x.created||0)-(y.created||0);
function buildIndex(){
  for(const o of [CH,MODS,SUBS]) for(const k in o) delete o[k];
  ALLMODS.length=0;
  const cus=(S.custom||[]).filter(c=>c && !c.del);
  const cmods=cus.filter(c=>c.kind==='mod').sort(byCreated).map(c=>({id:c.id, name:c.title, short:c.title, lvl:LV[c.lvl]?c.lvl:'L3', sem:c.sem===2?2:1, icon:MI[c.icon]?c.icon:'book', color:+c.color||0, custom:true, subs:[]}));
  for(const m of PROGRAMME.concat(cmods)){ MODS[m.id]=m; ALLMODS.push(m);
    m.allSubs=m.subs.concat(cus.filter(c=>c.kind==='sub'&&c.mod===m.id).sort(byCreated).map(c=>({id:c.id, name:c.title, ch:[], custom:true})));
    for(const s of m.allSubs){ s.mod=m.id; SUBS[s.id]=s;
      const list=s.ch.map((t,i)=>({id:s.id+'-'+(i+1), title:t, sub:s.id, mod:m.id, custom:false}));
      const extra=cus.filter(c=>!c.kind && c.sub===s.id).sort(byCreated).map(c=>({id:c.id, title:c.title, sub:s.id, mod:m.id, custom:true}));
      s.all=list.concat(extra); s.all.forEach((c,i)=>{ c.n=i+1; CH[c.id]=c; });
    }
  }
  buildInt();
}
const allChapters = () => Object.values(CH);

// ---------- État ----------
const S = { cards:{}, progress:{}, notes:{}, custom:[], stats:{days:{}}, prefs:clone(DEFAULT_PREFS), trash:{}, docs:{}, exams:{}, internat:{prog:{}, fiches:{}, tries:{}, custom:[]} };
const LS_KEY='xamxam.v1';
function loadLocal(){
  const raw=lsGet(LS_KEY); if(!raw){ migratePrefs(); return; }
  try{ const d=JSON.parse(raw);
    S.cards=d.cards||{}; S.progress=d.progress||{}; S.notes=d.notes||{}; S.custom=d.custom||[];
    S.stats=d.stats||{days:{}}; S.prefs={...clone(DEFAULT_PREFS), ...(d.prefs||{})}; S.trash=d.trash||{}; S.docs=d.docs||{}; S.exams=d.exams||{};
    S.internat={prog:{}, fiches:{}, tries:{}, custom:[], ...(d.internat||{})};
  }catch{}

// « ui » n'est volontairement pas dans DEFAULT_PREFS : son absence signale des réglages d'avant ce style.
function migratePrefs(){ const p=S.prefs; if(!p.level && (Object.keys(S.progress||{}).length || Object.keys(S.cards||{}).length)){ p.level='L3'; p.levelSem=1; } if(p.ui!==2){ p.theme='cahier'; p.accent=''; p.font='nunito'; p.heads='expressive'; p.radius='soft'; p.density='normal'; p.ui=2; } }
let localTimer;
function saveLocal(){ clearTimeout(localTimer); localTimer=setTimeout(writeLocal, 250); }
function writeLocal(){
  const d={cards:S.cards, progress:S.progress, notes:S.notes, custom:S.custom, stats:S.stats, prefs:S.prefs, trash:S.trash, docs:S.docs, exams:S.exams, internat:S.internat};
  if(!lsSet(LS_KEY, JSON.stringify(d))){ // trop lourd (images) : on garde le texte sur le téléphone, les images restent dans la sauvegarde en ligne
    const light={...d, cards:Object.fromEntries(Object.entries(S.cards).map(([k,c])=>[k, c.img?{...c, img:'', imgCloud:true}:c]))};

// ---------- Sauvegarde en ligne (capacité db) ----------
const W = { db:null, base:'', status:'local', q:new Map(), timers:{}, running:new Set(), active:0, readOnly:false };
const docKeys = ['prefs','progress','stats','trash'];
function refFor(key){
  if(key.startsWith('cards/')) return W.db.doc(W.base+'/main/'+key);
  if(key.startsWith('notes/')) return W.db.doc(W.base+'/main/'+key);
  return W.db.doc(W.base+'/'+key);
}
function docBody(key){
  if(key==='prefs') return {...S.prefs};
  if(key==='progress') return {map:S.progress, custom:S.custom, t:now()};
  if(key==='stats') return {days:S.stats.days};
  if(key==='trash') return {ids:S.trash};
  if(key.startsWith('cards/')){ const c=S.cards[key.slice(6)]; return c?{...c}:null; }
  if(key.startsWith('notes/')){ const id=key.slice(6); const n=S.notes[id]; return n?{...n, id}:null; }
  return null;
}
function cloudPut(key, delay=700){ if(!W.db||W.readOnly) return; W.q.set(key,'set'); queue(key, delay); }
function cloudDel(key){ if(!W.db||W.readOnly) return; W.q.set(key,'del'); queue(key, 300); }
function queue(key, delay){ clearTimeout(W.timers[key]); W.timers[key]=setTimeout(()=>flush(key), delay); }
async function flush(key){
  if(!W.db || W.running.has(key) || !W.q.has(key)) return;
  if(W.active>=4){ W.timers[key]=setTimeout(()=>flush(key), 250); return; }
  const op=W.q.get(key); W.q.delete(key); W.running.add(key); W.active++;
  try{
    const ref=refFor(key);
    if(op==='del') await ref.delete();
    else { const body=docBody(key); if(body && body.imgCloud && !body.img){ const {img, imgCloud, ...rest}=body; await ref.update(rest); } else if(body){ delete body.imgCloud; await ref.set(body); } }
    if(W.status!=='ok') setSync('ok');
  }catch(e){ cloudError(e, key, op); }
  finally{ W.running.delete(key); W.active--; if(W.q.has(key)) queue(key, 400); }
}
function flushAll(){ for(const k of Array.from(W.q.keys())){ clearTimeout(W.timers[k]); flush(k); } }
function cloudError(e, key, op){
  const code=e&&e.code;
  if(code==='unavailable' && !W.q.has(key)){ W.q.set(key,op); queue(key, 1500+Math.random()*1500); setSync('warn'); return; }
  if(code==='quota_exceeded'){ toast('Ta sauvegarde en ligne est pleine : supprime des cartes ou des images.'); setSync('warn'); return; }
  if(code==='invalid_argument' && key.startsWith('cards/')){ toast('Carte trop lourde pour la sauvegarde en ligne : utilise une image plus petite.'); return; }
  if(code==='invalid_argument'){ W.readOnly=true; setSync('local'); return; }
  if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){ W.db=null; setSync('local'); return; }
  setSync('warn');
}
function setSync(s){ W.status=s; const el=$('#syncLine'); if(el) el.outerHTML=syncHTML(); }
function syncHTML(){
  const map={ok:['ok','Synchronisé avec ton compte Claude. Tes cartes te suivent sur tous tes appareils.'],
    connecting:['warn','Connexion à ta sauvegarde en ligne…'], slow:['warn',"La sauvegarde en ligne ne répond pas encore. Tu travailles sur les données de ce téléphone ; elles seront envoyées dès que possible."],
    warn:['warn',"Sauvegarde en ligne momentanément indisponible. Tes changements sont gardés sur ce téléphone."],
    local:['', PWA ? "Tes cartes sont enregistrées sur ce téléphone, sans compte ni connexion. Exporte une sauvegarde chaque semaine pour ne rien perdre."+(S.prefs.lastExport?" Dernière sauvegarde : "+fmtShort(new Date(S.prefs.lastExport))+".":" Aucune sauvegarde pour l'instant.") : "Enregistré sur ce téléphone uniquement. Ouvre l'appli connecté à ton compte Claude pour la sauvegarde en ligne, et exporte régulièrement une copie."]};
  const [cls,txt]=map[W.status]||map.local; return '<p class="sync '+cls+'" id="syncLine"><i></i><span>'+txt+'</span></p>';
}
async function loadAll(coll){
  const out=[]; let last=-1;
  for(let i=0;i<80;i++){
    const snap=await coll.where('created','>',last).orderBy('created').limit(400).get();
    for(const d of snap.docs){ const v=d.data(); if(v) out.push({...clone(v), id:d.id}); }
    if(snap.size<400) break;
    last=snap.docs[snap.docs.length-1].data().created;
  }
  return out;
}
async function cloudInit(){
  const C=window.claude; if(!C||!C.use){ setSync('local'); return; }
  setSync('connecting');
  let db=null, user=null;
  try{ [db,user]=await Promise.all([C.use('db'), C.use('user')]); }catch{}
  if(!db||!user){ setSync('local'); return; }
  let id=null; try{ id=await user.id(); }catch{}
  if(!id){ setSync('local'); return; }
  W.db=db; W.base='data/users/'+id;
  const slow=setTimeout(()=>{ if(W.status==='connecting') setSync('slow'); }, 10000);
  try{
    const docs=await Promise.all(docKeys.map(k=>db.doc(W.base+'/'+k).get()));
    const main=db.doc(W.base+'/main');
    const [cards, notes]=await Promise.all([loadAll(main.collection('cards')), loadAll(main.collection('notes'))]);
    clearTimeout(slow);
    const inc={ prefs:docs[0].exists?clone(docs[0].data()):null, progress:docs[1].exists?clone(docs[1].data()):null,
      stats:docs[2].exists?clone(docs[2].data()):null, trash:docs[3].exists?clone(docs[3].data()).ids:{}, cards, notes };
    const r=mergeData(inc);
    // ce que le téléphone a de plus récent part en ligne
    r.toInc.cards.forEach(cid=>cloudPut('cards/'+cid, 200));
    r.toInc.cardsDel.forEach(cid=>cloudDel('cards/'+cid));
    r.toInc.notes.forEach(nid=>cloudPut('notes/'+nid, 200));
    r.toInc.docs.forEach(k=>cloudPut(k, 200));
    setSync('ok'); writeLocal(); onDataChanged(true);
  }catch(e){ clearTimeout(slow); cloudError(e,'load','set'); if(W.status!=='local') setSync('warn'); }
}

// Fusion "le plus récent gagne". Renvoie ce qui a changé dans chaque sens.
function mergeData(inc){
  const fromInc={cards:[],notes:[],docs:new Set()}, toInc={cards:[],cardsDel:[],notes:[],docs:new Set()};
  // corbeille
  const trash={...S.trash}; let trashChanged=false;
  for(const [k,v] of Object.entries(inc.trash||{})){ if(!trash[k]||v>trash[k]){ trash[k]=v; fromInc.docs.add('trash'); } }
  for(const k of Object.keys(S.trash)){ if(!(inc.trash||{})[k]) { trashChanged=true; } }
  if(trashChanged) toInc.docs.add('trash');
  S.trash=trash;
  // cartes
  const incCards={}; for(const c of inc.cards||[]) incCards[c.id]=c;
  const merged={...S.cards};
  for(const [id,c] of Object.entries(incCards)){
    const l=merged[id];
    if(!l || (c.updated||0)>(l.updated||0) || (l.imgCloud && (c.updated||0)>=(l.updated||0))){ merged[id]=c; fromInc.cards.push(id); }
    else if((l.updated||0)>(c.updated||0)) toInc.cards.push(id);
  }
  for(const id of Object.keys(S.cards)) if(!incCards[id] && !S.cards[id].imgCloud) toInc.cards.push(id);
  for(const [id,t] of Object.entries(trash)){ if(merged[id] && (merged[id].updated||0)<=t){ if(incCards[id]) toInc.cardsDel.push(id); delete merged[id]; } }
  toInc.cards=[...new Set(toInc.cards)].filter(id=>merged[id]); fromInc.cards=fromInc.cards.filter(id=>merged[id]);
  S.cards=merged;
  // notes
  const incNotes={}; for(const n of inc.notes||[]) incNotes[n.id]=n;
  for(const [id,n] of Object.entries(incNotes)){ const l=S.notes[id]; if(!l||(n.t||0)>(l.t||0)){ S.notes[id]={text:n.text||'', t:n.t||0, created:n.created||n.t||now()}; fromInc.notes.push(id); } else if((l.t||0)>(n.t||0)) toInc.notes.push(id); }
  for(const id of Object.keys(S.notes)) if(!incNotes[id]) toInc.notes.push(id);
  toInc.notes=[...new Set(toInc.notes)];
  // progression + chapitres perso
  if(inc.progress){
    const map=inc.progress.map||{};
    for(const [id,v] of Object.entries(map)){ const l=S.progress[id]; if(!l||(v.t||0)>(l.t||0)){ S.progress[id]=v; fromInc.docs.add('progress'); } else if((l.t||0)>(v.t||0)) toInc.docs.add('progress'); }
    for(const id of Object.keys(S.progress)) if(!map[id]) toInc.docs.add('progress');
    const cm={}; for(const c of S.custom) cm[c.id]=c;
    for(const c of inc.progress.custom||[]){ const l=cm[c.id]; if(!l||(c.t||0)>(l.t||0)){ cm[c.id]=c; fromInc.docs.add('progress'); } else if((l.t||0)>(c.t||0)) toInc.docs.add('progress'); }
    const incIds=new Set((inc.progress.custom||[]).map(c=>c.id)); if(S.custom.some(c=>!incIds.has(c.id))) toInc.docs.add('progress');
    S.custom=Object.values(cm);
  } else if(Object.keys(S.progress).length||S.custom.length) toInc.docs.add('progress');
  // stats
  if(inc.stats){
    const days=inc.stats.days||{};
    for(const [k,v] of Object.entries(days)){ const l=S.stats.days[k]; if(!l){ S.stats.days[k]=v; fromInc.docs.add('stats'); continue; }
      const m={r:Math.max(l.r||0,v.r||0), ok:Math.max(l.ok||0,v.ok||0), n:Math.max(l.n||0,v.n||0), ms:Math.max(l.ms||0,v.ms||0)};
      if(m.r!==(l.r||0)||m.ms!==(l.ms||0)||m.n!==(l.n||0)) fromInc.docs.add('stats');
      if(m.r!==(v.r||0)||m.ms!==(v.ms||0)||m.n!==(v.n||0)) toInc.docs.add('stats');
      S.stats.days[k]=m; }
    for(const k of Object.keys(S.stats.days)) if(!days[k]) toInc.docs.add('stats');
  } else if(Object.keys(S.stats.days).length) toInc.docs.add('stats');
  // préférences

const STEPS=[1,10], RSTEPS=[10];
function examCap(){
  if(!S.prefs.capExam) return Infinity;
  const ex=examDate(); if(!ex.set) return Infinity;
  const left=daysUntil(ex.date); return left>2 ? left-1 : Infinity;
}
function nextSrs(srs, g, fuzz=true){
  const s={...srs}; const t=now(); const cap=examCap();
  const reviewIn = ivl => { ivl=Math.min(ivl, Math.max(1,cap)); if(fuzz && ivl>=3) ivl=Math.max(1, Math.round(ivl*(0.95+Math.random()*0.1))); s.ivl=ivl; s.due=dayStart(t)+ivl*DAY; };
  if(s.state==='review'){
    const overdue=Math.max(0,(dayStart(t)-dayStart(s.due||t))/DAY);
    if(g===1){ s.lapses++; s.ease=Math.max(1.3,s.ease-0.2); s.ivl=Math.max(1,Math.round(s.ivl*0.2)); s.state='relearning'; s.step=0; s.due=t+RSTEPS[0]*MIN; }
    else if(g===2){ s.ease=Math.max(1.3,s.ease-0.15); reviewIn(Math.max(s.ivl+1, Math.round(s.ivl*1.2))); }
    else if(g===3){ reviewIn(Math.max(s.ivl+1, Math.round((s.ivl+overdue/2)*s.ease))); }
    else { s.ease+=0.15; reviewIn(Math.max(s.ivl+2, Math.round((s.ivl+overdue)*s.ease*1.3))); }
  } else {
    if(s.state==='new'){ s.state='learning'; s.step=0; }
    const steps = s.state==='relearning'?RSTEPS:STEPS;
    const grad = ivl => { s.state='review'; s.step=0; reviewIn(ivl); };
    if(g===1){ s.step=0; s.due=t+steps[0]*MIN; }
    else if(g===2){ const cur=steps[Math.min(s.step,steps.length-1)]; const d=(s.step===0&&steps.length>1)?(steps[0]+steps[1])/2:cur; s.due=t+d*MIN; }
    else if(g===3){ s.step++; if(s.step>=steps.length) grad(s.state==='relearning'?Math.max(1,s.ivl):1); else s.due=t+steps[s.step]*MIN; }
    else grad(s.state==='relearning'?Math.max(1,s.ivl)+1:4);
  }
  s.reps=(s.reps||0)+1; s.last=t; s.lastGrade=g; return s;
}

async function toJpegBlob(file, max=1600, q=0.8){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return {canvas:c, blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q))};
  } finally { URL.revokeObjectURL(url); }
}
async function compressForCard(file){
  const {canvas}=await toJpegBlob(file, 900, 0.75);
  let q=0.75, data=canvas.toDataURL('image/jpeg', q);
  while(data.length>170000 && q>0.35){ q-=0.1; data=canvas.toDataURL('image/jpeg', q); }
  if(data.length>170000){ const c2=document.createElement('canvas'); c2.width=Math.round(canvas.width*0.7); c2.height=Math.round(canvas.height*0.7); c2.getContext('2d').drawImage(canvas,0,0,c2.width,c2.height); data=c2.toDataURL('image/jpeg',0.6); }
  return data;
}

function normalizeGenerated(arr){
  if(!Array.isArray(arr)){ if(arr&&Array.isArray(arr.cards)) arr=arr.cards; else return []; }
  const out=[];
  for(const x of arr){
    if(!x||typeof x!=='object') continue;
    let type=['qa','cloze','qcm'].includes(x.type)?x.type:'qa';
    const front=String(x.front||x.question||'').trim(); if(!front) continue;
    const c={type, front, back:String(x.back||x.answer_text||x.reponse||'').trim(), hint:String(x.hint||'').trim(), choices:[], answer:[]};
    if(type==='qcm'){
      c.choices=Array.isArray(x.choices)?x.choices.map(s=>String(s).trim()).filter(Boolean).slice(0,6):[];
      let ans=Array.isArray(x.answer)?x.answer:(typeof x.answer==='number'?[x.answer]:[]);
      c.answer=ans.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<c.choices.length);
      if(c.choices.length<2||!c.answer.length){ c.type='qa'; if(c.choices.length) c.back=(c.back?c.back+'\n':'')+c.choices.filter((_,i)=>c.answer.includes(i)).join(' ; '); c.choices=[]; c.answer=[]; }
    }
    if(type==='cloze' && !/\{\{.+?\}\}/.test(front)) c.type='qa';
    out.push(c);
  }
  return out;
}
function parseLoose(text){
  text=String(text||'').trim(); if(!text) return [];
  const a=text.indexOf('['), b=text.lastIndexOf(']');
  if(a>=0&&b>a){ try{ return normalizeGenerated(JSON.parse(text.slice(a,b+1))); }catch{} }
  try{ return normalizeGenerated(JSON.parse(text)); }catch{}
  // lignes "question :: réponse :: astuce" ou séparées par tabulation
  const out=[];
  for(const line of text.split(/\r?\n/)){
    const parts=line.includes('::')?line.split('::'):line.split('\t');
    if(parts.length>=2 && parts[0].trim() && parts[1].trim()){
      const front=parts[0].trim(); out.push({type:/\{\{.+?\}\}/.test(front)?'cloze':'qa', front, back:parts[1].trim(), hint:(parts[2]||'').trim(), choices:[], answer:[]});
    }
  }
  return out;
}

  const hello=(h<5||h>=18)?'Bonsoir':'Bonjour';
  let html=`<header class="home-head"><div class="stack" style="gap:6px"><p class="eyebrow">${esc(fmtLong(new Date()))}</p><h1>${hello}${p.name?' '+esc(p.name):''}</h1></div>
    <button class="streak" data-act="tab" data-tab="me" aria-label="Série de jours de révision">${I.flame}<span class="mono">${streak()}</span><span class="small muted">j</span></button></header>`;
  if(!S.prefs.level) html+=levelPickHome();
  for(const [key,on] of p.home){ if(on && HOME_SECTIONS[key]) html+=homeSection(key); }
  return html;
}
function homeSection(k){
  if(k==='today'){
    const c=counts('all'); const total=Object.keys(S.cards).length;
    if(!total) return `<section class="today"><p class="eyebrow">Révisions du jour</p><h2>Aucune carte pour l'instant</h2>
      <p>Écris tes premières cartes, ou importe ton cours et une annale d'examen.</p>
      <button class="btn btn-primary btn-lg" data-act="tab" data-tab="new">Créer mes premières cartes</button></section>`;
    const n=c.rev+c.lrn+c.nw; const mins=Math.max(1,Math.round(n*avgSec()/60));
    const q=S.prefs.quick||10; const w=weakSpot(); const recent=recentCards('all').length;
    return `<section class="today"><p class="eyebrow">Révisions du jour</p>
      <div class="today-nums"><div><span class="big">${c.rev}</span><span class="lbl">à revoir</span></div><div><span class="big">${c.lrn}</span><span class="lbl">en cours</span></div><div><span class="big">${c.nw}</span><span class="lbl">nouvelles</span></div></div>
      ${n?`<p class="today-line">${c.late?`<strong>${plural(c.late,'carte')} en retard</strong> · `:''}environ ${plural(mins,'minute')}</p>
        <button class="btn btn-primary btn-lg" data-act="start" data-mode="srs" data-scope="all">Commencer</button>
        ${n>8?`<button class="btn btn-line" data-act="start" data-mode="srs" data-scope="all" data-min="${q}">Séance express · ${q} min</button>`:''}`
      :`<p>Tout est à jour. Les prochaines cartes reviendront demain.</p>
        ${recent?`<button class="btn btn-line" data-act="start" data-mode="recent" data-scope="all">Consolider les cartes de la semaine (${recent})</button>`:''}
        <button class="btn btn-ghost" data-act="tab" data-tab="rev">Bachoter un module</button>`}
      ${w?`<button class="btn btn-ghost today-weak" data-act="start" data-mode="hard" data-scope="s:${w.id}">Point faible : ${esc(w.name)} (${plural(w.n,'carte')} à retravailler)</button>`:''}
    </section>`;
  }
  if(k==='internat') return intHomeBlock();
  if(k==='exams'){
    const all=Object.values(S.exams);
    if(!all.length) return `<section class="panel stack"><h3 style="margin:0">Mes examens</h3>
      <p>Ajoute une épreuve des années passées, en fichier ou en photo : tu la refais ici, avec chronomètre, correction et note sur 20.</p>
      <button class="btn btn-soft" data-act="exam-pick">Ajouter un examen</button></section>`;
    const live=all.find(e=>exrLive(e.id)); const rank=e=>e===live?0:(bestScore(e)<0?1:2);
    const list=all.slice().sort((a,b)=>rank(a)-rank(b)||(rank(a)===2?bestScore(a)-bestScore(b):(b.date||'').localeCompare(a.date||''))).slice(0,3);
    return `<section class="panel"><div class="section-title"><h3>Mes examens</h3><button class="btn btn-ghost" data-act="exam-pick">${I.plus} Ajouter</button></div>
      ${list.map(e=>{ const b=bestScore(e), on=e===live;
        return `<div class="exam-row"><button style="text-align:left;padding:0;border:0;background:none;color:inherit;min-width:0" data-act="exam-open" data-id="${e.id}"><span class="t">${esc(e.title)}</span><span class="m">${on?`En cours · question ${EXR.i+1} sur ${EXR.idx.length}`:plural(e.items.length,'question')+' · '+(b>=0?'meilleure note : '+fmt20(b):'pas encore fait')}</span></button>
          <button class="btn ${on||b<0?'btn-primary':''}" data-act="${on?'exr-resume':'exr-start'}" data-id="${e.id}">${on?'Reprendre':b<0?'Faire':'Refaire'}</button></div>`; }).join('')}
      ${all.length>3?`<p class="small muted" style="margin-top:10px">${all.length-3>1?(all.length-3)+' autres examens':'Un autre examen'} dans Programme, dans chaque module.</p>`:''}</section>`;
  }
  if(k==='syn'){
    const mine=Object.values(S.cards).filter(c=>c.syn).length;
    return `<section class="panel stack"><div class="section-title" style="margin-bottom:0"><h3>Fiches syndromes</h3><span class="small muted">${SYNDROMES.length} fiches</span></div>
      <p>Tous les grands syndromes, expliqués deux fois : en mots simples, puis en langage hospitalier. En fiches ou en tableau.</p>
      <div class="row"><button class="btn btn-soft" style="flex:1" data-act="syn-open">Ouvrir les fiches</button>${mine?`<button class="btn" style="flex:1" data-act="start" data-mode="cram" data-scope="syn">Me tester</button>`:''}</div></section>`;
  }
  if(k==='countdown'){
    const st=semStart(), dSem=daysUntil(st), ex=examDate(), dEx=daysUntil(ex.date);
    const revStart=new Date(ex.date); revStart.setDate(revStart.getDate()-10);
    const left = dSem>0 ? `<div class="count"><span class="eyebrow">Rentrée</span><span class="num">${dSem}<small>j</small></span><span class="small muted">${esc(fmtLong(st))}</span></div>`
      : `<div class="count"><span class="eyebrow">Semestre 5</span><span class="num">S${Math.floor(-dSem/7)+1}</span><span class="small muted">semaine de cours</span></div>`;
    const right = `<div class="count"><span class="eyebrow">Examens</span><span class="num">${dEx>=0?'J-'+dEx:'Passés'}</span><span class="small muted">${ex.set?esc(fmtShort(ex.date))+' · révision dès le '+esc(fmtShort(revStart)):'date estimée · <button class="btn-ghost" style="padding:0;min-height:0;border:0;background:none;font-weight:700;color:var(--accent)" data-act="tab" data-tab="me">la fixer</button>'}</span></div>`;
    return `<section class="count-grid">${left}${right}</section>`;
  }
  if(k==='edt'){
    if(!(myLvl()==='L3' && mySem()===1)) return '';
    const d=new Date(); const wd=d.getDay(); const list=EDT[wd]||[];
    const hm=pad(d.getHours())+':'+pad(d.getMinutes());
    const rows=list.map(([a,b,lbl,room,subs])=>`<div class="edt-row ${hm>=a&&hm<b?'now':''}"><div class="edt-main"><span class="edt-time">${a.replace(':00','h')} – ${b.replace(':00','h')}</span>
      <button style="text-align:left;padding:0;border:0;background:none;color:var(--fg);font-weight:700;line-height:1.4" data-act="goto-subs" data-subs="${subs.join(',')}">${esc(lbl)}</button></div>${room?`<span class="edt-room">${esc(room)}</span>`:'<span></span>'}</div>`).join('');
    const before=daysUntil(semStart())>0;
    return `<section class="panel"><div class="section-title"><h3>Cours du jour</h3><button class="btn btn-ghost" data-act="week">La semaine</button></div>
      ${before?`<p class="small muted" style="margin-bottom:8px">Les cours commencent le ${esc(fmtLong(semStart()))}. Voici le programme d'un ${esc(fmtD(d,{weekday:'long'}))}.</p>`:''}
      ${rows||'<p class="muted">Pas de cours aujourd\'hui. Bonne journée pour rattraper un chapitre.</p>'}</section>`;
  }
  if(k==='progress'){
    let rows='';
    for(const m of modsOf(myLvl(),mySem())){
      const chs=modChaps(m); const n=chs.length;
      const st=[0,0,0,0]; chs.forEach(c=>st[statusOf(c.id)]++);
      const nc=Object.values(S.cards).filter(c=>CH[c.chap]&&CH[c.chap].mod===m.id).length;
      const w=i=>n?(st[i]/n*100):0;
      rows+=`<button class="mod-prog" data-act="goto-mod" data-mod="${m.id}"><span class="spread"><strong>${esc(m.short)}</strong><span class="small muted">${n?`${st[2]+st[3]}/${n} appris`:'Pas de chapitre'} · ${plural(nc,'carte')}${m.credits?' · '+m.credits+' cr.':''}</span></span>
        <span class="bar" role="img" aria-label="${st[3]} maîtrisés, ${st[2]} appris, ${st[1]} vus sur ${n}">${st[3]?`<i class="b3" style="width:${w(3)}%"></i>`:''}${st[2]?`<i class="b2" style="width:${w(2)}%"></i>`:''}${st[1]?`<i class="b1" style="width:${w(1)}%"></i>`:''}</span></button>`;
    }
    return `<section class="panel"><div class="section-title"><h3>Progression par matière</h3><span class="small muted">${LV[myLvl()].id} · S${semNo(myLvl(),mySem())}</span></div>${rows}
      <div class="legend" style="margin-top:8px"><span><i class="lg3"></i>Maîtrisé</span><span><i class="lg2"></i>Appris</span><span><i class="lg1"></i>Vu en cours</span></div></section>`;
  }
  if(k==='heatmap'){
    const t=new Date(); const todayK=dayKey();
    const start=new Date(t); start.setHours(12,0,0,0); const dow=(start.getDay()+6)%7; start.setDate(start.getDate()-dow-14*7);
    let cells='';
    for(let i=0;i<15*7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      const r=(S.stats.days[k]||{}).r||0; const fut=k>todayK;
      const l=r===0?'':r<20?'l1':r<50?'l2':r<100?'l3':'l4';
      cells+=`<button class="${l} ${k===todayK?'today-cell':''} ${fut?'future':''}" data-act="heat" data-k="${k}" data-r="${r}" aria-label="${esc(fmtShort(d))} : ${r} cartes" ${fut?'tabindex="-1"':''}></button>`;
    }
    const last30=Object.entries(S.stats.days).filter(([k])=>k>dayKey(now()-30*DAY)).filter(([,v])=>v.r>0).length;
    return `<section class="panel"><div class="section-title"><h3>Calendrier d'activité</h3><span class="small muted">${last30} jours actifs sur 30</span></div>
      <div class="heat-wrap"><div class="heat">${cells}</div></div>
      <div class="legend" style="margin-top:10px"><span>Moins</span><span><i style="background:var(--surface2)"></i><i style="background:var(--a28)"></i><i style="background:var(--a55)"></i><i style="background:var(--a78)"></i><i style="background:var(--accent)"></i></span><span>Plus</span></div></section>`;
  }
  if(k==='plan'){
    const chs=modsOf(myLvl(),mySem()).flatMap(modChaps); const remaining=chs.filter(c=>statusOf(c.id)<2).length;
    const ex=examDate(); const revStart=new Date(ex.date); revStart.setDate(revStart.getDate()-10);
    const from=daysUntil(semStart())>0?semStart():new Date();
    const days=Math.max(1, Math.round((midnight(revStart)-midnight(from))/DAY));
    const perWeek=Math.ceil(remaining/days*7);
    const tomorrow=Object.values(S.cards).filter(c=>!c.suspended&&c.srs.state!=='new'&&c.srs.due>=dayStart()+DAY&&c.srs.due<dayStart()+2*DAY).length;
    return `<section class="panel"><div class="section-title"><h3>Rythme conseillé</h3></div>
      <p>Il te reste <strong>${plural(remaining,'chapitre')}</strong> à apprendre et <strong>${plural(days,'jour')}</strong> avant la période de révision${ex.set?'':' (date estimée)'}.</p>
      <p style="margin-top:6px">Objectif : <strong>${perWeek} chapitres par semaine</strong>, soit environ ${Math.max(1,Math.round(perWeek/6))} par jour de cours. Marque un chapitre « Appris » quand tu le maîtrises.</p>
      <p class="small muted" style="margin-top:8px">${plural(tomorrow,'carte')} à revoir demain.</p></section>`;
  }
  return '';
}
function weekSheet(){
  const days=['','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  let body='';
  for(let d=1; d<=6; d++){
    body+=`<div class="week-day"><h3 style="margin-bottom:4px">${days[d]}</h3>`+(EDT[d]||[]).map(([a,b,lbl,room])=>`<div class="edt-row"><div class="edt-main"><span class="edt-time">${a.replace(':00','h')} – ${b.replace(':00','h')}</span><span>${esc(lbl)}</span></div>${room?`<span class="edt-room">${esc(room)}</span>`:'<span></span>'}</div>`).join('')+'</div>';
  }
  return sheetTop('Emploi du temps')+`<section class="panel">${body}</section>
    <div class="notice small">Le matin (8h–12h), 3 semaines à raison de 4 h par semaine et par groupe sont réservées au TP d'hématologie. Salles : SP, NB, Auditorium.</div>
    <section class="panel"><h3>Examens du semestre</h3><div class="kv" style="margin-top:8px">

      <span>Pharmacologie – Botanique</span><b>6 cr.</b><span>Sémiologie médicale</span><b>6 cr.</b><span>Stage</span><b>4 cr.</b></div></section>`;
}

   </section>
   ${c.custom?`<button class="btn danger" data-act="del-chap" data-id="${id}">Supprimer ce chapitre</button>`:''}`;

function cardRow(c){
  const s=c.srs; let when;
  if(c.suspended) when='Suspendue';
  else if(s.state==='new') when='Nouvelle';
  else if(isLearning(c)) when='En apprentissage';
  else when='Revient le '+fmtShort(new Date(s.due));
  const tl={qa:'Q/R',cloze:'Trous',qcm:'QCM'}[c.type]||'Q/R';
  return `<button class="citem" data-act="edit-card" data-id="${c.id}"><span style="min-width:0"><span class="q">${esc(plain(c.front))}</span><span class="meta"><span class="badge">${tl}</span>${c.example?'<span class="badge ex">Exemple</span>':''}${c.exam?'<span class="badge">'+esc(annLabel(c.exam))+'</span>':''}${c.img||c.imgCloud?'<span class="badge">Image</span>':''}<span>${esc(when)}</span></span></span>${I.chev}</button>`;
}

function scopeOptions(sel, withNone){
  let o=withNone?`<option value="" ${!sel?'selected':''}>Sans chapitre</option>`:`<option value="all" ${sel==='all'?'selected':''}>Tout le programme</option>`;
  for(const m of myScopeMods()){
    o+=`<optgroup label="${esc(m.name)}${m.lvl!==myLvl()?' ('+m.lvl+')':''}">`;
    if(!withNone) o+=`<option value="m:${m.id}" ${sel==='m:'+m.id?'selected':''}>${esc(m.name)} (tout)</option>`;
    for(const s of m.allSubs){
      if(!withNone && m.allSubs.length>1) o+=`<option value="s:${s.id}" ${sel==='s:'+s.id?'selected':''}>${esc(s.name)} (tout)</option>`;
      for(const c of s.all){ const v=withNone?c.id:'c:'+c.id; o+=`<option value="${v}" ${sel===v?'selected':''}>${withNone?esc(s.name.replace('Sémiologie ','Sémio. '))+' · ':'   '}${pad(c.n)}. ${esc(c.title)}</option>`; }
    }
    o+='</optgroup>';
  }
  const exams=withNone?[]:Array.from(new Set(Object.values(S.cards).map(c=>c.exam).filter(Boolean))).sort().reverse();
  if(exams.length){ o+=`<optgroup label="Annales d'examen"><option value="exam" ${sel==='exam'?'selected':''}>Toutes les annales</option>`; for(const e of exams) o+=`<option value="e:${esc(e)}" ${sel==='e:'+e?'selected':''}>${esc(annLabel(e))}</option>`; o+='</optgroup>'; }
  if(!withNone && Object.values(S.cards).some(c=>c.syn)) o+=`<option value="syn" ${sel==='syn'?'selected':''}>Fiches syndromes (toutes)</option>`;
  return o;
}
function viewRev(){

    cram:"Toutes les cartes de la sélection, mélangées, sans toucher au planning. Idéal pendant les 10 jours de révision ou la veille d'un examen.",
    recent:'Les cartes créées ces 7 derniers jours, mélangées, sans toucher au planning. Parfait le week-end pour consolider les leçons de la semaine.',
    hard:'Seulement les cartes que tu as déjà ratées ou trouvées difficiles.'}[r.mode];
  const n= r.mode==='srs'? cnt.rev+cnt.lrn+cnt.nw : r.mode==='cram'? pool.length : r.mode==='recent'? recent : hard;

   <section class="panel stack">
    <div class="seg grid2" role="group" aria-label="Mode">${modes.map(([k,l])=>`<button data-act="rev-mode" data-m="${k}" aria-pressed="${r.mode===k}">${l}</button>`).join('')}</div>
    <p class="small muted">${desc}</p>
    <label class="field">Quoi réviser<select id="revScope" data-input="rev-scope">${scopeOptions(r.scope)}</select></label>
    ${r.mode==='srs'?`<div class="sess-counts" aria-label="À faire"><span class="c-rev">${cnt.rev} à revoir</span><span class="c-lrn">${cnt.lrn} en cours</span><span class="c-new">${cnt.nw} nouvelles</span></div>`:`<p class="small"><strong>${plural(n,'carte')}</strong> dans cette sélection</p>`}
    <button class="btn btn-primary btn-lg" data-act="start" data-mode="${r.mode}" data-scope="${esc(r.scope)}" ${n?'':'disabled'}>${n?'Commencer':'Rien à réviser ici'}</button>
    ${r.mode==='srs'&&n>8?`<button class="btn" data-act="start" data-mode="srs" data-scope="${esc(r.scope)}" data-min="${q}">Séance express · ${q} min</button>`:''}
   </section>
   <section class="panel"><div class="section-title"><h3>Mes cartes</h3><div class="row" style="gap:4px"><button class="btn btn-ghost" data-act="share-scope">Partager</button><button class="btn btn-ghost" data-act="edit-card">${I.plus} Nouvelle</button></div></div>
    <div class="search" style="margin-bottom:8px">${I.search}<input type="search" id="cardSearch" placeholder="Chercher dans mes cartes" value="${esc(r.q)}" data-input="card-q" aria-label="Chercher dans mes cartes"></div>
    <div id="cardResults">${cardResults()}</div></section>`;
  return html;
}
function cardResults(){
  const q=UI.rev.q.trim().toLowerCase();
  let list=Object.values(S.cards).filter(c=>inScope(c,UI.rev.scope));
  if(q) list=list.filter(c=>(c.front+' '+c.back+' '+c.hint+' '+(c.choices||[]).join(' ')).toLowerCase().includes(q));
  list.sort((a,b)=>(b.updated||0)-(a.updated||0));
  if(!list.length) return `<p class="muted small">${q?'Aucune carte ne contient ce mot.':'Aucune carte dans cette sélection.'}</p>`;
  return `<div class="clist">${list.slice(0,60).map(cardRow).join('')}</div>${list.length>60?`<p class="small muted">${list.length-60} autres : précise ta recherche.</p>`:''}`;
}

function viewNew(){

// ---------- Feuilles (plein écran) ----------
function sheetTop(title){ return `<div class="layer-top"><button class="icon-btn" data-act="sheet-back" aria-label="Retour">${I.back}</button><h2>${esc(title)}</h2></div>`; }
function openSheet(fn){ UI.sheetStack.push(fn); paintSheet(); }
function paintSheet(keepScroll){
  const el=$('#sheet'); const fn=UI.sheetStack[UI.sheetStack.length-1];
  if(!fn){ el.hidden=true; document.body.style.overflow=$('#session').hidden?'':'hidden'; histSync(); return; }
  const y=el.scrollTop; $('#sheetIn').innerHTML=fn(); el.hidden=false; document.body.style.overflow='hidden';
  el.scrollTop=keepScroll?y:0; afterRender(); histSync();
}
// Bouton retour du téléphone : tant qu'une fiche ou une séance est ouverte, une entrée d'historique « garde »
// est posée. Le bouton retour ferme alors l'écran du dessus au lieu de quitter l'appli.
const H={guard:false, skip:0, noPush:false, closing:false};
function overlayOpen(){ return UI.sheetStack.length>0 || !$('#session').hidden; }
function histSync(){
  if(overlayOpen()){ if(!H.guard && !H.noPush && H.skip===0){ try{ history.pushState({xamxam:1},''); H.guard=true; }catch{} } }
  else if(H.guard && !H.closing){ // on attend un instant : un autre écran peut s'ouvrir aussitôt (fiche → séance), et la garde reste alors en place
    H.closing=true;
    setTimeout(()=>{ H.closing=false; if(!overlayOpen() && H.guard){ H.guard=false; H.skip++; setTimeout(()=>{ H.skip=0; }, 900); try{ history.back(); }catch{ H.skip=0; } } }, 0);
  }
}
window.addEventListener('popstate', ()=>{
  if(H.skip>0){ H.skip--; return; }
  if(!H.guard) return;
  H.guard=false; H.noPush=true;
  try{ if(UI.sheetStack.length) closeSheet(); else if(!$('#session').hidden) closeSession(); } finally { H.noPush=false; }
});
// après un retour, la garde est reposée au prochain geste (les navigateurs ignorent une entrée ajoutée sans geste)
['pointerup','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ if(!H.guard && overlayOpen()) histSync(); }, true));
function closeSheet(){ UI.sheetStack.pop(); paintSheet(); if(!UI.sheetStack.length) rerender(); }

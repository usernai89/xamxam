function editorValid(){
  const c=ED;
  if(!c.front.trim()) return 'Écris la question.';
  if(c.type==='cloze' && !/\{\{.+?\}\}/.test(c.front)) return 'Mets au moins un mot entre {{ }} pour le cacher.';
  if(c.type==='qcm'){ const filled=c.choices.filter(x=>x.trim()).length; if(filled<2) return 'Écris au moins 2 propositions.'; if(!c.answer.length) return 'Coche au moins une bonne réponse.'; }
  if(c.type==='qa' && !c.back.trim()) return 'Écris la réponse.';
  return '';
}
function editorCommit(){
  const err=editorValid(); if(err){ toast(err); return false; }
  const c=ED;
  if(c.type==='qcm'){ const keep=[]; const ans=[]; c.choices.forEach((x,i)=>{ if(x.trim()){ if(c.answer.includes(i)) ans.push(keep.length); keep.push(x.trim()); } }); c.choices=keep; c.answer=ans; }
  else { c.choices=[]; c.answer=[]; }
  const old=S.cards[c.id]; if(old && old.imgCloud && !c.img){ c.imgCloud=true; }
  saveCard(c); updateDueDot(); return true;
}

// ---------- Session de révision ----------
let SESS=null;
function startSession(mode, scope, opt){
  opt=opt||{};
  const t=now();
  let cards=liveCards(scope);
  let queue=[];
  if(mode==='srs'){
    const c=counts(scope); const end=dayStart(t)+DAY;
    const lrn=cards.filter(x=>isLearning(x)&&x.srs.due<=end).sort((a,b)=>a.srs.due-b.srs.due);
    const rev=shuffle(cards.filter(x=>x.srs.state==='review'&&x.srs.due<end)).sort((a,b)=>a.srs.due-b.srs.due).slice(0,c.rev); // les plus en retard d'abord
    const nw=cards.filter(x=>x.srs.state==='new').sort((a,b)=>(a.created||0)-(b.created||0)).slice(0,c.nw);
    // on intercale les nouvelles parmi les révisions
    const mixed=[]; const step=nw.length?Math.max(1,Math.floor(rev.length/nw.length)):0; let ni=0;
    rev.forEach((r,i)=>{ mixed.push(r); if(step && (i+1)%step===0 && ni<nw.length) mixed.push(nw[ni++]); });
    while(ni<nw.length) mixed.push(nw[ni++]);
    queue=lrn.filter(x=>x.srs.due<=t).concat(opt.minutes?rev.concat(nw):mixed);
    SESS={mode, scope, queue:queue.map(x=>x.id), later:lrn.filter(x=>x.srs.due>t).map(x=>x.id), done:0, ok:0, start:t, shown:0, total:queue.length+lrn.filter(x=>x.srs.due>t).length, missed:[]};
    if(opt.minutes){ SESS.limit=opt.minutes*MIN; SESS.minutes=opt.minutes; }
  } else {
    if(mode==='hard') cards=cards.filter(isHard);
    if(mode==='recent'){ const lim=t-7*DAY; cards=cards.filter(c=>(c.created||0)>lim); }
    if(mode==='list'){ const ids=new Set(opt.ids||[]); cards=cards.filter(c=>ids.has(c.id)); }
    queue=shuffle(cards.slice()).map(x=>x.id);
    SESS={mode, scope, queue, later:[], done:0, ok:0, start:t, shown:0, total:queue.length, missed:[], seen:new Set()};
  }
  if(!SESS.queue.length && !SESS.later.length){ toast('Rien à réviser dans cette sélection.'); SESS=null; return; }
  $('#session').hidden=false; document.body.style.overflow='hidden'; histSync();
  nextCard();
}
function nextCard(){
  const s=SESS; const t=now();
  if(s.limit && s.done>0 && t-s.start>=s.limit){ s.timeUp=true; sessionDone(); return; }
  let id=null;
  if(s.mode==='srs'){
    s.later.sort((a,b)=>(S.cards[a]?.srs.due||0)-(S.cards[b]?.srs.due||0));
    if(s.later.length && S.cards[s.later[0]] && S.cards[s.later[0]].srs.due<=t) id=s.later.shift();
    else if(s.queue.length) id=s.queue.shift();
    else if(s.later.length) id=s.later.shift(); // apprentissage en avance (comme Anki)
  } else if(s.queue.length) id=s.queue.shift();
  while(id && !S.cards[id]){ id=s.queue.shift()||null; }
  if(!id){ sessionDone(); return; }
  s.cur={id, revealed:false, picked:new Set(), t0:now()};
  paintSession();
}
function remaining(){ const s=SESS; if(s.mode!=='srs') return {n:s.queue.length+(s.cur?1:0)};
  let nw=0,lrn=0,rev=0; const ids=s.queue.concat(s.later); if(s.cur) ids.push(s.cur.id);
  for(const id of ids){ const c=S.cards[id]; if(!c) continue; if(c.srs.state==='new') nw++; else if(isLearning(c)) lrn++; else rev++; }
  return {nw,lrn,rev}; }
function paintSession(anim){
  const s=SESS, cur=s.cur, c=S.cards[cur.id]; const ch=CH[c.chap];
  const r=remaining(); const prog=s.total?Math.min(100, s.done/(s.done+(s.mode==='srs'?r.nw+r.lrn+r.rev:r.n))*100):0;
  const tl=s.limit?`<span class="c-time">${Math.max(1,Math.ceil((s.limit-(now()-s.start))/MIN))} min</span>`:'';
  const counter=s.mode==='srs'?`<div class="sess-counts">${tl}<span class="c-new">${r.nw}</span><span class="c-lrn">${r.lrn}</span><span class="c-rev">${r.rev}</span></div>`:`<div class="sess-counts"><span>${r.n}</span></div>`;
  const img = pos => (c.img && ((c.imgSide||'front')===pos))?`<img src="${c.img}" alt="Image de la carte">`:'';
  let front='', back='';
  if(c.type==='cloze'){ front=`<div class="front rt">${cur.revealed?clozeBack(c.front):clozeFront(c.front)}</div>`; }
  else front=`<div class="front rt">${md(c.front)}</div>`;
  if(c.type==='qcm'){
    front+=`<div class="qcm">${c.choices.map((x,i)=>{ let cls=''; if(cur.revealed){ const good=c.answer.includes(i), p=cur.picked.has(i); cls=good&&p?'ok':(!good&&p?'ko':(good?'ok miss':'')); }
      return `<button class="${cls}" data-act="qcm-pick" data-i="${i}" aria-pressed="${cur.picked.has(i)}" ${cur.revealed?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`; }).join('')}</div>`;
  }
  if(cur.revealed){
    back=`<div class="divider"></div>${img('back')}${c.back?`<div class="rt">${md(c.back)}</div>`:''}${c.hint?`<div class="hintbox"><p class="eyebrow">Pour retenir</p><div class="rt">${md(c.hint)}</div></div>`:''}`;
  }
  const actions = !cur.revealed
    ? (c.type==='qcm'?`<button class="btn btn-primary btn-lg" data-act="reveal">Valider mes réponses</button>`:`<button class="btn btn-primary btn-lg" data-act="reveal">Afficher la réponse</button>`)
    : gradeButtons(c);
  $('#sessIn').innerHTML=`<div class="layer-top"><button class="icon-btn" data-act="sess-close" aria-label="Quitter la révision">${I.x}</button><div class="sess-bar"><i style="width:${prog}%"></i></div>${counter}</div>
   <article class="flash ${anim&&S.prefs.anim!=='none'?'anim-'+S.prefs.anim:''}" id="flash">
     <div class="spread"><p class="eyebrow">${ch?esc(SUBS[ch.sub].name)+' · '+esc(ch.title):(c.syn&&SYN_BY[c.syn]?'Syndromes · '+esc(SYN_SYS[SYN_BY[c.syn].sys]):'Sans chapitre')}</p>${c.example?'<span class="badge ex">Exemple</span>':''}${c.exam?'<span class="badge">'+esc(annLabel(c.exam))+'</span>':''}</div>
     ${img('front')}${front}${back}
   </article>
   ${cur.revealed?`<div class="tools">${AI.sample?`<button class="btn btn-ghost" data-act="explain">${I.spark} Expliquer</button>`:''}<button class="btn btn-ghost" data-act="sess-edit">${I.pen} Modifier</button></div>`:''}
   <div class="sess-actions">${actions}</div>`;
  $('#session').scrollTop=0;
}
function gradeButtons(c){
  const s=SESS;
  if(s.mode!=='srs') return `<div class="grades two"><button class="grade g1" data-act="grade" data-g="1">À revoir<small>remise plus loin</small></button><button class="grade g3" data-act="grade" data-g="3">Je savais<small>suivante</small></button></div>`;
  const t=now(); const iv=g=>{ const n=nextSrs(c.srs,g,false); return fmtIvl(n.due-t); };
  if(String(S.prefs.buttons)==='2') return `<div class="grades two"><button class="grade g1" data-act="grade" data-g="1">Raté<small>${iv(1)}</small></button><button class="grade g3" data-act="grade" data-g="3">Réussi<small>${iv(3)}</small></button></div>`;
  return `<div class="grades"><button class="grade g1" data-act="grade" data-g="1">À revoir<small>${iv(1)}</small></button><button class="grade g2" data-act="grade" data-g="2">Difficile<small>${iv(2)}</small></button><button class="grade g3" data-act="grade" data-g="3">Bien<small>${iv(3)}</small></button><button class="grade g4" data-act="grade" data-g="4">Facile<small>${iv(4)}</small></button></div>`;
}
function reveal(){
  const cur=SESS.cur; if(cur.revealed) return; cur.revealed=true; paintSession(true);
}
function grade(g){
  const s=SESS, cur=s.cur, c=S.cards[cur.id]; if(!c) return nextCard();
  const ms=now()-cur.t0; const wasNew=c.srs.state==='new';
  s.done++; if(g>=3) s.ok++;
  if(s.mode==='srs'){
    c.srs=nextSrs(c.srs,g); saveCard(c,{fast:true});
    if(g===1) s.missed.push(c.id);
    if(isLearning(c)) s.later.push(c.id);
    logReview(g>=3, wasNew, ms);
  } else {
    logReview(g>=3, false, ms);
    if(g===1){ s.missed.push(c.id); const pos=Math.min(s.queue.length, 3+Math.floor(Math.random()*4)); s.queue.splice(pos,0,c.id); }
  }
  updateDueDot(); nextCard();
}
function sessionDone(){
  const s=SESS; const mins=Math.max(1,Math.round((now()-s.start)/MIN));
  const pct=s.done?Math.round(s.ok/s.done*100):0;
  const missed=[...new Set(s.missed)].filter(id=>S.cards[id]); UI.lastMissed=missed;
  const c=counts(s.scope); const left=s.mode==='srs'?c.rev+c.lrn+c.nw:0;
  const a=dayStart()+DAY, tomorrow=Object.values(S.cards).filter(x=>!x.suspended&&x.srs.state!=='new'&&x.srs.due>=a&&x.srs.due<a+DAY).length;
  const more=s.timeUp&&left>0;
  $('#sessIn').innerHTML=`<div class="layer-top"><button class="icon-btn" data-act="sess-close" aria-label="Fermer">${I.x}</button><div class="sess-bar"><i style="width:100%"></i></div></div>
   <div class="done"><svg viewBox="0 0 24 24" style="width:56px;height:56px;align-self:center;color:var(--good)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
   <h1>${s.timeUp?`${s.minutes} minutes : c'est fait`:'Session terminée'}</h1>
   <div class="count-grid"><div class="count"><span class="eyebrow">Cartes</span><span class="num">${s.done}</span></div><div class="count"><span class="eyebrow">Réussite</span><span class="num">${pct}<small>%</small></span></div></div>
   <p class="muted">${plural(mins,'minute')} · série de ${plural(streak(),'jour')} · demain : ${plural(tomorrow,'carte')}</p>
   ${more?`<p>Il reste ${plural(left,'carte')} pour aujourd'hui. Tu peux t'arrêter ici : ce que tu as fait compte.</p>
     <button class="btn btn-primary btn-lg" data-act="sess-close">Terminer</button>
     <button class="btn" data-act="start" data-mode="srs" data-scope="${esc(s.scope)}" data-min="${s.minutes}">Encore ${s.minutes} minutes</button>`
   :`<button class="btn btn-primary btn-lg" data-act="sess-close">Terminer</button>`}
   ${missed.length?`<button class="btn" data-act="start-missed">Revoir ${missed.length>1?'les '+missed.length+' cartes ratées':'la carte ratée'}</button>`:''}
   ${s.mode==='srs'&&!more?`<button class="btn" data-act="start" data-mode="cram" data-scope="${esc(s.scope)}">Bachoter cette sélection</button>`:''}
   </div>`;
  SESS.cur=null; SESS.finished=true;
}
function closeSession(){ $('#session').hidden=true; document.body.style.overflow=''; SESS=null; flushAll(); rerender(); histSync(); }

let aiCtl=null;
async function streamTo(el, prompt, opts={}){
  if(!AI.sample) return null;
  aiCtl=new AbortController();
  el.hidden=false; el.innerHTML='<p class="muted">Claude réfléchit…</p>';
  try{
    const r=await AI.sample(prompt,{signal:aiCtl.signal, modelTier:opts.tier||'default', onText:({text})=>{ el.innerHTML=md(text); }});
    el.innerHTML=md(r.text); return r.text;
  }catch(e){ const m=aiErr(e); if(e&&e.text) el.innerHTML=md(e.text); else el.innerHTML=''; if(m) el.insertAdjacentHTML('beforeend','<p class="notice warn">'+esc(m)+'</p>'); return null; }

// ---------- Génération de cartes ----------
async function generate(){
  const g=UI.gen; if(g.busy) return;
  if(!g.types.length){ toast('Choisis au moins un type de carte.'); return; }
  if(!g.chap && !g.focus.trim() && g.source==='focus'){ toast('Choisis un chapitre ou écris une notion.'); return; }
  if(g.source==='text' && !g.text.trim()){ toast('Colle d\'abord le texte du cours.'); return; }
  if(g.source==='photo' && !g.photos.length){ toast('Ajoute au moins une photo.'); return; }
  const prompt=buildCardPrompt(g);
  g.busy=true; g.err=''; g.results=null; rerender();
  aiCtl=new AbortController();
  try{
    const opts={signal:aiCtl.signal, modelTier:'default', onText:({text})=>{ const n=(text.match(/"front"\s*:/g)||[]).length; const el=$('#genCount'); if(el) el.textContent=n?n+'/'+g.n:''; }};
    if(g.source==='photo') opts.images=g.photos.map(p=>p.blob);
    const data=await AI.sample.json(prompt, opts);
    const res=normalizeGenerated(data);
    if(!res.length) g.err='Aucune carte exploitable. Précise la notion ou ajoute ton cours, puis réessaie.';
    else g.results=res;
  }catch(e){ if(e&&e.code==='invalid_json'&&e.text){ const res=parseLoose(e.text); if(res.length) g.results=res; else g.err=aiErr(e); } else g.err=aiErr(e); }
  g.busy=false; rerender();
  if(g.results){ const el=$('#genResults'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
}
function saveGenerated(){
  const g=UI.gen; let n=0;
  for(const r of g.results){ if(r.off) continue; const c=newCard({chap:g.chap, type:r.type, front:r.front, back:r.back, hint:r.hint||'', choices:r.choices||[], answer:r.answer||[]}); saveCard(c); n++; }
  toast(plural(n,'carte')+' ajoutée'+(n>1?'s':''));
  if(g.chap && statusOf(g.chap)===0) setStatus(g.chap,1);
  g.results=null; updateDueDot(); rerender();
}

// ---------- Export / import ----------
async function offerFile(filename, text){
  const C=window.claude; let dl=null;
  try{ dl=C&&C.use?await C.use('downloads'):null; }catch{}
  if(dl){ try{ await dl.save({filename, data:text}); return; }catch(e){ const c=e&&e.code; if(c==='declined') return; if(c==='rate_limited'){ toast('Un téléchargement est déjà en cours. Réessaie dans un instant.'); return; } } }
  if(!dl){ try{ const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Fichier enregistré dans tes téléchargements'); return; }catch{} }
  openSheet(()=>sheetTop(filename)+`<p class="small">Le téléchargement direct n'est pas disponible ici. Copie ce texte et enregistre-le dans un fichier.</p><textarea id="exportText" style="min-height:50vh" readonly>${esc(text)}</textarea><button class="btn btn-primary" data-act="copy-export">Copier</button>`);
}
function exportJSON(){
  const d={app:'xamxam', v:1, exported:new Date().toISOString(), cards:Object.values(S.cards), progress:S.progress, custom:S.custom, notes:S.notes, stats:S.stats, prefs:S.prefs, trash:S.trash, docs:S.docs, exams:S.exams, internat:S.internat, drive:DRV};
  S.prefs.lastExport=now(); savePrefs(); setSync(W.status);
  offerFile('xamxam-sauvegarde-'+dayKey()+'.json', JSON.stringify(d));
}
function exportAnki(){
  const clean=s=>String(s||'').replace(/\t/g,' ').replace(/\r?\n/g,'<br>');
  const lines=['#separator:tab','#html:true','#tags column:3'];
  for(const c of Object.values(S.cards)){
    const ch=CH[c.chap]; const tag=ch?(SUBS[ch.sub].name+'::'+ch.title).replace(/\s+/g,'_'):'XamXam';
    let f=c.front, b=c.back;
    if(c.type==='cloze'){ f=c.front.replace(/\{\{(.+?)\}\}/g,'[…]'); b=c.front.replace(/\{\{(.+?)\}\}/g,'<b>$1</b>')+(c.back?'<br><br>'+c.back:''); }
    if(c.type==='qcm'){ f=c.front+'<br>'+c.choices.map((x,i)=>String.fromCharCode(65+i)+'. '+x).join('<br>'); b='Bonnes réponses : '+c.answer.map(i=>String.fromCharCode(65+i)).join(', ')+(c.back?'<br><br>'+c.back:''); }
    if(c.hint) b+='<br><br><i>'+c.hint+'</i>';
    lines.push(clean(f)+'\t'+clean(b)+'\t'+tag);
  }
  offerFile('xamxam-anki-'+dayKey()+'.txt', lines.join('\n'));
}
function importBackup(text){
  let d; try{ d=JSON.parse(text); }catch{ toast("Ce fichier n'est pas une sauvegarde XamXam."); return; }
  if(!d||d.app!=='xamxam'){ toast("Ce fichier n'est pas une sauvegarde XamXam."); return; }
  if(d.kind==='share'){ importShare(d); return; }
  if(d.kind==='drive'){ importDrive(d); return; }
  const notes=Object.entries(d.notes||{}).map(([id,n])=>({...n, id}));
  const r=mergeData({cards:d.cards||[], notes, progress:{map:d.progress||{}, custom:d.custom||[]}, stats:d.stats||{days:{}}, prefs:d.prefs||null, trash:d.trash||{}});
  r.fromInc.cards.forEach(id=>cloudPut('cards/'+id,200)); r.fromInc.notes.forEach(id=>cloudPut('notes/'+id,200)); r.fromInc.docs.forEach(k=>cloudPut(k,200));
  for(const e of Object.values(d.exams||{})){ if(e&&e.id&&(!S.exams[e.id]||(S.exams[e.id].t||0)<(e.t||0))) S.exams[e.id]=e; }
  for(const x of Object.values(d.docs||{})){ if(x&&x.id&&!S.docs[x.id]) S.docs[x.id]=x; }
  mergeInternat(d.internat); mergeDrive(d.drive);
  writeLocal(); onDataChanged(true); toast('Sauvegarde importée : '+plural(r.fromInc.cards.length,'carte')+' mise'+(r.fromInc.cards.length>1?'s':'')+' à jour');
}

// Petit lecteur de fichiers .zip (docx et pptx sont des zip), sans bibliothèque.
async function unzipText(buf, want){
  const dv=new DataView(buf), dec=new TextDecoder();
  let e=buf.byteLength-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('zip');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={};
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(buf,p+46,nl)); p+=46+nl+xl+cl;
    if(!want(name)) continue;
    const data=new Uint8Array(buf, off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true), csize);
    if(method===0) out[name]=dec.decode(data);
    else if(method===8) out[name]=dec.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }
  return out;
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const wv = (el, attr) => el ? (el.getAttribute('w:'+attr) ?? el.getAttribute(attr)) : null;
function roman(n){ const t=[[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']]; let s=''; for(const [v,r] of t){ while(n>=v){ s+=r; n-=v; } } return s; }
function fmtNum(n, f){
  if(f==='upperLetter') return String.fromCharCode(64+((n-1)%26)+1);
  if(f==='lowerLetter') return String.fromCharCode(96+((n-1)%26)+1);
  if(f==='upperRoman') return roman(n).toUpperCase();
  if(f==='lowerRoman') return roman(n);
  if(f==='bullet'||f==='none') return '';
  return String(n);
}
async function docxText(buf){
  const z=await unzipText(buf, n=>n==='word/document.xml'||n==='word/numbering.xml'||n==='word/styles.xml');
  if(!z['word/document.xml']) throw new Error('docx');
  // Numérotation automatique de Word (1. 2. 3. / A. B. C.) : on la recalcule, sinon elle disparaît du texte.
  const abs={}, nums={};
  if(z['word/numbering.xml']){
    const nd=xmlDoc(z['word/numbering.xml']);
    for(const a of nd.getElementsByTagName('w:abstractNum')){ const lv={}; for(const l of a.getElementsByTagName('w:lvl')){ lv[wv(l,'ilvl')]={fmt:wv(l.getElementsByTagName('w:numFmt')[0],'val')||'decimal', text:wv(l.getElementsByTagName('w:lvlText')[0],'val')||'', start:+(wv(l.getElementsByTagName('w:start')[0],'val')||1)}; } abs[wv(a,'abstractNumId')]=lv; }
    for(const m of nd.getElementsByTagName('w:num')){ nums[wv(m,'numId')]=abs[wv(m.getElementsByTagName('w:abstractNumId')[0],'val')]||{}; }
  }
  const styleNum={}, styleHead={};
  if(z['word/styles.xml']){ for(const st of xmlDoc(z['word/styles.xml']).getElementsByTagName('w:style')){ const id=wv(st,'styleId'); const np=st.getElementsByTagName('w:numPr')[0];
    if(np) styleNum[id]={numId:wv(np.getElementsByTagName('w:numId')[0],'val'), ilvl:wv(np.getElementsByTagName('w:ilvl')[0],'val')};
    const ol=st.getElementsByTagName('w:outlineLvl')[0]; const nm=wv(st.getElementsByTagName('w:name')[0],'val')||'';
    if(ol || /^(heading|titre)\s*\d/i.test(nm) || /^title$/i.test(nm)) styleHead[id]=true; } }
  const counters={}; const lines=[];
  const d=xmlDoc(z['word/document.xml']);
  for(const p of d.getElementsByTagName('w:p')){
    let t='';
    const walk=el=>{ for(const c of el.childNodes){ if(c.nodeType!==1) continue; const tag=c.tagName;
      if(tag==='w:t') t+=c.textContent; else if(tag==='w:tab') t+='\t'; else if(tag==='w:br'||tag==='w:cr') t+='\n';
      else if(tag!=='w:pPr' && tag!=='w:instrText' && tag!=='w:del') walk(c); } };
    walk(p);
    const pSt=wv(p.getElementsByTagName('w:pStyle')[0],'val');
    const numPr=p.getElementsByTagName('w:numPr')[0]; const sn=pSt&&styleNum[pSt];
    if(numPr||sn){
      const id=(numPr&&wv(numPr.getElementsByTagName('w:numId')[0],'val'))||(sn&&sn.numId), il=+((numPr&&wv(numPr.getElementsByTagName('w:ilvl')[0],'val'))||(sn&&sn.ilvl)||0);
      const def=nums[id]; if(def && def[il] && id!=='0'){
        const cs=counters[id]||(counters[id]={});
        cs[il]=(cs[il]===undefined?def[il].start:cs[il]+1);
        for(const k of Object.keys(cs)) if(+k>il) delete cs[k];
        const pre=def[il].text.replace(/%(\d)/g,(_,k)=>{ const L=+k-1; const v=cs[L]===undefined?(def[L]?def[L].start:1):cs[L]; return fmtNum(v, def[L]?def[L].fmt:'decimal'); });
        if(def[il].fmt!=='bullet' && pre.trim()) t=pre+' '+t; else if(def[il].fmt==='bullet') t='- '+t;
      }
    }
    if(pSt && styleHead[pSt] && t.trim()) t='## '+t.trim();
    lines.push(t);
  }
  return lines.join('\n');
}
async function pptxText(buf){
  const z=await unzipText(buf, n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
  const names=Object.keys(z).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  if(!names.length) throw new Error('pptx');
  return names.map((n,i)=>{ const d=xmlDoc(z[n]); const ps=Array.from(d.getElementsByTagName('a:p')).map(p=>Array.from(p.getElementsByTagName('a:t')).map(t=>t.textContent).join('')).filter(s=>s.trim());
    return '## Diapo '+(i+1)+'\n'+ps.join('\n'); }).join('\n\n');
}
async function pdfText(buf, onProgress){
  const lib=await loadPdf(); const doc=await lib.getDocument({data:buf}).promise; const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent(); let s='', lastY=null;
    for(const it of tc.items){ if(!('str' in it)) continue; const y=Math.round(it.transform[5]);
      if(lastY!==null && Math.abs(y-lastY)>3 && !s.endsWith('\n')) s+='\n';
      s+=it.str; if(it.hasEOL) s+='\n'; lastY=y; }
    pages.push(s); onProgress && onProgress(i/doc.numPages);
  }
  return {doc, pages};
}
async function pdfOcr(doc, onPage){
  const max=Math.min(doc.numPages, 40); const out=[];
  for(let i=1;i<=max;i++){
    const page=await doc.getPage(i); const vp=page.getViewport({scale:2});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    out.push(await ocrImage(c, p=>onPage(i, max, p)));
  }
  return out.join('\n\n');
}
function cleanText(s){ return String(s||'').replace(/\r/g,'').replace(/ /g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim(); }

// Lecture d'une épreuve : questions numérotées, propositions A-E, corrigé éventuel.
const RE_Q = /^(?:(?:Q(?:uestion)?|QCM|QROC|QRU|QCS)\s*(?:n[°o]\s*)?)?(\d{1,3})\s*[.)\-:–—\/]\s*(.+)$/i;
const RE_Q2 = /^(?:Q(?:uestion)?|QCM|QROC)\s*(?:n[°o]\s*)?(\d{1,3})\s*$/i;
const RE_C = /^\(?([A-Ha-h])\s*[.)\-:–—\/]\s*(.+)$/;
const RE_ANS = /^(?:r[ée]p(?:onses?)?|r[ée]ponses? justes?|bonnes? r[ée]ponses?)\s*[:=\-–]\s*(.+)$/i;
const RE_KEY = /^(?:corrig[ée]s?|correction|grille(?: de r[ée]ponses| de correction)?|cl[ée]s? de correction|r[ée]ponses(?: aux qcm)?|solutions?)(?![a-zà-ÿ])\s*[:.\-]?\s*(.*)$/i;
const RE_CASE = /^(?:cas cliniques?|dossier(?: clinique)?|[ée]nonc[ée]|observation)(?![a-zà-ÿ])/i;
function lettersToIdx(s){ const m=String(s).toUpperCase().match(/[A-H]/g)||[]; return Array.from(new Set(m.map(x=>x.charCodeAt(0)-65))).sort((a,b)=>a-b); }
function parseKey(text){
  const key={}; const re=/(?:Q\s*)?(\d{1,3})\s*[-:).=\/–]?\s*((?:[A-Ha-h](?![a-zà-ÿ]{2})[\s,;+\/]*){1,8})/g; let m;
  while((m=re.exec(text))){ const idx=lettersToIdx(m[2]); if(idx.length && !key[m[1]]) key[m[1]]=idx; }
  return key;
}
function examLines(text){
  const out=[];
  for(const raw of cleanText(text).split('\n')){ const l=raw.trim(); if(!l) continue;
    // propositions écrites sur une seule ligne : « A. … B. … C. … »
    if(/^\(?A\s*[.)\-]\s/.test(l) || /\s\(?A\s*[.)]\s.+\s\(?B\s*[.)]\s/.test(l)) out.push(...l.split(/\s+(?=\(?[A-H]\s*[.)]\s)/)); else out.push(l); }
  return out;
}
function parseExam(text){
  const lines=examLines(text);
  let keyStart=-1;
  for(let i=0;i<lines.length;i++){ if(RE_KEY.test(lines[i]) && !RE_C.test(lines[i]) && Object.keys(parseKey(lines.slice(i).join('\n'))).length>=2){ keyStart=i; break; } }
  const key=keyStart>=0?parseKey(lines.slice(keyStart).join('\n')):{};
  const body=keyStart>=0?lines.slice(0,keyStart):lines;
  const qs=[]; let q=null, ctx='', inCase=false, last=null;
  const push=()=>{ if(q) qs.push(q); q=null; };
  const start=(num, stem)=>{ push(); q={num, stem, choices:[], ans:null, back:'', ctx}; inCase=false; last='stem'; };
  for(let i=0;i<body.length;i++){
    const l=body[i], next=body[i+1]||''; let m;
    if(RE_CASE.test(l)){ push(); ctx=l; inCase=true; last='ctx'; continue; }
    if((m=l.match(RE_Q2)) && next && !RE_C.test(next)){ start(m[1], next); i++; continue; }
    if((m=l.match(RE_Q))){ const prev=q?+q.num||0:(qs.length?+qs[qs.length-1].num||0:0);
      if(!q || +m[1]>prev || m[1]==='1' || inCase){ start(m[1], m[2]); continue; } }
    if(q && (m=l.match(RE_C))){ const k=m[1].toUpperCase().charCodeAt(0)-65; if(k===q.choices.length && last!=='back'){ q.choices.push(m[2]); last='choice'; continue; } }
    if(q && (m=l.match(RE_ANS))){ const idx=lettersToIdx(m[1]); if(q.choices.length && idx.length && /^[A-H\s,;+\/]+\.?$/i.test(m[1].replace(/\bet\b/gi,' ').trim())) q.ans=idx; else q.back=(q.back?q.back+'\n':'')+m[1]; last='back'; continue; }
    // question sans numéro : une ligne qui finit par « ? », ou par « : » juste avant la proposition A
    const isStem=/\?\s*$/.test(l) || (/:\s*$/.test(l) && /^\(?A\s*[.)\-]/.test(next));
    if(isStem && (!q || q.choices.length || last==='back' || inCase)){ start('', l); continue; }
    if(!q && !inCase) continue; // en-tête de l'épreuve (titre, durée…)
    if(inCase){ ctx=(ctx?ctx+'\n':'')+l; continue; }
    if(last==='choice') q.choices[q.choices.length-1]+=' '+l;
    else if(last==='back') q.back+='\n'+l;
    else q.stem+=(/[:?.]$/.test(q.stem)?'\n':' ')+l;
  }
  push();
  return qs.map(x=>{
    const cl=x.ctx?x.ctx.split('\n'):[];
    const front=(cl.length?'**'+cl[0]+'**'+(cl.length>1?'\n'+cl.slice(1).join('\n'):'')+'\n\n':'')+x.stem.trim();
    if(x.choices.length>=2){ const ans=x.ans||(x.num?key[x.num]:null)||[]; return {type:'qcm', num:x.num, front, choices:x.choices.map(s=>s.trim()), answer:ans.filter(i=>i<x.choices.length), back:x.back.trim(), hint:''}; }
    return {type:'qa', num:x.num, front, back:x.back.trim(), hint:'', choices:[], answer:[]};
  });
}
function buildExamPrompt(o){
  const ctx=chapCtx(o.chap);
  return `Voici le texte d'une épreuve d'examen de médecine (L3, Faculté de médecine de l'UCAD, Dakar)${o.year?' : '+o.year:''}${ctx.sub?', '+ctx.sub:''}. Le texte vient d'un PDF ou d'une photo : il peut contenir des erreurs de lecture.

Transforme CHAQUE question de l'épreuve en carte de révision, dans l'ordre, sans en inventer d'autres :
- QCM (propositions A, B, C…) : "type":"qcm", "front" = l'énoncé (avec le cas clinique s'il y en a un), "choices" = les propositions sans la lettre, "answer" = indices (à partir de 0) de TOUTES les bonnes propositions.
- Question rédactionnelle ou QROC : "type":"qa", "front" = la question, "back" = la réponse attendue, courte et structurée (tirets "- ").
- Si un corrigé figure dans le texte, utilise-le. Sinon, donne la réponse la plus sûre et commence "back" par « Réponse proposée par Claude, à vérifier. », puis justifie en 1 à 3 lignes.
- Corrige les fautes de lecture évidentes, sans changer le sens.

Réponds uniquement avec un tableau JSON, sans texte autour :
[{"type":"qcm","front":"…","choices":["…","…","…","…","…"],"answer":[0,2],"back":"…"},{"type":"qa","front":"…","back":"…"}]

Épreuve :
"""
${o.text.trim().slice(0,14000)}
"""`;
}
const IMP_MAX=200000;
function impRefresh(){ if(UI.sheetStack.length) paintSheet(true); else rerender(); }
function resetImpDoc(){ const m=UI.imp; m.blobs=[]; m.text=''; m.file=''; m.items=null; m.msg=''; m.err=''; m.scanned=null; m.paste=''; }
async function readDocFile(f){
  const m=UI.imp; resetImpDoc(); m.blobs=[f]; m.file=f.name; m.busy=true; m.msg='Lecture de « '+f.name+' »…'; impRefresh();
  const prog=t=>{ const el=$('#impProg'); if(el) el.textContent=t; };
  try{
    const name=f.name.toLowerCase(); const buf=await f.arrayBuffer(); let text='';
    if(name.endsWith('.pdf')||f.type==='application/pdf'){
      const {doc,pages}=await pdfText(buf, p=>prog(Math.round(p*100)+' %'));
      text=pages.join('\n\n');
      if(text.replace(/\s/g,'').length < 40*doc.numPages){ m.scanned=doc; m.msg=`Ce PDF (${plural(doc.numPages,'page')}) semble être un scan : il contient des images, pas du texte.`; }
    }
    else if(name.endsWith('.docx')) text=await docxText(buf);
    else if(name.endsWith('.pptx')) text=await pptxText(buf);
    else if(name.endsWith('.doc')||name.endsWith('.ppt')){ throw Object.assign(new Error('old'),{old:true}); }
    else text=new TextDecoder().decode(buf);
    m.text=cleanText(text).slice(0,IMP_MAX);
    if(!m.scanned) m.msg=m.text?`${f.name} : ${m.text.length.toLocaleString('fr-FR')} caractères lus.`+(text.length>IMP_MAX?' (Fichier très long : seul le début est gardé.)':''):'';
    if(!m.text && !m.scanned) m.err="Aucun texte trouvé dans ce fichier.";
  }catch(e){
    m.msg=''; m.err=e&&e.old?"Ancien format Word/PowerPoint (.doc, .ppt) : ouvre-le et enregistre-le en .docx, .pptx ou PDF, puis réessaie.":(!navigator.onLine?"Pas de connexion : la première lecture d'un PDF a besoin d'internet. Réessaie une fois connecté.":"Impossible de lire ce fichier. Essaie de l'exporter en PDF, ou colle le texte.");
  }
  m.busy=false; if(m.text && m.kind==='exam') m.items=parseExam(m.text); impRefresh();
}
async function runOcr(kind, files){

    let text='';

      for(let i=0;i<files.length;i++){ const {canvas}=await toJpegBlob(files[i], 2400, 0.9); text+=(i?'\n\n':'')+await ocrImage(canvas, p=>prog(`Photo ${i+1}/${files.length} · ${Math.round(p*100)} %`)); }

}

// ---------- Documents de cours et examens par module ----------
// Les fichiers (PDF, Word, photos…) sont gardés sur le téléphone, dans IndexedDB.
// S.docs : documents rangés dans un chapitre ; S.exams : épreuves d'un module, avec questions, corrigé et tentatives.
let FDB=null;
function fdb(){ return FDB||(FDB=new Promise((res,rej)=>{ const r=indexedDB.open('xamxam-files',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function fop(mode, fn){ const db=await fdb(); return new Promise((res,rej)=>{ const t=db.transaction('files',mode); const st=t.objectStore('files'); let out; const r=fn(st); if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const fput=(id,blob)=>fop('readwrite', st=>st.put(blob,id));
const fget=id=>fop('readonly', st=>st.get(id));
const fdel=id=>fop('readwrite', st=>st.delete(id));
async function storeFiles(list){ const out=[]; for(const f of list){ const id=uid('f'); await fput(id, f.blob||f); out.push({id, name:f.name||'Document', type:f.type||'', size:f.size||(f.blob&&f.blob.size)||0}); } return out; }
function fmtSize(n){ return n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko'; }
function fmtExamDate(s){ const d=parseDate(s); return d?fmtD(d,{day:'numeric',month:'long',year:'numeric'}):'Sans date'; }
function saveExams(){ saveLocal(); }
function fileKind(name, type){ const n=(name||'').toLowerCase();
  if(n.endsWith('.pdf')||type==='application/pdf') return 'pdf';
  if(/^image\//.test(type||'')||/\.(jpe?g|png|webp|gif|heic)$/.test(n)) return 'img';
  if(n.endsWith('.docx')) return 'docx'; if(n.endsWith('.pptx')) return 'pptx';
  if(/\.(txt|md|csv)$/.test(n)||/^text\//.test(type||'')) return 'txt';
  return 'other'; }
async function textOfBlob(blob, name){
  const k=fileKind(name, blob.type); const buf=await blob.arrayBuffer();
  if(k==='pdf') return (await pdfText(buf)).pages.join('\n\n');
  if(k==='docx') return docxText(buf); if(k==='pptx') return pptxText(buf);
  if(k==='txt') return new TextDecoder().decode(buf);
  return '';
}
function fileIcon(k){ return {pdf:'PDF',img:'Photo',docx:'Word',pptx:'Diapos',txt:'Texte'}[k]||'Fichier'; }

async function renderPdf(blob){
  const box=()=>$('#pdfPages');
  try{
    const lib=await loadPdf(); const doc=await lib.getDocument({data:await blob.arrayBuffer()}).promise;
    if(!box()) return; box().innerHTML='';
    const w=Math.min(900, ($('#sheetIn')||document.body).clientWidth||360);
    for(let i=1;i<=doc.numPages;i++){
      const el=box(); if(!el) return;
      const page=await doc.getPage(i); const vp0=page.getViewport({scale:1}); const sc=w/vp0.width*Math.min(2, window.devicePixelRatio||1);
      const vp=page.getViewport({scale:sc}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      c.style.cssText='width:100%;height:auto;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff';
      el.appendChild(c); await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    }
  }catch{ const el=box(); if(el) el.innerHTML='<div class="notice warn">Impossible d\'afficher ce PDF ici. Utilise « Ouvrir ailleurs ».</div>'; }
}
function downloadBlob(blob, name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 10000); }

// --- Faire l'examen ---
// EXR = l'examen en cours. idx = les questions posées (toutes, ou seulement les erreurs à refaire).
// Il est gardé sur le téléphone : si l'appli se ferme, on reprend où on en était.
let EXR=null, exrTimer=null;
const EXR_KEY='xamxam.exr';
function exrLive(id){ const e=S.exams[id]; return !!(EXR && !EXR.done && EXR.examId===id && e && Array.isArray(EXR.idx) && EXR.idx.length && EXR.idx.every(i=>e.items[i])); }
function exrItems(){ const e=S.exams[EXR.examId]; return EXR.idx.map(i=>e.items[i]); }
function exrSave(){ if(EXR && !EXR.done) lsSet(EXR_KEY, JSON.stringify(EXR)); else { try{ localStorage.removeItem(EXR_KEY); }catch{} } }
function exrLoad(){ try{ const d=JSON.parse(lsGet(EXR_KEY)||'null'); if(!d) return; EXR=d; if(!exrLive(d.examId)){ EXR=null; exrSave(); } }catch{ EXR=null; } }
function exrStart(id, only){
  const e=S.exams[id]; if(!e||!e.items.length) return;
  const part=!!(only&&only.length); const idx=part?only.slice():e.items.map((_,i)=>i);
  EXR={examId:id, idx, partial:part, i:0, picks:idx.map(()=>[]), texts:idx.map(()=>''), self:idx.map(()=>null), done:false, elapsed:0, limit:part?0:(+e.dur||0)};
  exrSave(); exrOpen();
}
function exrOpen(){ if(UI.sheetStack[UI.sheetStack.length-1]!==examRunSheet) UI.sheetStack.push(examRunSheet); paintSheet(); exrRun(); }
function exrClock(){ const lim=EXR.limit*MIN; const s=Math.floor((lim?Math.max(0,lim-EXR.elapsed):EXR.elapsed)/1000); return (s>=3600?Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60)):Math.floor(s/60))+':'+pad(s%60); }
function exrLow(){ return !!EXR.limit && EXR.limit*MIN-EXR.elapsed<=Math.min(5*MIN, EXR.limit*MIN*0.1); }
function exrRun(){ // le temps ne compte que lorsque l'examen est à l'écran
  clearInterval(exrTimer); let last=now(), n=0;
  exrTimer=setInterval(()=>{

function examToCards(e, only){

// ---------- Synchronisation entre appareils (gist GitHub secret) ----------
// Chaque appareil garde ses données ; elles sont fusionnées dans un fichier « xamxam-sync.json »
// rangé dans un gist secret du compte GitHub de l'étudiant. La clé (jeton « gist ») reste sur l'appareil.
// Les fichiers (PDF, photos…) ne sont pas synchronisés : seulement le texte (cartes, notes, examens, résultats).
const GS={ token:lsGet('xamxam.gh')||'', gist:lsGet('xamxam.gist')||'', login:lsGet('xamxam.ghlogin')||'', last:+(lsGet('xamxam.synced')||0), busy:false, err:'', timer:null, applying:false };
const GS_FILE='xamxam-sync.json';
async function gh(method, path, body){
  const r=await fetch('https://api.github.com'+path, {method, headers:{Authorization:'Bearer '+GS.token, Accept:'application/vnd.github+json', ...(body?{'Content-Type':'application/json'}:{})}, body:body?JSON.stringify(body):undefined, cache:'no-store'});
  if(r.status===401) throw Object.assign(new Error('auth'),{code:'auth'});
  if(r.status===404) throw Object.assign(new Error('404'),{code:'missing'});
  if(!r.ok) throw Object.assign(new Error('http'),{code:'http', status:r.status});
  return r.json();
}
function syncSnapshot(){ return {app:'xamxam', kind:'sync', v:1, cards:Object.values(S.cards), notes:S.notes, progress:S.progress, custom:S.custom, stats:S.stats, prefs:S.prefs, trash:S.trash, exams:S.exams, internat:S.internat, drive:DRV}; }
function applyRemote(d){
  const before=JSON.stringify([Object.keys(S.cards).length, Object.keys(S.exams).length]);
  const notes=Object.entries(d.notes||{}).map(([id,n])=>({...n, id}));
  const r=mergeData({cards:d.cards||[], notes, progress:{map:d.progress||{}, custom:d.custom||[]}, stats:d.stats||{days:{}}, prefs:d.prefs||null, trash:d.trash||{}});
  let ex=0;
  for(const e of Object.values(d.exams||{})){ if(!e||!e.id) continue; if(S.trash[e.id] && S.trash[e.id]>=(e.t||0)) continue;
    if(EXR && !EXR.done && EXR.examId===e.id) continue;
    const l=S.exams[e.id]; const seen=new Map(); for(const x of (l&&l.attempts)||[]) seen.set(x.t,x); for(const x of e.attempts||[]) if(!seen.has(x.t)) seen.set(x.t,x);
    const attempts=[...seen.values()].sort((x,y)=>x.t-y.t);
    if(!l||(e.t||0)>(l.t||0)){ S.exams[e.id]={...e, files:l?l.files:(e.files||[]), attempts}; ex++; }
    else if(attempts.length!==(l.attempts||[]).length){ l.attempts=attempts; ex++; } }
  for(const id of Object.keys(S.exams)){ if(S.trash[id] && S.trash[id]>=(S.exams[id].t||0)) delete S.exams[id]; }
  if(mergeInternat(d.internat)) ex++;
  if(mergeDrive(d.drive)) ex++;
  return r.fromInc.cards.length || r.fromInc.notes.length || r.fromInc.docs.size || ex || before!==JSON.stringify([Object.keys(S.cards).length, Object.keys(S.exams).length]);
}
async function gsSync(manual){
  if(!GS.token||!GS.gist||GS.busy) return;
  if(!navigator.onLine){ if(manual){ GS.err='Pas de connexion internet.'; gsPaint(); } return; }
  GS.busy=true; GS.err=''; gsPaint();
  try{
    const g=await gh('GET','/gists/'+GS.gist); const f=g.files&&g.files[GS_FILE];
    let text=f?(f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content):'';
    let changed=false;
    if(text){ const d=JSON.parse(text); if(d&&d.app==='xamxam'){ GS.applying=true; changed=applyRemote(d); writeLocal(); GS.applying=false; } }
    const mine=JSON.stringify(syncSnapshot());
    if(mine!==text) await gh('PATCH','/gists/'+GS.gist,{files:{[GS_FILE]:{content:mine}}});
    GS.last=now(); lsSet('xamxam.synced', String(GS.last));
    if(changed){ onDataChanged(true); if(manual) toast('Données des autres appareils récupérées'); }
    else if(manual) toast('Tout est à jour');
  }catch(e){
    GS.applying=false;
    GS.err=e&&e.code==='auth'?'La clé GitHub ne marche plus (expirée ou supprimée). Recrée-en une et relie à nouveau cet appareil.'
      :e&&e.code==='missing'?'Le fichier de synchronisation a disparu de GitHub. Relie à nouveau cet appareil.'
      :'Synchronisation impossible pour le moment. Elle reprendra toute seule.';
  }
  GS.busy=false; gsPaint();
}
function gsSchedule(){ if(!GS.token||!GS.gist||GS.applying) return; clearTimeout(GS.timer); GS.timer=setTimeout(()=>gsSync(false), 15000); }
async function gsConnect(token){
  GS.token=token.trim(); GS.err=''; GS.busy=true; gsPaint();
  try{
    const u=await gh('GET','/user'); GS.login=u.login||'';
    let found=null;
    for(let page=1; page<=5 && !found; page++){ const list=await gh('GET','/gists?per_page=100&page='+page); found=list.find(x=>x.files&&x.files[GS_FILE]); if(list.length<100) break; }
    if(!found) found=await gh('POST','/gists',{description:'XamXam · synchronisation de mes révisions (ne pas supprimer)', public:false, files:{[GS_FILE]:{content:JSON.stringify(syncSnapshot())}}});
    GS.gist=found.id; lsSet('xamxam.gh',GS.token); lsSet('xamxam.gist',GS.gist); lsSet('xamxam.ghlogin',GS.login);
    GS.busy=false; await gsSync(false);
    toast('Cet appareil est relié. Fais pareil sur tes autres appareils avec la même clé.', 4500);
  }catch(e){
    GS.busy=false; GS.token='';
    GS.err=e&&e.code==='auth'?'Clé refusée par GitHub. Vérifie que tu as copié toute la clé (elle commence par ghp_).':(!navigator.onLine?'Pas de connexion internet.':'Impossible de joindre GitHub. Vérifie que la case « gist » est bien cochée, puis réessaie.');
  }
  gsPaint();
}
function gsDisconnect(){ GS.token=''; GS.gist=''; GS.login=''; GS.err=''; ['xamxam.gh','xamxam.gist','xamxam.ghlogin','xamxam.synced'].forEach(k=>{ try{ localStorage.removeItem(k); }catch{} }); gsPaint(); toast('Cet appareil n\'est plus synchronisé. Tes données restent dessus.'); }
function ago(t){ const m=Math.round((now()-t)/MIN); if(m<1) return "à l'instant"; if(m<60) return 'il y a '+m+' min'; const h=Math.round(m/60); if(h<24) return 'il y a '+h+' h'; return 'le '+fmtShort(new Date(t)); }
function gsPanel(){
  const on=GS.token&&GS.gist;
  return `<section class="panel stack" id="gsPanel"><h3>Synchroniser mes appareils</h3>
   ${on?`<p class="small">Relié au compte GitHub <strong>${esc(GS.login||'?')}</strong>. ${GS.busy?'Synchronisation…':GS.last?'Dernière synchronisation : '+ago(GS.last)+'.':''}</p>
     <p class="small muted">Tes cartes, notes, examens et résultats sont mis en commun avec tes autres appareils dès qu'il y a internet. Les fichiers (PDF, photos) restent sur chaque appareil.</p>

   :`<p class="small">Pour retrouver les mêmes cartes, notes et examens sur ton téléphone et ton ordinateur. Ça passe par ton compte GitHub, une seule fois par appareil :</p>
     <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
      <li>Touche <strong>Créer ma clé</strong> (connecte-toi à GitHub si besoin).</li>
      <li>Dans « Expiration », choisis <strong>No expiration</strong>. Laisse la case <strong>gist</strong> cochée.</li>
      <li>En bas, touche <strong>Generate token</strong>, puis copie la clé (elle commence par <span class="mono">ghp_</span>).</li>
      <li>Colle-la ici, puis touche <strong>Relier cet appareil</strong>. Refais la même chose sur ton autre appareil, avec la même clé.</li></ol>
     <a class="btn btn-soft" style="text-decoration:none" href="https://github.com/settings/tokens/new?scopes=gist&description=XamXam%20synchronisation" target="_blank" rel="noopener">Créer ma clé</a>
     <label class="field">Ma clé GitHub<input type="password" id="gsToken" autocomplete="off" placeholder="ghp_…"></label>
     <button class="btn btn-primary" data-act="gs-link" ${GS.busy?'disabled':''}>${GS.busy?'Connexion…':'Relier cet appareil'}</button>
     <p class="small muted">Garde ta clé pour toi : elle donne accès à tes notes GitHub (gists), et rien d'autre.</p>`}
   ${GS.err?`<div class="notice warn">${esc(GS.err)}</div>`:''}
  </section>`;

function shareCardData(c){ return {type:c.type, front:c.front, back:c.back, hint:c.hint||'', choices:c.choices||[], answer:c.answer||[], img:c.img||'', imgSide:c.imgSide||'front', exam:c.exam||'', chap:c.chap||'', syn:c.syn||''}; }
async function shareFile(title, cards, exams){

function importShare(d){

let DRV=null; try{ DRV=JSON.parse(lsGet('xamxam.drive')||'null'); }catch{ DRV=null; }
const drv=(kind,id)=>(DRV&&!DRV.removed&&DRV[kind]&&DRV[kind][id])||[];
const driveUrl=e=>e[2]==='p'?'https://docs.google.com/presentation/d/'+e[1]+'/view':'https://drive.google.com/file/d/'+e[1]+'/view';
function driveList(list){ return `<div class="clist">${list.map(e=>{ const m=String(e[0]).match(/^(.*?)(?: · (PDF|Word|PowerPoint|Présentation))?$/);
  return `<a class="citem" href="${driveUrl(e)}" target="_blank" rel="noopener"><span style="min-width:0"><span class="q">${esc(m[1])}</span><span class="meta"><span class="badge">${esc(m[2]||'Fichier')}</span><span>Drive</span></span></span>${I.chev}</a>`; }).join('')}</div>`; }
function cleanDrive(d){ const ok=e=>Array.isArray(e)&&typeof e[0]==='string'&&/^[\w-]{10,100}$/.test(String(e[1]||''));
  const lists=o=>{ const r={}; for(const [k,v] of Object.entries(o&&typeof o==='object'?o:{})) if(Array.isArray(v)){ const l=v.filter(ok).map(e=>e[2]==='p'?[e[0].slice(0,200),e[1],'p']:[e[0].slice(0,200),e[1]]); if(l.length) r[k]=l; } return r; };
  const mod={}; for(const [k,v] of Object.entries(d.mod&&typeof d.mod==='object'?d.mod:{})){ const g=lists(v); if(Object.keys(g).length) mod[k]=g; }
  return {name:String(d.name||'Drive de la promo').slice(0,80), at:+d.at||now(), chap:lists(d.chap), mod, int:lists(d.int)}; }
function mergeDrive(inc){ if(!inc||typeof inc!=='object'||!inc.at) return false; if(DRV&&(DRV.at||0)>=inc.at) return false;
  DRV=inc.removed?{removed:true, at:+inc.at}:cleanDrive(inc); lsSet('xamxam.drive', JSON.stringify(DRV)); return true; }
function importDrive(d){ DRV=cleanDrive({...d, at:now()}); lsSet('xamxam.drive', JSON.stringify(DRV)); if(typeof gsSchedule==='function') gsSchedule();
  const nC=Object.keys(DRV.chap).length, nI=Object.keys(DRV.int).length;
  onDataChanged(true); toast(`Drive relié : ${plural(nC,'cours','cours')} et ${plural(nI,'question')} d'internat s'ouvrent maintenant sur leurs fichiers.`, 4800); }
function driveModBlock(mid){ const g=DRV&&!DRV.removed&&DRV.mod&&DRV.mod[mid]; if(!g) return '';
  const parts=[['doc','Autres documents'],['qcm','QCM'],['exam','Examens et devoirs'],['td','TD et TP'],['cas','Cas cliniques']].filter(([k])=>g[k]&&g[k].length);
  if(!parts.length) return '';
  return `<section class="panel"><h3>Sur le Drive de la promo</h3>${parts.map(([k,n])=>`<details class="syn"><summary><span>${n} <span class="small muted">· ${g[k].length}</span></span>${I.chev}</summary><div class="syn-body">${driveList(g[k])}</div></details>`).join('')}</section>`; }
function driveIntBlock(id){ const l=drv('int',id); if(!l.length) return '';
  return `<section class="panel"><h3>Copies modèles sur le Drive</h3><p class="small muted" style="margin-bottom:8px">Rédactions de cette question rangées dans le Drive de ta promo. Compare-les à ton plan et garde les mots-clés.</p>${driveList(l)}</section>`; }
function drivePanel(){ const on=DRV&&!DRV.removed;
  return `<section class="panel stack"><h3>Drive de la promo</h3>${on?`<p class="small">${plural(Object.keys(DRV.chap).length,'cours','cours')} et ${plural(Object.keys(DRV.int).length,'question')} d'internat ouvrent leurs fichiers du Drive. Liens importés le ${esc(fmtShort(new Date(DRV.at)))}.</p>
    <p class="small muted">Ces liens restent sur tes appareils et dans ta synchronisation : ils ne sont pas publiés avec l'appli.</p><button class="btn" data-act="drive-del">Retirer les liens du Drive</button>`
   :`<p class="small">Pour ouvrir depuis XamXam les cours, QCM, examens et copies modèles d'internat du Drive de ta promo, importe le fichier de liens (« xamxam-drive-promo103.json ») avec « Importer une sauvegarde ».</p>`}</section>`; }

const wordsOf = t => fold(String(t).replace(/\(.*?\)/g,' ')).replace(/œ/g,'oe').replace(/æ/g,'ae').split(/[^a-z0-9]+/).filter(w=>w&&!STOPW.has(w)).map(w=>w.length>4?w.replace(/[sx]$/,''):w);
// Matières où chercher les cours qui préparent une question, selon l'épreuve.
const INT_SCOPE={
  anat: m=>/anat/.test(m.id),
  bio: m=>/biochim|biophys|physio|bcg|histo|^hib$|bactviro/.test(m.id),
  chir: m=>!/^l[12]-/.test(m.id) || /semio|secour|soins/.test(m.id),
  med: m=>!/^l[12]-/.test(m.id) || /semio|secour|soins/.test(m.id)};
function buildInt(){
  for(const k in INTQ) delete INTQ[k]; for(const k in L3INT) delete L3INT[k];
  for(const ep of INT){ let n=0; ep.all=[];
    for(const [g,items,flag] of ep.groups) for(const [id,t,type,l3,note] of items){ const x={id,t,type,ep:ep.id,g,oral:flag==='oral',extra:flag==='extra',l3:(l3||'').split(' ').filter(Boolean),note:note||'',n:++n}; INTQ[id]=x; ep.all.push(x); }
    for(const c of (S.internat.custom||[])){ if(c.del||c.ep!==ep.id) continue; const x={id:c.id,t:c.title,type:c.type,ep:ep.id,g:'Mes questions',l3:[],note:'',n:++n,custom:true}; INTQ[c.id]=x; ep.all.push(x); }
  }
  // les cours de toutes les années dont l'intitulé reprend celui d'une question y sont reliés automatiquement
  const idx=Object.values(CH).map(c=>[c, wordsOf(c.title)]).filter(([,w])=>w.length);
  for(const x of Object.values(INTQ)){ if(x.custom) continue;
    const q=wordsOf(x.t.split(' : ')[0]), inScope=INT_SCOPE[x.ep]; if(!q.length||!inScope) continue;
    for(const [c,w] of idx){ const m=MODS[c.mod]; if(!m||!inScope(m)||x.l3.includes(c.id)) continue;
      const qInC=q.every(a=>w.includes(a)), cInQ=w.every(a=>q.includes(a)) && (w.length>=2 || x.ep==='anat' || w[0].length>=7);
      if(qInC||cInQ) x.l3.push(c.id); }
  }
  for(const x of Object.values(INTQ)){ x.l3=x.l3.filter(c=>CH[c]);
    for(const c of x.l3) (L3INT[c]=L3INT[c]||[]).push(x.id);
    let best=null; for(const c of x.l3){ const m=MODS[CH[c].mod]; if(!m) continue; const k=semNo(m.lvl,m.sem); if(!best||k<best.k) best={k,lvl:m.lvl}; }
    x.an=best?best.lvl+' · S'+best.k:''; }   // première fois que la question est vue en cours
}
const intSt = id => (S.internat.prog[id]||{}).s||0;
function setIntSt(id,s){ S.internat.prog[id]={s,t:now()}; saveLocal(); }
const intSeen = x => x.l3.some(c=>statusOf(c)>=1);   // la leçon correspondante a déjà été vue en cours
const intReady = id => INT_READY.includes(id) || !!((S.internat.fiches[id]||{}).lecon);
function intCounts(list){ const c=[0,0,0,0]; list.forEach(x=>c[intSt(x.id)]++); return c; }
function intBar(c,n){ const w=i=>n?c[i]/n*100:0; return `<span class="bar" role="img" aria-label="${c[3]} maîtrisées, ${c[2]} leçons sues, ${c[1]} plans sus sur ${n}">${c[3]?`<i class="b3" style="width:${w(3)}%"></i>`:''}${c[2]?`<i class="b2" style="width:${w(2)}%"></i>`:''}${c[1]?`<i class="b1" style="width:${w(1)}%"></i>`:''}</span>`; }

// --- Leçons rédigées : fichiers texte avec des repères @@plan, @@lecon, @@explications, @@schema, @@applications ---
function parseLesson(text){
  const out={plan:'',lecon:'',expl:'',apps:'',figs:[]}; let cur=null, fig=null;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    const m=line.match(/^@@\s*([A-Za-zÀ-ÿ]+)\s*(.*)$/);
    if(m){ const k=fold(m[1]); fig=null;
      if(k==='schema'||k==='figure'){ fig={title:m[2].trim(), svg:''}; out.figs.push(fig); cur='fig'; }
      else cur={plan:'plan', lecon:'lecon', explications:'expl', explication:'expl', applications:'apps'}[k]||null;
      continue; }
    if(cur==='fig') fig.svg+=line+'\n'; else if(cur) out[cur]+=line+'\n';
  }
  for(const k of ['plan','lecon','expl','apps']) out[k]=out[k].replace(/\s+$/,'').replace(/^\n+/,'');
  return out;
}
async function loadLesson(id){
  if(INTL[id] && !INTL[id].offline) return INTL[id];
  if(!INT_READY.includes(id)) return INTL[id]={none:true};
  try{ const r=await fetch('internat/lecons/'+id+'.md'); if(!r.ok) throw new Error('http'); INTL[id]=parseLesson(await r.text()); }
  catch{ INTL[id]={offline:true}; }
  return INTL[id];
}
function intLoad(id){ loadLesson(id).then(()=>{ const top=UI.sheetStack[UI.sheetStack.length-1];
  if((top===intSheet&&UI.intId===id&&!UI.intEdit)||(top===intCheckSheet&&ITR&&ITR.id===id)||(top===intRunSheet&&ITR&&ITR.id===id&&!ITR.run)) paintSheet(true); }); }
let intPrefetched=false;
function intPrefetch(){ if(intPrefetched||!navigator.onLine) return; intPrefetched=true; (async()=>{ for(const id of INT_READY){ try{ await loadLesson(id); }catch{} } })(); }
function intContent(id){
  const x=INTQ[id], own=S.internat.fiches[id]||{}, L=INTL[id]||{};
  return { plan: own.plan || L.plan || (PLANS[x.type]||PLANS['m-maladie']).p, planOwn:!!own.plan, planGen:!own.plan&&!L.plan,
    lecon: own.lecon || L.lecon || '', leconOwn:!!own.lecon, leconBase:!!L.lecon,
    expl:L.expl||'', notes:own.expl||'', apps:L.apps||'', figs:L.figs||[],
    loading:INT_READY.includes(id)&&!INTL[id], offline:!!L.offline };
}
function keysOf(lecon){ const out=[], seen=new Set(); for(const m of String(lecon||'').matchAll(/==(.+?)==/g)){ const k=m[1].trim(), n=fold(k); if(k && !seen.has(n)){ seen.add(n); out.push(k); } } return out; }
function planLines(text){ return String(text||'').split('\n').filter(l=>l.trim()).map(l=>({lvl:Math.min(3,Math.floor(l.match(/^\s*/)[0].replace(/\t/g,'  ').length/2)), t:l.trim()})); }
function planHTML(text, upto){ const L=planLines(text), n=upto==null?L.length:Math.min(upto,L.length);
  return `<div class="plan">${L.slice(0,n).map(l=>`<div class="pl pl${l.lvl}">${inline(esc(l.t))}</div>`).join('')}${n<L.length?`<div class="pl plq">… encore ${plural(L.length-n,'ligne')}</div>`:''}</div>`; }
// Comme md(), avec trois niveaux de titres (## ### ####) et des tableaux simples (| a | b |).
function mdLesson(text){
  const lines=esc(text||'').split('\n'); let html='', list=false, table=false;
  const close=()=>{ if(list){ html+='</ul>'; list=false; } if(table){ html+='</tbody></table></div>'; table=false; } };
  for(const raw of lines){ const l=raw.trim(); let m;
    if(!l){ close(); continue; }
    if((m=l.match(/^(#{2,4})\s+(.*)/))){ close(); const lv=m[1].length-1; html+=`<h${lv+2} class="lz-h${lv}">${inline(m[2])}</h${lv+2}>`; continue; }
    if(l.startsWith('|')){ const cells=l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()); if(/^[-: ]*$/.test(cells.join(''))) continue;
      if(!table){ close(); html+='<div class="tbl-mini"><table><thead><tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'; table=true; }
      else html+='<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; continue; }
    if((m=l.match(/^[-•]\s+(.*)/))){ if(!list){ close(); html+='<ul>'; list=true; } html+='<li'+(raw.match(/^\s*/)[0].length>=2?' class="li2"':'')+'>'+inline(m[1])+'</li>'; continue; }
    close(); html+='<p>'+inline(l)+'</p>';
  }
  close(); return html;
}

Object.assign(UI,{progView:lsGet('xamxam.progView')==='int'?'int':'l3', intFilter:'all', intQuery:'', intId:null, intTab:'plan', intEdit:null, intRecite:null});

     <div class="legend"><span><i class="lg3"></i>Maîtrisée</span><span><i class="lg2"></i>Leçon sue</span><span><i class="lg1"></i>Plan su</span></div>
     <div class="row" style="flex-wrap:nowrap"><button class="btn btn-soft" style="flex:1" data-act="int-plans">Plans types</button><button class="btn btn-primary" style="flex:1" data-act="int-train">Épreuve blanche</button></div></section>
   <div class="search">${I.search}<input type="search" id="intSearch" placeholder="Chercher une question" value="${esc(UI.intQuery)}" data-input="int-q" aria-label="Chercher une question"></div>
   <div class="chips" role="group" aria-label="Filtrer">${filters.map(([k,l])=>`<button class="chip" data-act="int-f" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>`;
  let total=0;
  for(const ep of INT){
    let inner='', shown=0, lastG=null;

function buildIntPrompt(id){ const x=INTQ[id], ep=INT.find(e=>e.id===x.ep), p=PLANS[x.type]||{};
  return `Tu es un enseignant de la Faculté de médecine de Dakar (UCAD). Rédige une question du concours d'internat des hôpitaux du Sénégal, épreuve écrite de ${ep.name.toLowerCase()} (${INT_DUR/60} heures, coefficient ${ep.coef}).

Question : « ${x.t} »

Plan type de cette famille de questions (adapte-le à la question, sans changer l'ordre des grandes parties) :
${p.p||''}

Écris ta réponse en trois blocs. Chaque bloc commence par une ligne de repère, exactement comme ceci :

@@plan
Le plan détaillé de la question : une ligne par titre, sous-parties décalées de deux espaces.

@@lecon
La leçon type, telle qu'un candidat doit la rédiger le jour de l'épreuve : 700 à 1000 mots, en suivant le plan. Titres : « ## I. … » pour les grandes parties, « ### 1. … » pour les sous-parties. Phrases courtes, listes avec « - ». Entoure chaque mot-clé attendu par le correcteur avec deux signes égal, comme ==mot-clé== (40 à 70 mots-clés). Pour une question d'anatomie ou de biologie, termine par les applications cliniques. Finis par une conclusion.

@@explications
Pour comprendre et retenir : l'idée générale en mots simples, les mécanismes (le pourquoi), les pièges classiques, un moyen mnémotechnique, le schéma à savoir refaire décrit en mots. 150 à 300 mots, en tutoyant.

Règles : français médical exact ; contexte du Sénégal quand c'est utile (épidémiologie, programmes nationaux) ; n'invente aucun chiffre ni aucune dose dont tu n'es pas sûr ; aucun texte avant ni après les trois blocs.`; }

let ITR=null, itrTimer=null; const ITR_KEY='xamxam.itr';
function itrSave(){ if(ITR) lsSet(ITR_KEY, JSON.stringify(ITR)); else { try{ localStorage.removeItem(ITR_KEY); }catch{} } }
function itrLoad(){ try{ const d=JSON.parse(lsGet(ITR_KEY)||'null'); if(d && INTQ[d.id]) ITR=d; else if(d) localStorage.removeItem(ITR_KEY); }catch{ ITR=null; } }
function itrElapsed(){ return ITR.acc+(ITR.run?now()-ITR.run:0); }
function itrLeft(){ return ITR.dur*MIN-itrElapsed(); }
function itrClock(){ const left=itrLeft(), s=Math.floor(Math.abs(left)/1000); return (left<0?'+ ':'')+Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function itrBegin(id){
  if(ITR && ITR.id!==id){ toast('Une épreuve blanche est déjà en cours : termine-la ou abandonne-la d\'abord.', 3600); itrResume(); return; }
  if(!ITR){ ITR={id, acc:0, run:now(), dur:INT_DUR, aid:false, phase:'run', keys:[], plan:null, rang:false}; itrSave(); }
  itrResume();
}
function itrResume(){ if(!ITR) return; const fn=ITR.phase==='check'?intCheckSheet:intRunSheet; UI.sheetStack=UI.sheetStack.filter(s=>s!==intRunSheet&&s!==intCheckSheet&&s!==intPickSheet); UI.sheetStack.push(fn); paintSheet(); intLoad(ITR.id); itrTick(); }
function itrTick(){ clearInterval(itrTimer);
  itrTimer=setInterval(()=>{ if(!ITR||ITR.phase!=='run'||UI.sheetStack[UI.sheetStack.length-1]!==intRunSheet){ clearInterval(itrTimer); return; }
    const el=$('#itrClock'); if(el){ el.textContent=itrClock(); el.classList.toggle('low', itrLeft()<10*MIN); }
    if(ITR.run && !ITR.rang && itrLeft()<=0){ ITR.rang=true; itrSave(); toast('Temps écoulé : pose ton stylo.', 6000); try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch{} } }, 1000); }
function intRunSheet(){

   <div class="stack" style="gap:6px"><p class="eyebrow">${esc(ep.name)} · coefficient ${ep.coef} · ${fmtDur(ITR.dur*MIN)}</p><h2>${esc(x.t)}</h2></div>
   <section class="panel stack" style="text-align:center"><p class="clock-big${itrLeft()<10*MIN?' low':''}" id="itrClock">${itrClock()}</p>

function mergeInternat(inc){ if(!inc) return false; let ch=false; const T=S.internat;
  for(const k of ['prog','fiches']) for(const [id,v] of Object.entries(inc[k]||{})){ const l=T[k][id]; if(v && (!l||(v.t||0)>(l.t||0))){ T[k][id]=v; ch=true; } }
  for(const [id,arr] of Object.entries(inc.tries||{})){ const seen=new Set((T.tries[id]||[]).map(a=>a.t)); for(const a of arr||[]) if(a && !seen.has(a.t)){ (T.tries[id]=T.tries[id]||[]).push(a); seen.add(a.t); ch=true; } if(T.tries[id]) T.tries[id].sort((a,b)=>a.t-b.t); }
  const cm={}; for(const c of T.custom) cm[c.id]=c; for(const c of inc.custom||[]){ const l=cm[c.id]; if(c && c.id && (!l||(c.t||0)>(l.t||0))){ cm[c.id]=c; ch=true; } } T.custom=Object.values(cm);
  return ch;
}

document.addEventListener('click', async e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act, d=a.dataset;
  if(!/^(int-|itr-|prog-view$|goto-int$)/.test(act)) return;
  switch(act){
    case 'prog-view': UI.progView=d.v==='int'?'int':'l3'; lsSet('xamxam.progView', UI.progView); window.scrollTo(0,0); render(); break;
    case 'goto-int': UI.tab='prog'; UI.progView='int'; lsSet('xamxam.tab','prog'); lsSet('xamxam.progView','int'); window.scrollTo(0,0); render(); break;
    case 'int-f': UI.intFilter=d.f; rerender(); break;
    case 'int-open': intOpen(d.id); break;
    case 'int-tab': UI.intTab=d.t; UI.intRecite=null; paintSheet(true); break;
    case 'int-status': setIntSt(UI.intId, +d.s); paintSheet(true); break;
    case 'int-plans': openSheet(plansSheet); break;
    case 'int-recite': UI.intRecite=0; paintSheet(true); break;
    case 'int-next': UI.intRecite++; paintSheet(true); break;
    case 'int-recite-stop': UI.intRecite=null; paintSheet(true); break;
    case 'int-edit': UI.intEdit=d.f; paintSheet(true); break;
    case 'int-cancel': UI.intEdit=null; paintSheet(true); break;
    case 'int-save': { const f=UI.intEdit, v=($('#intEditText')||{}).value||''; const o=S.internat.fiches[UI.intId]=S.internat.fiches[UI.intId]||{}; o[f]=v.replace(/\s+$/,''); o.t=now(); saveLocal(); UI.intEdit=null; UI.intTab=f; toast('Enregistré'); paintSheet(true); break; }
    case 'int-reset': armConfirm(a,'Confirmer : effacer ma version',()=>{ const o=S.internat.fiches[UI.intId]; if(o){ o[d.f]=''; o.t=now(); saveLocal(); } paintSheet(true); }); break;
    case 'int-retry': delete INTL[UI.intId]; paintSheet(true); intLoad(UI.intId); break;
    case 'int-copy': await copyText(buildIntPrompt(UI.intId)); break;
    case 'int-paste': { const L=parseLesson(($('#intPaste')||{}).value||''); if(!L.lecon&&!L.plan){ toast("Je n'ai pas trouvé les repères @@plan et @@lecon. Colle toute la réponse.", 3600); break; }
      const o=S.internat.fiches[UI.intId]=S.internat.fiches[UI.intId]||{}; if(L.plan) o.plan=L.plan; if(L.lecon) o.lecon=L.lecon; if(L.expl) o.expl=L.expl; o.t=now(); saveLocal(); toast('Leçon rangée dans la fiche'); paintSheet(); break; }
    case 'int-add': UI.intAddEp=d.ep; openSheet(intAddSheet); break;
    case 'int-add-go': { const t=(($('#intAddTitle')||{}).value||'').trim(); if(!t){ toast('Écris l\'intitulé de la question.'); break; }
      const c={id:uid('q'), ep:UI.intAddEp, title:t, type:($('#intAddType')||{}).value||'m-maladie', t:now()}; S.internat.custom.push(c); saveLocal(); buildInt(); UI.open.add('int-'+c.ep); closeSheet(); toast('Question ajoutée'); break; }
    case 'int-del': armConfirm(a,'Confirmer la suppression',()=>{ const c=S.internat.custom.find(x=>x.id===UI.intId); if(c){ c.del=true; c.t=now(); } saveLocal(); buildInt(); closeSheet(); toast('Question supprimée'); }); break;
    case 'int-train': if(d.id) itrBegin(d.id); else if(ITR) itrResume(); else openSheet(intPickSheet); break;
    case 'int-draw': { let pool=(d.ep==='seen'?Object.values(INTQ).filter(intSeen):INT.find(x=>x.id===d.ep).all).filter(x=>intSt(x.id)<3&&!x.oral&&!x.extra);
      if(!pool.length){ toast('Toutes ces questions sont déjà maîtrisées.'); break; }
      const known=pool.filter(x=>intSt(x.id)>=1); if(known.length && Math.random()<0.75) pool=known;
      itrBegin(pool[Math.floor(Math.random()*pool.length)].id); break; }
    case 'itr-resume': itrResume(); break;
    case 'itr-pause': if(ITR.run){ ITR.acc=itrElapsed(); ITR.run=0; } else ITR.run=now(); itrSave(); paintSheet(true); itrTick(); break;
    case 'itr-done': ITR.acc=itrElapsed(); ITR.run=0; ITR.phase='check'; itrSave(); itrResume(); break;
    case 'itr-cancel': armConfirm(a,'Confirmer : abandonner',()=>{ ITR=null; itrSave(); clearInterval(itrTimer); closeSheet(); }); break;
    case 'itr-plan': ITR.plan=+d.v; itrSave(); paintSheet(true); break;
    case 'itr-key': { const i=+d.i, k=ITR.keys.indexOf(i); if(k>=0) ITR.keys.splice(k,1); else ITR.keys.push(i); itrSave(); paintSheet(true); break; }
    case 'itr-save': { const id=ITR.id, n=keysOf(intContent(id).lecon).length; const tr={t:now(), ms:ITR.acc, k:Math.min(ITR.keys.length,n), n, plan:ITR.plan, aid:!!ITR.aid};
      (S.internat.tries[id]=S.internat.tries[id]||[]).push(tr); if(ITR.plan===2 && intSt(id)<1) S.internat.prog[id]={s:1,t:now()}; saveLocal();
      ITR=null; itrSave(); closeSheet(); toast(n?`${tr.k} mots-clés sur ${n} : ${Math.round(tr.k/n*100)} %`:'Essai enregistré', 3600); break; }
  }
});

const myLvl = () => LV[S.prefs.level] ? S.prefs.level : 'L3';
const mySem = () => S.prefs.levelSem===2 ? 2 : 1;
const hiddenMods = () => Array.isArray(S.prefs.hide) ? S.prefs.hide : [];
function modsOf(lvl, sem, all){ return ALLMODS.filter(m=>m.lvl===lvl && (!sem||m.sem===sem) && (all||!hiddenMods().includes(m.id))); }
const modChaps = m => m.allSubs.flatMap(s=>s.all);
function progOf(chs){ const st=[0,0,0,0]; chs.forEach(c=>st[statusOf(c.id)]++); const n=chs.length; return {n, st, pct:n?Math.round((st[2]+st[3])/n*100):0}; }
function stBar(p){ const w=i=>p.n?p.st[i]/p.n*100:0; return `<span class="bar" role="img" aria-label="${p.st[3]} maîtrisés, ${p.st[2]} appris, ${p.st[1]} vus sur ${p.n}">${p.st[3]?`<i class="b3" style="width:${w(3)}%"></i>`:''}${p.st[2]?`<i class="b2" style="width:${w(2)}%"></i>`:''}${p.st[1]?`<i class="b1" style="width:${w(1)}%"></i>`:''}</span>`; }
